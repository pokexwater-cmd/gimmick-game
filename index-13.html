/* ============ SPEED LINES FACTORY (screen-wide speed lines on the WORLD behind him, not on the character. They show up when he turns into blue energy during the dash and streak across the screen the opposite way he runs. Tune the numbers right below) ============ */
const SpeedLinesFactory = {
  list: [], k: 0, dx: 1, dy: 0, px: 0, py: 0, last: 0, acc: 0,
  rate: 110, max: 110, minLen: 90, maxLen: 300, speed: 2400,   // lines per second at full speed, max lines on screen, line length range, how fast they fly past (px/s)
  reset(){ this.list.length = 0; this.k = 0; this.acc = 0; },
  draw(g, ch, W, H){   // call after the ground, before props and the character, so everything stands in front of the lines
    const now = performance.now(), dt = this.last ? Math.min(0.05, (now - this.last) / 1000) : 0; this.last = now;
    const moved = Math.hypot(ch.x - this.px, ch.y - this.py) > 0.5; this.px = ch.x; this.py = ch.y;
    if (moved && ch.mv){ let x = ch.mv.x, y = ch.mv.y * CONFIG.tilt; const l = Math.hypot(x, y) || 1; this.dx = x / l; this.dy = y / l; }   // screen direction he runs in
    const target = moved ? SpeedFactory.energy(ch) : 0; this.k += (target - this.k) * (1 - Math.exp(-12 * dt));
    if (this.k > 0.03){
      this.acc += this.rate * this.k * dt; const R = Math.random;
      while (this.acc >= 1 && this.list.length < this.max){ this.acc -= 1;
        const len = this.minLen + R() * (this.maxLen - this.minLen);
        this.list.push({ x: (R() * 1.5 - 0.25) * W, y: (R() * 1.5 - 0.25) * H, len, w: 0.8 + R() * 1.8, v: this.speed * (0.7 + R() * 0.6), life: 0, dur: 0.14 + R() * 0.16, b: 0.5 + R() * 0.5 });
      }
      this.acc = Math.min(this.acc, 2);
    }
    if (!this.list.length) return;
    const dx = this.dx, dy = this.dy; g.save(); g.globalCompositeOperation = 'lighter'; g.lineCap = 'round';
    for (const l of this.list){
      l.life += dt / l.dur; l.x -= dx * l.v * dt; l.y -= dy * l.v * dt;   // the world rushes the other way
      const a = Math.sin(Math.min(1, l.life) * Math.PI) * l.b * Math.max(this.k, 0.25), tx = l.x + dx * l.len, ty = l.y + dy * l.len;
      const gr = g.createLinearGradient(l.x, l.y, tx, ty); gr.addColorStop(0, 'rgba(235,250,255,' + (a * 0.8) + ')'); gr.addColorStop(1, 'rgba(70,165,255,0)');
      g.strokeStyle = gr; g.lineWidth = l.w; g.beginPath(); g.moveTo(l.x, l.y); g.lineTo(tx, ty); g.stroke();
    }
    g.restore();
    this.list = this.list.filter(l => l.life < 1);
  }
};

/* ============ SPEED FACTORY (ability 'sprint' = DASH button of the speed gimmick: for `dur` seconds he runs very fast, tilted forward, leaving blue afterimages + electric sparks.
   When it ends he doesn't stop dead: he skids/coasts and eases back upright over `recDur` seconds. Tune the numbers right below) ============ */
const SpeedFactory = {
  dur: 5, cooldown: 8, charge: 8, mul: 2.6, ramp: 0.25, recDur: 0.7,   // seconds of dash, cooldown, top speed x run speed, ramp-up time, ease-out time
  sparks: [], trail: [], gt: 0, px: 0, py: 0, morph: 0.6, morphDur: 0.35, twistMorph: 0.5, twistMorphDur: 0.4,   // morph = seconds of normal dash before he turns into blue energy, morphDur = how long the change takes
  energy(ch){ if (ch.remote) return ch.en || 0;   // other players: the value they send us
    if (ch.twist){ const T = TornadoFactory.dur, u = Math.max(0, Math.min(1, (ch.twist.t - this.twistMorph) / this.twistMorphDur, (T - ch.twist.t) / this.twistMorphDur)); return u * u * (3 - 2 * u); }   // TWIST: after `twistMorph` seconds he turns into round energy, and turns back just before the twist ends
    if (ch.sprint){ const u = Math.max(0, Math.min(1, (ch.sprint.t - this.morph) / this.morphDur)); return u * u * (3 - 2 * u); } if (ch.rec > 0){ const k = ch.rec / this.recDur; return Math.min(1, k * 1.6); } return 0; },
  reset(ch){ this.charge = this.cooldown; this.trail.length = this.sparks.length = 0; if (ch){ ch.sprint = null; ch.rec = 0; } },
  ready(){ return this.charge >= this.cooldown; },
  start(ch){ if (!AbilityFactory.has(ch, 'sprint') || ch.sprint || ch.twist || !this.ready()) return false; ch.sprint = { t: 0 }; ch.rec = 0; this.charge = 0; this.gt = 0; return true; },
  boost(ch){   // speed multiplier: ramps up fast, holds, then falls away smoothly while easing out
    if (ch.sprint){ const u = Math.min(1, ch.sprint.t / this.ramp); return 1 + (this.mul - 1) * u * (2 - u); }
    if (ch.rec > 0){ const k = ch.rec / this.recDur; return 1 + (this.mul - 1) * k * k; }
    return 1;
  },
  step(ch, dx, dy){ const n = Math.max(1, Math.ceil(Math.hypot(dx, dy) / 8)); for (let i = 0; i < n; i++){ ch.x += dx / n; ch.y += dy / n; CollisionFactory.resolve(ch); } },   // small steps so fast movement can't tunnel through walls
  coast(ch, dt){   // no stick input right after a dash: slide on in the last direction, slowing to a stop
    if (!(ch.rec > 0) || ch.sprint || !ch.mv) return; const k = ch.rec / this.recDur, sp = CONFIG.runSpeed * this.mul * k * k;
    this.step(ch, ch.mv.x * sp * dt, ch.mv.y * sp * dt / CONFIG.tilt);
  },
  update(ch, dt){
    if (!ch.sprint && !(ch.rec > 0)) this.charge = Math.min(this.cooldown, this.charge + dt);
    if (ch.sprint){ ch.sprint.t += dt; if (ch.sprint.t >= this.dur){ ch.sprint = null; ch.rec = this.recDur; this.charge = 0; } }
    else if (ch.rec > 0) ch.rec = Math.max(0, ch.rec - dt);
    const moved = Math.hypot(ch.x - this.px, ch.y - this.py) > 1; this.px = ch.x; this.py = ch.y;
    const R = Math.random, mv = ch.mv || { x: 1, y: 0 };
    if (ch.sprint && moved){
            let ux = mv.x, uy = mv.y * CONFIG.tilt; const ul = Math.hypot(ux, uy) || 1; ux /= ul; uy /= ul;   // screen direction pointing back toward the runner
      for (let i = 0; i < 3; i++) this.sparks.push({ k: 's', x: ch.x + (R() - .5) * 10, y: ch.y + (R() - .5) * 6, z: 6 + R() * 52, vx: -mv.x * (60 + R() * 140), vy: -mv.y * (60 + R() * 140), ux, uy, len: 14 + R() * 26, j1: (R() - .5) * 7, j2: (R() - .5) * 7, life: 1, dur: 0.22 + R() * 0.2 });
      for (let i = 0; i < 2; i++) this.sparks.push({ k: 'a', x: ch.x, y: ch.y, z: 12 + R() * 46, ang: R() * 6.283, len: 8 + R() * 14, j1: (R() - .5) * 8, j2: (R() - .5) * 8, life: 1, dur: 0.12 });
    }
    const e = this.energy(ch); if (e > 0 && moved){ this.trail.push({ x: ch.x, y: ch.y, a: 0, e }); if (this.trail.length > 16) this.trail.shift(); }
    for (const p of this.trail) p.a += dt;
    if (this.trail.length) this.trail = this.trail.filter(p => p.a < 0.28);
    for (const q of this.sparks){ q.life -= dt / q.dur; if (q.k === 's'){ q.x += q.vx * dt; q.y += q.vy * dt; } }
    if (this.sparks.length) this.sparks = this.sparks.filter(q => q.life > 0);
    if (this.sparks.length > 110) this.sparks.splice(0, this.sparks.length - 110);
  },
  collect(items, cam, W, H, ch){
    if (!this.trail.length && !this.sparks.length) return;
    items.push({ y: ch.y - 0.5, f: () => this.drawTrail(ctx, cam, W, H) });
    items.push({ y: ch.y + 0.5, f: () => this.drawSparks(ctx, cam, W, H) });
  },
  drawTrail(g, cam, W, H){   // the blue streak he leaves: a few tapered lines, no pictures of his body
    const T = this.trail, n = T.length; if (n < 2) return;
    g.save(); g.globalCompositeOperation = 'lighter'; g.lineCap = 'round';
    for (let i = 1; i < n; i++){
      const a = T[i - 1], b = T[i], fade = Math.max(0, 1 - b.a / 0.28) * b.e, u = i / n;
      const p = GroundFactory.toScreen(a.x, a.y, cam, W, H), q = GroundFactory.toScreen(b.x, b.y, cam, W, H);
      for (const [w, col] of [[26 * u + 4, 'rgba(40,140,255,' + (fade * 0.22) + ')'], [9 * u + 2, 'rgba(120,205,255,' + (fade * 0.5) + ')'], [3 * u + 1, 'rgba(235,250,255,' + (fade * 0.9) + ')']]){

  },
  drawPlayer(g, ch, cam, W, H, prev){   // body fades out as he turns into blue energy (a glowing streak head), and fades back in when the dash ends
    const e = this.energy(ch);
    if (e > 0.02){
      const s = GroundFactory.toScreen(ch.x, ch.y, cam, W, H), pulse = 1 + 0.08 * Math.sin(ch.t * 40);
      if (e < 0.98){ g.save(); g.globalAlpha = 1 - e; CharacterFactory.draw(g, ch, cam, W, H); g.restore(); }
      if (ch.twist){   // TWIST: a glowing core with flat rings spinning round it, wide at the top like the tornado, turning the same way, so it looks like HE is the one making the tornado
        const tl = CONFIG.tilt, tt = ch.twist.t;
        g.save(); g.globalCompositeOperation = 'lighter'; g.translate(s.x, s.y - 30); g.lineCap = 'round';
        g.fillStyle = 'rgba(40,140,255,' + (0.26 * e) + ')'; g.beginPath(); g.ellipse(0, 0, 26 * e * pulse, 44 * e * pulse, 0, 0, 7); g.fill();
        g.fillStyle = 'rgba(130,210,255,' + (0.55 * e) + ')'; g.beginPath(); g.ellipse(0, 0, 14 * e * pulse, 28 * e * pulse, 0, 0, 7); g.fill();
        g.fillStyle = 'rgba(240,252,255,' + (0.95 * e) + ')'; g.beginPath(); g.ellipse(0, 0, 6 * e, 16 * e, 0, 0, 7); g.fill();
        for (let i = 0; i < 4; i++){ const u = i / 3, r = (16 + 22 * u) * e, y = (26 - 62 * u) * e;
          for (let k = 0; k < 2; k++){ const a0 = tt * (9 - 4 * u) + u * 2.2 + k * 3.1416, front = Math.sin(a0 + 0.8) > 0;
            g.strokeStyle = 'rgba(210,240,255,' + ((front ? 0.85 : 0.35) * e) + ')'; g.lineWidth = 2 + u * 2.5; g.beginPath(); g.ellipse(0, y, r, r * tl, 0, a0, a0 + 1.6); g.stroke(); } }
        g.restore(); return;
      }
      g.save(); g.globalCompositeOperation = 'lighter'; g.translate(s.x, s.y - 30);
      const mv = ch.mv || { x: 1, y: 0 }, ang = Math.atan2(mv.y * CONFIG.tilt, mv.x);
      g.rotate(ang);
      g.fillStyle = 'rgba(40,140,255,' + (0.28 * e) + ')'; g.beginPath(); g.ellipse(0, 0, 34 * e * pulse, 17 * e * pulse, 0, 0, 7); g.fill();
      g.fillStyle = 'rgba(130,210,255,' + (0.6 * e) + ')'; g.beginPath(); g.ellipse(0, 0, 20 * e * pulse, 9 * e * pulse, 0, 0, 7); g.fill();
      g.fillStyle = 'rgba(240,252,255,' + (0.95 * e) + ')'; g.beginPath(); g.ellipse(2, 0, 10 * e, 4 * e, 0, 0, 7); g.fill();

    }

  },
  drawSparks(g, cam, W, H){   // electric blue streaks and crackles
    g.save(); g.globalCompositeOperation = 'lighter'; g.lineCap = 'round'; g.lineJoin = 'round';
    for (const q of this.sparks){
      const s = GroundFactory.toScreen(q.x, q.y, cam, W, H), a = Math.max(0, q.life), hx = s.x, hy = s.y - q.z; let ex, ey, nx, ny;
      if (q.k === 's'){ ex = hx + q.ux * q.len * a; ey = hy + q.uy * q.len * a; }

  start(ch){

  press(ch){ StormFactory.start(ch); },

    if (ch.storm) return { mode: 'active', text: String(Math.ceil(F.dur - ch.storm.t)), p: 1 - ch.storm.t / F.dur };
    if (ch.swim || ch.shield) return { mode: 'busy', text: 'STORM', p: 1 };
    const p = Math.min(1, F.charge / F.cooldown); return p >= 1 ? { mode: 'ready', text: 'STORM', p } : { mode: 'charging', text: String(Math.ceil(F.cooldown - F.charge)), p }; }
});

/* ============ SHIELD FACTORY (ability 'shield' = SHIELD button of the defense gimmick: a DEFENSIVE ability, it never does damage.
   He drops into a guard (arms crossed, crouched) and a green dome forms round him with him inside. While it lasts he can walk around with the dome following him, and nothing can touch him:
   loose props that touch the dome are pushed back out and bounce off, and nothing that hits from outside reaches him (ShieldFactory.blocks(x, y) and ShieldFactory.deflect(x, y, r)
   are the hooks for zombies / projectiles later: if blocks() is true the hit does nothing). Each deflect makes a ripple on the dome. Cooldown starts when the dome drops. Tune the numbers right below) ============ */
const ShieldFactory = {
  dur: 4, cooldown: 5, charge: 5, radius: 70, pushBack: 260,   // seconds / seconds / world px (dome radius) / how hard props are thrown back off the dome
  pings: [],
  reset(ch){ this.charge = this.cooldown; this.pings.length = 0; if (ch){ ch.shield = null; ch.sh = 0; ch.ga = 0; } },
  ready(){ return this.charge >= this.cooldown; },
  start(ch){
    if (!AbilityFactory.has(ch, 'shield') || ch.shield || ch.swim || ch.storm || ch.grab || ch.slam || ch.aim || !this.ready()) return false;
    ch.shield = { t: 0 }; ch.clip = 'guard'; ch.mv = null; this.charge = 0; ShakeFactory.kick(2, 0.12); return true;
  },
  active(ch){ return !!(ch && ch.shield); },
  // is this world point inside a live dome (of the local player or a remote one)? projectiles, zombies, blasts: ask this before hurting anything at (x, y)
  blocks(x, y, pad = 0){
    for (const c of [player, ...RemoteFactory.list()]) if (c.clip === 'guard' && (c.sh || 0) > 0.5 && Math.hypot(x - c.x, (y - c.y)) <= this.radius + pad) return true;
    return false;
  },
  ping(ch, x, y){ const a = Math.atan2((y - ch.y), (x - ch.x)); this.pings.push({ ch, a, t: 0 }); if (this.pings.length > 14) this.pings.shift(); },
  // for every character (local + remote): ease the guard pose and the dome in and out
  track(ch, dt){
    const on = ch.clip === 'guard' ? 1 : 0;
    ch.ga = (ch.ga || 0) + (on - (ch.ga || 0)) * Math.min(1, dt * 12);
    const sh = ch.sh || 0, rate = on ? 7 : 9; ch.sh = on ? Math.min(1, sh + dt * rate) : Math.max(0, sh - dt * rate);
    if (ch.ga < 0.002) ch.ga = 0;
  },
  update(ch, dt, wdt){
    this.track(ch, dt);
    for (const r of RemoteFactory.list()) this.track(r, wdt === undefined ? dt : wdt);
    for (let i = this.pings.length - 1; i >= 0; i--){ this.pings[i].t += dt; if (this.pings[i].t > 0.45) this.pings.splice(i, 1); }
    const sh = ch.shield;
    if (!sh){ this.charge = Math.min(this.cooldown, this.charge + dt); return; }
    sh.t += dt; ch.clip = 'guard';
    if (sh.t >= this.dur){ ch.shield = null; ch.clip = 'idle'; this.charge = 0; return; }
    if ((ch.sh || 0) < 0.5) return;
    // keep everything out: loose props inside the dome are thrown back out, breakables just bounce the hit off
    for (const o of PropFactory.props.slice()){
      if (o.heldBy || o.breaking) continue;
      const cx = o.x + (o.w || 0) / 2, cy = o.y + (o.d || 0) / 2, d = Math.hypot(cx - ch.x, cy - ch.y), need = this.radius + Math.max(o.w || 0, o.d || 0) * 0.5;
      if (d >= need) continue;
      const nx = d > 0.01 ? (cx - ch.x) / d : 1, ny = d > 0.01 ? (cy - ch.y) / d : 0, push = need - d;
      if (o.movable){ MovableFactory.shove(o, nx * push, ny * push); MovableFactory.impulse(o, nx * this.pushBack, ny * this.pushBack); }
      this.ping(ch, cx, cy); ShakeFactory.kick(1.5, 0.08);
    }
    // anything registered as a target (zombies later) that wanders into the dome is shoved out too
    for (const t of ImpactFactory.extraTargets()){
      if (t.noPush) continue; const cx = t.x + (t.w || 0) / 2, cy = t.y + (t.d || 0) / 2, d = Math.hypot(cx - ch.x, cy - ch.y); if (d >= this.radius) continue;
      const nx = d > 0.01 ? (cx - ch.x) / d : 1, ny = d > 0.01 ? (cy - ch.y) / d : 0; t.x += nx * (this.radius - d); t.y += ny * (this.radius - d); this.ping(ch, cx, cy);
    }
  },
  // dome drawing: the back half goes behind the characters, the front half in front, so he stands truly inside it
  collect(items){
    for (const c of [player, ...RemoteFactory.list()]){
      if ((c.sh || 0) <= 0.02 || !ViewFactory.sees(c.x, c.y, this.radius + 40, 140, this.radius + 40)) continue;
      items.push({ y: c.y - 3, f: () => this.draw(ctx, c, false) }, { y: c.y + 3, f: () => this.draw(ctx, c, true) });
    }
  },
  draw(g, c, front){
    const f = c.sh, e = f * f * (3 - 2 * f), t = CONFIG.tilt, R = this.radius * (0.6 + 0.4 * e), Hh = R * 1.05, s = GroundFactory.toScreen(c.x, c.y, cam, W, H), now = performance.now() / 1000;
    const left = c.shield ? Math.max(0, this.dur - c.shield.t) : 9, blink = left < 0.8 ? (0.55 + 0.45 * Math.sin(now * 28)) : 1, al = e * blink;
    g.save(); g.translate(s.x, s.y);
    if (!front){
      // dome body: soft green glass, a little darker toward the rim
      const gr = g.createRadialGradient(0, -Hh * 0.45, R * 0.1, 0, -Hh * 0.35, R * 1.15); gr.addColorStop(0, 'rgba(120,255,170,' + 0.05 * al + ')'); gr.addColorStop(0.75, 'rgba(70,230,130,' + 0.16 * al + ')'); gr.addColorStop(1, 'rgba(40,200,110,' + 0.34 * al + ')');
      g.fillStyle = gr; g.beginPath(); g.ellipse(0, 0, R, Hh, 0, Math.PI, 0); g.ellipse(0, 0, R, R * t, 0, 0, Math.PI); g.closePath(); g.fill();
      g.fillStyle = 'rgba(90,255,160,' + 0.12 * al + ')'; g.beginPath(); g.ellipse(0, 0, R, R * t, 0, 0, 7); g.fill();   // glow on the ground
      g.strokeStyle = 'rgba(150,255,190,' + 0.35 * al + ')'; g.lineWidth = 1.5; g.beginPath(); g.ellipse(0, 0, R, R * t, 0, Math.PI, 0, true); g.stroke();   // back rim on the ground
    } else {
      // hex-ish glass lines: two latitude rings + meridians, slowly turning
      g.strokeStyle = 'rgba(170,255,205,' + 0.28 * al + ')'; g.lineWidth = 1;
      for (const k of [0.38, 0.72]){ const rr = R * Math.sqrt(1 - k * k), yy = -Hh * k; g.beginPath(); g.ellipse(0, yy, rr, rr * t, 0, 0, Math.PI); g.stroke(); }
      for (let i = 0; i < 4; i++){ const ph = now * 0.6 + i * Math.PI / 4, cx = Math.cos(ph); g.beginPath(); g.ellipse(0, 0, Math.abs(cx) * R, Hh, 0, Math.PI, 0); g.stroke(); }
      // shine streak on the upper left
      g.strokeStyle = 'rgba(255,255,255,' + 0.30 * al + ')'; g.lineWidth = 3; g.lineCap = 'round'; g.beginPath(); g.ellipse(0, 0, R * 0.86, Hh * 0.9, 0, Math.PI * 1.12, Math.PI * 1.3); g.stroke();
      // bright outline of the dome + front rim on the ground
      g.save(); g.shadowColor = '#5dff9a'; g.shadowBlur = 12 * al; g.strokeStyle = 'rgba(120,255,175,' + 0.85 * al + ')'; g.lineWidth = 2.6;
      g.beginPath(); g.ellipse(0, 0, R, Hh, 0, Math.PI, 0); g.stroke();
      g.beginPath(); g.ellipse(0, 0, R, R * t, 0, 0, Math.PI); g.stroke(); g.restore();
      // ripples where something was deflected
      for (const p of this.pings){
        if (p.ch !== c) continue; const u = p.t / 0.45, fa = (1 - u) * al, px = Math.cos(p.a) * R, py = Math.sin(p.a) * R * t - Hh * 0.35;
        g.strokeStyle = 'rgba(220,255,230,' + fa + ')'; g.lineWidth = 2.5; g.beginPath(); g.ellipse(px, py, 8 + u * 30, (8 + u * 30) * 0.8, 0, 0, 7); g.stroke();
        g.fillStyle = 'rgba(160,255,200,' + fa * 0.35 + ')'; g.beginPath(); g.ellipse(px, py, 8 + u * 30, (8 + u * 30) * 0.8, 0, 0, 7); g.fill();
      }
    }
    g.restore();
  }
};
AbilityFactory.register('shield', {
  label: 'SHIELD', color: '#58f0a0', key: 'z',
  press(ch){ ShieldFactory.start(ch); },
  ui(ch){ const F = ShieldFactory;
    if (ch.swim || ch.storm) return { mode: 'busy', text: 'SHIELD', p: 1 };
    if (ch.shield) return { mode: 'active', text: String(Math.ceil(F.dur - ch.shield.t)), p: 1 - ch.shield.t / F.dur };
    const p = Math.min(1, F.charge / F.cooldown); return p >= 1 ? { mode: 'ready', text: 'SHIELD', p } : { mode: 'charging', text: String(Math.ceil(F.cooldown - F.charge)), p }; }
});

/* ============ ZOMBIE FACTORY (NOT wired into the game yet: nothing creates, updates or draws a zombie until you call it) ============
   A bloody, rotting zombie with three animations:
     idle    he stands hunched, swaying, arms hanging forward, jaw slack
     walk    SLOW shamble, not a normal walk: stiff lurching steps, one foot dragging, head lolling, BOTH ARMS STRETCHED OUT toward the player as if he's trying to grab him
     attack  one CLAW attack: he rears back (arm up, mouth wide), then rakes his nails down across the air in front of him (three red slash marks), and recovers
   Same kind of object as the other characters: z = ZombieFactory.create(x, y) with { x, y, face (1 / -1), dir ('side' | 'front' | 'back' | diagonals drawn as side), clip, t }.
   Use (later):   ZombieFactory.update(z, dt, moving)   every frame (moving = true makes him walk, otherwise idle; it also runs the attack)
                  ZombieFactory.draw(ctx, z, screenPos)   screenPos = GroundFactory.toScreen(z.x, z.y, cam, W, H), same as the gimmick skins
                  ZombieFactory.attack(z)                 start the claw attack (returns false if he is already attacking)
   Hooks for the wiring later: ZombieFactory.onStrike = (z, claw) => {...} is called once at the moment the nails land; claw = { x, y, r, damage } is the hit circle in world px
   (also ZombieFactory.claw(z) any time). Nothing here damages anything by itself. Tune the numbers right below) ============ */
const ZombieFactory = {
  size: 0.9, reach: 46, damage: 15, onStrike: null,   // body scale / claw reach (world px) / damage handed to onStrike
  t: { windup: 0.5, strike: 0.14, hold: 0.1, recover: 0.45 },   // claw attack timing (seconds)
  walkSpeed: 3.3,   // gait speed: smaller = slower shamble (one full step cycle takes 2π / walkSpeed seconds)
  C: { sk: '#8da889', skHi: '#a8c2a0', skDk: '#5d785a', line: '#1a201b', rag: '#4d4f5e', ragDk: '#34363f', pants: '#3f4552', pantsDk: '#2a2e38',
       blood: '#a1121a', bloodDk: '#5c070c', bloodHi: '#d8262f', bone: '#e9e3cb', nail: '#2b1a16', eye: '#ebe6b6', pupil: '#c0151c', hair: '#2d2a26', teeth: '#d9d2b0', shoe: '#2b2520' },
  create(x, y){ return { x, y, face: 1, dir: 'side', clip: 'idle', t: Math.random() * 3, atk: null, hp: 100 }; },
  total(){ const T = this.t; return T.windup + T.strike + T.hold + T.recover; },
  attack(z){ if (z.atk) return false; z.atk = { t: 0, hit: false }; z.clip = 'attack'; return true; },
  claw(z){   // the hit circle of his claw in world px, in front of him
    const d = z.dir, f = z.face || 1, r = this.reach * 0.6;
    return { x: z.x + (d === 'front' || d === 'back' ? 0 : f * this.reach * 0.65), y: z.y + (d === 'front' ? this.reach * 0.5 : d === 'back' ? -this.reach * 0.5 : 0), r, damage: this.damage };
  },
  update(z, dt, moving){
    z.t += dt;
    if (z.atk){
      const a = z.atk; a.t += dt;
      if (!a.hit && a.t >= this.t.windup + this.t.strike * 0.6){ a.hit = true; if (this.onStrike) this.onStrike(z, this.claw(z)); }
      if (a.t >= this.total()){ z.atk = null; z.clip = moving ? 'walk' : 'idle'; } else z.clip = 'attack';
    } else z.clip = moving ? 'walk' : 'idle';
  },
  // swing: 0 = arms stretched out, 0..1 = arm rearing up and back, 0..-1 = raking down across the front. Only the attack uses it.
  swing(z){
    const a = z.atk; if (!a) return 0; const T = this.t, t = a.t, ease = u => u * u * (3 - 2 * u);
    if (t < T.windup) return ease(t / T.windup);
    if (t < T.windup + T.strike){ const u = (t - T.windup) / T.strike; return 1 - 2 * u * u; }
    if (t < T.windup + T.strike + T.hold) return -1;
    const u = Math.min(1, (t - T.windup - T.strike - T.hold) / T.recover); return -1 + ease(u);
  },
  pose(z){
    const t = z.t, P = { dip: 0, ox: 0, lean: 0.1, head: 0.25, mouth: 0.25, legN: 0, legF: 0, bendN: 0, bendF: 0, aN1: -1.35, aN2: -0.15, aF1: -1.48, aF2: -0.2, sw: 0, ph: 0, walk: false };
    if (z.clip === 'idle'){
      const s = Math.sin(t * 1.5); P.lean = 0.1 + s * 0.03; P.head = 0.25 + Math.sin(t * 0.9) * 0.06; P.mouth = 0.25 + 0.15 * Math.sin(t * 1.1); P.dip = (1 + s) * 0.4;
      P.aN1 = -1.1 + Math.sin(t * 1.7) * 0.08; P.aF1 = -1.2 + Math.sin(t * 1.7 + 1) * 0.08;
    } else if (z.clip === 'walk' || z.clip === 'attack'){
      const ph = t * this.walkSpeed, sw = Math.sin(ph); P.ph = ph; P.walk = z.clip === 'walk';
      P.legN = sw * 0.36; P.legF = -sw * 0.2; P.bendN = Math.max(0, -Math.cos(ph)) * 0.3; P.bendF = Math.max(0, Math.cos(ph)) * 0.12;   // near leg steps, far leg half-drags
      P.dip = sw * sw * 1.6; P.ox = sw * 1.0; P.lean = 0.16 + sw * 0.03; P.head = 0.3 + Math.sin(ph * 0.5) * 0.12; P.mouth = 0.35 + 0.2 * Math.sin(ph * 0.7);
      P.aN1 = -1.35 + Math.sin(ph * 0.5 + 0.4) * 0.09; P.aN2 = -0.15 + Math.sin(ph * 0.5) * 0.07; P.aF1 = -1.5 + Math.sin(ph * 0.5 + 2) * 0.09;
      if (z.clip === 'attack'){ P.legN *= 0.15; P.legF *= 0.15; P.bendN = P.bendF = 0; P.dip = 0; P.ox = 0; }   // he plants his feet to swing
    }

      const s = this.swing(z); P.sw = s;
      if (s >= 0){ P.aN1 = P.aN1 + (-2.75 - P.aN1) * s; P.aN2 = -0.15 - 0.35 * s; P.lean = 0.12 - 0.3 * s; P.head = 0.25 - 0.5 * s; P.mouth = 0.3 + 0.7 * s; P.aF1 = -1.5 - 0.15 * s; }
      else { const k = -s; P.aN1 = -2.75 + (2.75 - 0.45) * k; P.aN2 = -0.5 + 0.6 * k; P.lean = -0.18 + 0.5 * k; P.head = -0.25 + 0.6 * k; P.mouth = 1.0 - 0.45 * k; P.ox = 7 * k; P.aF1 = -1.65 + 0.3 * k; }
    }
    return P;
  },
  // ---------- small drawing helpers ----------
  limb(g, w, len, r, fill){ g.fillStyle = fill; g.beginPath(); g.roundRect(-w / 2, 0, w, len, r); g.fill(); g.strokeStyle = this.C.line; g.lineWidth = 1; g.stroke(); },
  blob(g, x, y, r, col, seed){ g.fillStyle = col; g.beginPath(); for (let i = 0; i < 8; i++){ const a = i / 8 * 6.283, rr = r * (0.65 + 0.45 * Math.abs(Math.sin(seed * 3.1 + i * 1.9))); g[i ? 'lineTo' : 'moveTo'](x + Math.cos(a) * rr, y + Math.sin(a) * rr * 0.8); } g.closePath(); g.fill(); },
  blood(g, x, y, r, seed){ const C = this.C; this.blob(g, x, y, r, C.bloodDk, seed); this.blob(g, x + 0.6, y - 0.4, r * 0.7, C.blood, seed + 2); this.blob(g, x - r * 0.15, y - r * 0.2, r * 0.3, C.bloodHi, seed + 5); },
  drip(g, x, y, len, w){ const C = this.C; g.fillStyle = C.blood; g.beginPath(); g.roundRect(x - w / 2, y, w, len, w / 2); g.fill(); g.fillStyle = C.bloodHi; g.beginPath(); g.arc(x, y + len, w * 0.7, 0, 7); g.fill(); },
  hand(g, y, claw, n){   // a hand hanging along +y with `n` fingers, each with a long dark nail; `claw` (0..1) grows and reddens the nails
    const C = this.C; g.fillStyle = C.sk; g.beginPath(); g.roundRect(-4.5, y, 9, 7, 3); g.fill(); g.strokeStyle = C.line; g.lineWidth = 1; g.stroke();
    for (let i = 0; i < n; i++){
      const a = (i - (n - 1) / 2) * 0.3, L = 6 + claw * 1, N = 5 + claw * 5;
      g.save(); g.translate((i - (n - 1) / 2) * 2.4, y + 6); g.rotate(a);
      g.strokeStyle = C.sk; g.lineWidth = 2; g.lineCap = 'round'; g.beginPath(); g.moveTo(0, 0); g.lineTo(0, L); g.stroke();
      g.strokeStyle = C.line; g.lineWidth = 1; g.beginPath(); g.moveTo(1.4, 1); g.lineTo(1.4, L); g.stroke();
      g.fillStyle = C.nail; g.beginPath(); g.moveTo(-1.2, L - 1); g.lineTo(1.2, L - 1); g.lineTo(0.2, L + N); g.closePath(); g.fill();
      g.fillStyle = C.blood; g.beginPath(); g.moveTo(-0.8, L + N * 0.5); g.lineTo(0.9, L + N * 0.5); g.lineTo(0.2, L + N); g.closePath(); g.fill();
      g.restore();
    }
    this.blood(g, 0, y + 3, 2.6, 4);
  },
  arm(g, sx, sy, a1, a2, claw, near, seed){   // side-view arm: torn sleeve, gashed upper arm, bare forearm with bone showing, clawed hand
    const C = this.C; g.save(); g.translate(sx, sy); g.rotate(a1);
    this.limb(g, 8, 12.5, 4, C.sk);
    g.fillStyle = C.rag; g.beginPath(); g.moveTo(-4.4, -1); g.lineTo(4.4, -1); g.lineTo(4.4, 5); g.lineTo(2.2, 7); g.lineTo(0.8, 4.6); g.lineTo(-1, 7.2); g.lineTo(-2.6, 5); g.lineTo(-4.4, 6.4); g.closePath(); g.fill(); g.strokeStyle = C.line; g.lineWidth = 1; g.stroke();
    if (near) this.blood(g, 1, 9, 2.6, seed);
    g.translate(0, 12); g.rotate(a2);
    this.limb(g, 7, 12.5, 3.5, near ? C.sk : C.skDk);
    if (near){ this.blood(g, 0, 4, 3.1, seed + 1); g.fillStyle = C.bone; g.fillRect(-1, 2.6, 2, 3.4); }

  },
  leg(g, hx, hy, ang, bend, near, seed){

    g.fillStyle = C.pants; g.beginPath(); g.moveTo(-4.6, -1); g.lineTo(4.6, -1); g.lineTo(4.6, 5); g.lineTo(2.6, 7.4); g.lineTo(1, 4.6); g.lineTo(-0.6, 7.8); g.lineTo(-2.4, 5); g.lineTo(-4.6, 7); g.closePath(); g.fill(); g.strokeStyle = C.line; g.lineWidth = 1; g.stroke();
    if (near) this.blood(g, 0.5, 10, 2.2, seed + 3);
    g.fillStyle = C.shoe; g.beginPath(); g.roundRect(-3.6, 11, 11, 4.6, 2); g.fill(); g.strokeStyle = C.line; g.stroke();
    g.fillStyle = C.sk; g.beginPath(); g.roundRect(4.6, 11.6, 4.4, 3.6, 1.4); g.fill(); g.stroke();   // bare toes poking out of the ruined shoe
    g.restore();
  },
  // ---------- side view ----------
  drawSide(g, z, s, P){
    const C = this.C, k = this.size, f = z.face || 1, diag = z.dir !== 'side', seed = (z.id || 1) * 1.7;
    g.fillStyle = 'rgba(0,0,0,.32)'; g.beginPath(); g.ellipse(s.x, s.y, 21 * k, 21 * k * CONFIG.tilt, 0, 0, 7); g.fill();
    g.save(); g.translate(s.x + P.ox * k, s.y); g.scale(f * k * (diag ? 0.88 : 1), k);

    g.beginPath(); g.moveTo(-7, 0); g.quadraticCurveTo(-11, -14, -7, -28); g.lineTo(5, -29); g.quadraticCurveTo(9, -14, 7.5, 0);
    g.lineTo(5.4, 3.4); g.lineTo(3.4, 0.4); g.lineTo(1.4, 4.2); g.lineTo(-0.8, 0.6); g.lineTo(-3, 3.8); g.lineTo(-5, 0.2); g.closePath();
    g.fillStyle = C.rag; g.fill(); g.strokeStyle = C.line; g.lineWidth = 1.2; g.stroke();

ZombieFactory.onStrike = (z, claw) => ZombieSystem.strike(z, claw);

/* ============ ZOMBIE SYSTEM (chunk spawning + AI for the ZombieFactory zombies) ============
   CHUNKS   The world is cut into squares of `chunk` px. Whenever a chunk comes within `loadR` chunks of ANY player it gets loaded ONCE: 1 or 2 zombies appear at random spots in it
            (never closer than `minSpawn` to a player, never inside a crate). A chunk never spawns again, dead zombies do not respawn. At most `maxAlive` zombies alive at once.
   AI       Each zombie walks toward the CLOSEST living player (any player in the room) inside `aggro`, and when he is within `atkRange` he claws (the ZombieFactory slash). The claw
            hurts every player inside its circle (a shield dome blocks it). Zombies far from every player (`freeze`) just stand still to save work.
   HEALTH   `hp` (20). Every hit flinches him (short stagger + knockback, the swing is interrupted). At 0 he falls onto his back, lies there and fades away. He is hurt by everything the
            other abilities already report to ImpactFactory (slam, missile, tornado, storm, spin) and by the speed gimmick's dash.
   MULTIPLAYER  One player (the lowest id in the room) runs the zombies and sends `zs` snapshots 10x/s; everybody else just shows them smoothly. Hits from other players are sent to him as `zdmg`.
            If he leaves, the next lowest id takes over from the last snapshot. Tune the numbers right below) ============ */
const ZombieSystem = {
  chunk: 640, loadR: 1, maxAlive: 28, minSpawn: 520, freeze: 1900,   // world px / chunks around a player that load / zombies / spawn no closer than this to a player / stand still beyond this
  aggro: 950, speed: 48, atkRange: 42, atkGap: 0.55, hp: 20, flinchT: 0.35, deadT: 4.5, sendEvery: 0.1,   // chase range / walk px/s / claw starts at this distance / rest after a swing / health / stagger s / lie s / snapshot gap
  list: [], spawned: new Set(), fails: {}, fresh: [], nid: 0, spT: 0, sendT: 0, fullT: 0,
  reset(){ this.list.length = 0; this.spawned.clear(); this.fails = {}; this.fresh.length = 0; this.spT = 0; },
  hostId(){ let a = [NetFactory.id, ...Object.keys(RemoteFactory.map)]; if (GameFactory.ids && performance.now() - GameFactory.t0 < 4000) a = a.concat(GameFactory.ids); return a.sort()[0]; },   // first seconds: the room list decides, so nobody claims it before the others show up
  isHost(){ return !GameFactory.room || this.hostId() === NetFactory.id; },
  players(){ const a = [{ id: NetFactory.id, ch: player }]; for (const id in RemoteFactory.map) a.push({ id, ch: RemoteFactory.map[id].ch }); return a.filter(p => !p.ch.dead && !(p.ch.hp <= 0)); },
  make(id, x, y){
    const R = Math.random, z = ZombieFactory.create(x, y);
    Object.assign(z, { id, hp: this.hp, max: this.hp, spd: 0.85 + R() * 0.3, cd: 0.5 + R() * 0.8, flinch: 0, vx: 0, vy: 0, tx: x, ty: y, mv: false, face: R() < 0.5 ? 1 : -1, dcd: 0 });
    this.list.push(z); return z;
  },
  blocked(x, y){ for (const b of CollisionFactory.boxes) if (x > b.x - 20 && x < b.x + b.w + 20 && y > b.y - 20 && y < b.y + b.h + 20) return true; return false; },
  spawnChunk(cx, cy, key, pl){
    const R = Math.random, n = R() < 0.5 ? 1 : 2, pts = [];
    for (let k = 0; k < n; k++) for (let tr = 0; tr < 10; tr++){
      const x = (cx + 0.1 + 0.8 * R()) * this.chunk, y = (cy + 0.1 + 0.8 * R()) * this.chunk;
      if (pl.some(p => Math.hypot(p.ch.x - x, p.ch.y - y) < this.minSpawn) || this.blocked(x, y) || pts.some(q => Math.hypot(q.x - x, q.y - y) < 40)) continue;
      pts.push({ x, y }); break;
    }
    if (!pts.length){ this.fails[key] = (this.fails[key] || 0) + 1; if (this.fails[key] < 6) return false; }   // a chunk that stays too close to the players is retried a few times, then skipped
    this.spawned.add(key); this.fresh.push(key);
    for (const q of pts) this.make(NetFactory.id + '.' + (++this.nid), q.x, q.y);
    return true;
  },
  spawnTick(dt, pl){
    this.spT -= dt; if (this.spT > 0 || !pl.length) return; this.spT = 0.35;   // one chunk per tick, so spawns trickle in instead of arriving all at once
    if (this.list.filter(z => !z.dead).length >= this.maxAlive) return;
    for (const p of pl){
      const cx = Math.floor(p.ch.x / this.chunk), cy = Math.floor(p.ch.y / this.chunk);
      for (let j = -this.loadR; j <= this.loadR; j++) for (let i = -this.loadR; i <= this.loadR; i++){
        const key = (cx + i) + ',' + (cy + j); if (this.spawned.has(key)) continue;
        if (this.spawnChunk(cx + i, cy + j, key, pl)) return;
      }
    }
  },
  // ---- damage ----
  targets(){   // hooked into ImpactFactory.extraTargets: every slam / missile / tornado / storm / spin sweep reaches the zombies, and the shield dome pushes them out
    const out = [];
    for (const z of this.list){
      if (z.dead) continue;
      if (!z.tg){
        z.tg = { w: 0, d: 0, onSlam: (pw, fx, fy, w) => { const amt = HealthFactory.amount(w && w.kind, w || {}, z); if (amt > 0) ZombieSystem.damage(z, amt, fx, fy); } };
        Object.defineProperty(z.tg, 'x', { get: () => z.x, set: v => { z.x = v; }, enumerable: true });

      out.push(z.tg);
    }
    return out;
  },
  damage(z, amt, fx, fy){   // anybody calls this; the host applies it, everyone else sends it to him

  },
  hit(z, amt, fx, fy){   // host only
    if (z.dead) return;

    const dx = z.x - fx, dy = z.y - fy, d = Math.hypot(dx, dy) || 1, kb = amt >= 8 ? 200 : 90;

  },
  strike(z, claw){   // the moment his nails land (host only: everybody else's copy is created with the hit already used)
    if (!this.isHost()) return;
    for (const p of this.players()){
      if (Math.hypot(p.ch.x - claw.x, p.ch.y - claw.y) > claw.r + 14) continue;
      if (p.ch === player) HealthFactory.hurt(player, claw.damage, z.x, z.y); else HealthFactory.send(p.id, claw.damage, z.x, z.y);
    }
  },
  // ---- per frame ----
  update(dt){
    const host = this.isHost(), pl = this.players();
    if (host) this.spawnTick(dt, pl);
    for (const z of this.list) this.step(z, dt, host, pl);
    if (host && this.list.some(z => z.gone)) this.list = this.list.filter(z => !z.gone);
    if (player.sprint) for (const z of this.list){ if (z.dead || z.dcd > 0 || Math.hypot(z.x - player.x, z.y - player.y) > 30) continue; z.dcd = 0.6; this.damage(z, HealthFactory.dmg.dash.tick, player.x, player.y); }   // the dash barges into them
    if (host) this.send(dt);
  },
  step(z, dt, host, pl){
    if (z.dcd > 0) z.dcd -= dt;
    if (z.dead){ z.dead.t += dt; if (z.dead.t > 0.55 && !z.dead.dust){ z.dead.dust = true; DustFactory.spawn(z.x, z.y, 4); } if (z.dead.t > this.deadT + (host ? 0 : 2)) z.gone = true; return; }
    if (!host){
      const k = Math.min(1, dt * 12); z.x += (z.tx - z.x) * k; z.y += (z.ty - z.y) * k; if (z.flinch > 0) z.flinch -= dt;
      ZombieFactory.update(z, dt, z.mv); return;
    }
    let near = 1e9, tg = null; for (const p of pl){ const d = Math.hypot(p.ch.x - z.x, p.ch.y - z.y); if (d < near){ near = d; tg = p.ch; } }
    if (near > this.freeze) return;   // nobody around: stand still, cost nothing
    if (z.flinch > 0){   // staggered: knocked back a little, can't do anything
      z.flinch -= dt; z.x += z.vx * dt; z.y += z.vy * dt; const f = Math.exp(-7 * dt); z.vx *= f; z.vy *= f; CollisionFactory.resolve(z);
      ZombieFactory.update(z, dt, false); return;
    }
    if (z.cd > 0) z.cd -= dt;
    let moving = false;
    if (tg && near < this.aggro && !z.atk){
      const dx = tg.x - z.x, dy = tg.y - z.y;
      z.face = dx >= 0 ? 1 : -1; z.dir = Math.abs(dy) > Math.abs(dx) * 1.3 ? (dy > 0 ? 'front' : 'back') : 'side';
      if (near > this.atkRange * 0.85){
        const vx = dx, vy = dy * CONFIG.tilt, n = Math.hypot(vx, vy) || 1, sp = this.speed * z.spd;   // same screen-speed trick as the player: vertical world speed is scaled up by the tilt
        z.x += vx / n * sp * dt; z.y += vy / n * sp * dt / CONFIG.tilt; moving = true; CollisionFactory.resolve(z);
      } else if (z.cd <= 0){ ZombieFactory.attack(z); z.cd = ZombieFactory.total() + this.atkGap; }
    }
    for (const o of this.list){   // don't stack on each other
      if (o === z || o.dead) continue; const ox = z.x - o.x, oy = z.y - o.y, d = Math.hypot(ox, oy);
      if (d > 0.01 && d < 26){ const push = (26 - d) * 0.5; z.x += ox / d * push; z.y += oy / d * push; }
    }
    ZombieFactory.update(z, dt, moving);
  },
  // ---- multiplayer ----
  send(dt){
    if (!GameFactory.room) return; this.sendT -= dt; if (this.sendT > 0) return; this.sendT = this.sendEvery;
    const r1 = v => Math.round(v * 10) / 10, r2 = v => Math.round(v * 100) / 100;
    const msg = { t: 'zs', id: NetFactory.id, z: this.list.map(z => [z.id, r1(z.x), r1(z.y), z.face, z.dir === 'front' ? 1 : z.dir === 'back' ? 2 : 0, z.clip === 'walk' ? 1 : z.clip === 'attack' ? 2 : 0, z.hp, z.atk ? r2(z.atk.t) : -1, z.dead ? r2(z.dead.t) : -1, z.flinch > 0 ? 1 : 0, z.fallDir || 1]) };
    this.fullT -= this.sendEvery; if (this.fullT <= 0){ this.fullT = 3; msg.c = [...this.spawned]; } else if (this.fresh.length) msg.c = this.fresh.slice();   // the spawned-chunk list, so a new host never spawns a chunk twice
    this.fresh.length = 0; GameFactory.room.send(msg);
  },
  onSnap(m){
    if (m.id === NetFactory.id || m.id !== this.hostId()) return;
    for (const k of m.c || []) this.spawned.add(k);
    const seen = new Set();
    for (const a of m.z){
      const [id, x, y, face, dc, cc, hp, atkT, deadT, fl, fd] = a; seen.add(id);
      let z = this.list.find(q => q.id === id);
      if (!z){ z = this.make(id, x, y); z.hp = hp; }
      z.tx = x; z.ty = y; z.face = face; z.dir = dc === 1 ? 'front' : dc === 2 ? 'back' : 'side'; z.mv = cc === 1; z.fallDir = fd;
      if (hp < z.hp){ HealthFactory.float(z, z.hp - hp); z.flinch = this.flinchT; } z.hp = hp;
      if (fl && !(z.flinch > 0)) z.flinch = this.flinchT;
      if (atkT >= 0 && !z.atk) z.atk = { t: atkT, hit: true }; else if (atkT < 0 && z.atk && z.atk.t > 0.3) { /* the local swing finishes by itself */ }
      if (deadT >= 0 && !z.dead){ z.dead = { t: deadT }; z.atk = null; z.clip = 'idle'; }
    }
    this.list = this.list.filter(z => seen.has(z.id));
  },
  onDmg(m){ if (!this.isHost()) return; const z = this.list.find(q => q.id === m.zid); if (z) this.hit(z, m.amt, m.x, m.y); },
  // ---- drawing ----
  collect(items, cam, W, H){
    for (const z of this.list){ if (!ViewFactory.sees(z.x, z.y, 120, 120, 200)) continue; items.push({ y: z.dead ? z.y - 1 : z.y, f: () => this.draw(ctx, z, cam, W, H) }); }
  },
  draw(g, z, cam, W, H){   // the ZombieFactory body, tilted for the flinch and the fall
    const s = GroundFactory.toScreen(z.x, z.y, cam, W, H), away = z.fallDir || (z.face ? -z.face : 1);
    let ang = 0, alpha = 1, red = 0;
    if (z.dead){
      const t = z.dead.t, u = Math.min(1, t / 0.7), pool = Math.min(1, t / 1.6);
      g.save(); g.fillStyle = 'rgba(90,6,10,' + (0.55 * Math.min(1, alpha)) + ')'; g.beginPath(); g.ellipse(s.x + away * 14 * pool, s.y + 2, 30 * pool, 10 * pool, 0, 0, 7); g.fill(); g.restore();   // blood pool
      ang = away * (u * u * 1.5 + (t > 0.7 ? 0.07 * Math.exp(-(t - 0.7) * 5) * Math.abs(Math.sin((t - 0.7) * 14)) : 0));   // falls onto his back, with a small bounce
      if (t > this.deadT - 1) alpha = Math.max(0, this.deadT - t);
    } else if (z.flinch > 0){ const u = z.flinch / this.flinchT; ang = away * 0.32 * Math.sin(u * Math.PI); red = u; }
    g.save(); g.globalAlpha = alpha; g.translate(s.x, s.y); g.rotate(ang); g.translate(-s.x, -s.y);
    ZombieFactory.draw(g, z, s);
    if (red > 0){ g.fillStyle = 'rgba(255,40,30,' + (0.35 * red) + ')'; g.beginPath(); g.ellipse(s.x, s.y - 34, 15, 38, 0, 0, 7); g.fill(); }
    g.restore();
    if (!z.dead && z.hp < z.max){   // small health bar, only once he has been hurt
      const w = 34, x = s.x - w / 2, y = s.y - 88; g.fillStyle = 'rgba(0,0,0,.65)'; g.fillRect(x - 1.5, y - 1.5, w + 3, 6);
      g.fillStyle = '#3a1512'; g.fillRect(x, y, w, 3); g.fillStyle = z.hp / z.max > 0.5 ? '#7dff8f' : '#ff6a5a'; g.fillRect(x, y, w * z.hp / z.max, 3);
    }
  }
};

/* ============ DUST FACTORY (footfall puffs for heavy gimmicks) ============ */
const DustFactory = {
  puffs: [], prev: 0, flip: 1,
  max: 120,
  spawn(x, y, n){ if (!ViewFactory.sees(x, y, 200, 200, 200)) return; if (this.puffs.length > this.max) this.puffs.splice(0, this.puffs.length - this.max); for (let i = 0; i < n; i++) this.puffs.push({ x: x + (Math.random() - .5) * 10, y: y + (Math.random() - .5) * 4, vx: (Math.random() - .5) * 30, vy: (Math.random() - .5) * 12, r: 3 + Math.random() * 3, life: 1 }); },
  step(ch){   // call every frame for the local character
    const sk = SkinFactory[ch.gimmick]; if (!sk || sk.dust === false || ch.clip === 'idle'){ this.prev = 0; return; }
    if (!sk.clips[ch.clip]){ this.prev = 0; return; }
    const ph = Math.cos(ch.t * sk.clips[ch.clip].f), sg = Math.sign(ph);
    if (this.prev && sg !== this.prev){ this.flip = -this.flip; this.spawn(ch.x + (ch.dir === 'side' ? ch.face * 4 : this.flip * 8), ch.y + 3, ch.clip === 'run' ? 5 : 3); }
    this.prev = sg;
  },
  update(dt){ this.puffs = this.puffs.filter(p => (p.life -= dt * 2.2) > 0); for (const p of this.puffs){ p.x += p.vx * dt; p.y += p.vy * dt; p.r += dt * 14; } },
  draw(g, cam, W, H){ for (const p of this.puffs){ if (!ViewFactory.sees(p.x, p.y, 40, 40, 60)) continue; const s = GroundFactory.toScreen(p.x, p.y, cam, W, H);
    g.fillStyle = `rgba(205,195,170,${p.life * 0.45})`; g.beginPath(); g.ellipse(s.x, s.y, p.r, p.r * CONFIG.tilt, 0, 0, 7); g.fill(); } }
};

/* ============ NET FACTORY (Supabase Realtime, or local two-tab test mode when no keys) ============ */
const NetFactory = {
  id: Math.random().toString(36).slice(2, 8), sb: null,
  mode(){ return CONFIG.supabase.url && CONFIG.supabase.key && window.supabase ? 'supabase' : 'local'; },
  open(name, meta, h){ return this.mode() === 'supabase' ? this.openSb(name, meta, h) : new LocalChannel(name, this.id, meta, h); },
  openSb(name, meta, h){
    if (!this.sb) this.sb = supabase.createClient(CONFIG.supabase.url, CONFIG.supabase.key);
    const ch = this.sb.channel(name, { config: { broadcast: { self: false }, presence: { key: this.id } } });
    const flat = () => { const st = ch.presenceState(), o = {}; for (const k in st) o[k] = st[k][0]; return o; };
    ch.on('presence', { event: 'sync' }, () => h.onPresence && h.onPresence(flat()));
    ch.on('broadcast', { event: 'msg' }, ({ payload }) => h.onMsg && h.onMsg(payload));
    const api = { ready: false, meta,
      track(m){ api.meta = m; if (api.ready && m) ch.track(m); },
      send(p){ if (api.ready) ch.send({ type: 'broadcast', event: 'msg', payload: p }); },
      state: flat, leave(){ try { ch.untrack(); NetFactory.sb.removeChannel(ch); } catch (e) {} } };
    ch.subscribe(st => {
      if (st === 'SUBSCRIBED'){ api.ready = true; if (api.meta) ch.track(api.meta); h.onReady && h.onReady(); }
      else if (st === 'CHANNEL_ERROR' || st === 'TIMED_OUT') h.onError && h.onError(st);
    });
    return api;
  }
};
class LocalChannel {   // same interface as the Supabase channel, over BroadcastChannel (tabs of the same browser)
  constructor(name, id, meta, h){
    Object.assign(this, { id, meta, h, peers: {}, ready: true });
    this.bc = new BroadcastChannel('gimmick:' + name);
    this.bc.onmessage = e => { const m = e.data;
      if (m.k === 'hb'){ this.peers[m.id] = { meta: m.meta, seen: Date.now() }; this.sync(); }
      else if (m.k === 'bye'){ delete this.peers[m.id]; this.sync(); }
      else if (m.k === 'who') this.beat();
      else if (m.k === 'msg') h.onMsg && h.onMsg(m.p); };
    this.timer = setInterval(() => { this.beat(); this.prune(); }, 1000);
    this.bc.postMessage({ k: 'who' }); this.beat();
    setTimeout(() => h.onReady && h.onReady(), 0);
  }
  beat(){ if (this.meta) this.bc.postMessage({ k: 'hb', id: this.id, meta: this.meta }); }
  prune(){ let c = false; for (const k in this.peers) if (Date.now() - this.peers[k].seen > 3500){ delete this.peers[k]; c = true; } if (c) this.sync(); }
  state(){ const o = {}; for (const k in this.peers) o[k] = this.peers[k].meta; if (this.meta) o[this.id] = this.meta; return o; }
  sync(){ this.h.onPresence && this.h.onPresence(this.state()); }
  track(m){ this.meta = m; this.beat(); this.sync(); }
  send(p){ this.bc.postMessage({ k: 'msg', p }); }
  leave(){ try { this.bc.postMessage({ k: 'bye', id: this.id }); } catch (e) {} clearInterval(this.timer); this.bc.close(); }
}

/* ============ REMOTE PLAYER FACTORY ============ */
const RemoteFactory = {
  map: {},
  list(){ return Object.values(this.map).map(r => r.ch); },
  onPos(m){
    if (m.id === NetFactory.id) return;
    let r = this.map[m.id];
    if (!r){ const meta = (GameFactory.roster[m.id]) || {}; r = this.map[m.id] = { ch: CharacterFactory.create(m.x, m.y, { shirt: meta.color || '#2980b9' }), tx: m.x, ty: m.y, seen: 0 }; r.ch.name = meta.name || 'Player'; r.ch.remote = true; }
    r.ch.gimmick = m.gm || (GameFactory.roster[m.id] || {}).gimmick || r.ch.gimmick || null; r.ch.enT = m.en || 0; r.ch.twist = m.tw >= 0 ? { t: m.tw } : null;   // which gimmick he is + his dash / twist energy form (so it shows on my screen too)
    Object.assign(r, { tx: m.x, ty: m.y, seen: performance.now() });
    const hpOld = r.ch.hp; Object.assign(r.ch, { dir: m.dir, face: m.face, clip: m.clip, hov: m.hov || 0 }); if (m.hp !== undefined){ r.ch.hp = m.hp; if (m.hp < hpOld) HealthFactory.float(r.ch, hpOld - m.hp); }
  },
  update(rdt, wdt){   // rdt = real time, wdt = slowed world time (the time-slow caster stays on real time)
    const now = performance.now();
    for (const id in this.map){ const r = this.map[id], dt = (SlowFactory.on && id === SlowFactory.owner) ? rdt : (wdt === undefined ? rdt : wdt);
      if (r.seen && now - r.seen > 6000){ delete this.map[id]; continue; }
      const k = Math.min(1, dt * 12), ox = r.ch.x, oy = r.ch.y; r.ch.x += (r.tx - r.ch.x) * k; r.ch.y += (r.ty - r.ch.y) * k; r.ch.t += dt;
      { const mx = r.tx - r.ch.x, my = (r.ty - r.ch.y) * CONFIG.tilt, ml = Math.hypot(mx, my); if (ml > 1) r.ch.mv = { x: mx / ml, y: my / ml / CONFIG.tilt }; r.ch.en = (r.ch.en || 0) + ((r.ch.enT || 0) - (r.ch.en || 0)) * Math.min(1, dt * 14); } r.ch.slamT = r.ch.clip === 'slam' ? (r.ch.slamT || 0) + dt : 0; }
  },
  collect(items, cam, W, H){ for (const id in this.map){ const c = this.map[id].ch; if (!ViewFactory.sees(c.x, c.y)) continue; items.push({ y: c.y, f: () => c.gimmick === 'speed' ? SpeedFactory.drawPlayer(ctx, c, cam, W, H) : CharacterFactory.draw(ctx, c, cam, W, H) }); } }
};

    this.show(`<h2>Multiplayer</h2><label>Your name (required)</label><input id="n" maxlength="14" placeholder="Type your name" value="${this.esc(this.name)}">
      <button class="mbtn pri" id="mkroom">Create room</button><button class="mbtn" id="j">Join room</button><div class="mmsg" id="msg"></div>
      <button class="mlink" id="b">Back</button>${local ? '<div class="mnote">Test mode: no Supabase keys set, so rooms work between two tabs of this browser. Add the keys in CONFIG.supabase for real online play.</div>' : ''}`);
    const need = () => { const v = this.$('#n').value.trim(); if (!v){ this.$('#msg').textContent = 'Type a name first.'; this.$('#n').focus(); return null; } return this.name = v; };
    this.$('#mkroom').onclick = () => need() && this.pick(g => { this.gimmick = g; this.create(); });
    this.$('#j').onclick = () => need() && this.pick(g => { this.gimmick = g; this.join(); });
    this.$('#b').onclick = () => this.main();
  },
  create(){
    this.show(`<h2>Create room</h2><label>Room name</label><input id="rn" maxlength="24" placeholder="Friday zombies" value="${this.esc(this.name)}'s room">
      <label>Max players</label><select id="mx">${[2, 3, 4, 5, 6].map(n => `<option ${n === CONFIG.maxPlayers ? 'selected' : ''}>${n}</option>`).join('')}</select>
      <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="pb" checked style="width:auto"> Public (listed on Join screen)</label>
      <button class="mbtn pri" id="go">Create</button><button class="mlink" id="b">Back</button>`);
    this.$('#b').onclick = () => this.multi();
    this.$('#go').onclick = () => this.host(this.$('#rn').value.trim() || 'Room', +this.$('#mx').value, this.$('#pb').checked);
  },
  host(roomName, max, isPublic){
    const code = this.code(); this.hostInfo = { code, roomName, max, isPublic, started: false };
    const meta = () => ({ name: this.name, color: this.color, gimmick: this.gimmick, host: true, started: this.hostInfo.started, max, roomName, code });
    this.room = NetFactory.open('room-' + code, meta(), { onPresence: st => this.lobby(st), onMsg: m => this.onMsg(m) });
    this.metaFn = meta;
    if (isPublic) this.pub = NetFactory.open('lobby', { code, name: roomName, host: this.name, max, players: 1, started: false }, {});
    this.lobby(this.room.state());
  },
  lobby(st){
    if (!this.room) return;
    const ids = Object.keys(st).sort(), amHost = !!(st[NetFactory.id] && st[NetFactory.id].host), h = ids.map(i => st[i]).find(m => m && m.host) || {};
    if (this.pub && this.hostInfo) this.pub.track({ code: this.hostInfo.code, name: this.hostInfo.roomName, host: this.name, max: this.hostInfo.max, players: ids.length, started: this.hostInfo.started });
    const rows = ids.map(i => `<div><i style="background:${this.esc(st[i].color)}"></i>${this.esc(st[i].name)}${st[i].gimmick && GimmickFactory.get(st[i].gimmick) ? ' <small style="opacity:.6">· ' + this.esc(GimmickFactory.get(st[i].gimmick).name) + '</small>' : ''}${st[i].host ? ' <small style="opacity:.6">(host)</small>' : ''}${i === NetFactory.id ? ' <small style="opacity:.6">(you)</small>' : ''}</div>`).join('');
    this.show(`<h2>${this.esc(h.roomName || 'Lobby')}</h2><div class="mnote">Room code</div><div class="bigcode">${this.esc(h.code || this.joinCode || '')}</div>
      <div class="mplayers">${rows}</div><div class="mnote">${ids.length}/${h.max || '?'} players</div>
      ${amHost ? '<button class="mbtn pri" id="st">Start game</button>' : '<div class="mnote">Waiting for the host to start…</div>'}<button class="mlink" id="lv">Leave room</button>`);
    this.$('#lv').onclick = () => this.main();
    if (amHost) this.$('#st').onclick = () => {
      this.hostInfo.started = true; this.room.track(this.metaFn());
      const roster = {}; ids.forEach(i => roster[i] = { name: st[i].name, color: st[i].color, gimmick: st[i].gimmick });
      this.room.send({ t: 'start', ids, roster }); this.begin(ids, roster);
    };
    this.lastState = st;
  },
  onMsg(m){
    if (m.t === 'start') this.begin(m.ids, m.roster);
    else if (m.t === 'pos') RemoteFactory.onPos(m);
    else if (m.t === 'slam') SlamFactory.onRemote(m);
    else if (m.t === 'missile') MissileFactory.onRemote(m);
    else if (m.t === 'slow') SlowFactory.onRemote(m);
    else if (m.t === 'tornado') TornadoFactory.onRemote(m);
    else if (m.t === 'dmg') HealthFactory.onRemote(m);
    else if (m.t === 'swim') SwimFactory.onRemote(m);
    else if (m.t === 'storm') StormFactory.onRemote(m);
    else if (m.t === 'zs') ZombieSystem.onSnap(m);
    else if (m.t === 'zdmg') ZombieSystem.onDmg(m);
  },
  begin(ids, roster){ const room = this.room; GameFactory.start({ name: this.name, color: this.color, room, roster, ids, gimmick: this.gimmick }); },
  join(){
    this.leaveAll();
    this.show(`<h2>Join room</h2><label>Public rooms</label><div class="mlist" id="pl"><div class="mnote">Looking for rooms…</div></div>
      <label>Or enter a room code</label><input class="code" id="cd" maxlength="4" placeholder="K7P2">
      <button class="mbtn pri" id="go">Join</button><div class="mmsg" id="msg"></div><button class="mlink" id="b">Back</button>`);
    const list = st => { const rs = Object.values(st).filter(m => m && m.code && !m.started);
      this.$('#pl').innerHTML = rs.length ? rs.map(r => `<button data-c="${this.esc(r.code)}">${this.esc(r.name)} · ${this.esc(r.host)} · ${r.players}/${r.max}</button>`).join('') : '<div class="mnote">No public rooms right now.</div>';
      this.$('#pl').querySelectorAll('[data-c]').forEach(b => b.onclick = () => this.enter(b.dataset.c)); };
    this.pub = NetFactory.open('lobby', null, { onPresence: st => this.$('#pl') && list(st) });
    this.$('#go').onclick = () => { const c = this.$('#cd').value.trim().toUpperCase(); if (c.length < 4){ this.$('#cd').focus(); return; } this.enter(c); };
    this.$('#b').onclick = () => this.multi();
  },
  enter(code){
    if (this.pub){ this.pub.leave(); this.pub = null; }
    this.joinCode = code; this.show('<h2>Joining ' + this.esc(code) + '…</h2>');
    const meta = { name: this.name, color: this.color, gimmick: this.gimmick, host: false };
    this.room = NetFactory.open('room-' + code, meta, { onPresence: st => this.joined && this.lobby(st), onMsg: m => this.onMsg(m), onError: () => this.fail('Could not connect to the server.') });
    setTimeout(() => {   // wait for presence, then check the room really exists
      if (!this.room) return;
      const st = this.room.state(), ms = Object.values(st), host = ms.find(m => m.host);
      if (!host) return this.fail('Room not found.');
      if (host.started) return this.fail('That game already started.');
      if (ms.length > host.max) return this.fail('Room is full.');
      this.joined = true; this.lobby(st);
    }, 1500);
  },
  fail(msg){ this.leaveAll(); this.join(); this.$('#msg').textContent = msg; },
  leaveAll(){ this.joined = false; this.hostInfo = null; for (const k of ['room', 'pub']) if (this[k]){ this[k].leave(); this[k] = null; } }
};
MenuFactory.init();
</script></body></html>
