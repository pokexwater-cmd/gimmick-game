<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gimmick Prototype</title>
<style>
html,body{margin:0;height:100%;background:#1b2a17;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%}
#joyZone{position:fixed;left:0;bottom:0;width:60%;height:60%;touch-action:none}
#joyBase{position:fixed;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.15);border:2px solid rgba(255,255,255,.4);display:none;pointer-events:none}
#joyStick{position:fixed;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.55);display:none;pointer-events:none}
#hud{position:fixed;left:8px;top:calc(env(safe-area-inset-top,0px) + 8px);color:#fff;font:12px sans-serif;background:rgba(0,0,0,.4);padding:6px 10px;border-radius:8px}
#menu{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:radial-gradient(#26401f,#0b1409);color:#fff;font-family:system-ui,sans-serif;padding:env(safe-area-inset-top,0px) 12px env(safe-area-inset-bottom,0px)}
.mcard{width:min(380px,100%);max-height:100%;overflow:auto;text-align:center}
.mcard h1{margin:0 0 4px;font-size:34px;letter-spacing:.04em}.mcard h2{margin:0 0 12px}.mcard p.sub{margin:0 0 22px;opacity:.6;font-size:13px}
.mcard label{display:block;text-align:left;font-size:12px;opacity:.7;margin:12px 0 4px}
.mcard input,.mcard select{width:100%;box-sizing:border-box;padding:11px;border-radius:10px;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.35);color:#fff;font-size:16px}
.mcard input.code{text-align:center;letter-spacing:.35em;text-transform:uppercase;font-size:22px}
.mbtn{display:block;width:100%;box-sizing:border-box;margin:10px 0 0;padding:13px;border-radius:12px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#fff;font-size:16px;cursor:pointer}
.mbtn.pri{background:#4f8a3a;border-color:#7cc45a}.mbtn:disabled{opacity:.4}
.mlink{background:none;border:0;color:#9fd18a;margin-top:14px;font-size:14px;cursor:pointer}
.mlist button{display:block;width:100%;text-align:left;margin:5px 0;padding:10px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.07);color:#fff;font-size:14px}
.mmsg{min-height:18px;margin-top:10px;font-size:13px;color:#ffb4a0}.mnote{font-size:12px;opacity:.6;margin-top:10px}
.mplayers div{padding:8px 10px;margin:4px 0;border-radius:8px;background:rgba(255,255,255,.08);text-align:left;display:flex;align-items:center;gap:8px}
.mplayers i{width:12px;height:12px;border-radius:50%;display:inline-block}
.bigcode{font-size:38px;letter-spacing:.3em;margin:6px 0;color:#ffd76a}
</style></head><body>
<div id="menu"></div><canvas id="c" style="display:none"></canvas><div id="joyZone" style="display:none"></div><div id="joyBase"></div><div id="joyStick"></div>
<div id="hud" style="display:none">Move: joystick / WASD · Shift = run · C = collision debug</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* ============ CONFIG (tune everything here) ============ */
const CONFIG = {
  tilt: 0.42,           // GroundFactory: 1 = top-down (2D), lower = more 3D. 0.42 = tilted down, see more of the back
  grassTile: 128,       // TextureFactory: tile size in px
  walkSpeed: 110, runSpeed: 230,   // px/sec
  runThreshold: 0.75,   // joystick push (0..1) above which he runs
  joystickMaxRadius: 55,           // from the cricket joystick factory
  invertX: false,       // set true for the "reversed" joystick X from the cricket game
  charScale: 1,
  supabase: { url: 'https://coirjxgwejtcojpzllqk.supabase.co', key: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNvaXJqeGd3ZWp0Y29qcHpsbHFrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA3MzY0MDAsImV4cCI6MjEwNjMxMjQwMH0.VM4Pn_7tXwMaSgPuOGfOSXtSk-mJ52o8Ay-a7BHaqPc' },   // paste your Supabase Project URL + anon (public) key. Empty = local test mode (same browser, two tabs)
  sendRate: 12,                     // position messages per second
  maxPlayers: 4
};

/* ============ TEXTURE FACTORY ============ */
const TextureFactory = {
  grass(seed = 7){
    const S = CONFIG.grassTile, c = document.createElement('canvas'); c.width = c.height = S;
    const g = c.getContext('2d');
    let s = seed; const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
    g.fillStyle = '#4f8a3a'; g.fillRect(0, 0, S, S);
    const wrap = (fn) => { for (const ox of [-S, 0, S]) for (const oy of [-S, 0, S]) fn(ox, oy); };
    // soft patches
    for (let i = 0; i < 14; i++){
      const x = r()*S, y = r()*S, rad = 14 + r()*22, col = r() < .5 ? 'rgba(90,150,60,.22)' : 'rgba(40,90,35,.22)';
      wrap((ox, oy) => { g.fillStyle = col; g.beginPath(); g.arc(x+ox, y+oy, rad, 0, 7); g.fill(); });
    }
    // blades
    const cols = ['#3d7a30', '#5fa044', '#6fb650', '#356b2b', '#7cc45a'];
    for (let i = 0; i < 420; i++){
      const x = r()*S, y = r()*S, h = 4 + r()*6, lean = (r()-.5)*4;
      g.strokeStyle = cols[(r()*cols.length)|0]; g.lineWidth = 1.2;
      wrap((ox, oy) => { g.beginPath(); g.moveTo(x+ox, y+oy); g.lineTo(x+ox+lean, y+oy-h); g.stroke(); });
    }
    // tiny flowers / dirt specks
    for (let i = 0; i < 10; i++){
      const x = r()*S, y = r()*S;
      wrap((ox, oy) => { g.fillStyle = r() < .5 ? '#e8e2a0' : '#7a5c3a'; g.fillRect(x+ox, y+oy, 2, 2); });
    }
    return c;
  }
};

/* ============ GROUND FACTORY (tilted plane) ============ */
const GroundFactory = {
  pattern: null,
  init(ctx){ this.pattern = ctx.createPattern(TextureFactory.grass(), 'repeat'); },
  // world (x,y) -> screen. y is squashed by tilt = pseudo 3D
  toScreen(x, y, cam, W, H){ return { x: x - cam.x + W/2, y: (y - cam.y) * CONFIG.tilt + H/2 }; },
  draw(ctx, cam, W, H){
    const t = CONFIG.tilt;
    ctx.save();
    ctx.translate(W/2, H/2); ctx.scale(1, t); ctx.translate(-cam.x, -cam.y);
    ctx.fillStyle = this.pattern;
    ctx.fillRect(cam.x - W/2 - 2, cam.y - H/(2*t) - 2, W + 4, H/t + 4);
    ctx.restore();
    // distance haze at the far (top) edge for depth
    const g = ctx.createLinearGradient(0, 0, 0, H*0.45);
    g.addColorStop(0, 'rgba(150,190,150,.35)'); g.addColorStop(1, 'rgba(150,190,150,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H*0.45);
  }
};

/* ============ COLLISION FACTORY ============ */
const CollisionFactory = {
  boxes: [],   // {x,y,w,h} footprints in world space
  radius: 12,  // character foot radius
  debug: false,
  add(x, y, w, h){ this.boxes.push({x, y, w, h}); },
  // move circle, slide along boxes
  resolve(pos){
    for (const b of this.boxes){
      const cx = Math.max(b.x, Math.min(pos.x, b.x + b.w));
      const cy = Math.max(b.y, Math.min(pos.y, b.y + b.h));
      let dx = pos.x - cx, dy = pos.y - cy, d = Math.hypot(dx, dy);
      if (d < this.radius){
        if (d === 0){ // centre inside box: push out the shortest way
          const l = pos.x - b.x, r = b.x + b.w - pos.x, t = pos.y - b.y, bt = b.y + b.h - pos.y, m = Math.min(l, r, t, bt);
          if (m === l) pos.x = b.x - this.radius; else if (m === r) pos.x = b.x + b.w + this.radius;
          else if (m === t) pos.y = b.y - this.radius; else pos.y = b.y + b.h + this.radius;
        } else { pos.x = cx + dx/d*this.radius; pos.y = cy + dy/d*this.radius; }
      }
    }
  }
};

/* ============ PROP FACTORY (crates / drums with collision, pseudo-3D boxes) ============ */
const PropFactory = {
  props: [],
  crate(x, y, w = 46, d = 34, h = 44){ this.props.push({type:'crate', x, y, w, d, h}); CollisionFactory.add(x, y, w, d); },
  drum(x, y){ this.props.push({type:'drum', x, y, w:30, d:30, h:46}); CollisionFactory.add(x, y, 30, 30); },
  draw(ctx, p, cam, W, H){
    const t = CONFIG.tilt, s = GroundFactory.toScreen(p.x, p.y, cam, W, H), dh = p.d * t, top = s.y - p.h, fy = s.y + dh - p.h;
    // long soft cast shadow on the ground
    ctx.fillStyle = 'rgba(0,0,0,.28)'; ctx.beginPath();
    ctx.moveTo(s.x, s.y + dh); ctx.lineTo(s.x + p.w, s.y + dh); ctx.lineTo(s.x + p.w + p.h*0.7, s.y + dh*0.35); ctx.lineTo(s.x + p.h*0.7, s.y + dh*0.35); ctx.closePath(); ctx.fill();
    if (p.type === 'crate'){
      const g = ctx.createLinearGradient(0, fy, 0, s.y + dh); g.addColorStop(0, '#9a6630'); g.addColorStop(1, '#6b4320');
      ctx.fillStyle = g; ctx.fillRect(s.x, fy, p.w, p.h);                                   // front face
      ctx.fillStyle = '#c4894a'; ctx.fillRect(s.x, top, p.w, dh);                            // top face (lit)
      ctx.strokeStyle = 'rgba(60,35,15,.55)'; ctx.lineWidth = 1.5;
      for (let i = 1; i < 4; i++){ const y = fy + p.h*i/4; ctx.beginPath(); ctx.moveTo(s.x, y); ctx.lineTo(s.x+p.w, y); ctx.stroke(); }   // planks
      for (let i = 1; i < 3; i++){ const y = top + dh*i/3; ctx.beginPath(); ctx.moveTo(s.x, y); ctx.lineTo(s.x+p.w, y); ctx.stroke(); }
      ctx.strokeStyle = '#4a2c12'; ctx.lineWidth = 3;                                         // frame beams
      ctx.strokeRect(s.x+1.5, fy+1.5, p.w-3, p.h-3);
      ctx.beginPath(); ctx.moveTo(s.x+3, fy+3); ctx.lineTo(s.x+p.w-3, s.y+dh-3); ctx.moveTo(s.x+p.w-3, fy+3); ctx.lineTo(s.x+3, s.y+dh-3); ctx.stroke();
      ctx.strokeRect(s.x, top, p.w, dh);
      ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.fillRect(s.x, fy, p.w, 3);                // edge highlight
      ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fillRect(s.x, s.y + dh - 5, p.w, 5);            // dark base
    } else {
      const cx = s.x + p.w/2, cy = s.y + dh/2, r = 15, ry = r*t;
      const g = ctx.createLinearGradient(cx - r, 0, cx + r, 0); g.addColorStop(0, '#a4523c'); g.addColorStop(.45, '#c1664d'); g.addColorStop(1, '#5a271c');
      ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(cx, cy, r, ry, 0, 0, Math.PI); ctx.lineTo(cx - r, cy - p.h); ctx.lineTo(cx + r, cy - p.h); ctx.lineTo(cx + r, cy); ctx.fill();
      ctx.fillStyle = 'rgba(0,0,0,.35)';
      for (const f of [.3, .7]){ ctx.beginPath(); ctx.ellipse(cx, cy - p.h*f, r, ry, 0, 0, Math.PI); ctx.lineTo(cx - r, cy - p.h*f - 3); ctx.ellipse(cx, cy - p.h*f - 3, r, ry, 0, Math.PI, 0, true); ctx.fill(); }
      ctx.fillStyle = '#d9825f'; ctx.beginPath(); ctx.ellipse(cx, cy - p.h, r, ry, 0, 0, 7); ctx.fill();
      ctx.fillStyle = '#3a1a12'; ctx.beginPath(); ctx.ellipse(cx, cy - p.h, r*0.7, ry*0.7, 0, 0, 7); ctx.fill();
    }
  },
  sortY(p){ return p.y + p.d; }
};

/* ============ GRASS FACTORY (upright tufts, depth-sorted like the props) ============ */
const GrassFactory = {
  cell: 70,
  hash(i, j){ let h = (i * 374761393 + j * 668265263) | 0; h = (h ^ (h >>> 13)) * 1274126177 | 0; return ((h ^ (h >>> 16)) >>> 0) / 4294967295; },
  collect(cam, W, H, out, time){
    const c = this.cell, t = CONFIG.tilt, x0 = Math.floor((cam.x - W/2 - 30)/c), x1 = Math.floor((cam.x + W/2 + 30)/c);
    const y0 = Math.floor((cam.y - H/(2*t) - 30)/c), y1 = Math.floor((cam.y + H/(2*t) + 60)/c);
    for (let i = x0; i <= x1; i++) for (let j = y0; j <= y1; j++){
      const r = this.hash(i, j); if (r < 0.35) continue;
      const wx = (i + this.hash(j, i)) * c, wy = (j + this.hash(i + 9, j + 4)) * c, size = 0.7 + r*0.9;
      out.push({ y: wy, f: () => this.draw(ctx, GroundFactory.toScreen(wx, wy, cam, W, H), size, time + wx*0.02, r) });
    }
  },
  draw(g, s, size, ph, r){
    const n = 5 + (r*4|0), cols = ['#3d7a30', '#5fa044', '#6fb650', '#4a8f38', '#7cc45a'];
    g.fillStyle = 'rgba(0,0,0,.15)'; g.beginPath(); g.ellipse(s.x, s.y, 7*size, 2.5*size, 0, 0, 7); g.fill();
    g.lineCap = 'round';
    for (let k = 0; k < n; k++){
      const a = (k/(n-1) - .5) * 1.5, len = (11 + ((k*7 + r*13)%7)) * size, sway = Math.sin(ph*2 + k) * 1.8;
      g.strokeStyle = cols[k % cols.length]; g.lineWidth = 2.2*size;
      g.beginPath(); g.moveTo(s.x + a*4, s.y); g.quadraticCurveTo(s.x + a*8, s.y - len*.6, s.x + a*14 + sway, s.y - len); g.stroke();
    }
  }
};

/* ============ ANIMATION FACTORY (walk / run) ============ */
const AnimationFactory = {
  clips: {
    idle: { freq: 0,  leg: 0,    arm: 0,    bob: 0,   lean: 0 },
    walk: { freq: 9,  leg: 0.55, arm: 0.5,  bob: 2.5, lean: 0.05 },
    run:  { freq: 15, leg: 1.0,  arm: 1.0,  bob: 4.5, lean: 0.22 }
  },
  // returns the pose for a clip at time t (radians)
  pose(clip, t){
    const c = this.clips[clip], sw = Math.sin(t * c.freq);
    return {
      legL: sw * c.leg, legR: -sw * c.leg,
      armL: -sw * c.arm, armR: sw * c.arm,
      bob: Math.abs(Math.cos(t * c.freq)) * c.bob + (clip === 'idle' ? Math.sin(t * 2) * 0.8 : 0),
      lean: c.lean
    };
  }
};

/* ============ DIRECTION FACTORY (4-direction: side L/R, back, front) ============ */
const DirectionFactory = {
  bias: 1.25,   // how much stronger an axis must be to switch direction (stops flickering on diagonals)
  resolve(ch, mx, my){
    const ax = Math.abs(mx), ay = Math.abs(my); let d = ch.dir;
    if (d === 'side'){ if (ay > ax * this.bias) d = my < 0 ? 'back' : 'front'; }
    else if (ax > ay * this.bias) d = 'side';
    else d = my < 0 ? 'back' : 'front';
    ch.dir = d;
    if (d === 'side' && ax > 0.1) ch.face = mx > 0 ? 1 : -1;
  }
};

/* ============ FRONT/BACK ANIMATION FACTORY (walking toward / away from camera) ============ */
const DepthAnimationFactory = {
  clips: {
    idle: { freq: 0,  stride: 0, lift: 0, arm: 0, sway: 0,   bob: 0,   tilt: 0 },
    walk: { freq: 9,  stride: 4, lift: 5, arm: 3, sway: 1.6, bob: 2.5, tilt: 0.04 },
    run:  { freq: 15, stride: 8, lift: 9, arm: 6, sway: 2.6, bob: 4.5, tilt: 0.08 }
  },
  pose(clip, t){
    const c = this.clips[clip], sw = Math.sin(t * c.freq), cs = Math.cos(t * c.freq);
    return {
      L: sw, R: -sw, c,
      raiseL: Math.max(0, sw) * c.lift, raiseR: Math.max(0, -sw) * c.lift,
      sway: cs * c.sway, tilt: cs * c.tilt,
      bob: Math.abs(cs) * c.bob + (clip === 'idle' ? Math.sin(t * 2) * 0.8 : 0)
    };
  }
};

/* ============ CHARACTER FACTORY (2D paper-doll body) ============ */
const CharacterFactory = {
  create(x, y, look = {}){
    return { x, y, face: 1, up: false, dir: 'front', clip: 'idle', t: 0,
      look: Object.assign({ skin:'#f0c39b', shirt:'#c0392b', pants:'#2c3e50', shoe:'#1a1a1a', hair:'#3b2416' }, look) };
  },
  limb(g, len, w, col){ g.fillStyle = col; g.beginPath(); g.roundRect(-w/2, 0, w, len, w/2); g.fill(); },
  // front / back view: symmetric body, legs step toward/away from the camera
  drawDepth(g, ch, s, k){
    const L = ch.look, back = ch.dir === 'back', sg = back ? -1 : 1, p = DepthAnimationFactory.pose(ch.clip, ch.t);
    g.fillStyle = 'rgba(0,0,0,.3)'; g.beginPath(); g.ellipse(s.x, s.y, 16*k, 16*k*CONFIG.tilt, 0, 0, 7); g.fill();
    g.save(); g.translate(s.x + p.sway*0.4*k, s.y - p.bob*k); g.scale(k, k);
    const leg = (x, sw, raise) => {   // foot lower on screen when stepping toward camera, higher when walking away
      const len = 26 + sw * p.c.stride * sg - raise, top = -26;
      g.fillStyle = L.pants; g.beginPath(); g.roundRect(x - 5, top, 10, len, 4); g.fill();
      g.fillStyle = L.shoe; g.beginPath(); g.roundRect(x - 6, top + len - 4, 12, 6, 3); g.fill();
    };
    const arm = (x, sw) => {          // hands swing opposite to the legs
      const len = 22 + sw * p.c.arm * sg, side = Math.sign(x);
      g.save(); g.translate(x, -51); g.rotate(side * 0.07);
      g.fillStyle = L.shirt; g.beginPath(); g.roundRect(-3.5, 0, 7, 9, 3); g.fill();          // sleeve
      g.fillStyle = L.skin; g.beginPath(); g.roundRect(-3.2, 7, 6.4, len - 7, 3); g.fill(); g.restore();
    };
    // back-most limbs first: when stepping away the far leg is the one higher on screen
    leg(-5, p.L, p.raiseL); leg(5, p.R, p.raiseR);
    g.save(); g.translate(0, -39); g.rotate(p.tilt); g.translate(0, 39);                        // shoulders rock while walking
    arm(-15, p.R); arm(15, p.L);
    g.fillStyle = L.shirt; g.beginPath(); g.roundRect(-12, -54, 24, 30, 6); g.fill();          // chest
    g.fillStyle = L.pants; g.fillRect(-12, -28, 24, 5);                                        // belt
    g.fillStyle = 'rgba(0,0,0,.12)'; g.fillRect(-12, -30, 24, 2);
    if (back){ g.strokeStyle = 'rgba(0,0,0,.18)'; g.lineWidth = 1.2; g.beginPath(); g.moveTo(0, -53); g.lineTo(0, -29); g.stroke(); }
    else { g.fillStyle = L.skin; g.beginPath(); g.arc(0, -54, 4.5, 0, Math.PI); g.fill(); }    // neck / collar
    g.restore();
    // head (bobs a little against the body)
    g.save(); g.translate(p.sway*0.5, -64 + Math.sin(ch.t * p.c.freq * 2) * (p.c.bob > 0 ? 0.6 : 0)); g.rotate(p.tilt * -0.8);
    g.fillStyle = L.skin; g.beginPath(); g.arc(0, 0, 11, 0, 7); g.fill();
    g.beginPath(); g.arc(-11, 1, 2.6, 0, 7); g.arc(11, 1, 2.6, 0, 7); g.fill();                 // ears
    g.fillStyle = L.hair;
    if (back){ g.beginPath(); g.arc(0, -1, 11.6, 0, 7); g.fill(); }
    else {
      g.beginPath(); g.arc(0, -2, 11.6, Math.PI, 0); g.lineTo(9, -3); g.quadraticCurveTo(0, -8, -9, -3); g.closePath(); g.fill();   // fringe
      for (const e of [-4, 4]){ g.fillStyle = '#fff'; g.beginPath(); g.arc(e, 1, 2.8, 0, 7); g.fill(); g.fillStyle = '#111'; g.beginPath(); g.arc(e, 1.4, 1.4, 0, 7); g.fill(); }
      g.strokeStyle = L.hair; g.lineWidth = 1.4; g.beginPath(); g.moveTo(-7, -3); g.lineTo(-2, -3.6); g.moveTo(2, -3.6); g.lineTo(7, -3); g.stroke();
      g.strokeStyle = '#8a4b3a'; g.lineWidth = 1.3; g.beginPath(); g.arc(0, 4, 3.2, 0.25, Math.PI - 0.25); g.stroke();
    }
    g.restore(); g.restore();
  },
  draw(ctx, ch, cam, W, H){
    const s = GroundFactory.toScreen(ch.x, ch.y, cam, W, H), L = ch.look, k = CONFIG.charScale;
    if (ch.dir !== 'side') return this.drawDepth(ctx, ch, s, k);
    const p = AnimationFactory.pose(ch.clip, ch.t);
    // shadow
    ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(s.x, s.y, 16*k, 16*k*CONFIG.tilt, 0, 0, 7); ctx.fill();
    ctx.save(); ctx.translate(s.x, s.y - p.bob); ctx.scale(ch.face * k, k); ctx.rotate(p.lean);
    // back arm + back leg first, then body, then front limbs
    ctx.save(); ctx.translate(0, -26); ctx.rotate(p.legR); this.limb(ctx, 26, 9, L.pants); ctx.translate(0, 22); ctx.fillStyle = L.shoe; ctx.fillRect(-4, 0, 11, 5); ctx.restore();
    ctx.save(); ctx.translate(0, -50); ctx.rotate(p.armR); this.limb(ctx, 24, 7, L.skin); ctx.restore();
    // chest
    ctx.fillStyle = L.shirt; ctx.beginPath(); ctx.roundRect(-10, -54, 20, 30, 5); ctx.fill();
    ctx.fillStyle = L.pants; ctx.fillRect(-10, -28, 20, 5);
    // front leg
    ctx.save(); ctx.translate(0, -26); ctx.rotate(p.legL); this.limb(ctx, 26, 9, L.pants); ctx.translate(0, 22); ctx.fillStyle = L.shoe; ctx.fillRect(-4, 0, 11, 5); ctx.restore();
    // head
    ctx.fillStyle = L.skin; ctx.beginPath(); ctx.arc(0, -64, 11, 0, 7); ctx.fill();
    ctx.fillStyle = L.hair; ctx.beginPath(); ctx.arc(0, -66, 11.5, Math.PI, 0); ctx.fill();
    if (ch.up){ ctx.beginPath(); ctx.arc(0, -64, 11.5, 0, 7); ctx.fill(); }       // back of head
    else {                                                                          // face
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(4, -64, 3, 0, 7); ctx.fill();
      ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(5, -64, 1.5, 0, 7); ctx.fill();
      ctx.strokeStyle = '#8a4b3a'; ctx.lineWidth = 1.3; ctx.beginPath(); ctx.arc(4, -59, 3, 0.2, Math.PI - 0.5); ctx.stroke();
    }
    // front arm
    ctx.save(); ctx.translate(0, -50); ctx.rotate(p.armL); this.limb(ctx, 24, 7, L.skin); ctx.restore();
    ctx.restore();
  }
};

/* ============ JOYSTICK FACTORY (from cricket-game-14-4) ============ */
const JoystickFactory = {
  move: {x:0, y:0}, active: false, start: {x:0, y:0}, keys: {},
  init(){
    window.addEventListener('keydown', e => this.keys[e.key.toLowerCase()] = true);
    window.addEventListener('keyup', e => this.keys[e.key.toLowerCase()] = false);
    const zone = document.getElementById('joyZone'), base = document.getElementById('joyBase'), stick = document.getElementById('joyStick');
    let id = null;
    const hide = () => { base.style.display = stick.style.display = 'none'; this.move.x = this.move.y = 0; this.active = false; id = null; };
    zone.addEventListener('pointerdown', e => {           // base appears wherever you touch
      id = e.pointerId; zone.setPointerCapture(id);
      this.start = {x:e.clientX, y:e.clientY}; this.active = true;
      base.style.left = (e.clientX-55)+'px'; base.style.top = (e.clientY-55)+'px';
      stick.style.left = (e.clientX-25)+'px'; stick.style.top = (e.clientY-25)+'px';
      base.style.display = stick.style.display = 'block'; e.preventDefault();
    });
    zone.addEventListener('pointermove', e => {
      if (e.pointerId !== id) return;
      let dx = e.clientX - this.start.x, dy = e.clientY - this.start.y;   // delta from ORIGINAL touch point
      const max = CONFIG.joystickMaxRadius, dist = Math.min(Math.hypot(dx, dy), max), ang = Math.atan2(dy, dx);
      dx = Math.cos(ang)*dist; dy = Math.sin(ang)*dist;
      stick.style.left = (this.start.x+dx-25)+'px'; stick.style.top = (this.start.y+dy-25)+'px';
      this.move.x = dx/max; this.move.y = dy/max;
    });
    zone.addEventListener('pointerup', hide); zone.addEventListener('pointercancel', hide);
  },
  getMoveVector(){
    let x = 0, y = 0;
    if (this.active){ x = CONFIG.invertX ? -this.move.x : this.move.x; y = this.move.y; }
    else {
      const k = this.keys;
      if (k['w']||k['arrowup']) y -= 1; if (k['s']||k['arrowdown']) y += 1;
      if (k['a']||k['arrowleft']) x -= 1; if (k['d']||k['arrowright']) x += 1;
    }
    const len = Math.hypot(x, y); if (len > 1){ x /= len; y /= len; }
    return {x, y, mag: Math.min(len, 1)};
  }
};

/* ============ GAME LOOP ============ */
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W = 0, H = 0;
function resize(){ const d = devicePixelRatio || 1; W = innerWidth; H = innerHeight; cv.width = W*d; cv.height = H*d; ctx.setTransform(d,0,0,d,0,0); }
addEventListener('resize', resize); resize();
GroundFactory.init(ctx); JoystickFactory.init();
addEventListener('keydown', e => { if (e.key.toLowerCase() === 'c') CollisionFactory.debug = !CollisionFactory.debug; });

PropFactory.crate(120, -60); PropFactory.crate(170, -60); PropFactory.crate(145, -100, 44, 32, 34);
PropFactory.drum(-140, 40); PropFactory.drum(-100, 60); PropFactory.crate(-60, -150, 60, 40, 44);
PropFactory.crate(220, 120); PropFactory.drum(-200, -80);

const player = CharacterFactory.create(0, 0); player.name = 'Player';
const cam = { x: 0, y: 0 };
let last = performance.now();

function frame(now){
  const dt = Math.min((now - last)/1000, 0.05); last = now;
  const m = JoystickFactory.getMoveVector();
  const running = m.mag > 0 && (JoystickFactory.active ? m.mag > CONFIG.runThreshold : !!JoystickFactory.keys['shift']);
  if (m.mag > 0.05){
    const sp = running ? CONFIG.runSpeed : CONFIG.walkSpeed;
    // ground is squashed by tilt, so vertical world speed is unchanged (feels even on screen)
    player.x += m.x * sp * dt; player.y += m.y * sp * dt;
    CollisionFactory.resolve(player);
    DirectionFactory.resolve(player, m.x, m.y);
    player.clip = running ? 'run' : 'walk';
  } else player.clip = 'idle';
  player.t += dt;
  RemoteFactory.update(dt);
  if (GameFactory.room && now - GameFactory.lastSend > 1000 / CONFIG.sendRate){
    GameFactory.lastSend = now;
    GameFactory.room.send({ t: 'pos', id: NetFactory.id, x: player.x, y: player.y, dir: player.dir, face: player.face, clip: player.clip });
  }
  cam.x += (player.x - cam.x) * Math.min(1, dt*8); cam.y += (player.y - cam.y) * Math.min(1, dt*8);

  GroundFactory.draw(ctx, cam, W, H);
  // depth sort: props and player by their foot Y
  const items = PropFactory.props.map(p => ({y: PropFactory.sortY(p), f: () => PropFactory.draw(ctx, p, cam, W, H)}));
  GrassFactory.collect(cam, W, H, items, now/1000);
  RemoteFactory.collect(items, cam, W, H);
  items.push({y: player.y, f: () => CharacterFactory.draw(ctx, player, cam, W, H)});
  items.sort((a, b) => a.y - b.y).forEach(i => i.f());
  NameTagFactory.drawAll(ctx, [player, ...RemoteFactory.list()], cam, W, H);

  if (CollisionFactory.debug){
    ctx.strokeStyle = '#ff3b3b'; ctx.lineWidth = 2;
    for (const b of CollisionFactory.boxes){ const s = GroundFactory.toScreen(b.x, b.y, cam, W, H); ctx.strokeRect(s.x, s.y, b.w, b.h*CONFIG.tilt); }
    const s = GroundFactory.toScreen(player.x, player.y, cam, W, H);
    ctx.beginPath(); ctx.ellipse(s.x, s.y, CollisionFactory.radius, CollisionFactory.radius*CONFIG.tilt, 0, 0, 7); ctx.stroke();
  }
  requestAnimationFrame(frame);
}

/* ============ NAME TAG FACTORY ============ */
const NameTagFactory = {
  drawAll(g, chars, cam, W, H){
    g.font = '600 13px system-ui, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
    for (const c of chars){
      const s = GroundFactory.toScreen(c.x, c.y, cam, W, H), name = c.name || '', w = g.measureText(name).width + 14, y = s.y - 92;
      g.fillStyle = 'rgba(0,0,0,.55)'; g.beginPath(); g.roundRect(s.x - w/2, y - 10, w, 20, 10); g.fill();
      g.fillStyle = c === player ? '#ffd76a' : '#fff'; g.fillText(name, s.x, y + 0.5);
    }
  }
};

/* ============ NET FACTORY (Supabase Realtime, or local two-tab test mode when no keys) ============ */
const NetFactory = {
  id: Math.random().toString(36).slice(2, 8), sb: null,
  mode(){ return CONFIG.supabase.url && CONFIG.supabase.key && window.supabase ? 'supabase' : 'local'; },
  open(name, meta, h){ return this.mode() === 'supabase' ? this.openSb(name, meta, h) : new LocalChannel(name, this.id, meta, h); },
  openSb(name, meta, h){
    if (!this.sb) this.sb = supabase.createClient(CONFIG.supabase.url, CONFIG.supabase.key);
    const ch = this.sb.channel(name, { config: { broadcast: { self: false }, presence: { key: this.id } } });
    const flat = () => { const st = ch.presenceState(), o = {}; for (const k in st) o[k] = st[k][0]; return o; };
    ch.on('presence', { event: 'sync' }, () => h.onPresence && h.onPresence(flat()));
    ch.on('broadcast', { event: 'msg' }, ({ payload }) => h.onMsg && h.onMsg(payload));
    const api = { ready: false, meta,
      track(m){ api.meta = m; if (api.ready && m) ch.track(m); },
      send(p){ if (api.ready) ch.send({ type: 'broadcast', event: 'msg', payload: p }); },
      state: flat, leave(){ try { ch.untrack(); NetFactory.sb.removeChannel(ch); } catch (e) {} } };
    ch.subscribe(st => {
      if (st === 'SUBSCRIBED'){ api.ready = true; if (api.meta) ch.track(api.meta); h.onReady && h.onReady(); }
      else if (st === 'CHANNEL_ERROR' || st === 'TIMED_OUT') h.onError && h.onError(st);
    });
    return api;
  }
};
class LocalChannel {   // same interface as the Supabase channel, over BroadcastChannel (tabs of the same browser)
  constructor(name, id, meta, h){
    Object.assign(this, { id, meta, h, peers: {}, ready: true });
    this.bc = new BroadcastChannel('gimmick:' + name);
    this.bc.onmessage = e => { const m = e.data;
      if (m.k === 'hb'){ this.peers[m.id] = { meta: m.meta, seen: Date.now() }; this.sync(); }
      else if (m.k === 'bye'){ delete this.peers[m.id]; this.sync(); }
      else if (m.k === 'who') this.beat();
      else if (m.k === 'msg') h.onMsg && h.onMsg(m.p); };
    this.timer = setInterval(() => { this.beat(); this.prune(); }, 1000);
    this.bc.postMessage({ k: 'who' }); this.beat();
    setTimeout(() => h.onReady && h.onReady(), 0);
  }
  beat(){ if (this.meta) this.bc.postMessage({ k: 'hb', id: this.id, meta: this.meta }); }
  prune(){ let c = false; for (const k in this.peers) if (Date.now() - this.peers[k].seen > 3500){ delete this.peers[k]; c = true; } if (c) this.sync(); }
  state(){ const o = {}; for (const k in this.peers) o[k] = this.peers[k].meta; if (this.meta) o[this.id] = this.meta; return o; }
  sync(){ this.h.onPresence && this.h.onPresence(this.state()); }
  track(m){ this.meta = m; this.beat(); this.sync(); }
  send(p){ this.bc.postMessage({ k: 'msg', p }); }
  leave(){ try { this.bc.postMessage({ k: 'bye', id: this.id }); } catch (e) {} clearInterval(this.timer); this.bc.close(); }
}

/* ============ REMOTE PLAYER FACTORY ============ */
const RemoteFactory = {
  map: {},
  list(){ return Object.values(this.map).map(r => r.ch); },
  onPos(m){
    if (m.id === NetFactory.id) return;
    let r = this.map[m.id];
    if (!r){ const meta = (GameFactory.roster[m.id]) || {}; r = this.map[m.id] = { ch: CharacterFactory.create(m.x, m.y, { shirt: meta.color || '#2980b9' }), tx: m.x, ty: m.y, seen: 0 }; r.ch.name = meta.name || 'Player'; }
    Object.assign(r, { tx: m.x, ty: m.y, seen: performance.now() });
    Object.assign(r.ch, { dir: m.dir, face: m.face, clip: m.clip });
  },
  update(dt){
    const now = performance.now();
    for (const id in this.map){ const r = this.map[id];
      if (r.seen && now - r.seen > 6000){ delete this.map[id]; continue; }
      const k = Math.min(1, dt * 12); r.ch.x += (r.tx - r.ch.x) * k; r.ch.y += (r.ty - r.ch.y) * k; r.ch.t += dt; }
  },
  collect(items, cam, W, H){ for (const id in this.map){ const c = this.map[id].ch; items.push({ y: c.y, f: () => CharacterFactory.draw(ctx, c, cam, W, H) }); } }
};

/* ============ GAME FACTORY (starts only when the menu says so) ============ */
const GameFactory = {
  room: null, lastSend: 0, roster: {}, running: false,
  start({ name, color, room, roster, ids }){
    document.getElementById('menu').style.display = 'none';
    cv.style.display = document.getElementById('joyZone').style.display = document.getElementById('hud').style.display = 'block';
    player.name = name || 'Player'; if (color) player.look.shirt = color;
    this.room = room || null; this.roster = roster || {};
    if (ids){ const i = ids.indexOf(NetFactory.id); player.x = (i - (ids.length - 1) / 2) * 44; player.y = 90; cam.x = player.x; cam.y = player.y; }
    resize(); last = performance.now();
    if (!this.running){ this.running = true; requestAnimationFrame(frame); }
  }
};

/* ============ MENU FACTORY (the only thing that renders at start) ============ */
const MenuFactory = {
  el: document.getElementById('menu'), name: '', color: '', room: null, pub: null, ctx: null,
  colors: ['#c0392b', '#2980b9', '#27ae60', '#8e44ad', '#d35400', '#16a085'],
  esc: t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])),
  code: () => Array.from({ length: 4 }, () => 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random() * 32)]).join(''),
  show(html){ this.el.innerHTML = '<div class="mcard">' + html + '</div>'; return this.el; },
  $(q){ return this.el.querySelector(q); },
  init(){ this.color = this.colors[parseInt(NetFactory.id, 36) % this.colors.length]; this.main(); },
  main(){
    this.leaveAll();
    this.show('<h1>GIMMICK</h1><p class="sub">zombie apocalypse co-op</p><button class="mbtn pri" id="p">Play</button><button class="mbtn" id="m">Play multiplayer</button>');
    this.$('#p').onclick = () => GameFactory.start({ name: 'Player', color: this.color });
    this.$('#m').onclick = () => this.multi();
  },
  multi(){
    const local = NetFactory.mode() === 'local';
    this.show(`<h2>Multiplayer</h2><label>Your name (required)</label><input id="n" maxlength="14" placeholder="Type your name" value="${this.esc(this.name)}">
      <button class="mbtn pri" id="mkroom">Create room</button><button class="mbtn" id="j">Join room</button><div class="mmsg" id="msg"></div>
      <button class="mlink" id="b">Back</button>${local ? '<div class="mnote">Test mode: no Supabase keys set, so rooms work between two tabs of this browser. Add the keys in CONFIG.supabase for real online play.</div>' : ''}`);
    const need = () => { const v = this.$('#n').value.trim(); if (!v){ this.$('#msg').textContent = 'Type a name first.'; this.$('#n').focus(); return null; } return this.name = v; };
    this.$('#mkroom').onclick = () => need() && this.create();
    this.$('#j').onclick = () => need() && this.join();
    this.$('#b').onclick = () => this.main();
  },
  create(){
    this.show(`<h2>Create room</h2><label>Room name</label><input id="rn" maxlength="24" placeholder="Friday zombies" value="${this.esc(this.name)}'s room">
      <label>Max players</label><select id="mx">${[2, 3, 4, 5, 6].map(n => `<option ${n === CONFIG.maxPlayers ? 'selected' : ''}>${n}</option>`).join('')}</select>
      <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="pb" checked style="width:auto"> Public (listed on Join screen)</label>
      <button class="mbtn pri" id="go">Create</button><button class="mlink" id="b">Back</button>`);
    this.$('#b').onclick = () => this.multi();
    this.$('#go').onclick = () => this.host(this.$('#rn').value.trim() || 'Room', +this.$('#mx').value, this.$('#pb').checked);
  },
  host(roomName, max, isPublic){
    const code = this.code(); this.hostInfo = { code, roomName, max, isPublic, started: false };
    const meta = () => ({ name: this.name, color: this.color, host: true, started: this.hostInfo.started, max, roomName, code });
    this.room = NetFactory.open('room-' + code, meta(), { onPresence: st => this.lobby(st), onMsg: m => this.onMsg(m) });
    this.metaFn = meta;
    if (isPublic) this.pub = NetFactory.open('lobby', { code, name: roomName, host: this.name, max, players: 1, started: false }, {});
    this.lobby(this.room.state());
  },
  lobby(st){
    if (!this.room) return;
    const ids = Object.keys(st).sort(), amHost = !!(st[NetFactory.id] && st[NetFactory.id].host), h = ids.map(i => st[i]).find(m => m && m.host) || {};
    if (this.pub && this.hostInfo) this.pub.track({ code: this.hostInfo.code, name: this.hostInfo.roomName, host: this.name, max: this.hostInfo.max, players: ids.length, started: this.hostInfo.started });
    const rows = ids.map(i => `<div><i style="background:${this.esc(st[i].color)}"></i>${this.esc(st[i].name)}${st[i].host ? ' <small style="opacity:.6">(host)</small>' : ''}${i === NetFactory.id ? ' <small style="opacity:.6">(you)</small>' : ''}</div>`).join('');
    this.show(`<h2>${this.esc(h.roomName || 'Lobby')}</h2><div class="mnote">Room code</div><div class="bigcode">${this.esc(h.code || this.joinCode || '')}</div>
      <div class="mplayers">${rows}</div><div class="mnote">${ids.length}/${h.max || '?'} players</div>
      ${amHost ? '<button class="mbtn pri" id="st">Start game</button>' : '<div class="mnote">Waiting for the host to start…</div>'}<button class="mlink" id="lv">Leave room</button>`);
    this.$('#lv').onclick = () => this.main();
    if (amHost) this.$('#st').onclick = () => {
      this.hostInfo.started = true; this.room.track(this.metaFn());
      const roster = {}; ids.forEach(i => roster[i] = { name: st[i].name, color: st[i].color });
      this.room.send({ t: 'start', ids, roster }); this.begin(ids, roster);
    };
    this.lastState = st;
  },
  onMsg(m){
    if (m.t === 'start') this.begin(m.ids, m.roster);
    else if (m.t === 'pos') RemoteFactory.onPos(m);
  },
  begin(ids, roster){ const room = this.room; GameFactory.start({ name: this.name, color: this.color, room, roster, ids }); },
  join(){
    this.leaveAll();
    this.show(`<h2>Join room</h2><label>Public rooms</label><div class="mlist" id="pl"><div class="mnote">Looking for rooms…</div></div>
      <label>Or enter a room code</label><input class="code" id="cd" maxlength="4" placeholder="K7P2">
      <button class="mbtn pri" id="go">Join</button><div class="mmsg" id="msg"></div><button class="mlink" id="b">Back</button>`);
    const list = st => { const rs = Object.values(st).filter(m => m && m.code && !m.started);
      this.$('#pl').innerHTML = rs.length ? rs.map(r => `<button data-c="${this.esc(r.code)}">${this.esc(r.name)} · ${this.esc(r.host)} · ${r.players}/${r.max}</button>`).join('') : '<div class="mnote">No public rooms right now.</div>';
      this.$('#pl').querySelectorAll('[data-c]').forEach(b => b.onclick = () => this.enter(b.dataset.c)); };
    this.pub = NetFactory.open('lobby', null, { onPresence: st => this.$('#pl') && list(st) });
    this.$('#go').onclick = () => { const c = this.$('#cd').value.trim().toUpperCase(); if (c.length < 4){ this.$('#cd').focus(); return; } this.enter(c); };
    this.$('#b').onclick = () => this.multi();
  },
  enter(code){
    if (this.pub){ this.pub.leave(); this.pub = null; }
    this.joinCode = code; this.show('<h2>Joining ' + this.esc(code) + '…</h2>');
    const meta = { name: this.name, color: this.color, host: false };
    this.room = NetFactory.open('room-' + code, meta, { onPresence: st => this.joined && this.lobby(st), onMsg: m => this.onMsg(m), onError: () => this.fail('Could not connect to the server.') });
    setTimeout(() => {   // wait for presence, then check the room really exists
      if (!this.room) return;
      const st = this.room.state(), ms = Object.values(st), host = ms.find(m => m.host);
      if (!host) return this.fail('Room not found.');
      if (host.started) return this.fail('That game already started.');
      if (ms.length > host.max) return this.fail('Room is full.');
      this.joined = true; this.lobby(st);
    }, 1500);
  },
  fail(msg){ this.leaveAll(); this.join(); this.$('#msg').textContent = msg; },
  leaveAll(){ this.joined = false; this.hostInfo = null; for (const k of ['room', 'pub']) if (this[k]){ this[k].leave(); this[k] = null; } }
};
MenuFactory.init();
</script></body></html>
