/* ============ ARTIFACT FACTORY (a rendered sealed scroll. It is NEVER carried in a slot: taking it writes it into the player's permanent collection (kept in the browser). Recipes come later: each artifact will get a random one then; none yet) ============ */
const ArtifactFactory = {
  kind: 'artifact', key: 'gimmick.artifacts.v1', list: [],   // list = collected artifacts { n } in order found (the recipe gets attached here later)

  save(){ try { localStorage.setItem(this.key, JSON.stringify(this.list)); } catch (e) {} },
  collect(n){ for (let i = 0; i < n; i++) this.list.push({ n: this.list.length + 1 }); this.save(); },
  init(){
    this.load(); SlotsFactory.names[this.kind] = 'Artifact'; SlotsFactory.icons[this.kind] = (g, x, y, sz, t) => this.draw(g, x, y, sz, t);

    const gl = g.createRadialGradient(0, 0, 2, 0, 0, sz * 0.8); gl.addColorStop(0, 'rgba(255,215,110,' + (0.3 + 0.25 * p) + ')'); gl.addColorStop(1, 'rgba(255,215,110,0)'); g.fillStyle = gl; g.beginPath(); g.arc(0, 0, sz * 0.8, 0, 7); g.fill();

    g.fillStyle = pg; g.beginPath(); g.roundRect(-w / 2, -h / 2, w, h, 3); g.fill(); g.strokeStyle = '#5a3d17'; g.lineWidth = Math.max(1, sz * 0.03); g.stroke();
    for (const sy of [-1, 1]){   // rolled ends
      const rg = g.createLinearGradient(0, sy * h / 2 - sz * 0.07, 0, sy * h / 2 + sz * 0.07); rg.addColorStop(0, '#8a6a2c'); rg.addColorStop(0.5, '#d9b868'); rg.addColorStop(1, '#6e5220');
      g.fillStyle = rg; g.beginPath(); g.roundRect(-w / 2 - sz * 0.05, sy * h / 2 - sz * 0.06, w + sz * 0.1, sz * 0.12, sz * 0.06); g.fill(); g.strokeStyle = '#4a3010'; g.stroke();
    }
    g.strokeStyle = 'rgba(90,60,25,.5)'; g.lineWidth = Math.max(1, sz * 0.025); g.beginPath(); for (let i = 0; i < 3; i++){ const ly = -h * 0.3 + i * h * 0.13; g.moveTo(-w * 0.32, ly); g.lineTo(w * 0.32 - (i === 2 ? w * 0.25 : 0), ly); } g.stroke();   // writing
    const sr = sz * 0.15, sg = g.createRadialGradient(-sr * 0.3, h * 0.2 - sr * 0.3, 1, 0, h * 0.2, sr * 1.2); sg.addColorStop(0, '#ff8a7a'); sg.addColorStop(1, '#8e1c14');   // wax seal
    g.fillStyle = sg; g.beginPath(); g.arc(0, h * 0.2, sr, 0, 7); g.fill(); g.strokeStyle = '#4b0d08'; g.stroke();
    g.fillStyle = 'rgba(255,225,150,' + (0.7 + 0.3 * p) + ')'; g.beginPath(); for (let i = 0; i < 8; i++){ const a = i * Math.PI / 4 - Math.PI / 2, r = i % 2 ? sr * 0.25 : sr * 0.6; g.lineTo(Math.cos(a) * r, h * 0.2 + Math.sin(a) * r); } g.closePath(); g.fill();
    g.restore();
  }

/* ============ LOOT FACTORY (what a chest holds, rolled ONCE from the chest's own id so the same chest is the same for every player. Tune the chances right below) ============ */
const LootFactory = {
  randomOn: true, capsuleChance: 0.35, artifactChance: 0.15,   // randomOn: false = only the start chest has loot (random loot comes later) /   // each capsule colour's chance per chest / chance a chest holds an artifact
  seed(str){ let h = 2166136261; for (let i = 0; i < str.length; i++) h = Math.imul(h ^ str.charCodeAt(i), 16777619); return h | 0; },
  roll(inv, id){
    if (!this.randomOn){ inv.add({ kind: 'dial' }); for (const t in CapsuleFactory.types) inv.add({ kind: CapsuleFactory.kind(t) }); inv.add({ kind: ArtifactFactory.kind }); return; }   // random loot is off: EVERY chest holds the dial, the 3 capsules and 1 artifact (the recipe)
    const sd = this.seed(id), r = k => RaidFactory.hash(sd, k, 77); let k = 0;
    for (const t in CapsuleFactory.types) if (r(k++) < this.capsuleChance) inv.add({ kind: CapsuleFactory.kind(t) }, 1 + (r(k++) < 0.2 ? 1 : 0));
    if (r(k++) < this.artifactChance) inv.add({ kind: ArtifactFactory.kind });
  }
};

/* ============ CHEST FACTORY (a rendered wooden chest with metal straps and a gold lock. Placed from a hash of the map cell like the raids, so every player sees the same ones; one always sits near the start. Walk up -> a button opens the lid (glow + sparkles). The slots inside come in the next step. Tune the numbers right below) ============ */
const ChestFactory = {
  spawnRandom: false, cell: 700, chance: 0.45, reach: 95, minStart: 160, openSpeed: 3.2, scale: 1.7,   // map cell size / how big the chest is drawn (1 = small) / chance a cell holds one / how close you must stand for the button / no random chest closer than this to the start / lid speed
  startChest: { x: 0, y: 20 },   // the guaranteed chest near the start (for testing)
  cache: {}, list: [], near: null, btn: null,
  make(x, y, key, n, fill){ const S = this.scale, c = { x, y, key, open: false, o: 0, id: key, inv: SlotsFactory.create(n || 5) }; if (fill) fill(c.inv); else LootFactory.roll(c.inv, key); CollisionFactory.add({ x: x - 16 * S, y: y - 7 * S, w: 32 * S, d: 10 * S }); return c; },
  at(i, j){
    const key = i + ',' + j; if (key in this.cache) return this.cache[key];
    let r = null;
    if (this.spawnRandom && RaidFactory.hash(i, j, 51) < this.chance){   // spawnRandom: false = no chests on the map except the one start chest (spawn places come later)
      const x = (i + 0.15 + 0.7 * RaidFactory.hash(i, j, 52)) * this.cell, y = (j + 0.15 + 0.7 * RaidFactory.hash(i, j, 53)) * this.cell;
      if (Math.hypot(x, y) > this.minStart && !ZombieSystem.blocked(x, y)) r = this.make(x, y, key);
    }
    return this.cache[key] = r;
  },
  init(){
    // the two SPAWN CHESTS, in the ice biome right next to where the players start (BiomeFactory.iceX / iceY) (same place + same key for everybody, so the chest sync (cht / cho) keeps them equal on every screen):
    const full = this.fullSet = inv => { inv.add({ kind: 'dial' }); for (const t in CapsuleFactory.types) inv.add({ kind: CapsuleFactory.kind(t) }); inv.add({ kind: 'pteranodon_saddle' }); };   // each chest holds the FULL set (so there are two of everything)
    this.cache.spawn_a = this.make(BiomeFactory.iceX - 95, BiomeFactory.iceY + 170, 'spawn_a', 8, full);
    this.cache.spawn_b = this.make(BiomeFactory.iceX + 95, BiomeFactory.iceY + 170, 'spawn_b', 8, full);
    const b = this.btn = document.createElement('button');
    b.style.cssText = 'position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 150px);transform:translateX(-50%);z-index:6;display:none;padding:12px 26px;font:800 15px system-ui,sans-serif;letter-spacing:1px;color:#fff;border-radius:14px;border:2px solid #fff;background:linear-gradient(#e0a43a,#9a6120);text-shadow:0 1px 3px rgba(0,0,0,.8);touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer';
    b.addEventListener('pointerdown', e => { e.preventDefault(); if (this.near) this.openChest(this.near); });
    this.ui = SlotsFactory.mount('CHEST', i => this.take(i), () => this.closeChest());
    document.body.appendChild(b);
  },
  refillSpawn(){ for (const k of ['spawn_a', 'spawn_b']){ const c = this.cache[k]; if (!c) continue; if (this.cur === c) this.closeChest(); c.inv.slots.fill(null); this.fullSet(c.inv); c.open = false; } },   // every new game / room starts with both spawn chests full again (a joiner then gets the room's current contents from the host)
  ui: null, cur: null,
  openChest(c){ c.open = true; this.cur = c; this.ui.show(c.inv); },
  closeChest(){ if (this.cur) this.cur.open = false; this.cur = null; this.ui.hide(); },
  take(i){   // tap a slot: the whole stack moves into the player's bag
    const c = this.cur; if (!c) return; const s = c.inv.slots[i]; if (!s) return;
    const sp = SlotsFactory.special[s.kind]; if (sp){ if (sp(s.qty)){ c.inv.slots[i] = null; this.ui.refresh(); } return; }
    const n = s.qty, left = player.bag.add({ kind: s.kind }, n), got = n - left;
    if (got <= 0){ RaidFactory.say('Bag is full'); return; }
    RaidFactory.say('+' + got + ' ' + (SlotsFactory.names[s.kind] || s.kind)); InventoryFactory.save(); s.qty = left; if (left <= 0) c.inv.slots[i] = null; this.ui.refresh();
  },
  update(dt){
    const ci = Math.floor(player.x / this.cell), cj = Math.floor(player.y / this.cell), all = [];
    for (let j = -2; j <= 2; j++) for (let i = -2; i <= 2; i++){ const r = this.at(ci + i, cj + j); if (r) all.push(r); }
    all.push(this.cache.spawn_a, this.cache.spawn_b);   // the two spawn chests are always in the list
    this.list = all; let best = null, bd = 1e9;
    for (const c of all){

      c.o += ((c.open ? 1 : 0) - c.o) * Math.min(1, dt * this.openSpeed * 2.4);

  collect(items, cam, W, H, t){ for (const c of this.list){ if (!ViewFactory.sees(c.x, c.y, 80, 80, 140)) continue; items.push({ y: c.y, f: () => this.draw(ctx, c, cam, W, H, t) }); } },
  draw(g, c, cam, W, H, t){

    g.fillStyle = 'rgba(0,0,0,.3)'; g.beginPath(); g.ellipse(0, 1, 23, 6.5, 0, 0, 7); g.fill();
    if (e > 0.02){ const gl = g.createRadialGradient(0, -14, 2, 0, -14, 52); gl.addColorStop(0, 'rgba(255,220,110,' + 0.55 * e + ')'); gl.addColorStop(1, 'rgba(255,200,80,0)'); g.fillStyle = gl; g.beginPath(); g.arc(0, -14, 52, 0, 7); g.fill(); }   // light spilling out
    // body
    g.fillStyle = lin(-15, 0, ['#b98343', '#8a5a2b', '#5a3618']); g.beginPath(); g.roundRect(-17, -15, 34, 15, 2); g.fill();
    g.strokeStyle = 'rgba(35,18,6,.5)'; g.lineWidth = 1; g.beginPath(); g.moveTo(-17, -10); g.lineTo(17, -10); g.moveTo(-17, -5); g.lineTo(17, -5); g.stroke();   // planks
    g.strokeStyle = 'rgba(255,210,140,.18)'; g.beginPath(); for (let i = 0; i < 6; i++){ const gx = -14 + i * 5.6, gy = -13 + (i % 3) * 5; g.moveTo(gx, gy); g.lineTo(gx + 3.5, gy); } g.stroke();   // grain
    g.fillStyle = '#3d2410'; g.fillRect(-17, -2.5, 34, 2.5);
    for (const bx of [-13, 9]){   // metal straps + rivets
      g.fillStyle = lin(-15, 0, ['#dfe3e6', '#9aa0a5', '#646a6f']); g.fillRect(bx, -15, 4, 15);
      g.fillStyle = '#3c4146'; g.fillRect(bx + 1.5, -12, 1, 1); g.fillRect(bx + 1.5, -4, 1, 1);
    }

      g.fillStyle = lin(hy, -15, ['#0d0603', '#2a150a']); g.beginPath(); g.moveTo(-16, -15); g.lineTo(16, -15); g.lineTo(14, hy); g.lineTo(-14, hy); g.closePath(); g.fill();
      const ig = g.createRadialGradient(0, -18, 1, 0, -18, 20); ig.addColorStop(0, 'rgba(255,230,140,' + 0.85 * e + ')'); ig.addColorStop(1, 'rgba(255,200,80,0)'); g.fillStyle = ig; g.fillRect(-16, hy, 32, 7);
    }
    // lid: outside face before it passes upright, padded inside after
    const out = a < Math.PI / 2;
    const lg = g.createLinearGradient(-17, 0, 17, 0); if (out){ lg.addColorStop(0, '#a66f36'); lg.addColorStop(0.5, '#cb9252'); lg.addColorStop(1, '#94602e'); } else { lg.addColorStop(0, '#6a2626'); lg.addColorStop(0.5, '#8a3636'); lg.addColorStop(1, '#5a1f1f'); }
    g.fillStyle = lg; g.beginPath(); g.moveTo(-16, hy); g.lineTo(16, hy); g.lineTo(17, fy); g.lineTo(-17, fy); g.closePath(); g.fill();

/* ============ TREE FACTORY (low-poly trees that grow all over the world. Like zombies they appear in cells around the player, from a hash of the cell so every player sees the same trees, and far ones are dropped again.
   Each tree is drawn from a few cached sprites (cheap). Punch it (PunchFactory): it jitters; at 0 health it falls, fades and drops logs, sticks and its apples. Tune the numbers right below) ============ */
const TreeFactory = {
  cell: 230, chance: 0.15, loadR: 4, keepR: 6, hp: 5, minStart: 90, apples: 0.4, jitterT: 0.28, fallT: 0.8,   // cell size px / chance a cell has a tree / cells loaded around you / cells kept / punches to fell / no tree closer than this to the start / chance a tree has apples / shake s / fall s
  logs: [2, 3], sticks: [2, 4],   // drops: [min, max]
  map: new Map(), felled: new Set(), sprites: [], fits: {}, pend: {}, list: [],
  reset(){ for (const t of this.map.values()) if (t.box) CollisionFactory.remove(t.box); this.map.clear(); this.felled.clear(); this.list = []; },
  sprite(v){   // one low-poly tree drawn ONCE into a small canvas: faceted trunk + 3 stacked leaf triangles in two shades

    const W = 120, H = 170, c = document.createElement('canvas'); c.width = W; c.height = H; const g = c.getContext('2d'), cx = W / 2, by = H - 8;
    const ice = v >= 3, pal = [['#2f7d32', '#3f9c42', '#256128'], ['#3a8a2c', '#55ad3c', '#2b6a21'], ['#2b7a4a', '#3b9a60', '#1f5c37']][v % 3];   // v >= 3 = ice biome tree
    g.fillStyle = 'rgba(0,0,0,.28)'; g.beginPath(); g.ellipse(cx, by, 26, 8, 0, 0, 7); g.fill();
    g.fillStyle = '#6b4423'; g.beginPath(); g.moveTo(cx - 8, by); g.lineTo(cx - 5, by - 58); g.lineTo(cx + 5, by - 58); g.lineTo(cx + 8, by); g.closePath(); g.fill();
    g.fillStyle = '#513218'; g.beginPath(); g.moveTo(cx + 1, by); g.lineTo(cx + 1, by - 58); g.lineTo(cx + 5, by - 58); g.lineTo(cx + 8, by); g.closePath(); g.fill();
    const tri = (y, w, h) => {
      g.fillStyle = pal[0]; g.beginPath(); g.moveTo(cx, y - h); g.lineTo(cx - w, y); g.lineTo(cx + w, y); g.closePath(); g.fill();
      g.fillStyle = pal[1]; g.beginPath(); g.moveTo(cx, y - h); g.lineTo(cx - w, y); g.lineTo(cx - w * 0.15, y); g.closePath(); g.fill();
      g.fillStyle = pal[2]; g.beginPath(); g.moveTo(cx, y - h); g.lineTo(cx + w * 0.3, y); g.lineTo(cx + w, y); g.closePath(); g.fill();
    };
    tri(by - 34, 46, 50); tri(by - 62, 38, 48); tri(by - 90, 28, 44);
    if (ice){   // a normal tree with a thick layer of snow lying on every tier and icicles hanging from the edges
      for (const [y, w, h] of [[by - 34, 46, 50], [by - 62, 38, 48], [by - 90, 28, 44]]){
        g.fillStyle = '#f4fbff'; g.beginPath(); g.moveTo(cx, y - h); g.lineTo(cx - w * 0.62, y - h * 0.38); g.quadraticCurveTo(cx - w * 0.3, y - h * 0.5, cx - w * 0.12, y - h * 0.36); g.quadraticCurveTo(cx + w * 0.1, y - h * 0.52, cx + w * 0.3, y - h * 0.38); g.quadraticCurveTo(cx + w * 0.5, y - h * 0.5, cx + w * 0.62, y - h * 0.38); g.closePath(); g.fill();
        g.fillStyle = '#cfe6f3'; g.beginPath(); g.moveTo(cx + w * 0.1, y - h * 0.6); g.lineTo(cx + w * 0.62, y - h * 0.38); g.lineTo(cx + w * 0.3, y - h * 0.4); g.closePath(); g.fill();
        for (let k = 0; k < 5; k++){ const ix = cx - w * 0.9 + k * (w * 1.8 / 4) + (k % 2 ? 3 : -2), ih = 7 + (k * 7 % 6), edge = y - Math.abs(ix - cx) / w * 0 ; g.fillStyle = k % 2 ? 'rgba(200,236,255,.95)' : 'rgba(235,250,255,.95)'; g.beginPath(); g.moveTo(ix - 2.2, y - 1); g.lineTo(ix + 2.2, y - 1); g.lineTo(ix + 0.3, y + ih); g.closePath(); g.fill(); }   // icicle blades along the bottom edge of the tier
      }
    }
    return this.sprites[v] = c;
  },
  fit(v, k){   // the tree already scaled to its size AND turned into an ImageBitmap (a finished texture). A plain canvas sprite keeps its drawing commands, and the browser can re-run every snow tier + icicle each time it is drawn: that was the 400ms+ "draw trees". Returns null for the few frames until the bitmap is ready
    const key = v + ':' + k; if (this.fits[key]) return this.fits[key]; if (this.pend[key]) return null; this.pend[key] = 1;
    const b = this.sprite(v), c = document.createElement('canvas'); c.width = Math.ceil(b.width * k); c.height = Math.ceil(b.height * k);
    const g = c.getContext('2d'); g.imageSmoothingQuality = 'high'; g.drawImage(b, 0, 0, c.width, c.height);
    if (window.createImageBitmap) createImageBitmap(c).then(bm => { this.fits[key] = bm; }).catch(() => { this.fits[key] = c; }); else this.fits[key] = c;

  },
  make(i, j){
    const key = i + ',' + j, R = k => RaidFactory.hash(i, j, 200 + k);
    const x = (i + 0.15 + 0.7 * R(1)) * this.cell, y = (j + 0.15 + 0.7 * R(2)) * this.cell;
    if (Math.hypot(x, y) < this.minStart || ZombieSystem.blocked(x, y)) return null;
    const n = R(3) < this.apples ? 1 + Math.floor(R(4) * 3) : 0, ap = [];
    for (let k = 0; k < n; k++) ap.push({ dx: (R(10 + k) - 0.5) * 44, dy: -50 - R(20 + k) * 50 });   // where the apples hang (px from the foot)
    const t = { key, x, y, hp: this.hp, v: Math.floor(R(5) * 3) + (BiomeFactory.isIce(x, y) ? 3 : 0), sc: Math.round((0.85 + R(6) * 0.4) * 10) / 10, apples: ap, hit: 0, hitDir: 1, fall: null, gone: false };
    t.box = CollisionFactory.add({ x: x - 7, y: y - 4, w: 14, d: 8 });

  },
  update(dt){

      const ok = RaidFactory.hash(i, j, 199) < this.chance; this.map.set(key, ok ? this.make(i, j) : null);
    }
    this.list.length = 0;
    for (const [key, t] of this.map){
      if (!t){ const p = key.split(','); if (Math.abs(p[0] - ci) > this.keepR || Math.abs(p[1] - cj) > this.keepR) this.map.delete(key); continue; }
      if (Math.abs(t.x / this.cell - ci) > this.keepR || Math.abs(t.y / this.cell - cj) > this.keepR){ if (t.box) CollisionFactory.remove(t.box); this.map.delete(key); continue; }
      if (t.hit > 0) t.hit = Math.max(0, t.hit - dt);

  },
  nearest(x, y, r){ let best = null, bd = r; for (const t of this.list){ if (t.fall) continue; const d = Math.hypot(t.x - x, t.y - y); if (d < bd){ bd = d; best = t; } } return best; },
  punch(t, fromX, n){   // one punch landed on the tree

    t.hp -= (n || 1); t.hit = this.jitterT; t.hitDir = t.x >= fromX ? 1 : -1; ImpactFactory.chips(t.x, t.y, 3); DustFactory.spawn(t.x, t.y, 2);
    if (t.hp <= 0) this.fell(t);
  },
  fell(t){
    t.fall = { t: 0, dir: t.hitDir }; if (t.box){ CollisionFactory.remove(t.box); t.box = null; }
    const r = (a) => a[0] + Math.floor(Math.random() * (a[1] - a[0] + 1));
    for (let k = 0; k < r(this.logs); k++) DropFactory.add('log', t.x, t.y, 1);
    for (let k = 0; k < r(this.sticks); k++) DropFactory.add('stick', t.x, t.y, 1);
    for (const a of t.apples) DropFactory.add('apple', t.x + a.dx * 0.4, t.y, 1);
    DustFactory.spawn(t.x, t.y, 10); XpFactory.give(XpFactory.gain.tree, t.x, t.y);
  },
  collect(items, cam, W, H){
    for (const t of this.list){ if (!ViewFactory.sees(t.x, t.y, 90, 60, 60)) continue; items.push({ y: t.y, f: () => this.draw(ctx, t, cam, W, H) }); }
  },
  draw(g, t, cam, W, H){
    const P = Prof.on, t0 = P ? performance.now() : 0, sp = this.fit(t.v, t.sc); if (!sp) return; const s = GroundFactory.toScreen(t.x, t.y, cam, W, H), k = t.sc, w = sp.width, h = sp.height;

      for (const p of t.apples){ const ax = Math.round(s.x + p.dx * k), ay = Math.round(s.y + p.dy * k); g.fillStyle = '#d62e2e'; g.fillRect(ax - r, ay - r * 0.6, d, d * 0.6 + r * 0.4); g.fillRect(ax - r * 0.6, ay - r, d * 0.6, d); g.fillStyle = 'rgba(255,255,255,.55)'; g.fillRect(ax - r * 0.4, ay - r * 0.6, r * 0.5, r * 0.5); }

/* ============ SURVIVAL FACTORY (hunger + stamina, for the plain HUMAN only. As a gimmick both bars are hidden and paused until you turn back).
   HUNGER  100 -> 0, slowly. At 0 you take `starveDmg` damage every second until you eat, so eat! Foods: SurvivalFactory.foods[kind] = how much hunger it fills (apple 25). Tap a food in the bag or the hotbar to eat it.
   STAMINA running drains it; at 0 you are exhausted and can only WALK until it climbs back above `recover`. It refills while you are not running.
   Both bars float over the head under the health bar (HealthFactory.drawBar is the health one; drawBars below draws these two). Tune the numbers right below) ============ */
const SurvivalFactory = {
  hungerMax: 100, hungerDrain: 0.2, starveDmg: 5, starveEvery: 1,   // full bar / hunger lost per second (0.2 = about 8 minutes from full to empty) / damage per tick at 0 / seconds between ticks
  staminaMax: 100, runDrain: 11, regen: 35, regenDelay: 0.4, recover: 30,   // full bar / lost per second of running / gained per second resting / seconds of rest before it refills / exhausted until this much is back
  foods: { apple: 25 },   // kind -> hunger it fills
  hunger: 100, stamina: 100, tired: false, rest: 0, starveT: 0, flashT: 0,
  reset(){ this.hunger = this.hungerMax; this.stamina = this.staminaMax; this.tired = false; this.rest = 0; this.starveT = 0; },
  active(ch){ return ch === player && !player.gimmick && !player.dead; },
  canRun(ch){ return ch.gimmick || !this.tired; },   // gimmicks ignore stamina
  eat(kind){
    const v = this.foods[kind]; if (!v) return { used: false };
    if (this.hunger >= this.hungerMax - 0.5) return { used: false, msg: 'You are not hungry' };
    this.hunger = Math.min(this.hungerMax, this.hunger + v); this.starveT = 0; return { used: true, msg: 'Yum! +' + v + ' food' };
  },
  update(dt, running){
    if (!this.active(player)){ this.rest = 0; return; }   // gimmick / dead: everything is paused
    this.hunger = Math.max(0, this.hunger - this.hungerDrain * dt);
    if (running){ this.stamina = Math.max(0, this.stamina - this.runDrain * dt); this.rest = 0; if (this.stamina <= 0 && !this.tired){ this.tired = true; } }
    else { this.rest += dt; if (this.rest > this.regenDelay) this.stamina = Math.min(this.staminaMax, this.stamina + this.regen * dt); }
    if (this.tired && this.stamina >= this.recover) this.tired = false;
    if (this.hunger <= 0){
      this.starveT += dt;
      if (this.starveT >= this.starveEvery){ this.starveT -= this.starveEvery; if (!(player.inv > 0) && player.hp > 0){ player.hp = Math.max(0, player.hp - this.starveDmg); HealthFactory.lastHit = 0; HealthFactory.flash = Math.min(1, 0.35 + this.starveDmg / 40); HealthFactory.float(player, this.starveDmg); } }
    } else this.starveT = 0;
    this.flashT += dt;
  },
  bar(g, x, y, W, H, v, max, c0, c1, pulse){
    const left = x - W / 2, f = Math.max(0, Math.min(1, v / max));
    g.fillStyle = 'rgba(0,0,0,.65)'; g.beginPath(); g.roundRect(left - 2, y - H / 2 - 2, W + 4, H + 4, 5); g.fill();
    g.save(); g.beginPath(); g.roundRect(left, y - H / 2, W, H, 3); g.clip(); g.fillStyle = '#26201a'; g.fillRect(left, y - H / 2, W, H);
    const gr = g.createLinearGradient(0, y - H / 2, 0, y + H / 2); gr.addColorStop(0, c0); gr.addColorStop(1, c1); g.fillStyle = gr; g.globalAlpha = pulse ? 0.65 + 0.35 * Math.sin(this.flashT * 8) : 1; g.fillRect(left, y - H / 2, W * f, H);
    g.globalAlpha = 1; g.fillStyle = 'rgba(255,255,255,.25)'; g.fillRect(left, y - H / 2, W * f, Math.max(1.5, H * 0.3)); g.restore();
  },
  drawBars(g, x, y){   // y = the name tag's centre: hunger sits above it, stamina just above the name
    const low = this.hunger < 25, green = HealFactory.isGreen();   // green = well fed: health is slowly coming back (HealFactory)
    this.bar(g, x, y - 24, 70, 6, this.hunger, this.hungerMax, low ? '#ff8a6a' : green ? '#8cf06a' : '#ffc45a', low ? '#d4361f' : green ? '#2fa83a' : '#d98a2b', this.hunger <= 0 || low);
    this.bar(g, x, y - 15, 70, 4, this.stamina, this.staminaMax, this.tired ? '#ff9a8a' : '#7fdcff', this.tired ? '#d4361f' : '#2f9be0', this.tired);
  }
};

/* ============ HEAL FACTORY (reusable: slow health recovery from a full belly. While the hunger bar is GREEN (hunger at or above `greenAt`) and health is not full, you heal `amount` points every `every` seconds: +2, +2, +2 ... The only sign is a faint green shine that ripples over the health bar.
   Eat an apple to push the bar back into the green. Below the green line (or starving) nothing heals. Works for the plain human AND for every gimmick you transform into (hunger is paused in gimmick form, so the green level you had stays).
   isGreen()  is the hunger bar green right now (SurvivalFactory.drawBars uses it for the bar colour)
   Tune the numbers right on the next line) ============ */
const HealFactory = {
  greenAt: 50, amount: 2, every: 1.2, glow: 0.7,   // hunger needed for the green bar (0..100) / health per tick / seconds between ticks / how long the faint green shine on the health bar lasts
  t: 0,
  isGreen(){ return SurvivalFactory.hunger >= this.greenAt; },
  update(dt){
    const p = player;
    if (p.dead || !this.isGreen() || p.hp >= HealthFactory.max || p.hp <= 0){ this.t = 0; return; }
    this.t += dt;
    while (this.t >= this.every){
      this.t -= this.every;
      const add = Math.min(this.amount, HealthFactory.max - p.hp); if (add <= 0) break;
      p.hp += add; p.healFx = this.glow;   // only a faint green shine on the health bar, no numbers
    }
  }
};

/* ============ XP FACTORY (Minecraft-style experience. XP sources: zombie kill > crafting > tree > pebble. Each level needs more XP than the last: need(level) = base + (level - 1) * step.
   Level shows in the inventory (bar under the title). Green orbs pop out where you earned XP, then fly into the player. Filling the bar = level up (ring + sparkles). Level is player.level (the dungeon gate reads it). Saved in the browser.
   Add XP anywhere with: XpFactory.give(XpFactory.gain.tree, x, y). Tune the numbers right below) ============ */
const XpFactory = {
  saveKey: 'gimmick.xp.v1', base: 10, step: 6,   // XP needed for level 1 -> 2 / extra XP needed for every level after that
  gain: { zombie: 12, craft: 6, tree: 2, pebble: 1 },   // XP per zombie kill / craft / tree felled / pebble collected
  orbMax: 7, orbPop: 0.35, orbSpeed: 260, orbAccel: 900, killR: 400,   // most orbs per gain / seconds they pop before flying / fly speed and speed-up px/s / zombie must die this close to you to count
  testLevel: 0,   // every game starts at level 0 (the testing boost is OFF)
  xp: 0, level: 0, orbs: [], fx: null, bar: null, fill: null, lab: null, txt: null, shown: '',
  need(l){ return this.base + Math.max(0, l - 1) * this.step; },
  init(){
    this.load(); if (this.testLevel > this.level){ this.level = this.testLevel; this.xp = 0; this.save(); }   // (the old one-time reset to level 0 was removed: it ran AFTER testLevel and wiped it back to 0)
    player.level = this.level;
    const css = (el, t) => { el.style.cssText = t; return el; }, box = css(document.createElement('div'), 'margin:-4px auto 10px;width:70%;text-align:center');
    this.lab = css(document.createElement('div'), 'font:800 12px system-ui;letter-spacing:2px;color:#b6ff5a;text-shadow:0 1px 3px #000;margin-bottom:3px');
    const tr = css(document.createElement('div'), 'height:10px;border-radius:6px;background:#1c2412;border:1px solid rgba(182,255,90,.5);overflow:hidden;box-shadow:inset 0 2px 4px rgba(0,0,0,.7)');
    this.fill = css(document.createElement('div'), 'height:100%;width:0;background:linear-gradient(#d6ff7a,#5fbf1f);transition:width .25s');
    this.txt = css(document.createElement('div'), 'font:600 10px system-ui;color:rgba(230,255,190,.7);margin-top:2px');
    tr.appendChild(this.fill); box.append(this.lab, tr, this.txt);
    const p = InventoryFactory.panel; p.insertBefore(box, p.children[1]); this.paint();
  },
  load(){ try { const o = JSON.parse(localStorage.getItem(this.saveKey)); if (o){ this.level = Math.max(0, o.level == null ? 0 : o.level | 0); this.xp = Math.max(0, +o.xp || 0); } } catch (e) {} },
  save(){ try { localStorage.setItem(this.saveKey, JSON.stringify({ level: this.level, xp: this.xp })); } catch (e) {} },
  paint(){
    const n = this.need(this.level), k = this.level + ':' + Math.floor(this.xp); if (k === this.shown) return; this.shown = k;
    this.lab.textContent = 'LEVEL ' + this.level; this.fill.style.width = Math.min(100, this.xp / n * 100) + '%'; this.txt.textContent = Math.floor(this.xp) + ' / ' + n + ' XP';
  },
  give(amount, x, y){   // spawn orbs at (x, y) in the world; the XP is added when they reach you
    if (player.dead || amount <= 0) return; const n = Math.max(1, Math.min(this.orbMax, Math.ceil(amount / 2))); let left = amount;
    for (let i = 0; i < n; i++){
      const v = i === n - 1 ? left : Math.floor(amount / n); left -= v; const a = Math.random() * 6.283, sp = 40 + Math.random() * 70;
      this.orbs.push({ x, y, z: 8, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, vz: 90 + Math.random() * 70, t: 0, v, fly: 0 });
    }
  },
  add(v){
    this.xp += v; let up = false;
    while (this.xp >= this.need(this.level)){ this.xp -= this.need(this.level); this.level++; up = true; }
    player.level = this.level; this.save();
    if (up){ this.fx = { t: 0, sp: Array.from({ length: 16 }, () => ({ a: Math.random() * 6.283, r: 8 + Math.random() * 22, s: 40 + Math.random() * 60, ph: Math.random() })) }; RaidFactory.say('LEVEL UP! You are level ' + this.level); }
  },
  update(dt){
    if (player.level !== this.level){ this.level = Math.max(0, player.level | 0); this.xp = 0; this.save(); }   // e.g. the L test key
    for (const z of ZombieSystem.list){ if (z.dead && !z.xpDone){ z.xpDone = true; if (Math.hypot(z.x - player.x, z.y - player.y) < this.killR) this.give(this.gain.zombie, z.x, z.y); } }
    for (let i = this.orbs.length - 1; i >= 0; i--){
      const o = this.orbs[i]; o.t += dt;
      if (o.t < this.orbPop){ const k = Math.exp(-4 * dt); o.vx *= k; o.vy *= k; o.vz -= 420 * dt; o.x += o.vx * dt; o.y += o.vy * dt; o.z = Math.max(4, o.z + o.vz * dt); continue; }
      o.fly += dt; const dx = player.x - o.x, dy = player.y - o.y, d = Math.hypot(dx, dy), sp = (this.orbSpeed + this.orbAccel * o.fly) * dt;
      o.z += (26 - o.z) * Math.min(1, dt * 6);
      if (d <= sp + 8){ this.add(o.v); this.orbs.splice(i, 1); continue; }
      o.x += dx / d * sp; o.y += dy / d * sp;
    }
    if (this.fx && (this.fx.t += dt) > 1.4) this.fx = null;
    if (InventoryFactory.isOpen) this.paint();
  },
  draw(g, cam, W, H){

/* ============ CUTSCENE FACTORY (reusable: plays a short scripted scene, then hands the game back exactly as it was.

   A SCENE is a list of STEPS in `scenes`, played one after another. Edit the text and timings right there; nothing else needs to change.
   STEP fields:  dur  = seconds this step lasts

const CutsceneFactory = {

  scenes: {
    bossIntro: { steps: [
      { cam: 'player', dur: 0.9 },                                                                            // a moment to see where you landed
      { cam: 'boss',   dur: 1.7, glide: 2.4 },                                                                 // the camera floats over to the boss
      { cam: 'boss',   dur: 2.6, roar: true, title: '{NAME}', sub: '{TIER} DUNGEON BOSS' },                   // he ROARS, the text comes up
      { cam: 'boss',   dur: 0.7, title: '{NAME}', sub: '{TIER} DUNGEON BOSS' },                               // a beat to let it sink in
      { cam: 'player', dur: 1.2, glide: 3.4 }                                                                 // back to you, then the fight
    ] }

  active: false, run: null, ov: null, top: null, bot: null, ttl: null, sb: null, hint: null, hideT: 0, cx: 0, cy: 0,
  init(){
    const st = document.createElement('style');
    st.textContent = 'body.csOn>*:not(#c):not(.csKeep){visibility:hidden!important}';   // everything on screen except the game canvas, the black fade and the cutscene itself
    document.head.appendChild(st);
    const mk = (p, css) => { const e = document.createElement('div'); e.style.cssText = css; p.appendChild(e); return e; };
    const o = this.ov = document.createElement('div'); o.className = 'csKeep'; o.style.cssText = 'position:fixed;inset:0;z-index:850;display:none;touch-action:none;user-select:none;-webkit-user-select:none';
    const bar = 'position:absolute;left:0;right:0;height:0;background:#000;overflow:hidden;transition:height ' + this.barSec + 's ease';
    this.top = mk(o, bar + ';top:0');
    this.bot = mk(o, bar + ';bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 12px');
    this.ttl = mk(this.bot, 'font:900 clamp(22px,6.4vw,38px) system-ui,sans-serif;letter-spacing:.14em;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.9);min-height:1.2em;white-space:nowrap');
    this.sb = mk(this.bot, 'font:700 clamp(11px,3vw,15px) system-ui,sans-serif;letter-spacing:.3em;margin-top:4px;opacity:0;transition:opacity .5s;color:rgba(255,255,255,.8)');
    this.hint = mk(this.top, 'position:absolute;right:14px;bottom:8px;font:700 10px system-ui,sans-serif;letter-spacing:2px;color:rgba(255,255,255,.4)'); this.hint.textContent = 'TAP TO SKIP';

/* ============ DUNGEON FACTORY (the dungeon trip. `inside` = you are in a dungeon, `tier` = which one (a RaidFactory tier), `out` = where you stood outside so exit() puts you back on the same spot.

   ARENA: a round cave floor far away from the outside world, a ring of rocks all around it (rock collision boxes + a circular clamp as backup), an exit portal, decoration rocks and pebbles.
   OUTSIDE PAUSED: while `inside`, frame() skips the outside loaders (trees, pebbles, zombies, chests, dungeon holes, grass), so nothing spawns in here and everything outside waits for you.

const DungeonFactory = {
  inside: false, tier: null, out: null,   // in a dungeon? / which tier / outside position {x, y}
  cx: 0, cy: -80000, R: 1400, ringN: 80, boxSize: 110, fadeT: 0.4, reach: 90,   // arena centre (far from everything) / arena radius / rocks in the wall ring / size of a rock's collision box / fade seconds each way / how close to the portal for the exit button

    document.body.appendChild(v);

    b.style.cssText = 'position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 96px);transform:translateX(-50%);z-index:6;display:none;padding:12px 26px;font:800 15px system-ui,sans-serif;letter-spacing:1px;color:#fff;border-radius:14px;border:2px solid #fff;touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer;text-shadow:0 1px 3px rgba(0,0,0,.8)';

  spawnBoss(tier, id){

/* ============ DROP FACTORY (items lying on the ground: they pop out of a felled tree or fly out when you drag something out of the inventory. Walk over one to pick it up into the bag; if the bag is full it stays) ============ */
const DropFactory = {
  list: [], pickR: 30, max: 120,
  reset(){ this.list.length = 0; },
  add(kind, x, y, qty, delay, opt){   // opt (optional): { glow: 'r,g,b' light pillar, size, pickR, loot } used by boss loot
    if (this.list.length > this.max) this.list.shift();
    const a = Math.random() * 6.283, sp = 25 + Math.random() * 45;
    this.list.push(Object.assign({ kind, qty, x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp * 0.6, z: 6, vz: (opt ? 260 : 130) + Math.random() * 60, t: 0, delay: delay || 0.35 }, opt));
  },
  update(dt){
    const bag = player.bag; if (!bag) return; let changed = false;
    for (let i = this.list.length - 1; i >= 0; i--){
      const d = this.list[i]; d.t += dt;
      if (d.z > 0 || d.vz > 0){ d.vz -= 520 * dt; d.z += d.vz * dt; d.x += d.vx * dt; d.y += d.vy * dt; if (d.z <= 0){ d.z = 0; d.vz = 0; d.vx = d.vy = 0; } }
      if (d.t < d.delay || player.dead || d.z > 4) continue;
      if (Math.hypot(d.x - player.x, d.y - player.y) < (d.pickR || this.pickR)){
        const left = bag.add({ kind: d.kind }, d.qty), got = d.qty - left;
        if (got > 0){ changed = true; RaidFactory.say('+' + got + ' ' + (SlotsFactory.names[d.kind] || d.kind)); }
        if (left <= 0) this.list.splice(i, 1); else { d.qty = left; d.delay = d.t + 1.5; }
      }
    }
    if (changed){ InventoryFactory.save(); if (InventoryFactory.isOpen) InventoryFactory.refresh(0); }
  },
  collect(items, cam, W, H, t){
    for (const d of this.list){ if (!ViewFactory.sees(d.x, d.y, 40, 40, 60)) continue; items.push({ y: d.y, f: () => this.draw(ctx, d, cam, W, H, t) }); }
  },
  draw(g, d, cam, W, H, t){
    const s = GroundFactory.toScreen(d.x, d.y, cam, W, H), ic = SlotsFactory.icons[d.kind]; if (!ic) return;
    g.fillStyle = 'rgba(0,0,0,.3)'; g.beginPath(); g.ellipse(s.x, s.y, 8, 3, 0, 0, 7); g.fill();
    if (d.glow){   // boss loot: a soft pillar of light and a glow on the ground so it can't be missed
      const p = 0.5 + 0.5 * Math.sin(t * 3 + d.x), pg = g.createLinearGradient(0, s.y, 0, s.y - 150); pg.addColorStop(0, 'rgba(' + d.glow + ',' + (0.4 + 0.2 * p) + ')'); pg.addColorStop(1, 'rgba(' + d.glow + ',0)');

      const rg = g.createRadialGradient(s.x, s.y, 2, s.x, s.y, 34); rg.addColorStop(0, 'rgba(' + d.glow + ',' + (0.55 + 0.25 * p) + ')'); rg.addColorStop(1, 'rgba(' + d.glow + ',0)'); g.fillStyle = rg; g.beginPath(); g.ellipse(s.x, s.y, 34, 34 * CONFIG.tilt, 0, 0, 7); g.fill();
    }
    ic(g, s.x, s.y - (d.size ? d.size * 0.35 : 9) - d.z + (d.z === 0 ? Math.sin(t * 3 + d.x) * 1.6 : 0), d.size || 30, t);
    if (d.qty > 1){ g.font = '800 10px system-ui'; g.fillStyle = '#fff'; g.strokeStyle = '#000'; g.lineWidth = 2.5; g.strokeText(d.qty, s.x + 8, s.y - 2); g.fillText(d.qty, s.x + 8, s.y - 2); }
  },
  fromPlayer(kind, qty){   // dragged out of the inventory: lands next to the player
    const fx = player.dir === 'side' ? player.face : 0, fy = player.dir === 'front' ? 1 : player.dir === 'back' ? -1 : 0.3;
    this.add(kind, player.x + fx * 26, player.y + fy * 14, qty, 1.4);
  }

/* ============ LOOT DROP FACTORY (reusable: what a BOSS drops when it dies. Attached to every dungeon boss: when his death fall is over, his loot pops out of the body, a light pillar marks it, and you just walk over it to pick it up (the drop itself is a DropFactory item, so a full bag leaves it lying there).
   table[gimmick] = list of drops { kind, qty, chance }: each boss drops HIS OWN crystal capsule (strength red, speed blue, defense green). Add more entries to a list for extra loot, lower `chance` (0..1) for a rare one.
   Anything still lying in the arena is removed when you leave the dungeon, so pick it up before you go.
   Tune the numbers right on the next lines) ============ */
const LootDropFactory = {
  delay: 1.3, spread: 34, pickR: 46, size: 46, lift: 40,   // seconds after he dies before the loot pops out / how far the drops scatter (px) / pickup reach (px) / drawn size / how far in front of the body it lands
  table: {
    strength: [{ kind: CapsuleFactory.kind('strength'), qty: 1, chance: 1 }],
    speed:    [{ kind: CapsuleFactory.kind('speed'),    qty: 1, chance: 1 }],
    defense:  [{ kind: CapsuleFactory.kind('defense'),  qty: 1, chance: 1 }]
  },
  list(id){ return this.table[id] || (CapsuleFactory.types[id] ? [{ kind: CapsuleFactory.kind(id), qty: 1, chance: 1 }] : []); },   // a boss with no table entry still drops his own capsule
  glowOf(kind){ const T = CapsuleFactory.types[String(kind).replace('capsule_', '')]; return T ? T.gl : '255,230,150'; },
  update(dt){   // every frame: watches the dungeon boss
    const b = DungeonFactory.boss; if (!b || !DungeonFactory.inside || !b.dead || b.looted) return;
    b.lootT = (b.lootT || 0) + dt; if (b.lootT < this.delay) return;
    b.looted = true; this.drop(b);
  },
  drop(b){
    const x = b.x, y = b.y + this.lift; let first = null;
    for (const d of this.list(b.gimmick)){
      if (Math.random() >= (d.chance === undefined ? 1 : d.chance)) continue;
      DropFactory.add(d.kind, x + (Math.random() - 0.5) * this.spread, y + (Math.random() - 0.5) * this.spread * 0.5, d.qty || 1, 0.6, { glow: this.glowOf(d.kind), size: this.size, pickR: this.pickR, loot: true });
      first = first || d.kind;
    }
    if (!first) return;
    DustFactory.spawn(x, y, 14); ShakeFactory.kick(5, 0.25); ShakeFactory.flashNow(0.08);
    RaidFactory.say((b.name || 'Boss') + ' defeated! ' + (SlotsFactory.names[first] || 'Loot') + ' dropped');
  },
  clear(){ DropFactory.list = DropFactory.list.filter(d => !d.loot && !d.dk); }   // called when the dungeon is torn down
};

/* ============ PUNCH FACTORY (the PUNCH button, and the punch itself: the character turns toward the nearest tree, throws a fist (arm animation lives in HumanSkin), and the hit lands mid-swing) ============ */
/* ============ ARROW FACTORY (the BOW: hold a bow in the hotbar and have arrows in the bag. Then the PUNCH button turns into the 🏹 button, and it works like the missile ability:

/* ============ STONE FACTORY (small low-poly pebbles scattered over the world, only a few, like the trees: cells around you get a hash-based pebble, far ones are dropped again.
   Walk up to one: the PUNCH button turns into a green COLLECT hand (see PunchFactory) and pressing it puts a Stone in your bag. Tune the numbers right below) ============ */
const StoneFactory = {
  cell: 260, chance: 0.16, loadR: 4, keepR: 6, minStart: 60, pickR: 42,   // cell size px / chance a cell has a pebble / cells loaded / cells kept / none closer than this to the start / how close you must be to collect
  map: new Map(), taken: new Set(), list: [], sprites: [], near: null,
  reset(){ this.map.clear(); this.taken.clear(); this.list = []; this.near = null; },
  init(){
    SlotsFactory.names.stone = 'Stone';
    SlotsFactory.icons.stone = (g, x, y, z) => this.poly(g, x, y, z * 0.34, 0);
  },
  poly(g, x, y, r, v){   // one faceted grey stone: a dark body, a light top facet, a shadowed side
    const P = [[-1, 0.1], [-0.55, -0.7], [0.3, -0.85], [1, -0.2], [0.8, 0.55], [-0.2, 0.75]].map(p => [x + p[0] * r * (1 + v * 0.12), y + p[1] * r * 0.8]);
    g.fillStyle = '#7d848c'; g.beginPath(); P.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); g.closePath(); g.fill();
    g.fillStyle = '#b4bac1'; g.beginPath(); g.moveTo(P[0][0], P[0][1]); g.lineTo(P[1][0], P[1][1]); g.lineTo(P[2][0], P[2][1]); g.lineTo(x + r * 0.1, y - r * 0.1); g.closePath(); g.fill();
    g.fillStyle = '#5b6168'; g.beginPath(); g.moveTo(P[3][0], P[3][1]); g.lineTo(P[4][0], P[4][1]); g.lineTo(P[5][0], P[5][1]); g.lineTo(x + r * 0.1, y - r * 0.1); g.closePath(); g.fill();
  },
  sprite(v){   // 3 cached looks: one stone, two stones, three stones
    if (this.sprites[v]) return this.sprites[v];
    const c = document.createElement('canvas'); c.width = 44; c.height = 28; const g = c.getContext('2d');
    g.fillStyle = 'rgba(0,0,0,.25)'; g.beginPath(); g.ellipse(22, 21, 17, 5, 0, 0, 7); g.fill();
    if (v === 0) this.poly(g, 22, 15, 9, 0);
    else if (v === 1){ this.poly(g, 15, 16, 7, 0); this.poly(g, 28, 17, 6, 1); }
    else { this.poly(g, 12, 17, 5.5, 1); this.poly(g, 23, 14, 7.5, 0); this.poly(g, 33, 18, 5, 1); }
    return this.sprites[v] = c;
  },
  update(dt){
    const ci = Math.floor(player.x / this.cell), cj = Math.floor(player.y / this.cell), L = this.loadR;
    for (let j = cj - L; j <= cj + L; j++) for (let i = ci - L; i <= ci + L; i++){
      const key = i + ',' + j; if (this.map.has(key) || this.taken.has(key)) continue;
      let p = null;
      if (RaidFactory.hash(i, j, 300) < this.chance){
        const x = (i + 0.12 + 0.76 * RaidFactory.hash(i, j, 301)) * this.cell, y = (j + 0.12 + 0.76 * RaidFactory.hash(i, j, 302)) * this.cell;
        if (Math.hypot(x, y) > this.minStart && !ZombieSystem.blocked(x, y)) p = { key, x, y, v: Math.floor(RaidFactory.hash(i, j, 303) * 3), qty: 1 + Math.floor(RaidFactory.hash(i, j, 304) * 2) };
      }
      this.map.set(key, p);
    }
    this.list.length = 0; let best = null, bd = this.pickR;
    for (const [key, p] of this.map){
      const q = key.split(','); if (Math.abs(q[0] - ci) > this.keepR || Math.abs(q[1] - cj) > this.keepR){ this.map.delete(key); continue; }
      if (!p) continue; this.list.push(p);
      const d = Math.hypot(p.x - player.x, p.y - player.y); if (d < bd){ bd = d; best = p; }
    }
    this.near = player.dead ? null : best;
  },
  collect(items, cam, W, H, t){
    for (const p of this.list){ if (!ViewFactory.sees(p.x, p.y, 40, 30, 30)) continue; items.push({ y: p.y, f: () => this.draw(ctx, p, cam, W, H, t) }); }
  },
  draw(g, p, cam, W, H, t){
    const sp = this.sprite(p.v), s = GroundFactory.toScreen(p.x, p.y, cam, W, H);

  },
  take(p){   // put the pebble into the bag; a full bag leaves it where it is

    RaidFactory.say('+' + got + ' Stone'); XpFactory.give(XpFactory.gain.pebble, p.x, p.y); InventoryFactory.save(); if (InventoryFactory.isOpen) InventoryFactory.refresh(0);
    if (left > 0){ p.qty = left; return true; }
    this.map.set(p.key, null); this.taken.add(p.key); DustFactory.spawn(p.x, p.y, 4); return true;
  }
};

/* ============ DIAL FACTORY (the gimmick dial. You start as a plain human (skipSelect skips the "Choose your gimmick" screen). unlocked = which gimmicks are in the dial; artifacts will add to it later with unlock(id).

  list(){ return this.unlocked.map(id => GimmickFactory.get(id)).filter(Boolean); },

  init(){

/* ============ RECIPE FACTORY (the crafting recipes as plain data: to add a recipe, add ONE entry to `list`. ingredients = what is used up, out = what you get, time = seconds to craft.

const RecipeFactory = {

    { id: 'stone_axe', station: 'bench', name: 'Stone Axe', out: { kind: 'stone_axe', qty: 1 }, ingredients: [{ kind: 'stone', qty: 3 }, { kind: 'stick', qty: 2 }], time: 4 },
    { id: 'stone_sword', station: 'bench', name: 'Stone Sword', out: { kind: 'stone_sword', qty: 1 }, ingredients: [{ kind: 'stone', qty: 2 }, { kind: 'stick', qty: 1 }], time: 3 },
    { id: 'copper_axe', station: 'bench', name: 'Copper Axe', out: { kind: 'copper_axe', qty: 1 }, ingredients: [{ kind: 'copper_ingot', qty: 3 }, { kind: 'stick', qty: 2 }], time: 4 },
    { id: 'copper_sword', station: 'bench', name: 'Copper Sword', out: { kind: 'copper_sword', qty: 1 }, ingredients: [{ kind: 'copper_ingot', qty: 2 }, { kind: 'stick', qty: 1 }], time: 3 },
    { id: 'spear', station: 'bench', name: 'Spear', out: { kind: 'spear', qty: 1 }, ingredients: [{ kind: 'stone', qty: 2 }, { kind: 'stick', qty: 3 }, { kind: 'rope', qty: 1 }], time: 4 },
    { id: 'iron_axe', station: 'bench', name: 'Iron Axe', out: { kind: 'iron_axe', qty: 1 }, ingredients: [{ kind: 'iron_ingot', qty: 3 }, { kind: 'stick', qty: 2 }], time: 5 },
    { id: 'iron_sword', station: 'bench', name: 'Iron Sword', out: { kind: 'iron_sword', qty: 1 }, ingredients: [{ kind: 'iron_ingot', qty: 2 }, { kind: 'stick', qty: 1 }], time: 4 },
    { id: 'rope', name: 'Rope', out: { kind: 'rope', qty: 1 }, ingredients: [{ kind: 'veins', qty: 1 }], time: 2 },   // by hand (inventory book)
    { id: 'bow', station: 'bench', name: 'Bow', out: { kind: 'bow', qty: 1 }, ingredients: [{ kind: 'stick', qty: 3 }, { kind: 'rope', qty: 2 }], time: 4 },
    { id: 'arrow', station: 'bench', name: 'Arrow', out: { kind: 'arrow', qty: 1 }, ingredients: [{ kind: 'stone', qty: 1 }, { kind: 'stick', qty: 1 }], time: 2 },

    this.sel = RecipeFactory.list.find(r => r.id === id) || null; const r = this.sel; this.detail.textContent = ''; this.rows = []; this.qty = 1;
    for (const row of this.list.children) row.style.borderColor = row.dataset.rid === id ? '#ffd45a' : 'rgba(255,225,170,.25)';
    if (this.sel) for (const row of this.list.children) if (row.dataset.rid === id) row.scrollIntoView({ block: 'nearest' });
    if (!r) return;
    const mk = (tag, t, txt) => { const el = document.createElement(tag); el.style.cssText = t; if (txt !== undefined) el.textContent = txt; return el; };
    this.detail.appendChild(mk('div', 'font:800 12px system-ui;letter-spacing:2px;color:#f3d79a;margin-bottom:8px', r.name.toUpperCase() + ' · YOU NEED'));

      const row = mk('div', 'display:flex;align-items:center;gap:10px;margin-bottom:6px'), tx = mk('div', 'font:800 15px system-ui;margin-left:auto;text-shadow:0 1px 3px #000');
      row.append(this.icon(i.kind, 34), mk('div', 'font:700 14px system-ui', SlotsFactory.names[i.kind] || i.kind), tx); this.detail.appendChild(row); this.rows.push({ i, tx });
    }
    const st = this.stepper = Stepper.make(d => this.setQty(this.qty + d), () => this.setQty(this.maxN(this.sel) || 1));   // − / + / MAX: how many to craft
    const bar = this.bar = mk('div', 'height:8px;border-radius:5px;background:rgba(0,0,0,.5);margin:12px 0 10px;overflow:hidden'), fill = mk('div', 'height:100%;width:0%;background:linear-gradient(#7dff9b,#2fbf5b)'); bar.appendChild(fill); bar.fill = fill;
    const btns = mk('div', 'display:flex;gap:8px');
    const mkGo = (flex, all) => { const g = mk('button', 'flex:' + flex + ';padding:12px 6px;border-radius:12px;border:2px solid #fff;font:800 14px system-ui;letter-spacing:1px;color:#fff;touch-action:none', 'CRAFT'); g.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); this.start(all); }); return g; };
    const go = this.go = mkGo(1.2, false), all = this.all = mkGo(1, true); btns.append(go, all);
    this.hint = mk('div', 'margin-top:6px;min-height:14px;text-align:center;font:600 11px system-ui;color:rgba(255,235,200,.6)'); const ai = typeof ArmorFactory !== 'undefined' && ArmorFactory.info[r.out.kind]; if (ai) this.hint.textContent = 'Worn: ' + Math.round(ArmorFactory.sets[ai.set].reduce[ai.slot] * 100) + '% less damage';

  start(all){

      if (this.craft.r === r){ this.craft = null; this.hint.textContent = 'Crafting cancelled'; this.paint(); } else this.hint.textContent = 'Already crafting ' + this.craft.r.name;
      return;
    }
    if (r.locked){ this.hint.textContent = 'Locked: needs items that are not in the game yet'; return; }
    const n = all ? this.maxN(r) : this.qty;   // CRAFT ALL = as many as the bag allows
    if (n < 1 || !RecipeFactory.can(r) || this.maxN(r) < n){ this.hint.textContent = 'You are missing something (red)'; return; }
    this.craft = { r, t: 0, n, done: 0 }; this.paint();
  },
  paint(){   // counts + colours + button state (runs a few times a second; nothing is rebuilt)

    for (const { i, tx } of this.rows){ const has = player.bag ? player.bag.count(i.kind) : 0, need = i.qty * q, good = has >= need; if (!good) ok = false; tx.textContent = has + ' / ' + need; tx.style.color = good ? '#5cff8a' : '#ff6b6b'; }

    this.go.style.background = busy ? 'linear-gradient(#e0a43a,#9a6120)' : ok && !r.locked ? 'linear-gradient(#3fdc7a,#1f9a4c)' : 'rgba(110,110,110,.55)';
    this.go.style.opacity = ok || busy ? 1 : 0.7;
    this.go.textContent = busy ? 'CANCEL · ' + this.craft.done + '/' + this.craft.n : r.locked ? 'LOCKED' : q > 1 ? 'CRAFT ×' + q : 'CRAFT';

  update(dt){

  },
  tick(dt){   // runs every frame, open or closed: a craft in progress keeps going when you close the window or walk away. A batch (n > 1) crafts one after another
    if (this.craft){
      const c = this.craft; c.t += dt;
      if (c.t >= c.r.time){
        if (RecipeFactory.finish(c.r)){
          c.done++; c.t = 0; XpFactory.give(XpFactory.gain.craft, player.x, player.y); if (InventoryFactory.isOpen) InventoryFactory.refresh(0);

        this.paint(); return;
      }
      if (!RecipeFactory.can(c.r)){ this.craft = null; if (this.hint) this.hint.textContent = c.done ? 'Crafted ' + c.done * c.r.out.qty + ' ' + c.r.name + ' (ran out)' : 'Ingredients are gone'; this.paint(); return; }
    }
    if (!this.isOpen) return;
    this.acc += dt; if (this.acc > 0.2){ this.acc = 0; this.paint(); }
  }
};


/* ============ BENCH SCREEN (the crafting bench window: the recipe book above, filtered to station 'bench', as a full-screen panel. Opens with the action button next to a bench (see PunchFactory), closes when you walk away or open the bag) ============ */
const BenchScreen = Object.create(RecipeBook);
Object.assign(BenchScreen, {

  init(){
    this.sel = null; this.craft = null; this.isOpen = false; this.rows = []; this.acc = 0; this.qty = 1;

/* ============ HOTBAR FACTORY (the top row of the bag = the first 5 slots, always on screen at the bottom, no need to open the inventory.
   Tap a slot: it turns YELLOW (selected); tap it again to unselect. With a PLACEABLE item selected (`HotbarFactory.placeable[kind] = { w, d, place(x, y) }`, registered by the item's own factory, e.g. the crafting bench),
   tap the ground: it is placed there, if it is close enough and the spot is free, and one is used up. The hotbar always shows the bag: drag things in the inventory and it follows) ============ */
const HotbarFactory = {
  n: 5, size: 46, gap: 6, reach: 150, sel: -1, placeable: {}, el: null, cells: [], tap: null, acc: 0, keys: [], hint: null, hintT: 0,
  init(){
    const S = this.size, css = (el, t) => { el.style.cssText = t; return el; };
    const bar = this.el = css(document.createElement('div'), 'position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 8px);z-index:8;display:none;gap:' + this.gap + 'px;padding:6px;border-radius:16px;background:rgba(20,14,8,.55);border:1px solid rgba(255,225,170,.3);touch-action:none;user-select:none;-webkit-user-select:none');
    for (let i = 0; i < this.n; i++){
      const el = css(document.createElement('div'), 'position:relative;width:' + S + 'px;height:' + S + 'px;border-radius:11px;background:linear-gradient(rgba(8,5,3,.9),rgba(52,39,26,.8));border:2px solid rgba(255,225,170,.3);box-sizing:border-box;cursor:pointer;touch-action:none');
      const cv = css(document.createElement('canvas'), 'position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none'); cv.width = cv.height = S * 2;
      const q = css(document.createElement('div'), 'position:absolute;right:4px;bottom:1px;font:800 12px system-ui;color:#fff;text-shadow:0 1px 3px #000,0 0 2px #000;pointer-events:none');
      const num = css(document.createElement('div'), 'position:absolute;left:4px;top:1px;font:700 9px system-ui;color:rgba(255,235,200,.55);pointer-events:none'); num.textContent = i + 1;
      el.append(cv, q, num); bar.appendChild(el); this.cells.push({ el, cv, q, key: null });
      el.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); this.toggle(i); });
    }
    const h = this.hint = css(document.createElement('div'), 'position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 74px);z-index:8;display:none;padding:5px 12px;border-radius:10px;background:rgba(0,0,0,.6);color:#ffe9a8;font:700 12px system-ui;pointer-events:none;white-space:nowrap');
    document.body.append(bar, h);
    addEventListener('keydown', e => { if (InventoryFactory.isOpen || e.repeat) return; const k = parseInt(e.key, 10); if (k >= 1 && k <= this.n) this.toggle(k - 1); });   // PC: keys 1-5

    document.addEventListener('pointerdown', e => { this.tap = (e.target === cv || e.target.id === 'joyZone') ? { x: e.clientX, y: e.clientY, t: performance.now(), id: e.pointerId } : null; }, true);
    document.addEventListener('pointerup', e => { const t = this.tap; if (!t || t.id !== e.pointerId) return; this.tap = null; if (Math.hypot(e.clientX - t.x, e.clientY - t.y) < 12 && performance.now() - t.t < 400) this.place(e.clientX, e.clientY); }, true);

  },
  say(t){ this.hint.textContent = t; this.hint.style.display = 'block'; this.hintT = 2; },
  toggle(i){
    if (player.dead || !player.bag) return;
    const eat = player.bag.slots[i]; if (eat && (SurvivalFactory.foods[eat.kind] || SlotsFactory.quick[eat.kind])){ const r = SlotsFactory.use[eat.kind](); if (r.used){ player.bag.remove(i); InventoryFactory.save(); this.paint(true); } if (r.msg) this.say(r.msg); return; }   // food: one tap eats it
    this.sel = this.sel === i ? -1 : i; const it = this.sel >= 0 ? player.bag.slots[this.sel] : null;
    if (it && this.placeable[it.kind]) this.say('Tap the ground to place ' + (SlotsFactory.names[it.kind] || it.kind));
    else if (it && ToolFactory.defs[it.kind]) this.say(ToolFactory.info(it.kind));
    this.paint(true);
  },
  world(cx, cy){ const z = CONFIG.zoom || 1; return { x: cx / z - W / 2 + cam.x, y: (cy / z - H / 2) / CONFIG.tilt + cam.y }; },   // screen px -> world
  place(cx, cy){
    if (this.sel < 0 || player.dead || InventoryFactory.isOpen || DialFactory.isOpen || ChestFactory.cur) return;
    const it = player.bag.slots[this.sel], def = it && this.placeable[it.kind]; if (!def) return;
    const p = this.world(cx, cy);
    if (Math.hypot(p.x - player.x, p.y - player.y) > (def.reach || this.reach)){ this.say('Too far away'); return; }
    const x0 = p.x - def.w / 2 - 4, x1 = p.x + def.w / 2 + 4, y0 = p.y - def.d / 2 - 4, y1 = p.y + def.d / 2 + 4;
    let bad = Math.hypot(p.x - player.x, p.y - player.y) < 24;   // not right on top of yourself

      c.el.style.background = on ? 'linear-gradient(rgba(120,90,10,.9),rgba(80,58,10,.85))' : 'linear-gradient(rgba(8,5,3,.9),rgba(52,39,26,.8))';
    }
  },
  update(dt){
    const show = GameFactory.running && !player.dead; this.el.style.display = show ? 'flex' : 'none';

    if (this.sel >= 0 && !player.bag.slots[this.sel]) this.sel = -1;   // the selected item is gone

/* ============ CRAFTING BENCH FACTORY (the bench you placed in the world: a low-poly wooden workbench drawn from one cached sprite. Placed from the hotbar (see HotbarFactory.placeable), solid (you can't walk through it) and saved in the browser, so it is there next time.
   To use it as a crafting station later, read CraftingBenchFactory.list (the benches) / .near(x, y, r). Tune the numbers right below) ============ */
const CraftingBenchFactory = {
  w: 44, d: 16, saveKey: 'gimmick.benches.v1', list: [], sprite: null,   // footprint on the ground (px) / browser save
  init(){
    HotbarFactory.placeable.crafting_bench = { w: this.w, d: this.d, place: (x, y) => this.add(x, y, true) };
    let a = null; try { a = JSON.parse(localStorage.getItem(this.saveKey)); } catch (e) {}
    if (Array.isArray(a)) for (const b of a) if (b && isFinite(b.x) && isFinite(b.y)) this.add(b.x, b.y, false);
  },
  add(x, y, save){
    const b = { x, y }; b.box = CollisionFactory.add({ x: x - this.w / 2, y: y - this.d / 2, w: this.w, d: this.d }); this.list.push(b);
    if (save){ this.save(); DustFactory.spawn(x, y, 8); RaidFactory.say('Crafting bench placed'); } return true;
  },
  save(){ try { localStorage.setItem(this.saveKey, JSON.stringify(this.list.map(b => ({ x: Math.round(b.x), y: Math.round(b.y) })))); } catch (e) {} },
  near(x, y, r){ let best = null, bd = r; for (const b of this.list){ const d = Math.hypot(b.x - x, b.y - y); if (d < bd){ bd = d; best = b; } } return best; },

    g.fillStyle = '#e2b884'; g.beginPath(); g.moveTo(14, 8); g.lineTo(36, 8); g.lineTo(34, 22); g.lineTo(4, 22); g.closePath(); g.fill();
    g.strokeStyle = 'rgba(90,55,25,.45)'; g.lineWidth = 1; g.beginPath(); g.moveTo(9, 15); g.lineTo(63, 15); g.moveTo(20, 8); g.lineTo(14, 22); g.moveTo(44, 8); g.lineTo(46, 22); g.stroke();
    g.fillStyle = '#7a4b25'; g.fillRect(4, 22, 64, 7); g.fillStyle = '#5e3818'; g.fillRect(4, 26, 64, 3);
    g.strokeStyle = '#7a5230'; g.lineWidth = 2.5; g.lineCap = 'round'; g.beginPath(); g.moveTo(40, 15); g.lineTo(52, 12); g.stroke();
    g.fillStyle = '#8a8f98'; g.fillRect(50, 7, 7, 8); g.fillStyle = '#b8bdc6'; g.fillRect(50, 7, 7, 3);

  },
  collect(items, cam, W, H){
    for (const b of this.list){ if (!ViewFactory.sees(b.x, b.y, 60, 40, 40)) continue; items.push({ y: b.y + this.d / 2, f: () => this.draw(ctx, b, cam, W, H) }); }

/* ============ ANVIL FACTORY (the third station, next to the crafting bench and the furnace: build it at the bench from iron ingots, place it from the hotbar, then the action button beside it opens the ANVIL screen = the recipe book filtered to station 'anvil': iron pickaxe, iron shield, iron arrows. To add an anvil recipe add ONE entry with station: 'anvil' to RecipeFactory.list. Tune the numbers right below) ============ */

    g.fillStyle = '#8f9bab'; g.beginPath(); g.moveTo(14, 12); g.lineTo(2, 17); g.lineTo(16, 22); g.lineTo(19, 29); g.lineTo(26, 29); g.lineTo(24, 12); g.closePath(); g.fill();

    I.use.iron_arrow = () => ({ used: false, msg: 'Iron Arrow · ' + ArrowFactory.dmgs.iron_arrow + ' damage (stone arrows ' + ArrowFactory.dmgs.arrow + ') · used first when you shoot' });
    RecipeFactory.list.push(

/* ============ BACKPACK FACTORY (the BACKPACK item has its own slot in the inventory window (next to the dial slot). The bag stays at 10 slots; only while a backpack is WORN in that slot the bag gets `bonus` more slots. Tap a backpack in the bag (or drag it onto the slot) to wear it, tap the slot to take it off (the extra slots must be empty first). Made at the crafting bench from rope and copper ingots. Tune `bonus` right below) ============ */
const BackpackFactory = {

/* ============ GUARD FACTORY (the SHIELD: tap a shield in the bag (or drag it onto the DIAL/SHIELD slot) to wear it: the slot holds EITHER the dial OR a shield. A worn shield is drawn on one arm for good, so the other arm stays free (punch, tools, bow). A 🛡 button appears only while a shield is worn: HOLD it to raise the shield, let go to lower it.
   While raised, hits do `holdMul` of their damage. The first `parryWin` seconds after you raise it are a PARRY: hits do nothing at all (press it just as the hit lands). After you lower it you must wait `parryCd` seconds for the parry window to work again. Tune the numbers right below) ============ */
const GuardFactory = {
  worn: null, hold: false, t: 0, cd: 0, btn: null, key: 'g', saveKey: 'gimmick.guard.v1', hintT: 0, ang: Math.PI / 2, tgt: Math.PI / 2, lock: 0, flash: 0,
  sides: 8, seeR: 300, turn: 18, lockT: 0.5, radius: 25, span: 0.75,   // directions it snaps to (8) / how far it looks for attackers (px) / turn speed / seconds it stays on the side that just hit you / shield distance from your body / half-width of the guard (radians)
  holdMul: 0.3, parryWin: 0.3, parryCd: 0.9, btnRight: 84, btnBottom: 84,   // damage left while raised (0.3 = 70% blocked) / seconds of perfect block / cooldown before the next parry / button spot (px from the right / bottom)
  isShield(k){ const d = ToolFactory.defs[k]; return !!(d && d.type === 'shield'); },
  active(){ return !!(this.worn && this.hold && !player.dead); },
  mul(){ if (!this.active()) return 1; return this.t < this.parryWin ? 0 : this.holdMul; },
  deflect(fx, fy){
    if (!this.active()) return; const parry = this.t < this.parryWin; this.flash = 1;
    if (fx !== undefined && fy !== undefined && (fx !== player.x || fy !== player.y)){ this.tgt = this.snap(Math.atan2(fy - player.y, fx - player.x)); this.lock = this.lockT; }
    ShakeFactory.kick(parry ? 3 : 1.5, 0.12); if (this.hintT <= 0){ HotbarFactory.say(parry ? '🛡 PARRY!' : '🛡 Blocked'); this.hintT = 0.5; }
  },
  save(){ try { localStorage.setItem(this.saveKey, this.worn || ''); } catch (e) {} },
  say(t){ if (InventoryFactory.isOpen) InventoryFactory.say(t); else RaidFactory.say(t); },
  equipTap(i){   // from the bag: the dial / old shield that sat in the slot goes back into the bag
    const IF = InventoryFactory, bag = player.bag, s = bag.slots[i]; if (!s || !this.isShield(s.kind)) return;
    let back = null; if (this.worn) back = this.worn; else if (IF.dialSlot){ back = 'dial'; IF.dialSlot = false; if (DialFactory.isOpen) DialFactory.close(); }
    this.worn = s.kind; s.qty--; if (s.qty <= 0) bag.slots[i] = back ? { kind: back, qty: 1 } : null; else if (back && bag.add({ kind: back }, 1) > 0) DropFactory.fromPlayer(back, 1);
    this.hold = false; this.save(); IF.save(); return { used: false, msg: 'Shield worn · hold 🛡 to raise it' + (back === 'dial' ? ' (dial taken off)' : '') };
  },
  unequip(){
    const k = this.worn; if (!k) return; if (player.bag.add({ kind: k }, 1) > 0){ this.say('Bag is full'); return; }
    this.worn = null; this.hold = false; this.save(); InventoryFactory.save(); this.say('Shield removed');
  },
  press(){ if (!this.worn || player.dead) return; this.hold = true; this.t = this.cd > 0 ? this.parryWin : 0; },
  release(){ if (!this.hold) return; this.hold = false; this.cd = this.parryCd; },
  draw(g, ch, x, y, mode){   // on the free arm; called from the human body drawing (also the inventory preview)
    if (!this.worn || !(ch === player || ch === InventoryFactory.pw)) return; const d = ToolFactory.defs[this.worn]; if (!d) return;
    if (ch === player && this.active()) return;   // raised: the shield swings out to the attacker's side (see collect / drawGuard)
    g.save(); ToolFactory.drawHeld(g, d, x, y, mode); g.restore();
  },
  snap(a){ const q = Math.PI * 2 / this.sides; return Math.round(a / q) * q; },   // round an angle to the nearest of the 8 sides
  threat(){   // the direction of the closest attacker (zombie / boss), or null
    let best = null, bd = this.seeR;
    for (const z of ZombieSystem.list){ if (z.dead || z.gone) continue; const d = Math.hypot(z.x - player.x, z.y - player.y); if (d < bd){ bd = d; best = z; } }
    const bs = BossFactory.alive(); if (bs){ const d = Math.hypot(bs.x - player.x, bs.y - player.y) - BossFactory.radius(); if (d < bd){ bd = d; best = bs; } }
    return best ? Math.atan2(best.y - player.y, best.x - player.x) : null;
  },
  collect(items, cam, W, H){
    if (!this.worn || !this.hold || player.dead) return;
    const back = Math.sin(this.ang) < -0.35;   // pointing away from the camera: draw it behind the body
    items.push({ y: player.y + (back ? -6 : 6), f: () => this.drawGuard(ctx, cam, W, H) });
  },
  drawGuard(g, cam, W, H){
    const s = GroundFactory.toScreen(player.x, player.y, cam, W, H), a = this.ang, d = ToolFactory.defs[this.worn] || {}, M = ToolFactory.mats[d.mat] || ToolFactory.mats.stone;
    const parry = this.t < this.parryWin, R = this.radius, tl = CONFIG.tilt, cy = s.y - 34, k = Math.min(1, this.t / 0.12);
    g.save(); g.translate(s.x, cy); g.scale(1, Math.min(1, 0.55 + tl)); g.lineCap = 'round';
    const a0 = a - this.span * k, a1 = a + this.span * k;
    g.globalAlpha = 0.28 + 0.12 * this.flash; g.strokeStyle = parry ? '#ffffff' : '#7fdcff'; g.lineWidth = 26; g.beginPath(); g.arc(0, 0, R, a0, a1); g.stroke(); g.globalAlpha = 1;   // soft glow
    g.strokeStyle = '#7a4b25'; g.lineWidth = 15; g.beginPath(); g.arc(0, 0, R, a0, a1); g.stroke();   // wooden face
    g.strokeStyle = M.head; g.lineWidth = 3.2; for (const o of [-7.5, 7.5]){ g.beginPath(); g.arc(0, 0, R + o, a0, a1); g.stroke(); }   // metal rims
    g.strokeStyle = M.hi; g.lineWidth = 1.4; g.beginPath(); g.arc(0, 0, R - 3, a0 + 0.05, a1 - 0.05); g.stroke();
    const bx = Math.cos(a) * R, by = Math.sin(a) * R; g.fillStyle = parry ? '#ffffff' : M.hi; g.beginPath(); g.arc(bx, by, 5.2, 0, 7); g.fill(); g.strokeStyle = M.line || '#46515f'; g.lineWidth = 1; g.stroke();   // boss in the middle
    if (this.flash > 0.05){ g.globalCompositeOperation = 'lighter'; g.globalAlpha = this.flash * 0.7; g.strokeStyle = '#bff0ff'; g.lineWidth = 6; g.beginPath(); g.arc(0, 0, R + 4, a0, a1); g.stroke(); }
    g.restore();
  },
  init(){
    try { const k = localStorage.getItem(this.saveKey); this.worn = k && this.isShield(k) ? k : null; if (this.worn) InventoryFactory.dialSlot = false; } catch (e) {}
    SlotsFactory.use.iron_shield = i => this.equipTap(i);
    for (const k in ToolFactory.defs) if (this.isShield(k)) SlotsFactory.use[k] = i => this.equipTap(i);
    const b = this.btn = document.createElement('button'); b.textContent = '🛡️';
    b.style.cssText = 'position:fixed;right:' + this.btnRight + 'px;bottom:calc(env(safe-area-inset-bottom,0px) + ' + this.btnBottom + 'px);z-index:6;width:54px;height:54px;padding:0;border-radius:50%;font:700 24px system-ui;line-height:1;color:#fff;background:rgba(60,110,170,.7);border:2px solid #fff;touch-action:none;user-select:none;-webkit-user-select:none;display:none';
    b.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); try { b.setPointerCapture(e.pointerId); } catch (x) {} this.press(); });
    const up = () => this.release(); b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up); b.addEventListener('lostpointercapture', up);
    document.body.appendChild(b);
    addEventListener('keydown', e => { if (e.key.toLowerCase() === this.key && !e.repeat) this.press(); }); addEventListener('keyup', e => { if (e.key.toLowerCase() === this.key) this.release(); });
  },
  update(dt){
    if (!this.btn) return; if (this.hintT > 0) this.hintT -= dt; if (this.cd > 0) this.cd -= dt;
    if (this.flash > 0) this.flash = Math.max(0, this.flash - dt * 4);
    if (this.hold){ this.t += dt; if (player.dead || !this.worn) this.hold = false;
      if (this.lock > 0) this.lock -= dt; else { const th = this.threat(); if (th !== null) this.tgt = this.snap(th); }   // face the nearest attacker unless a hit just told us a side
      let df = this.tgt - this.ang; df = Math.atan2(Math.sin(df), Math.cos(df)); this.ang += df * Math.min(1, dt * this.turn); }
    else { const f = player.face || 1, th = this.threat(); this.tgt = this.snap(th !== null ? th : (f < 0 ? Math.PI : 0)); this.ang = this.tgt; }   // lowered: ready on the attacker's side (or the way you face)
    const show = !!this.worn && GameFactory.running && !player.dead && !InventoryFactory.isOpen; this.btn.style.display = show ? 'block' : 'none';
    this.btn.style.background = this.hold ? 'rgba(90,170,255,.95)' : 'rgba(60,110,170,.7)'; this.btn.style.boxShadow = this.hold ? '0 0 16px rgba(140,220,255,.95)' : 'none';
  }
};
const parryGlow = p => p ? '#ffffff' : '#6fd8ff';

/* ============ FOOD FACTORY (the STONE BOWL and the HEALING STEW: 2 stone make a bowl at the bench, a bowl + 2 apples make a stew. Eat it (tap in the bag, or one tap in the hotbar): heals health and fills hunger) ============ */

const BuffFactory = {

/* ============ BOMB FACTORY (the BOMB: 2 stone + 1 rope + 1 crystal at the bench. Select it in the hotbar and tap the ground within `reach` to place it: it hisses for `fuse` seconds, then blows up everything within `radius` (zombies take `dmg`, a boss `bossDmg`). It never hurts you. Tune the numbers right below) ============ */
const BombFactory = {
  fuse: 1.6, radius: 170, dmg: 80, bossDmg: 60, reach: 220, list: [],   // fuse s / blast size px / zombie damage / boss damage / how far from you it can be placed
 
  register(){
    const I = SlotsFactory, self = this;
    I.names.bomb = 'Bomb';
    I.icons.bomb = (g, x, y, z, t) => {
      const r = z * 0.27; g.save(); g.translate(x, y + r * 0.3);
      g.fillStyle = '#23272d'; g.beginPath(); g.arc(0, 0, r, 0, 7); g.fill(); g.fillStyle = '#4a525c'; g.beginPath(); g.arc(-r * 0.32, -r * 0.34, r * 0.3, 0, 7); g.fill();
      g.fillStyle = '#5a5f66'; g.fillRect(-r * 0.22, -r * 1.2, r * 0.44, r * 0.34);
      g.strokeStyle = '#b08a52'; g.lineWidth = Math.max(1.5, z * 0.04); g.lineCap = 'round'; g.beginPath(); g.moveTo(0, -r * 1.2); g.quadraticCurveTo(r * 0.5, -r * 1.6, r * 0.7, -r * 1.35); g.stroke();
      g.fillStyle = (Math.floor((t || 0) * 8) % 2) ? '#ffd24a' : '#ff7a1a'; g.beginPath(); g.arc(r * 0.72, -r * 1.38, r * 0.2, 0, 7); g.fill(); g.restore();
    };
    I.use.bomb = () => ({ used: false, msg: 'Bomb · select it in the hotbar, then tap the ground to place it' });
    HotbarFactory.placeable.bomb = { w: 14, d: 14, reach: self.reach, place: (x, y) => { if (player.dead || !GameFactory.running) return false; self.list.push({ x, y, t: 0, boom: -1, inside: !!DungeonFactory.inside }); HotbarFactory.say('Bomb planted · get away!'); return true; } };
    RecipeFactory.list.push({ id: 'bomb', station: 'bench', name: 'Bomb', out: { kind: 'bomb', qty: 1 }, ingredients: [{ kind: 'stone', qty: 2 }, { kind: 'rope', qty: 1 }, { kind: 'crystal', qty: 1 }], time: 4 });
  },
  update(dt){
    for (const b of this.list){
      if (b.inside !== !!DungeonFactory.inside) continue;   // a bomb waits while you are in the other place
      b.t += dt;
      if (b.boom < 0 && b.t >= this.fuse){
        b.boom = 0; const R = this.radius;
        if (!b.rem) for (const z of ZombieSystem.list){ if (z.dead || z.gone) continue; if (Math.hypot(z.x - b.x, z.y - b.y) < R) ZombieSystem.damage(z, this.dmg, b.x, b.y); }   // a bomb another player planted only shows here: the planter's own blast does the damage (otherwise it hit once per player)
        const bs = BossFactory.alive(); if (!b.rem && bs && Math.hypot(bs.x - b.x, bs.y - b.y) - BossFactory.radius() < R) BossFactory.damage(bs, this.bossDmg, b.x, b.y);
        ShakeFactory.kick(7, 0.3); ImpactFactory.chips(b.x, b.y, 16); DustFactory.spawn(b.x, b.y, 14);
      } else if (b.boom >= 0) b.boom += dt;

  },
  collect(items, cam, W, H){ for (const b of this.list){ if (b.inside !== !!DungeonFactory.inside || !ViewFactory.sees(b.x, b.y, 160, 160, 60)) continue; items.push({ y: b.y, f: () => this.draw(ctx, b, cam, W, H) }); } },
  draw(g, b, cam, W, H){
    const s = GroundFactory.toScreen(b.x, b.y, cam, W, H);
    if (b.boom < 0){
      const blink = Math.floor(b.t * (6 + b.t * 6)) % 2; g.fillStyle = 'rgba(0,0,0,.3)'; g.beginPath(); g.ellipse(s.x, s.y + 2, 9, 4, 0, 0, 7); g.fill();

      g.fillStyle = '#ffd24a'; g.beginPath(); g.arc(s.x + 5, s.y - 17 + Math.sin(b.t * 30) * 1.5, 2.4, 0, 7); g.fill();

      g.fillStyle = gr; g.beginPath(); g.arc(0, 0, R, 0, 7); g.fill(); g.strokeStyle = 'rgba(255,200,120,' + (0.7 * (1 - u)) + ')'; g.lineWidth = 4; g.beginPath(); g.arc(0, 0, R, 0, 7); g.stroke(); g.restore();
    }
  }
};

/* ============ ARMOR FACTORY (REUSABLE armor: wearing, slots, damage reduction and the drawing on the character. 4 slots: helmet, chest, legs, boots (shown in the inventory next to the character).
   To add a new armor set (iron, diamond...) add ONE entry to `sets`: { name, mat (ingot item), col [main, light, dark], cost per piece, reduce per piece }. Items, icons, recipes (at the crafting bench) and the drawing on the body are all made from that entry.
   Total reduction = the sum of the worn pieces' `reduce` (copper full set = 20%). Tap armor in the bag to wear it (or drag it onto its slot); tap a worn piece to take it off. Worn armor is drawn on the human body (HumanSkin hooks) and in the inventory preview, and is saved in the browser) ============ */
const ArmorFactory = {
  slots: ['helmet', 'chest', 'legs', 'boots'], labels: { helmet: 'Helmet', chest: 'Chestplate', legs: 'Leggings', boots: 'Boots' },
  sets: {
    copper: { name: 'Copper', mat: 'copper_ingot', col: ['#b8652a', '#e8a064', '#7a3f17'], cost: { helmet: 5, chest: 8, legs: 7, boots: 4 }, reduce: { helmet: 0.04, chest: 0.07, legs: 0.05, boots: 0.04 } },
    iron: { name: 'Iron', mat: 'iron_ingot', col: ['#8d99a8', '#e2e9f1', '#4d5866'], cost: { helmet: 5, chest: 8, legs: 7, boots: 4 }, reduce: { helmet: 0.06, chest: 0.10, legs: 0.08, boots: 0.06 } }   // full iron set = 30% less damage   // full copper set = 20% less damage (the lowest tier)
  },
  saveKey: 'gimmick.armor.v1', cellSize: 44, worn: { helmet: null, chest: null, legs: null, boots: null }, info: {}, cells: {}, pct: null,   // worn = item kind per slot / kind -> { set, slot }
  kind(set, slot){ return set + '_' + slot; },
  register(){   // items + icons + bench recipes from the sets table (runs before the inventory loads so saved armor is recognised)
    const I = SlotsFactory;
    for (const key in this.sets){ const st = this.sets[key];
      for (const sl of this.slots){
        const k = this.kind(key, sl), nm = st.name + ' ' + this.labels[sl]; this.info[k] = { set: key, slot: sl };
        I.names[k] = nm; I.icons[k] = (g, x, y, z) => this.icon(g, x, y, z, sl, st.col); I.use[k] = i => this.equipTap(i);
        RecipeFactory.list.push({ id: k, station: 'bench', name: nm, out: { kind: k, qty: 1 }, ingredients: [{ kind: st.mat, qty: st.cost[sl] }], time: Math.round(3 + st.cost[sl] * 0.5) });
      }
    }
  },
  reduction(){ let r = 0; for (const sl of this.slots){ const k = this.worn[sl], inf = k && this.info[k]; if (inf) r += this.sets[inf.set].reduce[inf.slot]; } return r; },
  mul(ch){ return ch === player ? (1 - this.reduction()) * this.shieldMul() : 1; },
  shieldMul(){ return GuardFactory.mul(); },   // holding a shield = half damage on top of the armor   // damage multiplier (HealthFactory.takenMul uses it)
  load(){ let o = null; try { o = JSON.parse(localStorage.getItem(this.saveKey)); } catch (e) {} if (o) for (const sl of this.slots){ const k = o[sl]; if (k && this.info[k] && this.info[k].slot === sl) this.worn[sl] = k; } },
  save(){ try { localStorage.setItem(this.saveKey, JSON.stringify(this.worn)); } catch (e) {} },
  say(t){ if (InventoryFactory.isOpen) InventoryFactory.say(t); else RaidFactory.say(t); },
  equipTap(i){   // tap armor in the bag: wear it (an old piece in that slot goes back to the bag)
    const bag = player.bag, s = bag.slots[i], inf = s && this.info[s.kind]; if (!inf) return;
    const old = this.worn[inf.slot]; this.worn[inf.slot] = s.kind; s.qty--;
    if (s.qty <= 0) bag.slots[i] = old ? { kind: old, qty: 1 } : null; else if (old && bag.add({ kind: old }, 1) > 0) DropFactory.fromPlayer(old, 1);
    this.save(); InventoryFactory.save(); return { used: false, msg: SlotsFactory.names[this.worn[inf.slot]] + ' worn · ' + Math.round(this.reduction() * 100) + '% less damage' };
  },
  equipFrom(i, want){   // dragged onto an armor slot
    const s = player.bag.slots[i], inf = s && this.info[s.kind]; if (!inf) return;
    if (inf.slot !== want){ this.say('That goes in the ' + this.labels[inf.slot] + ' slot'); return; }
    const r = this.equipTap(i); if (r && r.msg) this.say(r.msg);
  },
  unequip(sl){
    const k = this.worn[sl]; if (!k) return;
    if (player.bag.add({ kind: k }, 1) > 0){ this.say('Bag is full'); return; }
    this.worn[sl] = null; this.save(); InventoryFactory.save(); this.say(SlotsFactory.names[k] + ' removed · ' + Math.round(this.reduction() * 100) + '% less damage');
  },
  // ---- the inventory column ----
  column(){
    const css = (el, t) => { el.style.cssText = t; return el; }, S = this.cellSize;
    const col = css(document.createElement('div'), 'display:flex;flex-direction:column;align-items:center;gap:6px');
    const lab = css(document.createElement('div'), 'font:800 10px system-ui;letter-spacing:2px;color:#f3d79a'); lab.textContent = 'ARMOR'; col.appendChild(lab);
    for (const sl of this.slots){
      const el = css(document.createElement('div'), 'position:relative;width:' + S + 'px;height:' + S + 'px;border-radius:11px;background:linear-gradient(rgba(8,5,3,.9),rgba(52,39,26,.8));border:1px solid rgba(255,225,170,.3);box-shadow:inset 0 3px 6px rgba(0,0,0,.65);cursor:pointer');

      el.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); InventoryFactory.dragStart(e, 'armor:' + sl, el); });

  },
  paint(){

      if (k && SlotsFactory.icons[k]) SlotsFactory.icons[k](g, S, S, S * 1.35, 0);
      else { g.globalAlpha = 0.22; this.icon(g, S, S, S * 1.2, sl, ['#9aa', '#cdd', '#667']); g.globalAlpha = 1; }

  },
  icon(g, x, y, z, slot, c){   // one picture per slot, coloured by the set (also used for the empty-slot ghost)

    const poly = (pts, col) => { g.fillStyle = col; g.beginPath(); pts.forEach((q, i) => i ? g.lineTo(q[0] * r, q[1] * r) : g.moveTo(q[0] * r, q[1] * r)); g.closePath(); g.fill(); };

      g.fillStyle = c[2]; g.fillRect(-r, 0.25 * r, 2 * r, 0.35 * r); g.fillRect(-0.14 * r, 0.25 * r, 0.28 * r, 0.9 * r); g.fillStyle = 'rgba(0,0,0,.55)'; g.fillRect(-0.7 * r, 0.62 * r, 0.5 * r, 0.3 * r); g.fillRect(0.2 * r, 0.62 * r, 0.5 * r, 0.3 * r);
    } else if (slot === 'chest'){

      poly([[-0.5, -1], [0, -1], [0, 1], [-0.6, 1], [-0.8, 0.2], [-1.1, -0.65]], c[1]);
      g.fillStyle = c[2]; g.fillRect(-0.7 * r, 0.35 * r, 1.4 * r, 0.22 * r); g.beginPath(); g.arc(0, -1 * r, 0.32 * r, 0, Math.PI); g.fill();
    } else if (slot === 'legs'){
      g.fillStyle = c[0]; g.beginPath(); g.roundRect(-0.85 * r, -r, 0.78 * r, 2 * r, r * 0.12); g.roundRect(0.07 * r, -r, 0.78 * r, 2 * r, r * 0.12); g.fill();
      g.fillStyle = c[1]; g.fillRect(-0.85 * r, -r, 0.22 * r, 2 * r); g.fillRect(0.07 * r, -r, 0.22 * r, 2 * r);
      g.fillStyle = c[2]; g.fillRect(-0.9 * r, -r, 1.8 * r, 0.4 * r); g.fillRect(-0.85 * r, 0.2 * r, 0.78 * r, 0.14 * r); g.fillRect(0.07 * r, 0.2 * r, 0.78 * r, 0.14 * r);

        g.fillStyle = c[1]; g.fillRect(bx - 0.42 * r, -0.9 * r, 0.2 * r, 1.4 * r); g.fillStyle = c[2]; g.fillRect(bx - 0.46 * r, -0.9 * r, 0.92 * r, 0.3 * r); }

  },
  // ---- drawing on the body (called from HumanSkin; g is already in the body's own space) ----
  wornFor(ch){ return ch === player || ch === InventoryFactory.pw ? this.worn : (ch.wornNet || null); },
  colOf(k){ const inf = k && this.info[k]; return inf ? this.sets[inf.set].col : null; },
  legDepth(g, ch, x, top, len){

    if (c){ g.fillStyle = c[0]; g.beginPath(); g.roundRect(-4.8, -1, 9.6, 26, 3.6); g.fill(); g.fillStyle = c[1]; g.fillRect(-3.6, 2, 2, 16); g.fillStyle = c[2]; g.fillRect(-4.8, -1, 9.6, 3); g.fillRect(-4.8, 11, 9.6, 1.6); }

  chestDepth(g, ch, tp, back){

    g.fillStyle = c[1]; g.globalAlpha = 0.55; g.fillRect(-14, -60, 14, 32); g.globalAlpha = 1; g.fillStyle = 'rgba(0,0,0,.2)'; g.fillRect(2, -60, 13, 32);

  chestSide(g, ch){
