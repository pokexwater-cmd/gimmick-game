  },
  helmetDepth(g, ch, back){   // head space: origin = middle of the head
    const W = this.wornFor(ch), c = W && this.colOf(W.helmet); if (!c) return;
    g.fillStyle = c[0]; g.beginPath();
    if (back){ g.ellipse(0, -0.4, 9, 9.7, 0, 0, 7); g.fill(); g.fillStyle = c[1]; g.globalAlpha = 0.5; g.fillRect(-9, -10, 6, 14); g.globalAlpha = 1; g.fillStyle = c[2]; g.fillRect(-9, -3.2, 18, 2); g.fillRect(-0.7, -10, 1.4, 14); return; }

    g.fillStyle = c[2]; g.fillRect(-9.2, -4, 18.4, 2.4); g.fillRect(-1, -3, 2, 7);   // brow band + nose guard
    g.fillStyle = c[0]; g.fillRect(-9.2, -2, 2.2, 7); g.fillRect(7, -2, 2.2, 7);   // cheek plates
  },
  helmetSide(g, ch){

/* ============ PTERANODON FACTORY (the first DINOSAUR: a pteranodon that WALKS on its folded wings, like in ARK.
   PSEUDO-3D, built the same way as the Ace Guardian: a tiny 3D rig. Every part is a real 3D tube / sheet / slab (smooth 10-sided tubes for the body, neck, head, bones, legs; flat sheets for the wing skin and the head sails)
   that turns to face the way he walks (front / back / side / every diagonal, smoothly), is lit, face-culled and drawn far-to-near, so he looks solid from every side.
   Walk = a diagonal gait: the wing-arms and the hind legs swing in opposite pairs, the wing knuckles hit the ground, the body rocks and the head bobs. Idle = breathing, jaw working, and the head looks around.
   He strolls around his home spot: walks to a random point, rests, walks again. FLIGHT: every few seconds he stops, crouches, unfolds his wings, takes off with two big wing swings, then flies in wide curves high above the ground (a shadow stays below), glides now and then, and finally flares, lands and folds his wings. Tune it in `fly`; PteranodonFactory.takeoff(d) starts a flight at once.
   To change him: `C` (paint, [r,g,b]), `size` (how big he is drawn), `speed` / `stepLen` (walk), `turn` (how fast he swings round), `wanderR` / `rest` (how he strolls), `spawnAt` (where the first one appears). To add more: PteranodonFactory.make(x, y).
   The body is `model()`: every part is one short line (tube(path, widths, heights, colour) / sheet / slab), easy to tweak) ============ */
const PteranodonFactory = {
  firstSpawn: false, size: 2.1, speed: 32, stepLen: 14, turn: 9, wanderR: 170, rest: [1.2, 3.4], spawnAt: { x: 190, y: 70 }, hp: 80,   // drawn size / walk px per second / px per half-stride / how fast he turns round / how far from home he strolls / seconds he rests between walks / first spawn spot / health (for later)
  fly: { on: true, alt: 120, speed: 125, crouch: 0.55, swing: 1.4, every: [6, 12], first: [3, 5], stay: [10, 17], radius: 460, turnRate: 1.6, freq: 1.15, glide: [2.2, 4.5] },   // alt = flight height above the ground / speed = flight px per second / seconds of crouch + of the take-off wing swings / seconds he walks between flights / seconds before the very first one / seconds he stays up / how far from home he flies / how fast he banks round / wing beats per second / seconds of each glide
  C: { skin: [170, 94, 54], skinHi: [204, 128, 78], belly: [226, 192, 146], dark: [60, 44, 42], beak: [74, 66, 60], beakHi: [128, 114, 98], tip: [214, 196, 164], crest: [178, 112, 66], sail: [52, 46, 56], sailHi: [126, 92, 84], mem: [98, 112, 156], memIn: [150, 160, 196], memEdge: [64, 72, 108], bone: [150, 98, 58], boneDk: [104, 66, 42], claw: [230, 218, 192], eye: [255, 176, 44], pupil: [14, 10, 10] },
  list: [], spawned: false, nid: 0,
  make(x, y){
    const d = { id: ++this.nid, x, y, homeX: x, homeY: y, tx: x, ty: y, vx: 0, vy: 0, hd: 0, face: 1, dir: 'front', mv: false, wait: 1 + Math.random() * 1.5, ph: Math.random() * 6.283, t: Math.random() * 9, wk: 0, hp: this.hp, max: this.hp, state: 'walk', sp: 0, h: 0, fa: 0, fv: 0, crouch: 0, st: 0, fp: 0, ga: 1, gt: 0, flyIn: this.rnd(this.fly.first) };
    this.list.push(d); return d;
  },
  blocked(x, y){ if (IglooFactory.covers(x, y)) return true; for (const b of CollisionFactory.boxes) if (x > b.x - 24 && x < b.x + b.w + 24 && y > b.y - 24 && y < b.y + b.h + 24) return true; return false; },
  spawnFirst(){
    if (!this.firstSpawn || this.spawned || !GameFactory.running) return; this.spawned = true;
    let x = this.spawnAt.x, y = this.spawnAt.y; for (let i = 0; i < 24 && this.blocked(x, y); i++){ const a = i * 0.9, r = 40 + i * 14; x = this.spawnAt.x + Math.cos(a) * r; y = this.spawnAt.y + Math.sin(a) * r; }
    this.make(x, y);
  },
  rnd(r){ return r[0] + Math.random() * (r[1] - r[0]); },
  update(dt){
    this.spawnFirst();
    for (const d of this.list){
      d.t += dt;
      if (d.net) continue;   // another player's bird: MultiplayerFactory moves it
      if (d.rider){ FlightFactory.drive(d, dt); continue; }   // ridden: the player's buttons + joystick drive him
      if (MountFactory.calm(d)) continue;   // you are close: he stands and waits so you can hop on

      dot(hb([sd * 4.1, 45.9, 19.2]), 1.9, C.eye, [sd, 0.1, 0.1], 6); dot(hb([sd * 4.3, 45.9, 19.7]), 0.95, C.pupil, [sd, 0.1, 0.1], 6.2);

    for (const sd of [-1, 1]){
      const q = (y, z, fl) => hb([sd * (1.5 + fl), y, z]), pts = [q(58, 8, 0.4), q(64, -2, 2.8), q(58, -10, 4), q(50, -4.4, 2.8), q(46.4, 11, 0.6)];
      sheet(pts, C.sail, C.sailHi, { edge: C.sailHi, bias: 5, ribs: [[q(58, 8, 0.4), q(50, -4.4, 2.8)], [q(61, 3, 1.6), q(54, -7.6, 3.4)], [q(58, 8, 0.4), q(58, -10, 4)], [q(54, 9.5, 0.5), q(51, -1, 2.4)]] });

      tube([M.add(lg.h, [0, -1, 6.2]), M.add(lg.h, [0, -1.5, 8.6])], [0.5, 0.15], [0.5, 0.15], C.claw, { bias: 0.4, cap: true });
    }
    // ---- wings: folded for walking (he walks on the wrist knuckles, the wing finger folded back along the body) and SPREAD for flight. Both poses share the same points, so unfolding is a smooth morph (sp = 0 folded .. 1 spread; fa = flap angle, the wing tips lag behind the flap) ----
    for (const sd of [-1, 1]){

      const F1 = [sd * (14.4 + Math.sin(t * 1.2) * 0.2), 15 + by * 0.5, -3.5], F2 = [sd * 12.2, 27 + by, -19], Ft = [sd * 10, 34.6 + by, -32 + Math.sin(t * 1.4) * 0.5];
      const Lw = [sd * 13.2, 4.2 + ft[1] * 0.3, -3.5 + ft[0] * 0.3], Lb = [sd * 10.6, 5.2, -24], Mb = [sd * 9.4, 15, -31];
      const spr = (l, y, z, u) => { const th = fa - Math.max(-0.9, Math.min(0.9, fv * 0.045)) * u, c = Math.cos(th), s = Math.sin(th); return [sd * (7.2 + l * c - y * s), 24.4 + by + l * s + y * c, 6.5 + z]; };   // a point of the spread wing: l = out from the shoulder, y = up, z = forward, u = how far along the wing (the tip lags behind the flap)
      let E = E0, W = W0, Af = [S, E0, W0, Lw, Lb, Mb], Bf = [F1, F1, F2, F2, Ft, Ft], fb = [F1, F2, Ft];

      tube([M.add(W, [0, 2.2 * (1 - sp), -1.8 * (1 - sp)]), fb[0], fb[1], fb[2]], [1.9, 1.5, 1.0, 0.3], [1.9, 1.5, 1.0, 0.3], C.boneDk, { bias: 1, cap: true });   // the long wing finger

      tube([M.add(W, [0, -0.2, 1.8]), M.add(W, [0, -0.9, 6.4])], [1.0, 0.2], [1.0, 0.2], C.claw, { bias: 2.2, cap: true });   // little hand claw
    }

/* ============ RIDE BUTTON FACTORY (reusable: the button set that REPLACES the normal punch / ability / bag buttons while the player is riding. Same spots as the normal pad:
   FLY at the punch spot (right), UP on top, DOWN at the bottom, BOOST on the left, EXIT where the bag button is.
   register(id, factory, { label, color, spot, key })   spot = 'punch' | 'bag' | 0 (bottom) | 1 (left) | 2 (top). The factory gives press(), release()? and ui() -> { mode, text }. Each button's behaviour lives in its own factory below) ============ */
const RideButtonFactory = {
  defs: {}, order: [], els: {}, st: {},
  register(id, f, o){
    const el = document.createElement('button'); el.className = 'abBtn'; el.textContent = o.label; el.style.setProperty('--c', o.color); document.body.appendChild(el);
    this.defs[id] = { f, o }; this.order.push(id); this.els[id] = el; const s = this.st[id] = { down: false, shown: false, key: '' };
    const up = () => { if (s.down){ s.down = false; if (f.release) f.release(); } };
    el.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); if (!player.ride) return; try { el.setPointerCapture(e.pointerId); } catch (x) {} s.down = true; f.press(); });
    el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up); el.addEventListener('lostpointercapture', up);
  },
  spot(o){ return o.spot === 'punch' ? AbilityFactory.punchSpot() : o.spot === 'bag' ? AbilityFactory.bagSpot() : AbilityFactory.spot(o.spot); },
  update(on){
    for (const id of this.order){
      const el = this.els[id], s = this.st[id], f = this.defs[id].f, o = this.defs[id].o;
      if (!on){ if (s.shown){ s.shown = false; el.style.display = 'none'; s.down = false; if (f.release) f.release(); } continue; }
      if (!s.shown){ s.shown = true; s.key = ''; el.style.display = 'block'; const p = this.spot(o); el.style.right = p[0] + 'px'; el.style.bottom = 'calc(env(safe-area-inset-bottom,0px) + ' + p[1] + 'px)'; }
      const u = f.ui(), k = u.mode + '|' + u.text; if (k === s.key) continue; s.key = k; el.className = 'abBtn ' + u.mode; el.textContent = u.text;
    }
  },
  init(){   // PC keys
    addEventListener('keydown', e => { if (!player.ride || e.repeat) return; const k = e.key.toLowerCase(); for (const id of this.order) if (this.defs[id].o.key === k) this.defs[id].f.press(); });
    addEventListener('keyup', e => { if (!player.ride) return; const k = e.key.toLowerCase(); for (const id of this.order) if (this.defs[id].o.key === k && this.defs[id].f.release) this.defs[id].f.release(); });
  }
};
/* ---- one factory per riding button ---- */
const AscendFactory = { held: false, press(){ this.held = true; }, release(){ this.held = false; }, ui(){ return { mode: this.held ? 'active' : 'ready', text: '▲' }; } };   // hold: climb (on the ground: take off)
const DescendFactory = { held: false, press(){ this.held = true; }, release(){ this.held = false; }, ui(){ const d = player.ride; return { mode: !d || d.state !== 'ride' ? 'idle' : this.held ? 'active' : 'ready', text: '▼' }; } };   // hold: sink; at the bottom he lands
const BoostFactory = { held: false, press(){ this.held = true; }, release(){ this.held = false; }, ui(){ const d = player.ride; return { mode: !d || d.state !== 'ride' ? 'idle' : this.held ? 'active' : 'ready', text: 'BOOST' }; } };   // hold: faster flight, quicker wing beats
const TakeoffFactory = {   // the FLY button: on the ground = take off; in the air = auto-land (he glides in to a free spot)
  press(){ const d = player.ride, F = PteranodonFactory; if (!d) return; if (d.state === 'walk'){ if ((d.sa === undefined ? 1 : d.sa) >= FlightFactory.minTake) F.takeoff(d); } else if (d.state === 'ride' && F.pickLand(d)){ d.state = 'land'; d.ls = 0; d.st = 0; } },
  ui(){ const d = player.ride; if (!d) return { mode: 'idle', text: 'FLY' }; return d.state === 'walk' ? { mode: 'ready', text: 'FLY' } : d.state === 'ride' ? { mode: 'ready', text: 'LAND' } : { mode: 'busy', text: d.state === 'takeoff' ? 'FLY' : 'LAND' }; }
};
const DismountFactory = { press(){ MountFactory.dismount(); }, ui(){ const d = player.ride; return { mode: d && d.state === 'walk' ? 'ready' : 'busy', text: 'EXIT' }; } };   // only works on the ground
RideButtonFactory.register('fly', TakeoffFactory, { label: 'FLY', color: '#27ae60', spot: 'punch', key: 'g' });
RideButtonFactory.register('up', AscendFactory, { label: '▲', color: '#3498db', spot: 2, key: 'e' });
RideButtonFactory.register('down', DescendFactory, { label: '▼', color: '#8e6bd8', spot: 0, key: 'q' });
RideButtonFactory.register('boost', BoostFactory, { label: 'BOOST', color: '#f39c12', spot: 1, key: 'b' });
RideButtonFactory.register('exit', DismountFactory, { label: 'EXIT', color: '#e74c3c', spot: 'bag', key: 'x' });
RideButtonFactory.init();

/* ============ SEAT FACTORY (reusable: draws a rider SITTING on something. The body is lowered `drop` px and cut off at the hip (`hip` px above the feet), then two bent legs are drawn astride the mount: thigh out and forward, shin hanging down, in his own pants / shoe colours.
   Tune: drop = how deep he sinks into the saddle / hip = where the legs are cut / spread = how far the knees go out / the lengths) ============ */
const SeatFactory = {
  drop: 13, hip: 21, spread: 15, thigh: 11, shin: 12,
  draw(g, ch, cam, W, H, prev){
    const s = GroundFactory.toScreen(ch.x, ch.y, cam, W, H), L = ch.look || {}, ly = s.y - (ch.lift || 0) + this.drop, hy = ly - this.hip + 3;
    g.save(); g.beginPath(); g.rect(s.x - 90, ly - 220, 180, 220 - this.hip); g.clip();   // keep only the body above the hip
    g.translate(0, -(ch.lift || 0) + this.drop); SpeedFactory.drawPlayer(g, ch, cam, W, H, prev); g.restore();
    g.save(); g.lineCap = 'round'; g.lineJoin = 'round';
    g.fillStyle = '#5a3a1e'; g.beginPath(); g.ellipse(s.x, hy + 4, 21, 8, 0, 0, 7); g.fill(); g.strokeStyle = '#c8d2dd'; g.lineWidth = 1.6; g.stroke(); g.fillStyle = '#9a6535'; g.beginPath(); g.ellipse(s.x, hy + 2, 16, 5.5, 0, 0, 7); g.fill();   // the saddle he sits on
    for (const sd of [-1, 1]){   // thigh goes out + forward, the shin hangs down beside the bird's body
      const kx = s.x + sd * this.spread, ky = hy + this.thigh * 0.5, fx = kx + sd * 2, fy = ky + this.shin;
      g.strokeStyle = L.pants || '#2c3e50'; g.lineWidth = 9; g.beginPath(); g.moveTo(s.x + sd * 3, hy); g.lineTo(kx, ky); g.lineTo(fx, fy - 3); g.stroke();
      g.strokeStyle = L.shoe || '#1a1a1a'; g.lineWidth = 8; g.beginPath(); g.moveTo(fx, fy - 2); g.lineTo(fx + sd * 1.5, fy + 2); g.stroke();
    }
    g.restore();
  }
};

/* ============ STAMINA FACTORY (reusable: the little bar at the top of the screen while riding. Green, turns orange then red as the bird tires; pulses when he is nearly out) ============ */
const StaminaFactory = {
  el: null, fill: null,
  init(){
    const w = this.el = document.createElement('div'); w.style.cssText = 'position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 10px);transform:translateX(-50%);width:130px;height:10px;border-radius:6px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.4);z-index:4;display:none;pointer-events:none;overflow:hidden';
    const f = this.fill = document.createElement('div'); f.style.cssText = 'height:100%;width:100%;border-radius:6px'; w.appendChild(f); document.body.appendChild(w);
  },
  update(d){
    if (!this.el) this.init(); this.el.style.display = d ? 'block' : 'none'; if (!d) return;
    const a = Math.max(0, Math.min(1, d.sa === undefined ? 1 : d.sa)); this.fill.style.width = a * 100 + '%';
    this.fill.style.background = a > 0.5 ? '#3ddc6b' : a > 0.22 ? '#f5a623' : '#ff4b3a'; this.el.style.opacity = a < 0.22 && d.state === 'ride' ? 0.55 + 0.45 * Math.sin(performance.now() / 120) : 1;
  }
};

/* ============ FLIGHT FACTORY (reusable: drives a pteranodon that has a rider. Joystick = where he goes, UP / DOWN = height, BOOST = speed, FLY = take off / land.
   He keeps all his own animations (crouch, take-off swings, wing beats, flare and landing); this only decides where he goes. Tune the numbers below.
   speed = flight px/s / boost = speed multiplier / walk = ground px/s / climb = px/s up or down / maxAlt, minAlt = height limits / accel = how fast he reaches the joystick speed) ============ */
const FlightFactory = {
  stamina: 40, rest: 14, minTake: 0.3, speed: 210, boost: 1.7, walk: 80, climb: 95, maxAlt: 300, minAlt: 16, accel: 3,
  drive(d, dt){
    const F = PteranodonFactory, FL = F.fly, TAU = Math.PI * 2, tl = CONFIG.tilt, pa = d.fa;
    const m = (CutsceneFactory.active || player.dead) ? { x: 0, y: 0, mag: 0 } : JoystickFactory.getMoveVector();
    d.flyIn = 99; d.mv = false; if (d.sa === undefined) d.sa = 1; if (d.state !== 'ride') d.bob = 0;
    if (d.state === 'takeoff' || d.state === 'land'){ F.air(d, dt); if (d.state === 'fly'){ d.state = 'ride'; d.vx = d.vy = 0; } return; }
    if (d.state === 'walk'){   // on the ground: he walks where the joystick points; UP takes off
      d.h = d.sp = d.fa = d.fv = d.crouch = 0; d.sa = Math.min(1, d.sa + dt / this.rest);   // resting on the ground refills the stamina
      if (AscendFactory.held && d.sa >= this.minTake){ F.takeoff(d); return; }
      if (m.mag > 0.08){ const vx = m.x * this.walk, vy = m.y * this.walk / tl, px = d.x, py = d.y; d.x += vx * dt; d.y += vy * dt; CollisionFactory.resolve(d); d.ph += Math.hypot(d.x - px, d.y - py) / F.stepLen * Math.PI; d.hd = Math.atan2(vx, vy); d.vx = vx; d.vy = vy; d.mv = true; if (Math.abs(vx) > 1) d.face = vx > 0 ? 1 : -1; } else d.vx = d.vy = 0;
      return;
    }
    const tired = d.sa <= 0, b = BoostFactory.held && !tired ? this.boost : 1, sp = this.speed * b * (tired ? 0.6 : 1), k = Math.min(1, dt * this.accel), dir = tired ? -0.8 : (AscendFactory.held ? 1 : 0) - (DescendFactory.held ? 1 : 0);   // in the air; out of stamina = he sinks on his own and lands
    d.sa = Math.max(0, d.sa - dt / this.stamina * (1 + (b > 1 ? 1.5 : 0) + (dir > 0 ? 0.5 : 0)));
    d.vx += (m.x * sp - d.vx) * k; d.vy += (m.y * sp / tl - d.vy) * k; d.x += d.vx * dt; d.y += d.vy * dt;
    if (Math.hypot(d.vx, d.vy * tl) > 20) d.hd = Math.atan2(d.vx, d.vy);
    d.h = Math.min(this.maxAlt, d.h + dir * this.climb * dt);
    if (dir < 0 && d.h <= this.minAlt){ d.state = 'land'; d.ls = 1; d.st = 0; d.h0 = d.h; return; }   // sank to the bottom: flare and land
    d.h = Math.max(this.minAlt, d.h); d.sp = 1; d.crouch = 0;
    const gaT = tired ? 0.1 : dir > 0 || b > 1 ? 1 : dir < 0 ? 0.15 : 0.55 + 0.4 * m.mag;   // climbing / boosting = hard flapping, sinking = gliding
    d.ga += (gaT - d.ga) * Math.min(1, dt * 2.5); d.fp += dt * TAU * FL.freq * (0.4 + 0.6 * d.ga) * (b > 1 ? 1.4 : 1);
    d.fa += (0.16 + 0.5 * d.ga * Math.sin(d.fp) + (1 - d.ga) * 0.05 * Math.sin(d.t * 1.3) - d.fa) * Math.min(1, dt * 12);
    const raw = Math.max(-14, Math.min(14, (d.fa - pa) / Math.max(dt, 0.001))); d.fv += (raw - d.fv) * Math.min(1, dt * 18);
    d.bob = (-Math.cos(d.fp) * 6 * d.ga + Math.sin(d.t * 1.7) * 3);   // flight bob: rises on each wing down-beat, plus a slow sway
  }
};

/* ============ MOUNT FACTORY (reusable: get on / off a creature, like ARK. Walk up to a pteranodon and a RIDE button appears (he stops and waits for you). While riding, the normal buttons (punch, abilities, bag, arrow, guard...) hide and the RideButtonFactory buttons take their place.
   player.ride = the bird, bird.rider = the player. The rider is drawn on his back, the camera and name tag follow the height. EXIT only works once he has landed. To ride something else, give it x / y / h / state and a drive() like FlightFactory) ============ */
const MountFactory = {
  reach: 120, btn: null, _bp: -1, _hv: 0,
  init(){
    const b = this.btn = document.createElement('button'); b.className = 'abBtn ready'; b.textContent = 'RIDE'; b.style.setProperty('--c', '#27ae60'); document.body.appendChild(b);
    b.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); this.mount(this.nearest()); });
    addEventListener('keydown', e => { if (e.key.toLowerCase() === 'r' && !e.repeat) this.mount(this.nearest()); });
  },
  nearest(){
    if (player.dead || player.ride || DungeonFactory.inside || !GameFactory.running) return null;
    let best = null, bd = this.reach; for (const d of PteranodonFactory.list){ if (d.state !== 'walk' || d.rider) continue; const q = Math.hypot(d.x - player.x, d.y - player.y); if (q < bd){ bd = q; best = d; } } return best;
  },
  mount(d){ if (!d) return; if (!SaddleFactory.has()){ RaidFactory.say('You need a Pteranodon Saddle: craft it at the bench (4 iron ingots + 3 logs)'); return; } if (player.grab) PushFactory.release(player); player.grab = null; d.rider = player; player.ride = d; d.state = 'walk'; d.mv = false; d.vx = d.vy = 0; DustFactory.spawn(d.x, d.y, 6); },
  dismount(){
    const d = player.ride; if (!d || d.state !== 'walk') return;
    player.ride = null; d.rider = null; player.lift = 0; player.x = d.x + 46; player.y = d.y + 8; CollisionFactory.resolve(player);
    d.homeX = d.x; d.homeY = d.y; d.wait = 2; d.flyIn = PteranodonFactory.rnd(PteranodonFactory.fly.every);
  },
  calm(d){   // a free bird near the player stands still and looks at him
    if (d.rider || d.state !== 'walk' || player.dead || player.ride || Math.hypot(d.x - player.x, d.y - player.y) > 150) return false;
    d.mv = false; d.vx = d.vy = 0; d.h = d.sp = d.fa = d.fv = d.crouch = 0; d.flyIn = Math.max(d.flyIn, 2); d.hd = Math.atan2(player.x - d.x, player.y - d.y); return true;
  },
  sync(d){   // the rider goes where the bird goes, sits on his back and faces the way the joystick points
    const Z = PteranodonFactory.size; player.x = d.x; player.y = d.y; player.lift = (d.h || 0) + (d.bob || 0) + 23 * Z - 4.5 * (d.crouch || 0) * Z;
    const m = JoystickFactory.getMoveVector(); if (m.mag > 0.08 && !CutsceneFactory.active) DirectionFactory.resolve(player, m.x, m.y); player.clip = 'idle';
  },
  lead(l){ return player.ride ? { x: l.x, y: l.y - (player.lift || 0) * 0.7 / CONFIG.tilt } : l; },   // camera looks a bit up so the flying bird stays on screen
  tag(on){ if (!player.ride) return; if (on){ this._hv = player.hov; player.hov = (player.lift || 0) / 40; } else player.hov = this._hv; },   // name tag + health bar float over the rider's head
  hideOld(on){ for (const f of [PunchFactory, InventoryFactory, ArrowFactory, GuardFactory, RaidFactory, ChestFactory, DungeonFactory, DialFactory]) if (f && f.btn) f.btn.classList.toggle('rideHide', on); },
  update(dt){
    let d = player.ride;
    if (d && (player.dead || DungeonFactory.inside || PteranodonFactory.list.indexOf(d) < 0)){ d.state = 'walk'; d.h = d.sp = d.fa = d.fv = d.crouch = 0; d.rider = null; player.ride = null; player.lift = 0; d = null; }
    if (d) this.sync(d);
    RideButtonFactory.update(!!d && GameFactory.running); StaminaFactory.update(d); this.hideOld(!!d);

/* ============ PTERANODON SPAWN FACTORY (reusable: scatters rare creatures over the world. The map is cut into big cells; a hash of the cell number decides, the same for every player and every visit with no networking, whether a cell holds one, and where.
   One is created when you come within `near` of its spot and removed again when you are further than `far` (never while someone rides it). No bird spawns near the start, so the old home bird is gone.
   Tune: cell = size of a map cell (px) / chance = share of cells that hold one (lower = rarer) / near, far = spawn / despawn distance / clear = no spawns this close to the start / max = most alive at once / seed = change it for a different world layout) ============ */
const PteranodonSpawnFactory = {
  cell: 2000, chance: 0.3, near: 1300, far: 2800, clear: 700, max: 6, seed: 7, cells: {}, acc: 0,
  hash(i, j, s){ let h = Math.imul(i, 374761393) ^ Math.imul(j, 668265263) ^ Math.imul(s + this.seed, 1013904223); h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return (h >>> 0) / 4294967296; },
  point(i, j){ return { x: (i + 0.15 + 0.7 * this.hash(i, j, 2)) * this.cell, y: (j + 0.15 + 0.7 * this.hash(i, j, 3)) * this.cell }; },
  update(dt){
    if (!GameFactory.running || player.dead) return; this.acc -= dt; if (this.acc > 0) return; this.acc = 0.5;   // checked twice a second
    const P = PteranodonFactory, c = this.cell;
    for (const d of P.list.slice()){ if (!d.cellKey || d.rider) continue; if (Math.hypot(d.x - player.x, d.y - player.y) > this.far){ P.list.splice(P.list.indexOf(d), 1); delete this.cells[d.cellKey]; } }   // far away: gone (it comes back fresh if you return)
    const i0 = Math.floor((player.x - this.near) / c), i1 = Math.floor((player.x + this.near) / c), j0 = Math.floor((player.y - this.near) / c), j1 = Math.floor((player.y + this.near) / c);
    for (let i = i0; i <= i1; i++) for (let j = j0; j <= j1; j++){
      const key = i + ',' + j; if (this.cells[key] || this.hash(i, j, 1) >= this.chance) continue;
      const p = this.point(i, j); if (Math.hypot(p.x, p.y) < this.clear || Math.hypot(p.x - player.x, p.y - player.y) > this.near || P.blocked(p.x, p.y)) continue;
      if (P.list.length >= this.max) return;
      const d = P.make(p.x, p.y); d.cellKey = key; this.cells[key] = d;
    }
  }
};

/* ============ SLOW FACTORY (ability 'slow' = TIME SLOW button of the speed gimmick: for `dur` seconds the WHOLE world (props, debris, grass, dust, other players, effects) runs in slow motion
   while the caster keeps moving at normal speed. Time eases into the slow-down and back out again.
   How it works: frame() reads `scale` (1 = normal) and passes a slowed dt to everything that isn't the caster. Anything new that should freeze / slow (enemies later) just uses the world dt.
   Multiplayer: the caster broadcasts {t:'slow'}; every other client slows itself too (including that client's own player) and the caster stays at normal speed. Tune the numbers right below) ============ */
const SlowFactory = {
  dur: 5, cooldown: 20, charge: 20, slowTo: 0.15, inT: 0.35, outT: 0.7,   // seconds of slow-mo, cooldown, world speed while slowed (0.15 = 15%), ease-in / ease-out time
  on: false, t: 0, owner: null, scale: 1, k: 0, wt: 0, ring: 0, x: 0, y: 0,
  mine(){ return this.owner === NetFactory.id; },
  ready(){ return this.charge >= this.cooldown && !this.on; },
  reset(){ this.on = false; this.t = 0; this.owner = null; this.scale = 1; this.k = 0; this.ring = 0; this.charge = this.cooldown; },
  start(ch){
    if (!AbilityFactory.has(ch, 'slow') || !this.ready()) return false;
    this.begin(NetFactory.id, ch.x, ch.y); this.charge = 0;
    if (GameFactory.room) GameFactory.room.send({ t: 'slow', id: NetFactory.id, x: ch.x, y: ch.y });
    return true;
  },
  begin(owner, x, y){ this.on = true; this.t = 0; this.owner = owner; this.x = x; this.y = y; this.ring = 0.0001; ShakeFactory.flashNow(0.1); },
  onRemote(m){ if (m.id !== NetFactory.id) this.begin(m.id, m.x, m.y); },
  update(dt){   // real dt

    else this.charge = Math.min(this.cooldown, this.charge + dt);

  },
  player(dt){ return this.mine() ? dt : dt * this.scale; },   // the caster keeps normal time; everyone else (incl. you, if someone else cast it) is slowed
  drawScreen(g, W, H, cam){
    if (this.k <= 0 && this.ring <= 0) return;
    g.save();
    if (this.k > 0){
      g.fillStyle = 'rgba(120,150,255,' + (0.07 * this.k) + ')'; g.fillRect(0, 0, W, H);
      const r = Math.hypot(W, H) / 2, v = g.createRadialGradient(W / 2, H / 2, r * 0.35, W / 2, H / 2, r);

      for (let i = 0; i < 2; i++){ const uu = Math.max(0, e - i * 0.12); if (uu <= 0) continue;

/* ============ TORNADO FACTORY (ability 'tornado' = TWIST button of the speed gimmick: he stands still and spins, whipping up a huge tornado around him.
   Everything inside `radius` gets hit every `tick` seconds: breakables take `power` damage (so crates / drums break in a few ticks), loose props get flung outward,

  spawn(x, y, visual){

  wander(tw, dt){

  },

   (same hit rules as the TORNADO: breakables break, loose props are flung, ImpactFactory.extraTargets get onSlam). He can walk while it lasts and the tornadoes follow him (they stay within `leash` of him). Tune the numbers right below) ============ */

  dur: 6, cooldown: 16, charge: 16, count: 3, leash: 300, speed: 90, rMin: 85, rMax: 105,   // seconds / tornadoes / how far they may roam (world px) / their speed / their size range
  reset(ch){ this.charge = this.cooldown; if (ch) ch.storm = null; },
  ready(){ return this.charge >= this.cooldown; },
  start(ch){
    if (!AbilityFactory.has(ch, 'storm') || ch.shield || ch.storm || ch.swim || ch.grab || ch.slam || ch.aim || !this.ready()) return false;
    ch.storm = { t: 0 }; ch.clip = 'swim'; ch.hov = 0; this.charge = 0;
    for (let i = 0; i < this.count; i++) TornadoFactory.roam(ch, this.dur, this.rMin + Math.random() * (this.rMax - this.rMin), this.leash, this.speed);
    if (GameFactory.room) GameFactory.room.send({ t: 'storm', id: NetFactory.id, dur: this.dur });
    return true;
  },
  onRemote(m){   // his 3 tornadoes on my screen: only drawn (no hits, the hits are done on his side)
    const r = RemoteFactory.map[m.id]; if (m.id === NetFactory.id || !r) return;
    for (let i = 0; i < this.count; i++){ TornadoFactory.roam(r.ch, m.dur, this.rMin + Math.random() * (this.rMax - this.rMin), this.leash, this.speed); const tw = TornadoFactory.list[TornadoFactory.list.length - 1]; tw.visual = true; tw.noHit = true; }
  },
  update(ch, dt){
    const st = ch.storm;
    if (!st){ this.charge = Math.min(this.cooldown, this.charge + dt); return; }
    st.t += dt; ch.clip = 'swim';
    const u = Math.max(0, Math.min(1, st.t / 0.4, (this.dur - st.t) / 0.4)); ch.hov = u * u * (3 - 2 * u);   // rises, hovers, lands
    if (st.t >= this.dur){ ch.storm = null; ch.clip = 'idle'; this.charge = 0; }
  }
};
AbilityFactory.register('storm', {
  label: 'STORM', color: '#7ad7ff', key: 'x',
  press(ch){ StormFactory.start(ch); },
  ui(ch){ const F = StormFactory;
    if (ch.storm) return { mode: 'active', text: String(Math.ceil(F.dur - ch.storm.t)), p: 1 - ch.storm.t / F.dur };
    if (ch.swim || ch.shield) return { mode: 'busy', text: 'STORM', p: 1 };
    const p = Math.min(1, F.charge / F.cooldown); return p >= 1 ? { mode: 'ready', text: 'STORM', p } : { mode: 'charging', text: String(Math.ceil(F.cooldown - F.charge)), p }; }
});

/* ============ SHIELD FACTORY (ability 'shield' = SHIELD button of the defense gimmick: a DEFENSIVE ability, it never does damage.
   He drops into a guard (arms crossed, crouched) and a green dome forms round him with him inside. While it lasts he can walk around with the dome following him, and nothing can touch him:
   loose props that touch the dome are pushed back out and bounce off, and nothing that hits from outside reaches him (ShieldFactory.blocks(x, y) and ShieldFactory.deflect(x, y, r)
   are the hooks for zombies / projectiles later: if blocks() is true the hit does nothing). Each deflect makes a ripple on the dome. Cooldown starts when the dome drops. Tune the numbers right below) ============ */
const ShieldFactory = {
  dur: 4, cooldown: 5, charge: 5, radius: 70, pushBack: 260,   // seconds / seconds / world px (dome radius) / how hard props are thrown back off the dome
  pings: [],
  reset(ch){ this.charge = this.cooldown; this.pings.length = 0; if (ch){ ch.shield = null; ch.sh = 0; ch.ga = 0; } },
  ready(){ return this.charge >= this.cooldown; },
  start(ch){
    if (!AbilityFactory.has(ch, 'shield') || ch.shield || ch.swim || ch.storm || ch.grab || ch.slam || ch.aim || !this.ready()) return false;
    ch.shield = { t: 0 }; ch.clip = 'guard'; ch.mv = null; this.charge = 0; ShakeFactory.kick(2, 0.12); return true;
  },
  active(ch){ return !!(ch && ch.shield); },
  // is this world point inside a live dome (of the local player or a remote one)? projectiles, zombies, blasts: ask this before hurting anything at (x, y)
  blocks(x, y, pad = 0){
    for (const c of [player, ...RemoteFactory.list()]) if (c.clip === 'guard' && (c.sh || 0) > 0.5 && Math.hypot(x - c.x, (y - c.y)) <= this.radius + pad) return true;
    return false;
  },
  ping(ch, x, y){ const a = Math.atan2((y - ch.y), (x - ch.x)); this.pings.push({ ch, a, t: 0 }); if (this.pings.length > 14) this.pings.shift(); },
  // for every character (local + remote): ease the guard pose and the dome in and out
  track(ch, dt){
    const on = ch.clip === 'guard' ? 1 : 0;
    ch.ga = (ch.ga || 0) + (on - (ch.ga || 0)) * Math.min(1, dt * 12);
    const sh = ch.sh || 0, rate = on ? 7 : 9; ch.sh = on ? Math.min(1, sh + dt * rate) : Math.max(0, sh - dt * rate);
    if (ch.ga < 0.002) ch.ga = 0;
  },
  update(ch, dt, wdt){
    this.track(ch, dt);
    for (const r of RemoteFactory.list()) this.track(r, wdt === undefined ? dt : wdt);
    for (let i = this.pings.length - 1; i >= 0; i--){ this.pings[i].t += dt; if (this.pings[i].t > 0.45) this.pings.splice(i, 1); }
    const sh = ch.shield;
    if (!sh){ this.charge = Math.min(this.cooldown, this.charge + dt); return; }
    sh.t += dt; ch.clip = 'guard';
    if (sh.t >= this.dur){ ch.shield = null; ch.clip = 'idle'; this.charge = 0; return; }
    if ((ch.sh || 0) < 0.5) return;
    // keep everything out: loose props inside the dome are thrown back out, breakables just bounce the hit off
    for (const o of PropFactory.props.slice()){
      if (o.heldBy || o.breaking) continue;
      const cx = o.x + (o.w || 0) / 2, cy = o.y + (o.d || 0) / 2, d = Math.hypot(cx - ch.x, cy - ch.y), need = this.radius + Math.max(o.w || 0, o.d || 0) * 0.5;
      if (d >= need) continue;
      const nx = d > 0.01 ? (cx - ch.x) / d : 1, ny = d > 0.01 ? (cy - ch.y) / d : 0, push = need - d;
      if (o.movable){ MovableFactory.shove(o, nx * push, ny * push); MovableFactory.impulse(o, nx * this.pushBack, ny * this.pushBack); }
      this.ping(ch, cx, cy); ShakeFactory.kick(1.5, 0.08);
    }
    // anything registered as a target (zombies later) that wanders into the dome is shoved out too
    for (const t of ImpactFactory.extraTargets()){
      if (t.noPush) continue; const cx = t.x + (t.w || 0) / 2, cy = t.y + (t.d || 0) / 2, d = Math.hypot(cx - ch.x, cy - ch.y); if (d >= this.radius) continue;
      const nx = d > 0.01 ? (cx - ch.x) / d : 1, ny = d > 0.01 ? (cy - ch.y) / d : 0; t.x += nx * (this.radius - d); t.y += ny * (this.radius - d); this.ping(ch, cx, cy);
    }
  },
  // dome drawing: the back half goes behind the characters, the front half in front, so he stands truly inside it
  collect(items){
    for (const c of [player, ...RemoteFactory.list(), ...BossFactory.list()]){
      if ((c.sh || 0) <= 0.02 || !ViewFactory.sees(c.x, c.y, this.radius + 40, 140, this.radius + 40)) continue;
      items.push({ y: c.y - 3, f: () => this.draw(ctx, c, false) }, { y: c.y + 3, f: () => this.draw(ctx, c, true) });
    }
  },
  draw(g, c, front){
    const f = c.sh, e = f * f * (3 - 2 * f), t = CONFIG.tilt, R = this.radius * (c.isBoss ? DungeonFactory.bossScale : 1) * (0.6 + 0.4 * e), Hh = R * 1.05, s = GroundFactory.toScreen(c.x, c.y, cam, W, H), now = performance.now() / 1000;
    const left = c.shield ? Math.max(0, (c.isBoss ? BossFactory.shieldDur : this.dur) - c.shield.t) : 9, blink = left < 0.8 ? (0.55 + 0.45 * Math.sin(now * 28)) : 1, al = e * blink;
    g.save(); g.translate(s.x, s.y);
    if (!front){
      // dome body: soft green glass, a little darker toward the rim
      const gr = g.createRadialGradient(0, -Hh * 0.45, R * 0.1, 0, -Hh * 0.35, R * 1.15); gr.addColorStop(0, 'rgba(120,255,170,' + 0.05 * al + ')'); gr.addColorStop(0.75, 'rgba(70,230,130,' + 0.16 * al + ')'); gr.addColorStop(1, 'rgba(40,200,110,' + 0.34 * al + ')');
      g.fillStyle = gr; g.beginPath(); g.ellipse(0, 0, R, Hh, 0, Math.PI, 0); g.ellipse(0, 0, R, R * t, 0, 0, Math.PI); g.closePath(); g.fill();
      g.fillStyle = 'rgba(90,255,160,' + 0.12 * al + ')'; g.beginPath(); g.ellipse(0, 0, R, R * t, 0, 0, 7); g.fill();   // glow on the ground
      g.strokeStyle = 'rgba(150,255,190,' + 0.35 * al + ')'; g.lineWidth = 1.5; g.beginPath(); g.ellipse(0, 0, R, R * t, 0, Math.PI, 0, true); g.stroke();   // back rim on the ground
    } else {
      // hex-ish glass lines: two latitude rings + meridians, slowly turning
      g.strokeStyle = 'rgba(170,255,205,' + 0.28 * al + ')'; g.lineWidth = 1;
      for (const k of [0.38, 0.72]){ const rr = R * Math.sqrt(1 - k * k), yy = -Hh * k; g.beginPath(); g.ellipse(0, yy, rr, rr * t, 0, 0, Math.PI); g.stroke(); }
      for (let i = 0; i < 4; i++){ const ph = now * 0.6 + i * Math.PI / 4, cx = Math.cos(ph); g.beginPath(); g.ellipse(0, 0, Math.abs(cx) * R, Hh, 0, Math.PI, 0); g.stroke(); }
      // shine streak on the upper left
      g.strokeStyle = 'rgba(255,255,255,' + 0.30 * al + ')'; g.lineWidth = 3; g.lineCap = 'round'; g.beginPath(); g.ellipse(0, 0, R * 0.86, Hh * 0.9, 0, Math.PI * 1.12, Math.PI * 1.3); g.stroke();
      // bright outline of the dome + front rim on the ground
      g.save(); g.shadowColor = '#5dff9a'; g.shadowBlur = 12 * al; g.strokeStyle = 'rgba(120,255,175,' + 0.85 * al + ')'; g.lineWidth = 2.6;
      g.beginPath(); g.ellipse(0, 0, R, Hh, 0, Math.PI, 0); g.stroke();
      g.beginPath(); g.ellipse(0, 0, R, R * t, 0, 0, Math.PI); g.stroke(); g.restore();
      // ripples where something was deflected
      for (const p of this.pings){
        if (p.ch !== c) continue; const u = p.t / 0.45, fa = (1 - u) * al, px = Math.cos(p.a) * R, py = Math.sin(p.a) * R * t - Hh * 0.35;
        g.strokeStyle = 'rgba(220,255,230,' + fa + ')'; g.lineWidth = 2.5; g.beginPath(); g.ellipse(px, py, 8 + u * 30, (8 + u * 30) * 0.8, 0, 0, 7); g.stroke();
        g.fillStyle = 'rgba(160,255,200,' + fa * 0.35 + ')'; g.beginPath(); g.ellipse(px, py, 8 + u * 30, (8 + u * 30) * 0.8, 0, 0, 7); g.fill();
      }
    }
    g.restore();
  }
};
AbilityFactory.register('shield', {
  label: 'SHIELD', color: '#58f0a0', key: 'z',
  press(ch){ ShieldFactory.start(ch); },
  ui(ch){ const F = ShieldFactory;
    if (ch.swim || ch.storm) return { mode: 'busy', text: 'SHIELD', p: 1 };
    if (ch.shield) return { mode: 'active', text: String(Math.ceil(F.dur - ch.shield.t)), p: 1 - ch.shield.t / F.dur };
    const p = Math.min(1, F.charge / F.cooldown); return p >= 1 ? { mode: 'ready', text: 'SHIELD', p } : { mode: 'charging', text: String(Math.ceil(F.cooldown - F.charge)), p }; }
});

/* ============ ZOMBIE FACTORY (NOT wired into the game yet: nothing creates, updates or draws a zombie until you call it) ============
   A bloody, rotting zombie with three animations:
     idle    he stands hunched, swaying, arms hanging forward, jaw slack
     walk    SLOW shamble, not a normal walk: stiff lurching steps, one foot dragging, head lolling, BOTH ARMS STRETCHED OUT toward the player as if he's trying to grab him
     attack  one CLAW attack: he rears back (arm up, mouth wide), then rakes his nails down across the air in front of him (three red slash marks), and recovers
   Same kind of object as the other characters: z = ZombieFactory.create(x, y) with { x, y, face (1 / -1), dir ('side' | 'front' | 'back' | diagonals drawn as side), clip, t }.
   Use (later):   ZombieFactory.update(z, dt, moving)   every frame (moving = true makes him walk, otherwise idle; it also runs the attack)
                  ZombieFactory.draw(ctx, z, screenPos)   screenPos = GroundFactory.toScreen(z.x, z.y, cam, W, H), same as the gimmick skins
                  ZombieFactory.attack(z)                 start the claw attack (returns false if he is already attacking)
   Hooks for the wiring later: ZombieFactory.onStrike = (z, claw) => {...} is called once at the moment the nails land; claw = { x, y, r, damage } is the hit circle in world px
   (also ZombieFactory.claw(z) any time). Nothing here damages anything by itself. Tune the numbers right below) ============ */
const ZombieFactory = {
  size: 0.9, reach: 46, damage: 15, onStrike: null,   // body scale / claw reach (world px) / damage handed to onStrike
  t: { windup: 0.5, strike: 0.14, hold: 0.1, recover: 0.45 },   // claw attack timing (seconds)
  walkSpeed: 3.3,   // gait speed: smaller = slower shamble (one full step cycle takes 2π / walkSpeed seconds)
  C: { sk: '#8da889', skHi: '#a8c2a0', skDk: '#5d785a', line: '#1a201b', rag: '#4d4f5e', ragDk: '#34363f', pants: '#3f4552', pantsDk: '#2a2e38',
       blood: '#a1121a', bloodDk: '#5c070c', bloodHi: '#d8262f', bone: '#e9e3cb', nail: '#2b1a16', eye: '#ebe6b6', pupil: '#c0151c', hair: '#2d2a26', teeth: '#d9d2b0', shoe: '#2b2520' },
  create(x, y){ return { x, y, face: 1, dir: 'side', clip: 'idle', t: Math.random() * 3, atk: null, hp: 100 }; },
  total(){ const T = this.t; return T.windup + T.strike + T.hold + T.recover; },
  attack(z){ if (z.atk) return false; z.atk = { t: 0, hit: false }; z.clip = 'attack'; return true; },
  claw(z){   // the hit circle of his claw in world px, in front of him
    const d = z.dir, f = z.face || 1, r = this.reach * 0.6;
    return { x: z.x + (d === 'front' || d === 'back' ? 0 : f * this.reach * 0.65), y: z.y + (d === 'front' ? this.reach * 0.5 : d === 'back' ? -this.reach * 0.5 : 0), r, damage: this.damage };
  },
  update(z, dt, moving){
    if (z.thr) return IceZombieFactory.updateThrow(z, dt, moving);   // ice zombie: snowball throw runs instead
    if (z.thrCd > 0) z.thrCd -= dt;
    z.t += dt;
    if (z.atk){
      const a = z.atk; a.t += dt;
      if (!a.hit && a.t >= this.t.windup + this.t.strike * 0.6){ a.hit = true; if (this.onStrike) this.onStrike(z, this.claw(z)); }
      if (a.t >= this.total()){ z.atk = null; z.clip = moving ? 'walk' : 'idle'; } else z.clip = 'attack';
    } else z.clip = moving ? 'walk' : 'idle';
  },
  // swing: 0 = arms stretched out, 0..1 = arm rearing up and back, 0..-1 = raking down across the front. Only the attack uses it.
  swing(z){
    const a = z.atk; if (!a) return 0; const T = this.t, t = a.t, ease = u => u * u * (3 - 2 * u);
    if (t < T.windup) return ease(t / T.windup);
    if (t < T.windup + T.strike){ const u = (t - T.windup) / T.strike; return 1 - 2 * u * u; }
    if (t < T.windup + T.strike + T.hold) return -1;
    const u = Math.min(1, (t - T.windup - T.strike - T.hold) / T.recover); return -1 + ease(u);
  },
  pose(z){
    const t = z.t, P = { dip: 0, ox: 0, lean: 0.1, head: 0.25, mouth: 0.25, legN: 0, legF: 0, bendN: 0, bendF: 0, aN1: -1.35, aN2: -0.15, aF1: -1.48, aF2: -0.2, sw: 0, ph: 0, walk: false };
    if (z.clip === 'idle'){
      const s = Math.sin(t * 1.5); P.lean = 0.1 + s * 0.03; P.head = 0.25 + Math.sin(t * 0.9) * 0.06; P.mouth = 0.25 + 0.15 * Math.sin(t * 1.1); P.dip = (1 + s) * 0.4;
      P.aN1 = -1.1 + Math.sin(t * 1.7) * 0.08; P.aF1 = -1.2 + Math.sin(t * 1.7 + 1) * 0.08;
    } else if (z.clip === 'walk' || z.clip === 'attack'){
      const ph = t * this.walkSpeed, sw = Math.sin(ph); P.ph = ph; P.walk = z.clip === 'walk';
      P.legN = sw * 0.36; P.legF = -sw * 0.2; P.bendN = Math.max(0, -Math.cos(ph)) * 0.3; P.bendF = Math.max(0, Math.cos(ph)) * 0.12;   // near leg steps, far leg half-drags
      P.dip = sw * sw * 1.6; P.ox = sw * 1.0; P.lean = 0.16 + sw * 0.03; P.head = 0.3 + Math.sin(ph * 0.5) * 0.12; P.mouth = 0.35 + 0.2 * Math.sin(ph * 0.7);
      P.aN1 = -1.35 + Math.sin(ph * 0.5 + 0.4) * 0.09; P.aN2 = -0.15 + Math.sin(ph * 0.5) * 0.07; P.aF1 = -1.5 + Math.sin(ph * 0.5 + 2) * 0.09;
      if (z.clip === 'attack'){ P.legN *= 0.15; P.legF *= 0.15; P.bendN = P.bendF = 0; P.dip = 0; P.ox = 0; }   // he plants his feet to swing
    }
    if (z.atk){
      const s = this.swing(z); P.sw = s;
      if (s >= 0){ P.aN1 = P.aN1 + (-2.75 - P.aN1) * s; P.aN2 = -0.15 - 0.35 * s; P.lean = 0.12 - 0.3 * s; P.head = 0.25 - 0.5 * s; P.mouth = 0.3 + 0.7 * s; P.aF1 = -1.5 - 0.15 * s; }
      else { const k = -s; P.aN1 = -2.75 + (2.75 - 0.45) * k; P.aN2 = -0.5 + 0.6 * k; P.lean = -0.18 + 0.5 * k; P.head = -0.25 + 0.6 * k; P.mouth = 1.0 - 0.45 * k; P.ox = 7 * k; P.aF1 = -1.65 + 0.3 * k; }
    }
    return P;
  },
  // ---------- small drawing helpers ----------
  limb(g, w, len, r, fill){ g.fillStyle = fill; g.beginPath(); g.roundRect(-w / 2, 0, w, len, r); g.fill(); g.strokeStyle = this.C.line; g.lineWidth = 1; g.stroke(); },
  blob(g, x, y, r, col, seed){ g.fillStyle = col; g.beginPath(); for (let i = 0; i < 8; i++){ const a = i / 8 * 6.283, rr = r * (0.65 + 0.45 * Math.abs(Math.sin(seed * 3.1 + i * 1.9))); g[i ? 'lineTo' : 'moveTo'](x + Math.cos(a) * rr, y + Math.sin(a) * rr * 0.8); } g.closePath(); g.fill(); },
  blood(g, x, y, r, seed){ const C = this.C; this.blob(g, x, y, r, C.bloodDk, seed); this.blob(g, x + 0.6, y - 0.4, r * 0.7, C.blood, seed + 2); this.blob(g, x - r * 0.15, y - r * 0.2, r * 0.3, C.bloodHi, seed + 5); },
  drip(g, x, y, len, w){ const C = this.C; g.fillStyle = C.blood; g.beginPath(); g.roundRect(x - w / 2, y, w, len, w / 2); g.fill(); g.fillStyle = C.bloodHi; g.beginPath(); g.arc(x, y + len, w * 0.7, 0, 7); g.fill(); },
  hand(g, y, claw, n){   // a hand hanging along +y with `n` fingers, each with a long dark nail; `claw` (0..1) grows and reddens the nails
    const C = this.C; g.fillStyle = C.sk; g.beginPath(); g.roundRect(-4.5, y, 9, 7, 3); g.fill(); g.strokeStyle = C.line; g.lineWidth = 1; g.stroke();
    for (let i = 0; i < n; i++){
      const a = (i - (n - 1) / 2) * 0.3, L = 6 + claw * 1, N = 5 + claw * 5;
      g.save(); g.translate((i - (n - 1) / 2) * 2.4, y + 6); g.rotate(a);
      g.strokeStyle = C.sk; g.lineWidth = 2; g.lineCap = 'round'; g.beginPath(); g.moveTo(0, 0); g.lineTo(0, L); g.stroke();
      g.strokeStyle = C.line; g.lineWidth = 1; g.beginPath(); g.moveTo(1.4, 1); g.lineTo(1.4, L); g.stroke();
      g.fillStyle = C.nail; g.beginPath(); g.moveTo(-1.2, L - 1); g.lineTo(1.2, L - 1); g.lineTo(0.2, L + N); g.closePath(); g.fill();
      g.fillStyle = C.blood; g.beginPath(); g.moveTo(-0.8, L + N * 0.5); g.lineTo(0.9, L + N * 0.5); g.lineTo(0.2, L + N); g.closePath(); g.fill();
      g.restore();
    }
    this.blood(g, 0, y + 3, 2.6, 4);
  },
  arm(g, sx, sy, a1, a2, claw, near, seed){   // side-view arm: torn sleeve, gashed upper arm, bare forearm with bone showing, clawed hand
    const C = this.C; g.save(); g.translate(sx, sy); g.rotate(a1);
    this.limb(g, 8, 12.5, 4, C.sk);
    g.fillStyle = C.rag; g.beginPath(); g.moveTo(-4.4, -1); g.lineTo(4.4, -1); g.lineTo(4.4, 5); g.lineTo(2.2, 7); g.lineTo(0.8, 4.6); g.lineTo(-1, 7.2); g.lineTo(-2.6, 5); g.lineTo(-4.4, 6.4); g.closePath(); g.fill(); g.strokeStyle = C.line; g.lineWidth = 1; g.stroke();
    if (near) this.blood(g, 1, 9, 2.6, seed);
    g.translate(0, 12); g.rotate(a2);
    this.limb(g, 7, 12.5, 3.5, near ? C.sk : C.skDk);
    if (near){ this.blood(g, 0, 4, 3.1, seed + 1); g.fillStyle = C.bone; g.fillRect(-1, 2.6, 2, 3.4); }
    this.drip(g, 1.5, 9, 4, 1.6);
    this.hand(g, 11.5, claw, near ? 4 : 3);
    g.restore();
  },
  leg(g, hx, hy, ang, bend, near, seed){
    const C = this.C; g.save(); g.translate(hx, hy); g.rotate(ang);
    this.limb(g, 9.5, 13.5, 4, C.pants);
    if (near){ this.blood(g, 1, 6, 3, seed); g.strokeStyle = C.line; g.lineWidth = 0.8; g.beginPath(); g.moveTo(-3, 3); g.lineTo(0, 7); g.lineTo(-2, 11); g.stroke(); }
    g.translate(0, 13); g.rotate(bend);

/* ---- ICE ZOMBIE: 2nd attack = SNOWBALL THROW (animation + timing + range check; the flying ball itself and the AI that picks the attack come in the next steps)
   z.thr = { t, rel } runs: scoop (he crouches and grabs snow) -> wind (arm goes up and back, snowball in hand) -> throw (arm whips forward, ball leaves the hand) -> recover.

   IceZombieFactory.canThrow(z, dist) says whether he may throw now (player inside throwMin..throwMax, not busy, cooldown over). Pure vector pose, goes through ZombieCache like the rest. ---- */

  throwTotal(){ const T = this.th; return T.scoop + T.wind + T.throw + T.recover; },
  releaseAt(){ const T = this.th; return T.scoop + T.wind + T.throw * 0.55; },
  canThrow(z, dist){ return !z.dead && !z.atk && !z.thr && !(z.frz > 0) && !(z.thrCd > 0) && dist >= this.throwMin && dist <= this.throwMax; },
  throwOrigin(z){ const d = z.dir, f = z.face || 1; return { x: z.x + (d === 'front' || d === 'back' ? 0 : f * 30), y: z.y + (d === 'front' ? 14 : d === 'back' ? -14 : 0), h: 62 }; },
  holding(z){ return !!(z.thr && !z.thr.rel && z.thr.t >= this.th.scoop * 0.7); },   // is the snowball in his hand right now
  ball(g, x, y){ const C = this.C; g.fillStyle = '#f4fbff'; g.beginPath(); g.arc(x, y, 5.6, 0, 7); g.fill(); g.fillStyle = 'rgba(120,180,225,.55)'; g.beginPath(); g.arc(x + 1.6, y + 1.6, 4, 0, 7); g.fill(); g.strokeStyle = C.line; g.lineWidth = 1; g.beginPath(); g.arc(x, y, 5.6, 0, 7); g.stroke(); },
  pose(z){
    if (!z.thr) return ZombieFactory.pose.call(this, z);

/* ---- ICE ZOMBIE: PREDICTION AIM (same idea as the strength gimmick's missile). While he winds up he watches the target, measures how fast it is moving (smoothed) and aims where it will BE when the ball lands (target + speed x lead time).
   The aim LOCKS at the end of the wind-up, so a player who changes direction after that can still dodge. IceZombieFactory.throwAttack(z, target) starts the throw at a target (any character object with x / y). ---- */
Object.assign(IceZombieFactory, {
  ballSpeed: 300, leadMax: 1.0, speedCap: 420,   // ball speed (px/s) / the most lead time he will predict (s) / ignore target speeds above this (px/s)
  throwAttack(z, target){
    if (z.atk || z.thr) return false;
    const tx = target ? target.x : z.x + (z.face || 1) * 200, ty = target ? target.y : z.y;
    z.thr = { t: 0, rel: false, tg: target || null, px: tx, py: ty, vx: 0, vy: 0, ax: tx, ay: ty, lock: false }; z.clip = 'throw'; return true;
  },
  aimStep(z, a, dt){   // measure the target's speed and work out the predicted landing spot (a.ax, a.ay)
    const T = a.tg; if (!T) return;
    if (dt > 0){ const k = 1 - Math.exp(-dt * 10), vx = (T.x - a.px) / dt, vy = (T.y - a.py) / dt; if (Math.hypot(vx, vy) < this.speedCap){ a.vx += (vx - a.vx) * k; a.vy += (vy - a.vy) * k; } }

  },
  updateThrow(z, dt, moving){
    z.t += dt; const a = z.thr; a.t += dt; const TH = this.th;
    if (!a.lock){ if (a.tg){ this.aimStep(z, a, dt); z.face = a.ax >= z.x ? 1 : -1; } if (a.t >= TH.scoop + TH.wind) a.lock = true; }   // he turns to the aim; at the end of the wind-up it is locked
    if (!a.rel && a.t >= this.releaseAt()){ a.rel = true; if (this.onThrow && !a.net) this.onThrow(z, Object.assign(this.throwOrigin(z), { tx: a.ax, ty: a.ay })); }

  }
});

/* ============ SNOWBALL FACTORY (the flying snowball of the ICE ZOMBIE: it arcs from his hand to the (predicted) landing spot, hurts a player it passes close to, and bursts into snow where it lands or hits)
   launch(x, y, h, tx, ty, owner)   x / y / h = where it leaves the hand (h = height above the ground), tx / ty = landing spot. IceZombieFactory.onThrow calls it at the release moment.
   Damage: only the HOST decides hits (same rule as the zombie claw): your own player is hurt directly, other players get a damage message. Shields / armor work as usual because it goes through HealthFactory.
   Cheap by design: balls are drawn with the same single circle as the held one, snow bursts are a few tiny dots, and both lists are capped. Tune the numbers right below) ============ */
const SnowballFactory = {
  damage: 12, hitR: 18, hitH: 46, arc: 70, maxBalls: 12, maxBursts: 8,   // damage / how close (world px) and how low (px above ground) counts as a hit / peak arc height / caps
  balls: [], bursts: [],
  reset(){ this.balls.length = 0; this.bursts.length = 0; },
  launch(x, y, h, tx, ty, owner){
    if (this.balls.length >= this.maxBalls) this.balls.shift();
    const d = Math.hypot(tx - x, ty - y);
    this.balls.push({ x0: x, y0: y, h0: h, tx, ty, x, y, z: h, t: 0, T: Math.max(0.3, d / IceZombieFactory.ballSpeed), arc: Math.min(this.arc, 16 + d * 0.12), done: false, owner });
  },
  burst(x, y, z, n){
    if (this.bursts.length >= this.maxBursts) this.bursts.shift();
    const parts = [], R = Math.random; for (let i = 0; i < n; i++){ const a = R() * 6.283, sp = 40 + R() * 90; parts.push({ x: 0, y: 0, z: z + 2, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp * 0.6, vz: 60 + R() * 130, r: 1.3 + R() * 2 }); }
    this.bursts.push({ x, y, t: 0, life: 0.6, parts });
  },
  update(dt, host, players){
    dt = Math.min(dt, 0.05);
    for (const b of this.balls){
      b.t += dt; const u = Math.min(1, b.t / b.T), px = b.x, py = b.y;
      b.x = b.x0 + (b.tx - b.x0) * u; b.y = b.y0 + (b.ty - b.y0) * u; b.z = b.h0 * (1 - u) + b.arc * Math.sin(Math.PI * u);
      const wl = IglooFactory.cut(px, py, b.x, b.y); if (wl && b.z < IglooFactory.H){ b.x = wl.x; b.y = wl.y; b.done = true; }   // the dome is solid: the ball smashes on the wall
      if (host && !b.done && b.z < this.hitH){
        for (const p of players){
          if (Math.hypot(p.ch.x - b.x, p.ch.y - b.y) > this.hitR) continue;
          if (p.ch === player) HealthFactory.hurt(player, this.damage, b.x0, b.y0); else HealthFactory.send(p.id, this.damage, b.x0, b.y0);
          b.done = true; break;
        }
      }
      if (host && !b.done && b.z < this.hitH && (VillagerSystem.ballHit(b) || BodyguardFactory.ballHit(b))) b.done = true;
      if (u >= 1) b.done = true;
      if (b.done) this.burst(b.x, b.y, Math.max(0, b.z), 10);
    }
    this.balls = this.balls.filter(b => !b.done);
    for (const s of this.bursts){ s.t += dt; for (const p of s.parts){ p.vz -= 520 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.z = Math.max(0, p.z + p.vz * dt); if (p.z === 0){ p.vx *= 0.8; p.vy *= 0.8; p.vz = 0; } } }
    this.bursts = this.bursts.filter(s => s.t < s.life);
  },
  collect(items, cam, W, H){
    for (const b of this.balls) if (ViewFactory.sees(b.x, b.y, 40, 40, 200)) items.push({ y: b.y, f: () => this.drawBall(ctx, b, cam, W, H) });
    for (const s of this.bursts) if (ViewFactory.sees(s.x, s.y, 60, 60, 200)) items.push({ y: s.y + 1, f: () => this.drawBurst(ctx, s, cam, W, H) });
  },
  drawBall(g, b, cam, W, H){
    const s = GroundFactory.toScreen(b.x, b.y, cam, W, H), k = Math.max(0.4, 1 - b.z / 160);
    g.fillStyle = 'rgba(0,0,0,' + (0.28 * k) + ')'; g.beginPath(); g.ellipse(s.x, s.y, 6 * k, 6 * k * CONFIG.tilt, 0, 0, 7); g.fill();
    IceZombieFactory.ball(g, s.x, s.y - b.z - 5);
  },
  drawBurst(g, sn, cam, W, H){
    const s = GroundFactory.toScreen(sn.x, sn.y, cam, W, H), a = 1 - sn.t / sn.life;
    g.fillStyle = 'rgba(245,252,255,' + a + ')';
    for (const p of sn.parts){ const q = GroundFactory.toScreen(sn.x + p.x, sn.y + p.y, cam, W, H); g.beginPath(); g.arc(q.x, q.y - p.z, p.r, 0, 7); g.fill(); }
  }
};
IceZombieFactory.onThrow = (z, org) => {   // the ball leaves his hand at the release moment (only the host runs the throw AI, so only the host gets here)
  SnowballFactory.launch(org.x, org.y, org.h, org.tx, org.ty, z);
  if (GameFactory.room) GameFactory.room.send({ t: 'zthrow', id: NetFactory.id, x: org.x, y: org.y, h: org.h, tx: org.tx, ty: org.ty });   // everybody else sees the same ball (visual only: the host decides who is hit)
};
SnowballFactory.onRemote = function(m){ if (m.id === NetFactory.id || m.id !== ZombieSystem.hostId()) return; for (const k of ['x', 'y', 'h', 'tx', 'ty']) if (!isFinite(m[k])) return; this.launch(m.x, m.y, m.h, m.tx, m.ty, null); };

/* ============ ZOMBIE SPRITE CACHE (each zombie pose is drawn ONCE into a small offscreen canvas, then only drawImage'd. Animation is stepped (walk 48 steps, idle 24, attack every 0.04s).
   Set `on: false` to go back to live vector drawing. New sprites are capped per frame so spawning never hitches.) ============ */
const ZombieCache = {
  on: true, map: new Map(), dpr: 0, made: 0, cap: 100, maxNew: 3, W: 180, H: 170, ox: 90, oy: 135,
  draw(g, z, s){
    const Z = z.ice ? IceZombieFactory : ZombieFactory, k = CONFIG.dprNow;   // ice-biome zombies use their own body
    if (!this.on || !k){ Z.draw(g, z, s); return; }
    if (Math.abs(k - this.dpr) > 0.01){ this.map.clear(); this.dpr = k; }
    const walking = z.clip === 'walk' || z.clip === 'attack', per = walking ? 4 * Math.PI / Z.walkSpeed : 2 * Math.PI / 1.5, n = walking ? 48 : 24;
    const qi = Math.floor((((z.t % per) + per) % per) / per * n), qa = z.atk ? Math.floor(z.atk.t / 0.04) : z.thr ? Math.floor(z.thr.t / 0.04) : -1;
    const key = z.dir + '|' + (z.face || 1) + '|' + z.clip + '|' + ((z.id || 1) % 6) + '|' + qi + '|' + qa + '|' + (z.ice ? 1 : 0);
    let e = this.map.get(key);
    if (e){ this.map.delete(key); this.map.set(key, e); }
    else {
      if (this.made >= this.maxNew){ Z.draw(g, z, s); return; }
      this.made++;
      const c = document.createElement('canvas'); c.width = Math.ceil(this.W * k); c.height = Math.ceil(this.H * k);
      const cg = c.getContext('2d'); cg.scale(k, k);
      const fake = { dir: z.dir, face: z.face, clip: z.clip, id: z.id, t: qi * per / n, atk: z.atk ? Object.assign({}, z.atk, { t: qa * 0.04 }) : null, thr: z.thr ? { t: qa * 0.04, rel: qa * 0.04 >= Z.releaseAt() } : null };
      Z.draw(cg, fake, { x: this.ox, y: this.oy });
      e = c; this.map.set(key, e);
      if (this.map.size > this.cap) this.map.delete(this.map.keys().next().value);
    }
    g.drawImage(e, s.x - this.ox, s.y - this.oy, this.W, this.H);
  }
};

/* ============ ZOMBIE SYSTEM (chunk spawning + AI for the ZombieFactory zombies) ============
   CHUNKS   The world is cut into squares of `chunk` px. Whenever a chunk comes within `loadR` chunks of ANY player it gets loaded ONCE: 1 or 2 zombies appear at random spots in it
            (never closer than `minSpawn` to a player, never inside a crate). A chunk never spawns again, dead zombies do not respawn. At most `maxAlive` zombies alive at once.
   AI       Each zombie walks toward the CLOSEST living player (any player in the room) inside `aggro`, and when he is within `atkRange` he claws (the ZombieFactory slash). The claw
            hurts every player inside its circle (a shield dome blocks it). Zombies far from every player (`freeze`) just stand still to save work.
   HEALTH   `hp` (20). Every hit flinches him (short stagger + knockback, the swing is interrupted). At 0 he falls onto his back, lies there and fades away. He is hurt by everything the
            other abilities already report to ImpactFactory (slam, missile, tornado, storm, spin) and by the speed gimmick's dash.
   MULTIPLAYER  One player (the lowest id in the room) runs the zombies and sends `zs` snapshots 10x/s; everybody else just shows them smoothly. Hits from other players are sent to him as `zdmg`.
            If he leaves, the next lowest id takes over from the last snapshot. Tune the numbers right below) ============ */
/* ============ ZOMBIE LOOT (what a zombie drops when he dies. Same DropFactory as trees: walk over it to pick it up.
   table = list of { kind, qty: [min, max], chance 0..1 }. Add a line for more loot, lower `chance` for a rarer one. The roll comes from the zombie's id so every player in a room sees the same drop) ============ */
const ZombieLoot = {
  table: [{ kind: 'veins', qty: [1, 1], chance: 0.15 }],   // rare: about 1 zombie in 7
  seed(z){ let h = 7; for (const c of String(z.id)) h = Math.imul(h ^ c.charCodeAt(0), 16777619) >>> 0; return h; },
  roll(z){
    if (GameFactory.room){ if (!ZombieSystem.isHost()) return; }   // in a room only the host rolls it, and the drop hook sends that ONE drop to everybody
    else if (Math.hypot(z.x - player.x, z.y - player.y) > 1200) return;   // far away: nobody is there to pick it up
    let h = this.seed(z); const next = () => { h = Math.imul(h ^ (h >>> 15), 2246822507) >>> 0; h = Math.imul(h ^ (h >>> 13), 3266489909) >>> 0; h ^= h >>> 16; return (h >>> 0) / 4294967296; };
    for (const d of this.table){ if (next() < d.chance){ const n = d.qty[0] + Math.floor(next() * (d.qty[1] - d.qty[0] + 1)); for (let k = 0; k < n; k++) DropFactory.add(d.kind, z.x, z.y, 1); } }
  }
};

const ZombieSystem = {
  chunk: 640, loadR: 1, maxAlive: 20, cullR: 2600, emptyChance: 0.2, twoChance: 0.35, minSpawn: 520, freeze: 1900,   // world px / chunks around a player that load / zombies / spawn no closer than this to a player / stand still beyond this
  aggro: 260, wanderR: 140, wanderSpeed: 0.45, speed: 48, atkRange: 42, atkGap: 0.55, hp: 20, flinchT: 0.35, deadT: 4.5, sendEvery: 0.05,   // invisible chase radius: a zombie only chases you inside it (once chasing he keeps on until you are 35% farther) / how far from his spot he strolls / stroll speed vs chase speed / walk px/s / claw starts at this distance / rest after a swing / health / stagger s / lie s / snapshot gap
  list: [], spawned: new Set(), fails: {}, fresh: [], nid: 0, spT: 0, sendT: 0, fullT: 0,
  reset(){ SnowballFactory.reset(); VillagerSystem.reset(); BodyguardFactory.reset(); this.list.length = 0; this.spawned.clear(); this.fails = {}; this.fresh.length = 0; this.spT = 0; },
  hostId(){ let a = [NetFactory.id, ...Object.keys(RemoteFactory.map)]; if (GameFactory.ids && performance.now() - GameFactory.t0 < 4000) a = a.concat(GameFactory.ids); return a.sort()[0]; },   // first seconds: the room list decides, so nobody claims it before the others show up
  isHost(){ return !GameFactory.room || this.hostId() === NetFactory.id; },
  players(){ const a = [{ id: NetFactory.id, ch: player }]; for (const id in RemoteFactory.map) a.push({ id, ch: RemoteFactory.map[id].ch }); return a.filter(p => !p.ch.dead && !(p.ch.hp <= 0)); },
  make(id, x, y){
    const R = Math.random, z = ZombieFactory.create(x, y);
    Object.assign(z, { id, ice: BiomeFactory.isIce(x, y), hp: this.hp, max: this.hp, spd: 0.85 + R() * 0.3, cd: 0.5 + R() * 0.8, flinch: 0, vx: 0, vy: 0, tx: x, ty: y, mv: false, face: R() < 0.5 ? 1 : -1, dcd: 0 });
    this.list.push(z); return z;
  },
  blocked(x, y){ if (IglooFactory.covers(x, y)) return true; for (const b of CollisionFactory.boxes) if (x > b.x - 20 && x < b.x + b.w + 20 && y > b.y - 20 && y < b.y + b.h + 20) return true; return false; },
  spawnChunk(cx, cy, key, pl){
    const R = Math.random, n = R() < this.emptyChance ? 0 : R() < this.twoChance ? 2 : 1, pts = [];   // some chunks stay empty, most get 1, fewer get 2
    for (let k = 0; k < n; k++) for (let tr = 0; tr < 10; tr++){
      const x = (cx + 0.1 + 0.8 * R()) * this.chunk, y = (cy + 0.1 + 0.8 * R()) * this.chunk;
      if (pl.some(p => Math.hypot(p.ch.x - x, p.ch.y - y) < this.minSpawn) || this.blocked(x, y) || pts.some(q => Math.hypot(q.x - x, q.y - y) < 40)) continue;
      pts.push({ x, y }); break;
    }
    if (!pts.length && n > 0){ this.fails[key] = (this.fails[key] || 0) + 1; if (this.fails[key] < 6) return false; }   // a chunk that stays too close to the players is retried a few times, then skipped
    this.spawned.add(key); this.fresh.push(key);
    for (const q of pts) this.make(NetFactory.id + '.' + (++this.nid), q.x, q.y);
    return true;
  },
  spawnTick(dt, pl){
    this.spT -= dt; if (this.spT > 0 || !pl.length) return; this.spT = 0.35;   // one chunk per tick, so spawns trickle in instead of arriving all at once
    for (const z of this.list) if (!z.dead && !pl.some(p => Math.hypot(p.ch.x - z.x, p.ch.y - z.y) < this.cullR)) z.gone = true;   // zombies left far behind are removed so they don't fill the cap
    if (this.list.filter(z => !z.dead && !z.gone).length >= this.maxAlive) return;
    for (const p of pl){
      const cx = Math.floor(p.ch.x / this.chunk), cy = Math.floor(p.ch.y / this.chunk);
      for (let j = -this.loadR; j <= this.loadR; j++) for (let i = -this.loadR; i <= this.loadR; i++){
        const key = (cx + i) + ',' + (cy + j); if (this.spawned.has(key)) continue;
        if (this.spawnChunk(cx + i, cy + j, key, pl)) return;
      }
    }
  },
  // ---- damage ----
  targets(){   // hooked into ImpactFactory.extraTargets: every slam / missile / tornado / storm / spin sweep reaches the zombies, and the shield dome pushes them out
    const out = [];
    for (const z of this.list){
      if (z.dead) continue;
      if (!z.tg){
        z.tg = { z, w: 0, d: 0, onSlam: (pw, fx, fy, w) => { const amt = HealthFactory.amount(w && w.kind, w || {}, z); if (amt > 0) ZombieSystem.damage(z, amt, fx, fy); } };
        Object.defineProperty(z.tg, 'x', { get: () => z.x, set: v => { z.x = v; }, enumerable: true });
        Object.defineProperty(z.tg, 'y', { get: () => z.y, set: v => { z.y = v; }, enumerable: true });
      }
      out.push(z.tg);
    }
    return out;
  },
  damage(z, amt, fx, fy){   // anybody calls this; the host applies it, everyone else sends it to him
    if (z.dead || amt <= 0) return;
    if (this.isHost()) this.hit(z, amt, fx, fy);
    else if (GameFactory.room){ GameFactory.room.send({ t: 'zdmg', id: NetFactory.id, zid: z.id, amt, x: fx, y: fy }); z.flinch = this.flinchT; const dx = z.x - fx, dy = z.y - fy, d = Math.hypot(dx, dy) || 1, kb = amt >= 8 ? 14 : 6; z.x += dx / d * kb; z.y += dy / d * kb; }   // joiner: react at once, the host's snapshot confirms the HP a moment later
  },
  hit(z, amt, fx, fy){   // host only
    if (z.dead) return;
    z.hp = Math.max(0, z.hp - amt); z.hitFrom = { x: fx, y: fy }; HealthFactory.float(z, amt);
    const dx = z.x - fx, dy = z.y - fy, d = Math.hypot(dx, dy) || 1, kb = amt >= 8 ? 200 : 90;
    z.vx = dx / d * kb; z.vy = dy / d * kb; z.atk = null; z.thr = null; z.flinch = this.flinchT; z.fallDir = z.x >= fx ? 1 : -1;
    if (z.hp <= 0){ z.hp = 0; z.dead = { t: 0 }; z.flinch = 0; z.clip = 'idle'; }
  },
  strike(z, claw){   // the moment his nails land (host only: everybody else's copy is created with the hit already used)
    if (!this.isHost()) return;
    VillagerSystem.claw(z, claw); BodyguardFactory.claw(z, claw);
    for (const p of this.players()){
      if (Math.hypot(p.ch.x - claw.x, p.ch.y - claw.y) > claw.r + 14 || IglooFactory.blocks(z.x, z.y, p.ch.x, p.ch.y)) continue;
      if (p.ch === player) HealthFactory.hurt(player, claw.damage, z.x, z.y); else HealthFactory.send(p.id, claw.damage, z.x, z.y);
    }
  },
  // ---- per frame ----
  update(dt){
    const host = this.isHost(), pl = this.players();
    SnowballFactory.update(dt, host, pl); VillagerSystem.update(dt, host, pl); BodyguardFactory.update(dt, host, pl);
    if (host) this.spawnTick(dt, pl);
    for (const z of this.list) this.step(z, dt, host, pl);
    if (host && this.list.some(z => z.gone)) this.list = this.list.filter(z => !z.gone);
    if (player.sprint) for (const z of this.list){ if (z.dead || z.dcd > 0 || Math.hypot(z.x - player.x, z.y - player.y) > 30) continue; z.dcd = 0.6; this.damage(z, HealthFactory.dmg.dash.tick, player.x, player.y); }   // the dash barges into them
    if (host) this.send(dt);
  },
  step(z, dt, host, pl){
    if (z.dcd > 0) z.dcd -= dt;
    if (z.dead){ if (!z.lootDone){ z.lootDone = true; ZombieLoot.roll(z); } z.dead.t += dt; if (z.dead.t > 0.55 && !z.dead.dust){ z.dead.dust = true; DustFactory.spawn(z.x, z.y, 4); } if (z.dead.t > this.deadT + (host ? 0 : 2)) z.gone = true; return; }
    if (!host){
      const k = Math.min(1, dt * 12); z.x += (z.tx - z.x) * k; z.y += (z.ty - z.y) * k; if (z.flinch > 0) z.flinch -= dt;
      ZombieFactory.update(z, dt, z.mv); return;
    }
    if (z.frz > 0){ z.frz -= dt; z.atk = null; z.thr = null; z.vx = z.vy = 0; ZombieFactory.update(z, dt, false); return; }   // frozen solid
    let near = 1e9, tg = null; for (const p of pl){ const d = Math.hypot(p.ch.x - z.x, p.ch.y - z.y); if (d < near && !IglooFactory.blocks(z.x, z.y, p.ch.x, p.ch.y)){ near = d; tg = p.ch; } }   // an igloo wall in between = he can't see you
    for (const v of VillagerSystem.list){ if (v.dead || v.gone || v.inside) continue; const d = Math.hypot(v.x - z.x, v.y - z.y); if (d < near && !IglooFactory.blocks(z.x, z.y, v.x, v.y)){ near = d; tg = v; } }
    for (const v of BodyguardFactory.list){ if (v.dead || v.gone || v.hp <= 0) continue; const d = Math.hypot(v.x - z.x, v.y - z.y); if (d < near && !IglooFactory.blocks(z.x, z.y, v.x, v.y)){ near = d; tg = v; } }   // the bodyguard is prey too (and fights back)   // villagers outside an igloo are prey too
    if (near > this.freeze) return;   // nobody around: stand still, cost nothing
    if (z.flinch > 0){   // staggered: knocked back a little, can't do anything
      z.flinch -= dt; z.x += z.vx * dt; z.y += z.vy * dt; const f = Math.exp(-7 * dt); z.vx *= f; z.vy *= f; CollisionFactory.resolve(z);
      ZombieFactory.update(z, dt, false); return;
    }
    if (z.cd > 0) z.cd -= dt;
    let moving = false;
    const ag = z.ice ? this.aggro * 1.3 : this.aggro, chase = !!tg && (near < ag || (z.chasing && near < ag * 1.35));   // ice zombies notice you from farther (their throw reaches that far) z.chasing = chase;   // nobody inside the invisible radius = he just wanders
    if (!chase && !z.atk && !z.thr){
      if (z.hx === undefined){ z.hx = z.x; z.hy = z.y; z.wp = true; z.wt = Math.random() * 3; }   // his home spot
      z.wt -= dt;
      if (z.wp){ if (z.wt <= 0){ const a = Math.random() * 6.283, r = 30 + Math.random() * this.wanderR; z.wx = z.hx + Math.cos(a) * r; z.wy = z.hy + Math.sin(a) * r * 0.7; z.wp = false; z.wt = 6; } }   // standing still, then picks a spot
      else {
        const dx = z.wx - z.x, dy = z.wy - z.y, d = Math.hypot(dx, dy * CONFIG.tilt);
        if (d < 4 || z.wt <= 0){ z.wp = true; z.wt = 1.5 + Math.random() * 3.5; }
        else { const sp = this.speed * this.wanderSpeed * z.spd; z.face = dx >= 0 ? 1 : -1; z.dir = Math.abs(dy) > Math.abs(dx) * 1.3 ? (dy > 0 ? 'front' : 'back') : 'side';
          z.x += dx / d * sp * dt; z.y += dy * CONFIG.tilt / d * sp * dt / CONFIG.tilt; moving = true; CollisionFactory.resolve(z); }
      }
    }
    if (chase && !z.atk && !z.thr){
      const dx = tg.x - z.x, dy = tg.y - z.y;
      z.face = dx >= 0 ? 1 : -1; z.dir = Math.abs(dy) > Math.abs(dx) * 1.3 ? (dy > 0 ? 'front' : 'back') : 'side';
      if (z.ice && z.cd <= 0 && IceZombieFactory.canThrow(z, near)){   // ice zombie: you are in throwing range -> he picks up snow and throws it (then claws once you get close)
        IceZombieFactory.throwAttack(z, tg); z.cd = IceZombieFactory.throwTotal() + this.atkGap;
      } else if (near > this.atkRange * 0.85){
        const st = IglooFactory.steer(z.x, z.y, tg.x, tg.y), vx = st.x - z.x, vy = (st.y - z.y) * CONFIG.tilt, n = Math.hypot(vx, vy) || 1, sp = this.speed * z.spd * AcidFactory.slowOf(z);   // same screen-speed trick as the player: vertical world speed is scaled up by the tilt
        z.x += vx / n * sp * dt; z.y += vy / n * sp * dt / CONFIG.tilt; moving = true; CollisionFactory.resolve(z);
      } else if (z.cd <= 0){ ZombieFactory.attack(z); z.cd = ZombieFactory.total() + this.atkGap; }
    }
    IglooFactory.repel(z);   // fire: they can never get into an igloo
    for (const o of this.list){   // don't stack on each other
      if (o === z || o.dead) continue; const ox = z.x - o.x, oy = z.y - o.y, d = Math.hypot(ox, oy);

/* ============ IGLOO FACTORY (a BIG igloo that only appears deep inside the ICE biome, very rarely and very far apart: at most one per 3200px map cell, chance `chance`, placed from a hash of the cell so every player and the host see the same ones)
   Walk in through the arched door at the front (the walls are solid, only the door is open). While you stand INSIDE, the roof fades to see-through so you can see the room (floor, rug, fire); step out and it turns solid again.
   Drawn as TWO pre-baked sprites (flat vector, made once, no texture overlays): BACK (snow mound, inner wall, floor, rug, fire pit) and FRONT (the dome shell with ice blocks and a door hole). Each frame is only two drawImage calls + a tiny flame, so it costs almost nothing.

  },
  repel(o){   // the FIRE inside keeps zombies out: anything pushed into an igloo is moved back out to just beyond the walls
