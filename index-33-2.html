<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gimmick Prototype</title>
<style>
html,body{margin:0;height:100%;background:#1b2a17;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%}
#joyZone{position:fixed;left:0;bottom:0;width:60%;height:60%;touch-action:none}
.abBtn{position:fixed;right:20px;bottom:30px;width:54px;height:54px;padding:0;border-radius:50%;--c:#e74c3c;--p:0deg;background:rgba(110,110,110,.55);border:2px solid rgba(255,255,255,.35);color:rgba(255,255,255,.7);font:700 11px system-ui,sans-serif;text-shadow:0 1px 2px rgba(0,0,0,.55);display:none;touch-action:none;user-select:none;-webkit-user-select:none;z-index:5;transition:transform .12s,box-shadow .12s}
.isDead .abBtn{opacity:.25;pointer-events:none}
.abBtn.charging{background:conic-gradient(var(--c) var(--p),rgba(90,90,90,.6) 0)}
.abBtn.ready{background:var(--c);border-color:#fff;color:#fff;box-shadow:0 0 14px var(--c);animation:abPulse 1s ease-in-out infinite}
.abBtn.active{background:#f39c12;border-color:#fff;color:#fff;transform:scale(.92);box-shadow:0 0 14px #f39c12}
.abBtn.busy{transform:scale(.9);opacity:.6}
.rideHide{display:none!important}
@keyframes abPulse{50%{transform:scale(1.06)}}
#joyBase{position:fixed;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.15);border:2px solid rgba(255,255,255,.4);display:none;pointer-events:none}
#joyStick{position:fixed;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.55);display:none;pointer-events:none}
#hud{position:fixed;left:10px;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:4;pointer-events:none;color:#fff;font:800 15px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:1.5px;background:rgba(0,0,0,.6);padding:7px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.18);text-shadow:0 1px 3px rgba(0,0,0,.8);white-space:pre;line-height:1.35}#hud b{color:#ffd76a;font-weight:800;margin-right:4px}#hud span{display:inline-block;min-width:4.2ch;text-align:right}#hud i{font-style:normal;opacity:.35;margin:0 8px}
#menu{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:radial-gradient(#26401f,#0b1409);color:#fff;font-family:system-ui,sans-serif;padding:env(safe-area-inset-top,0px) 12px env(safe-area-inset-bottom,0px)}
.mcard{width:min(380px,100%);max-height:100%;overflow:auto;text-align:center}
.mcard h1{margin:0 0 4px;font-size:34px;letter-spacing:.04em}.mcard h2{margin:0 0 12px}.mcard p.sub{margin:0 0 22px;opacity:.6;font-size:13px}
.mcard label{display:block;text-align:left;font-size:12px;opacity:.7;margin:12px 0 4px}
.mcard input,.mcard select{width:100%;box-sizing:border-box;padding:11px;border-radius:10px;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.35);color:#fff;font-size:16px}
.mcard input.code{text-align:center;letter-spacing:.35em;text-transform:uppercase;font-size:22px}
.mbtn{display:block;width:100%;box-sizing:border-box;margin:10px 0 0;padding:13px;border-radius:12px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#fff;font-size:16px;cursor:pointer}
.mbtn.pri{background:#4f8a3a;border-color:#7cc45a}.mbtn:disabled{opacity:.4}
.mlink{background:none;border:0;color:#9fd18a;margin-top:14px;font-size:14px;cursor:pointer}
.mlist button{display:block;width:100%;text-align:left;margin:5px 0;padding:10px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.07);color:#fff;font-size:14px}
.mmsg{min-height:18px;margin-top:10px;font-size:13px;color:#ffb4a0}.mnote{font-size:12px;opacity:.6;margin-top:10px}
.mplayers div{padding:8px 10px;margin:4px 0;border-radius:8px;background:rgba(255,255,255,.08);text-align:left;display:flex;align-items:center;gap:8px}
.mplayers i{width:12px;height:12px;border-radius:50%;display:inline-block}
.bigcode{font-size:38px;letter-spacing:.3em;margin:6px 0;color:#ffd76a}
.gwrap{position:relative}
.gtrack{display:flex;gap:4%;padding:4px 8%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.gtrack::-webkit-scrollbar{display:none}
.gslide{flex:0 0 84%;scroll-snap-align:center;box-sizing:border-box;padding:14px 12px 12px;border-radius:18px;border:2px solid var(--gc);background:rgba(255,255,255,.09);text-align:center;box-shadow:0 0 22px -8px var(--gc)}
.gslide canvas{width:160px;height:200px;background:radial-gradient(circle at 50% 78%,rgba(255,255,255,.2),transparent 62%)}
.gslide b{display:block;font-size:20px;margin-top:2px;color:var(--gc)}.gslide small{display:block;opacity:.75;margin:4px 0 10px;font-size:12.5px;line-height:1.35}
.gst{display:flex;align-items:center;gap:6px;font-size:11px;opacity:.9;margin:4px 0}.gst span{width:50px;text-align:left}.gst div{flex:1;height:7px;border-radius:4px;background:rgba(255,255,255,.15)}.gst i{display:block;height:100%;border-radius:4px}
.garr{position:absolute;top:42%;z-index:2;width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(0,0,0,.5);color:#fff;font-size:20px;line-height:1;cursor:pointer;transition:opacity .2s}
#gl{left:-4px}#gr{right:-4px}.garr.off{opacity:0;pointer-events:none}
.gdots{display:flex;justify-content:center;gap:8px;margin:10px 0 2px}.gdots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.3);transition:.2s}.gdots i.on{background:#fff;width:22px;border-radius:4px}
body.noKeyHints button[data-key]::after{display:none}
button[data-key]::after{content:attr(data-key);position:absolute;top:-7px;right:-7px;min-width:17px;height:17px;padding:0 4px;border-radius:6px;background:#111;color:#ffd76a;border:1px solid rgba(255,255,255,.55);font:800 10px/15px system-ui,sans-serif;text-align:center;box-sizing:border-box;pointer-events:none;text-shadow:none;letter-spacing:0}
</style></head><body>
<div id="menu"></div><div id="ver" style="position:fixed;top:calc(env(safe-area-inset-top,0px) + 6px);left:0;right:0;text-align:center;z-index:51;font:600 11px system-ui,sans-serif;color:rgba(255,255,255,.55);pointer-events:none">v1.2.1</div><canvas id="c" style="display:none"></canvas><div id="joyZone" style="display:none"></div><div id="joyBase"></div><div id="joyStick"></div>
<div id="hud" style="display:none"><b>X</b><span id="cx">0</span><i>|</i><b>Z</b><span id="cz">0</span></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* ============ CONFIG (tune everything here) ============ */
/* ZERO START (runs ONCE per browser, before anything loads): wipes every saved game value (bag, dial, unlocked gimmicks, XP / level, armor, stations) so everyone begins from absolute zero. Change the key's version to wipe again. */
try { const ZK = 'gimmick.zeroStart.v1'; if (!localStorage.getItem(ZK)){ Object.keys(localStorage).filter(k => k.indexOf('gimmick.') === 0).forEach(k => localStorage.removeItem(k)); localStorage.setItem(ZK, '1'); } } catch (e) {}
const CONFIG = {
  tilt: 0.42,           // GroundFactory: 1 = top-down (2D), lower = more 3D. 0.42 = tilted down, see more of the back
  grassTile: 128,       // TextureFactory: tile size in px
  walkSpeed: 110, runSpeed: 230,   // px/sec
  runThreshold: 0.75,   // joystick push (0..1) above which he runs
  joystickMaxRadius: 32,           // the joystick's size: how far (px) you drag for full speed. The base circle and knob scale with it (was 55). Smaller = less thumb travel
  invertX: false,       // set true for the "reversed" joystick X from the cricket game
  charScale: 1,
  startLevel: 0,        // RaidFactory: everyone starts at level 0 (XpFactory levels you up)
  viewW: 571, viewH: 271,   // FAIR VIEW: every screen shows at least this much of the world (in game units). Big PC screens zoom IN to match a phone instead of seeing more of the map. Raise both to show more for everyone, lower to zoom in for everyone
  maxPixels: 4.5e6,     // most pixels the canvas may draw per frame (about 1080p). Bigger screens draw fewer pixels and are stretched up - the biggest speed-up on PC
  fpsCap: 60,           // frame limit (144 Hz monitors would otherwise work twice as hard for nothing)
  minFps: 30,           // if the game runs slower than this, the resolution steps down by itself (and back up when there is room)
  glow: false,          // shadowBlur glows are very slow on canvas: off = same shapes, no soft halo
  maxDpr: 3,            // cap on canvas pixel density (phones report 3+; 2 looks the same but draws ~45% fewer pixels)
  supabase: { url: 'https://coirjxgwejtcojpzllqk.supabase.co', key: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNvaXJqeGd3ZWp0Y29qcHpsbHFrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA3MzY0MDAsImV4cCI6MjEwNjMxMjQwMH0.VM4Pn_7tXwMaSgPuOGfOSXtSk-mJ52o8Ay-a7BHaqPc' },   // paste your Supabase Project URL + anon (public) key. Empty = local test mode (same browser, two tabs)
  ws: { url: 'wss://gimmick-game.onrender.com' },
  sendRate: 12,                     // position messages per second
  maxPlayers: 4
};

/* ============ TEXTURE FACTORY ============ */
const TextureFactory = {
  grass(seed = 7){
    const S = CONFIG.grassTile, c = document.createElement('canvas'); c.width = c.height = S;
    const g = c.getContext('2d');
    let s = seed; const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
    g.fillStyle = '#4f8a3a'; g.fillRect(0, 0, S, S);
    const wrap = (fn) => { for (const ox of [-S, 0, S]) for (const oy of [-S, 0, S]) fn(ox, oy); };
    // soft patches
    for (let i = 0; i < 8; i++){
      const x = r()*S, y = r()*S, rad = 14 + r()*22, col = r() < .5 ? 'rgba(90,150,60,.22)' : 'rgba(40,90,35,.22)';
      wrap((ox, oy) => { g.fillStyle = col; g.beginPath(); g.arc(x+ox, y+oy, rad, 0, 7); g.fill(); });
    }
    // blades
    const cols = ['#3d7a30', '#5fa044', '#6fb650', '#356b2b', '#7cc45a'];
    for (let i = 0; i < 150; i++){
      const x = r()*S, y = r()*S, h = 4 + r()*6, lean = (r()-.5)*4;
      g.strokeStyle = cols[(r()*cols.length)|0]; g.lineWidth = 1.2;
      wrap((ox, oy) => { g.beginPath(); g.moveTo(x+ox, y+oy); g.lineTo(x+ox+lean, y+oy-h); g.stroke(); });
    }
    // tiny flowers / dirt specks
    for (let i = 0; i < 10; i++){
      const x = r()*S, y = r()*S;
      wrap((ox, oy) => { g.fillStyle = r() < .5 ? '#e8e2a0' : '#7a5c3a'; g.fillRect(x+ox, y+oy, 2, 2); });
    }
    return c;
  }
};

/* ============ BIOME FACTORY (big world regions. at(x,y) = 0..1 how much ICE there is at that spot, worked out ONLY from the world position (no random, no messages), so every player and the host see exactly the same biome.
   Biomes are huge: smooth noise with ~3200px blobs, and a guaranteed ice land (centre iceX/iceY). Nothing within safeR of the start is ever ice. Tune the numbers right below) ============ */
const BiomeFactory = {   // (tree sprites are baked at the end of the file, once)
  testSpawn: true, scale: 3200, from: 0.66, to: 0.76, safeR: 1800, safeFull: 3200, iceX: 8000, iceY: 0, iceR: 6100, iceEdge: 800, seed: 7,   // the big snow region: a circle of radius iceR around (iceX, iceY); its soft border is iceEdge wide. Its nearest edge is still ~1900 from spawn, so the start stays grass
 
  h(i, j){ let h = Math.imul(i, 374761393) ^ Math.imul(j, 668265263) ^ Math.imul(this.seed, 1013904223); h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return (h >>> 0) / 4294967296; },
  sm(a, b, x){ const t = Math.max(0, Math.min(1, (x - a) / (b - a))); return t * t * (3 - 2 * t); },
  noise(x, y){ const X = x / this.scale, Y = y / this.scale, i = Math.floor(X), j = Math.floor(Y), u = X - i, v = Y - j, su = u * u * (3 - 2 * u), sv = v * v * (3 - 2 * v);
    const a = this.h(i, j), b = this.h(i + 1, j), c = this.h(i, j + 1), d = this.h(i + 1, j + 1); return (a + (b - a) * su) + ((c + (d - c) * su) - (a + (b - a) * su)) * sv; },
  at(x, y){ const n = this.sm(this.from, this.to, this.noise(x, y)) * this.sm(this.safeR, this.safeFull, Math.hypot(x, y)), g = this.sm(this.iceR, this.iceR - this.iceEdge, Math.hypot(x - this.iceX, y - this.iceY)); return Math.max(n, g); },
  isIce(x, y){ return this.at(x, y) > 0.5; },
  iceTile(S){   // rough snow ground: one big seamless tile, soft low-contrast drifts + fine grain, nothing that stands out (so no visible tiles)
    const c = document.createElement('canvas'); c.width = c.height = S; const g = c.getContext('2d'); let sd = 91; const r = () => { sd = (sd * 16807) % 2147483647; return sd / 2147483647; };
    g.fillStyle = '#dfeaf1'; g.fillRect(0, 0, S, S);
    const wrap = f => { for (const ox of [-S, 0, S]) for (const oy of [-S, 0, S]) f(ox, oy); };
    for (let i = 0; i < 70; i++){ const x = r() * S, y = r() * S, w = 40 + r() * 110, h = 14 + r() * 40, a = r() < 0.5 ? 'rgba(255,255,255,.22)' : 'rgba(150,185,210,.16)'; wrap((ox, oy) => { g.fillStyle = a; g.beginPath(); g.ellipse(x + ox, y + oy, w, h, 0, 0, 7); g.fill(); }); }   // wide soft drifts
    for (let i = 0; i < 900; i++){ const x = r() * S, y = r() * S, w = 1 + r() * 3.2, a = r() < 0.5 ? 'rgba(255,255,255,.35)' : 'rgba(120,160,190,.22)'; wrap((ox, oy) => { g.fillStyle = a; g.fillRect(x + ox, y + oy, w, 1 + r() * 1.6); }); }   // rough grain
    return c;
  }
};

/* ============ GROUND FACTORY (tilted plane) ============ */
const GroundFactory = {
  pattern: null, tw: 128, th: 54, haze: null,
  // the tile is squashed ONCE here (same squash as the tilted view), so each frame the ground is only a plain shifted tile fill instead of a stretched, resampled one
  init(ctx){
    const S = CONFIG.grassTile, sh = Math.max(1, Math.round(S * CONFIG.tilt)), c = document.createElement('canvas'); c.width = S; c.height = sh;
    const g = c.getContext('2d'); g.imageSmoothingQuality = 'high'; g.drawImage(TextureFactory.grass(), 0, 0, S, S, 0, 0, S, sh);
    this.pattern = ctx.createPattern(c, 'repeat'); this.gSrc = c; this.tw = S; this.th = sh;
    const ic = document.createElement('canvas'); const IS = 512, ish = Math.max(1, Math.round(IS * CONFIG.tilt)); ic.width = IS; ic.height = ish; const ig = ic.getContext('2d'); ig.imageSmoothingQuality = 'high'; ig.drawImage(BiomeFactory.iceTile(IS), 0, 0, IS, IS, 0, 0, IS, ish); this.icePat = ctx.createPattern(ic, 'repeat');
    const xc = document.createElement('canvas'); xc.width = IS + 1; xc.height = ish + 1; const xg = xc.getContext('2d'); for (let a = 0; a < 2; a++) for (let b = 0; b < 2; b++) xg.drawImage(ic, a * IS, b * ish); this.icePat = ctx.createPattern(ic, 'repeat'); this.iSrc = ic; this.iceCv = null; this.itw = IS; this.ith = ish;
    const fin = bm => { this.iceCv = bm; };   // the snow tile has ~8000 drawing commands: as a canvas the browser re-runs ALL of them for every copy. As a bitmap it is one finished picture
    if (window.createImageBitmap) createImageBitmap(xc).then(fin).catch(() => { this.iceCv = xc; }); else this.iceCv = xc;
    const hz = document.createElement('canvas'); hz.width = 1; hz.height = 128; const hg = hz.getContext('2d'), gr = hg.createLinearGradient(0, 0, 0, 128);   // far-edge haze, baked once
    gr.addColorStop(0, 'rgba(150,190,150,.35)'); gr.addColorStop(1, 'rgba(150,190,150,0)'); hg.fillStyle = gr; hg.fillRect(0, 0, 1, 128); this.haze = hz;
  },
  // world (x,y) -> screen. y is squashed by tilt = pseudo 3D
  toScreen(x, y, cam, W, H){ return { x: x - cam.x + W/2, y: (y - cam.y) * CONFIG.tilt + H/2 }; },
  // The ground tiles are re-baked at the REAL screen pixel size (whenever the resolution changes). Then every frame the ground is a pure 1:1 pixel copy at a whole-pixel offset: no scaling, no smoothing, no resampling. A scaled pattern fill (what it did before) has to resample every single pixel of the screen, which on this phone cost ~60ms.
  dev(){
    const sc = CONFIG.dprNow; if (this.dsc === sc && this.gD) return; this.dsc = sc; this.gc = null; this.hzC = null;
    const mk = (src, ww, wh) => { const P = Math.max(1, Math.round(ww * sc)), Q = Math.max(1, Math.round(wh * sc)), c = document.createElement('canvas'); c.width = P; c.height = Q; const g = c.getContext('2d'); g.imageSmoothingQuality = 'high'; g.drawImage(src, 0, 0, src.width, src.height, 0, 0, P, Q); return { pat: ctx.createPattern(c, 'repeat'), P, Q }; };
    this.gD = mk(this.gSrc, this.tw, this.th); this.iD = mk(this.iSrc, this.itw, this.ith);
  },
  // GROUND CACHE: the ground is painted ONCE into a canvas bigger than the screen (a margin all around). Each frame is then a single 1:1 copy of the part you see. When you walk, the cache slides and only the thin new strip at the edge is painted (grass or snow or the soft patchy blend). Everything already painted is reused, nothing is repainted.
  tile(g, t, c, rx, ry, rw, rh){ g.save(); g.translate(c.wc / 2 - c.px, c.hc / 2 - c.py); g.fillStyle = t.pat; g.fillRect(rx - (c.wc / 2 - c.px), ry - (c.hc / 2 - c.py), rw, rh); g.restore(); },
  paint(c, rx, ry, rw, rh){
    const sc = c.sc, tl = CONFIG.tilt, g = c.g, wc = c.wc, hc = c.hc, cs = 120, cw = cs * sc, ch = cs * tl * sc, wx0 = c.px - wc / 2, wy0 = c.py - hc / 2;
    const i0 = Math.floor((wx0 + rx) / cw) - 1, i1 = Math.floor((wx0 + rx + rw) / cw) + 1, j0 = Math.floor((wy0 + ry) / ch) - 1, j1 = Math.floor((wy0 + ry + rh) / ch) + 1, mw = i1 - i0 + 1, mh = j1 - j0 + 1;
    if (!this.ac || this.ac.size > 8000) this.ac = new Map();
    if (!this.mk || this.mk.width !== mw || this.mk.height !== mh){ this.mk = document.createElement('canvas'); this.mk.width = mw; this.mk.height = mh; this.mkg = this.mk.getContext('2d'); this.mid = this.mkg.createImageData(mw, mh); }
    const d = this.mid.data; let lo = 2, hi = -1;
    for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++){
      const key = i * 100003 + j; let a = this.ac.get(key); if (a === undefined){ a = BiomeFactory.at((i + 0.5) * cs, (j + 0.5) * cs); this.ac.set(key, a); }
      if (a < lo) lo = a; if (a > hi) hi = a;
      const o = ((j - j0) * mw + (i - i0)) * 4; d[o] = d[o + 1] = d[o + 2] = 255; d[o + 3] = a < 0.03 ? 0 : Math.min(1, a * 1.1) * 255;
    }
    g.save(); g.beginPath(); g.rect(rx, ry, rw, rh); g.clip();
    if (lo > 0.985) this.tile(g, this.iD, c, rx, ry, rw, rh);   // all snow here
    else {
      this.tile(g, this.gD, c, rx, ry, rw, rh);   // grass
      if (hi > 0.02){   // patchy: lay the snow over it through a soft mask
        this.mkg.putImageData(this.mid, 0, 0); const tg = c.tg;
        tg.save(); tg.beginPath(); tg.rect(rx, ry, rw, rh); tg.clip(); tg.globalCompositeOperation = 'copy'; this.tile(tg, this.iD, c, rx, ry, rw, rh);
        tg.globalCompositeOperation = 'destination-in'; tg.imageSmoothingEnabled = true; tg.drawImage(this.mk, 0, 0, mw, mh, i0 * cw - wx0, j0 * ch - wy0, mw * cw, mh * ch); tg.restore();
        g.drawImage(c.tmp, rx, ry, rw, rh, rx, ry, rw, rh);
      }
    }
    g.restore();
  },
  draw(ctx, cam, W, H){
    this.dev(); const sc = CONFIG.dprNow, tl = CONFIG.tilt, cv = ctx.canvas, ws = cv.width, hs = cv.height;
    const camPx = Math.round(cam.x * sc), camPy = Math.round(cam.y * tl * sc), Mx = Math.max(160, Math.round(ws * 0.3)), My = Math.max(160, Math.round(hs * 0.2)), wc = ws + 2 * Mx, hc = hs + 2 * My;
    let c = this.gc;
    const mkc = () => { const e = document.createElement('canvas'); e.width = wc; e.height = hc; return e; };
    if (!c || c.wc !== wc || c.hc !== hc){
      c = this.gc = { wc, hc, sc, Mx, My, px: camPx, py: camPy, cv: mkc(), cv2: mkc(), tmp: mkc() }; c.g = c.cv.getContext('2d'); c.g2 = c.cv2.getContext('2d'); c.tg = c.tmp.getContext('2d');
      this.paint(c, 0, 0, wc, hc);
    } else {
      const dx = camPx - c.px, dy = camPy - c.py;
      if (Math.abs(dx) > Mx - 12 || Math.abs(dy) > My - 12){ c.px = camPx; c.py = camPy; this.paint(c, 0, 0, wc, hc); }   // jumped far (teleport / big dash): repaint everything once
      else if (Math.abs(dx) >= 96 || Math.abs(dy) >= 96){   // slide the finished picture and paint only the new strip
        const g2 = c.g2; g2.save(); g2.globalCompositeOperation = 'copy'; g2.drawImage(c.cv, -dx, -dy); g2.restore();
        [c.cv, c.cv2] = [c.cv2, c.cv]; [c.g, c.g2] = [c.g2, c.g]; c.px = camPx; c.py = camPy;
        if (dx > 0) this.paint(c, wc - dx, 0, dx, hc); else if (dx < 0) this.paint(c, 0, 0, -dx, hc);
        if (dy > 0) this.paint(c, 0, hc - dy, wc, dy); else if (dy < 0) this.paint(c, 0, 0, wc, -dy);
      }
    }
    ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(c.cv, camPx - c.px + Mx, camPy - c.py + My, ws, hs, 0, 0, ws, hs);   // the whole ground = ONE 1:1 copy
    const hh = Math.round(hs * 0.45);
    if (!this.hzC || this.hzC.width !== ws || this.hzC.height !== hh){ this.hzC = document.createElement('canvas'); this.hzC.width = ws; this.hzC.height = hh; const hg = this.hzC.getContext('2d'), gr = hg.createLinearGradient(0, 0, 0, hh); gr.addColorStop(0, 'rgba(150,190,150,.35)'); gr.addColorStop(1, 'rgba(150,190,150,0)'); hg.fillStyle = gr; hg.fillRect(0, 0, ws, hh); }
    ctx.drawImage(this.hzC, 0, 0);   // distance haze at the far (top) edge, baked once
    ctx.restore();
  }
};

/* ============ VIEW FACTORY (render distance: what's on screen, in world coords. Things outside it are not drawn and far-away effects are not spawned.
   sees(x, y, padSide, padTop, padBottom) - the bottom pad is big because tall objects poke up into view from below the screen edge) ============ */
const ViewFactory = {
  x0: -1e9, x1: 1e9, y0: -1e9, y1: 1e9,
  set(cam, W, H){ const hy = H / (2 * CONFIG.tilt); this.x0 = cam.x - W / 2; this.x1 = cam.x + W / 2; this.y0 = cam.y - hy; this.y1 = cam.y + hy; },
  sees(x, y, px = 90, pt = 60, pb = 260){ return x >= this.x0 - px && x <= this.x1 + px && y >= this.y0 - pt && y <= this.y1 + pb; }
};

/* ============ COLLISION FACTORY ============ */
const CollisionFactory = {
  boxes: [],   // {x,y,w,h,owner} footprints in world space (owner = the object this box belongs to, if any)
  radius: 12,  // character foot radius
  debug: false,
  add(o){ const b = { x: o.x, y: o.y, w: o.w, h: o.d, owner: o }; this.boxes.push(b); return b; },   // o = {x,y,w,d}
  remove(b){ const i = this.boxes.indexOf(b); if (i >= 0) this.boxes.splice(i, 1); },
  // move circle out of boxes; boxes that belong to a movable object take a share of the push (heavier = smaller share)
  resolve(pos){
    for (const b of this.boxes){
      if (b.owner && b.owner.heldBy) continue;   // the thing he's holding is part of him
      const cx = Math.max(b.x, Math.min(pos.x, b.x + b.w));
      const cy = Math.max(b.y, Math.min(pos.y, b.y + b.h));
      let dx = pos.x - cx, dy = pos.y - cy, d = Math.hypot(dx, dy), nx, ny, depth;
      if (d >= this.radius) continue;
      if (d === 0){ // centre inside box: push out the shortest way
        const l = pos.x - b.x, r = b.x + b.w - pos.x, tp = pos.y - b.y, bt = b.y + b.h - pos.y, m = Math.min(l, r, tp, bt);
        nx = m === l ? -1 : m === r ? 1 : 0; ny = m === tp ? -1 : m === bt ? 1 : 0; if (nx && ny) ny = 0; depth = m + this.radius;
      } else { nx = dx / d; ny = dy / d; depth = this.radius - d; }
      const mv = b.owner && b.owner.movable ? b.owner : null;
      if (mv && !mv.breaking){
        const k = mv.pushK;                                   // share of the push the object absorbs
        MovableFactory.shove(mv, -nx * depth * k, -ny * depth * k);
        pos.x += nx * depth * (1 - k); pos.y += ny * depth * (1 - k);
      } else { pos.x += nx * depth; pos.y += ny * depth; }
    }
  }
};

/* ============ PROP FACTORY (crates / drums with collision, pseudo-3D boxes) ============ */
const PropFactory = {
  props: [],
  types: {   // per-type defaults: size, weight, how much of a push the object absorbs, and which break preset it uses
    crate: { w: 46, d: 34, h: 44, mass: 1.4, pushK: 0.6, preset: 'crate' },
    drum:  { w: 30, d: 30, h: 46, mass: 0.8, pushK: 0.8, preset: 'drum' }
  },
  spawn(type, x, y, opts = {}){
    const T = this.types[type], p = Object.assign({ type, x, y, w: T.w, d: T.d, h: T.h }, opts);
    p.box = CollisionFactory.add(p);
    MovableFactory.make(p, { mass: T.mass, pushK: T.pushK });
    BreakFactory.register(p, T.preset);
    p.destroy = () => this.remove(p);
    this.props.push(p); return p;
  },
  remove(p){ const i = this.props.indexOf(p); if (i >= 0) this.props.splice(i, 1); CollisionFactory.remove(p.box); MovableFactory.forget(p); },
  crate(x, y, w, d, h){ return this.spawn('crate', x, y, w ? { w, d, h } : {}); },
  drum(x, y){ return this.spawn('drum', x, y); },
  drawBody(ctx, p, cam, W, H){
    const t = CONFIG.tilt, s = GroundFactory.toScreen(p.x, p.y, cam, W, H), dh = p.d * t, top = s.y - p.h, fy = s.y + dh - p.h;
    // long soft cast shadow on the ground
    ctx.fillStyle = 'rgba(0,0,0,.28)'; ctx.beginPath();
    ctx.moveTo(s.x, s.y + dh); ctx.lineTo(s.x + p.w, s.y + dh); ctx.lineTo(s.x + p.w + p.h*0.7, s.y + dh*0.35); ctx.lineTo(s.x + p.h*0.7, s.y + dh*0.35); ctx.closePath(); ctx.fill();
    if (p.type === 'crate'){
      const g = ctx.createLinearGradient(0, fy, 0, s.y + dh); g.addColorStop(0, '#9a6630'); g.addColorStop(1, '#6b4320');
      ctx.fillStyle = g; ctx.fillRect(s.x, fy, p.w, p.h);                                   // front face
      ctx.fillStyle = '#c4894a'; ctx.fillRect(s.x, top, p.w, dh);                            // top face (lit)
      ctx.strokeStyle = 'rgba(60,35,15,.55)'; ctx.lineWidth = 1.5;
      for (let i = 1; i < 4; i++){ const y = fy + p.h*i/4; ctx.beginPath(); ctx.moveTo(s.x, y); ctx.lineTo(s.x+p.w, y); ctx.stroke(); }   // planks
      for (let i = 1; i < 3; i++){ const y = top + dh*i/3; ctx.beginPath(); ctx.moveTo(s.x, y); ctx.lineTo(s.x+p.w, y); ctx.stroke(); }
      ctx.strokeStyle = '#4a2c12'; ctx.lineWidth = 3;                                         // frame beams
      ctx.strokeRect(s.x+1.5, fy+1.5, p.w-3, p.h-3);
      ctx.beginPath(); ctx.moveTo(s.x+3, fy+3); ctx.lineTo(s.x+p.w-3, s.y+dh-3); ctx.moveTo(s.x+p.w-3, fy+3); ctx.lineTo(s.x+3, s.y+dh-3); ctx.stroke();
      ctx.strokeRect(s.x, top, p.w, dh);
      ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.fillRect(s.x, fy, p.w, 3);                // edge highlight
      ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fillRect(s.x, s.y + dh - 5, p.w, 5);            // dark base
    } else {
      const cx = s.x + p.w/2, cy = s.y + dh/2, r = 15, ry = r*t;
      const g = ctx.createLinearGradient(cx - r, 0, cx + r, 0); g.addColorStop(0, '#a4523c'); g.addColorStop(.45, '#c1664d'); g.addColorStop(1, '#5a271c');
      ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(cx, cy, r, ry, 0, 0, Math.PI); ctx.lineTo(cx - r, cy - p.h); ctx.lineTo(cx + r, cy - p.h); ctx.lineTo(cx + r, cy); ctx.fill();
      ctx.fillStyle = 'rgba(0,0,0,.35)';
      for (const f of [.3, .7]){ ctx.beginPath(); ctx.ellipse(cx, cy - p.h*f, r, ry, 0, 0, Math.PI); ctx.lineTo(cx - r, cy - p.h*f - 3); ctx.ellipse(cx, cy - p.h*f - 3, r, ry, 0, Math.PI, 0, true); ctx.fill(); }
      ctx.fillStyle = '#d9825f'; ctx.beginPath(); ctx.ellipse(cx, cy - p.h, r, ry, 0, 0, 7); ctx.fill();
      ctx.fillStyle = '#3a1a12'; ctx.beginPath(); ctx.ellipse(cx, cy - p.h, r*0.7, ry*0.7, 0, 0, 7); ctx.fill();
    }
  },
  draw(ctx, p, cam, W, H){   // body + shake / swell while breaking + cracks + hit flash
    const t = CONFIG.tilt, s = GroundFactory.toScreen(p.x, p.y, cam, W, H), dh = p.d * t;
    const br = p.breaking ? p.breaking.t / p.breaking.dur : 0;
    const sh = p.breaking ? Math.sin(p.breaking.t * 120) * (2 + 4 * br) : (p.shakeT > 0 ? Math.sin(p.shakeT * 90) * 3 * (p.shakeT / 0.25) : 0);
    ctx.save(); ctx.translate(sh, 0);
    if (br > 0){ const bx = s.x + p.w / 2, by = s.y + dh; ctx.translate(bx, by); ctx.scale(1 + br * 0.12, 1 - br * 0.07); ctx.translate(-bx, -by); }
    this.drawBody(ctx, p, cam, W, H);
    const fx = p.type === 'drum' ? s.x + p.w / 2 - 15 : s.x, fw = p.type === 'drum' ? 30 : p.w, fh = p.h, fy = (p.type === 'drum' ? s.y + dh / 2 : s.y + dh) - p.h;
    BreakFactory.drawCracks(ctx, p, fx, fy, fw, fh);
    const fl = Math.max(p.flashT > 0 ? p.flashT / 0.12 * 0.4 : 0, br > 0.7 ? (br - 0.7) / 0.3 * 0.6 : 0);
    if (fl > 0){ ctx.globalAlpha = fl; ctx.fillStyle = '#fff'; ctx.fillRect(fx, fy, fw, fh); ctx.globalAlpha = 1; }
    ctx.restore();
  },
  sortY(p){ return p.y + p.d; }
};

/* ============ MOVABLE FACTORY (reusable: make any {x,y,w,d} object pushable, with weight, friction and collisions) ============ */
const MovableFactory = {
  list: [], friction: 7,
  make(o, { mass = 1, pushK = 0.6 } = {}){ Object.assign(o, { movable: true, mass, pushK, vx: 0, vy: 0 }); this.list.push(o); return o; },
  forget(o){ const i = this.list.indexOf(o); if (i >= 0) this.list.splice(i, 1); },
  sync(o){ if (o.box){ o.box.x = o.x; o.box.y = o.y; } },
  shove(o, dx, dy){ o.x += dx; o.y += dy; this.sync(o); },                     // direct move (used when something pushes it)
  impulse(o, ix, iy){ o.vx += ix / o.mass; o.vy += iy / o.mass; },              // knock it (lighter objects fly further)
  update(dt){
    for (const o of this.list){
      if (!o.vx && !o.vy) continue;
      o.x += o.vx * dt; o.y += o.vy * dt;
      const k = Math.exp(-this.friction * dt); o.vx *= k; o.vy *= k;
      if (Math.hypot(o.vx, o.vy) < 4) o.vx = o.vy = 0;
      this.sync(o);
    }
    const B = CollisionFactory.boxes;   // objects push each other apart; the lighter one gives way more
    for (let it = 0; it < 2; it++) for (let i = 0; i < B.length; i++) for (let j = i + 1; j < B.length; j++){
      const a = B[i], b = B[j], ma = a.owner && a.owner.movable && !a.owner.heldBy ? a.owner : null, mb = b.owner && b.owner.movable && !b.owner.heldBy ? b.owner : null;
      if (!ma && !mb) continue;
      const ox = Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x), oy = Math.min(a.y + a.h, b.y + b.h) - Math.max(a.y, b.y);
      if (ox <= 0 || oy <= 0) continue;
      const horiz = ox < oy, pen = horiz ? ox : oy;
      const sgn = (horiz ? (a.x + a.w / 2) - (b.x + b.w / 2) : (a.y + a.h / 2) - (b.y + b.h / 2)) >= 0 ? 1 : -1;
      let sa = ma ? 1 : 0, sb = mb ? 1 : 0;
      if (ma && mb){ const m = ma.mass + mb.mass; sa = mb.mass / m; sb = ma.mass / m; }
      if (ma){ if (horiz){ ma.x += sgn * pen * sa; ma.vx *= 0.5; } else { ma.y += sgn * pen * sa; ma.vy *= 0.5; } this.sync(ma); }
      if (mb){ if (horiz){ mb.x -= sgn * pen * sb; mb.vx *= 0.5; } else { mb.y -= sgn * pen * sb; mb.vy *= 0.5; } this.sync(mb); }
    }
  }
};

/* ============ BREAK FACTORY (reusable: make any object breakable — hits crack it, then it swells, bursts and shatters into pieces) ============
   register(obj, preset)   obj needs {x, y, w, d, h} and a destroy() that removes it from the world
   damage(obj, amount, fromX, fromY)   hit it (cracks it, shakes it, nudges it away from the hit)
   presets                 hp + the kinds of pieces it shatters into; add a preset to make something new breakable */
const BreakFactory = {
  debris: [], maxDebris: 120, gravity: 620,
  presets: {
    crate: { hp: 3, count: [12, 16], shapes: [
      { w: [14, 26], h: [4, 6],  c: ['#9a6630', '#c4894a', '#b07840'] },     // planks
      { w: [8, 14],  h: [4, 6],  c: ['#6b4320', '#4a2c12'] },                 // beam bits
      { w: [3, 6],   h: [3, 6],  c: ['#c4894a', '#9a6630'] } ] },             // splinters
    drum: { hp: 2, count: [12, 16], shapes: [
      { w: [5, 8],   h: [12, 22], c: ['#a4523c', '#c1664d'] },                // curved metal strips
      { w: [8, 14],  h: [3, 5],   c: ['#3a1a12', '#5a271c'] },                // rim pieces
      { w: [3, 6],   h: [3, 6],   c: ['#d9825f', '#5a271c'] } ] }             // scraps
  },
  rand(a, b){ return a + Math.random() * (b - a); },
  pick(arr){ return arr[Math.random() * arr.length | 0]; },
  register(o, preset, over){
    const P = Object.assign({}, this.presets[preset], over);
    Object.assign(o, { breakable: true, hp: P.hp, maxHp: P.hp, crackAmt: 0, shakeT: 0, flashT: 0, breaking: null, breakSpec: P, cracks: this.makeCracks() });
    return o;
  },
  makeCracks(){   // jagged crack lines in 0..1 face coordinates; they grow as the object takes damage
    const out = [];
    for (let i = 0; i < 4; i++){
      let u = Math.random(), v = i < 2 ? 0 : Math.random() * 0.45; const pts = [[u, v]];
      for (let k = 0; k < 5; k++){ u += (Math.random() - .5) * 0.3; v += 0.12 + Math.random() * 0.14; pts.push([Math.min(1, Math.max(0, u)), Math.min(1, v)]); }
      out.push(pts);
    }
    return out;
  },
  drawCracks(g, o, x, y, w, h){
    if (!o.breakable || o.crackAmt <= 0) return;
    g.save(); g.lineJoin = 'round';
    for (const pts of o.cracks){
      const n = Math.max(2, Math.ceil(pts.length * o.crackAmt));
      g.beginPath(); for (let k = 0; k < n; k++){ const [u, v] = pts[k]; g[k ? 'lineTo' : 'moveTo'](x + u * w, y + v * h); }
      g.strokeStyle = 'rgba(20,10,5,.85)'; g.lineWidth = 1.8; g.stroke();
      g.strokeStyle = 'rgba(255,240,210,.35)'; g.lineWidth = 0.6; g.stroke();
    }
    g.restore();
  },
  damage(o, amt = 1, fx, fy){
    if (!o || !o.breakable || o.breaking) return false;
    o.hp -= amt; o.crackAmt = 1 - Math.max(0, o.hp) / o.maxHp; o.shakeT = 0.25; o.flashT = 0.12; o.lastHit = { x: fx, y: fy };
    if (o.movable && fx !== undefined){ const dx = o.x + o.w / 2 - fx, dy = o.y + o.d / 2 - fy, d = Math.hypot(dx, dy) || 1; MovableFactory.impulse(o, dx / d * 110, dy / d * 110); }
    if (o.hp <= 0) o.breaking = { t: 0, dur: 0.3 };
    return true;
  },
  nearest(x, y, reach){
    let best = null, bd = reach;
    for (const p of PropFactory.props){
      if (!p.breakable || p.breaking) continue;
      const cx = Math.max(p.x, Math.min(x, p.x + p.w)), cy = Math.max(p.y, Math.min(y, p.y + p.d)), d = Math.hypot(x - cx, y - cy);
      if (d < bd){ bd = d; best = p; }
    }
    return best;
  },
  smash(ch, reach = 45){ const o = this.nearest(ch.x, ch.y, reach); return o ? this.damage(o, 1, ch.x, ch.y) : false; },
  update(dt){
    for (const p of PropFactory.props.slice()){
      if (p.shakeT > 0) p.shakeT = Math.max(0, p.shakeT - dt);
      if (p.flashT > 0) p.flashT = Math.max(0, p.flashT - dt);
      if (p.breaking){ p.breaking.t += dt; p.crackAmt = 1; if (p.breaking.t >= p.breaking.dur) this.shatter(p); }
    }
    const G = this.gravity;
    for (const d of this.debris){
      if (d.rest){ d.life -= dt; continue; }
      d.vz -= G * dt; d.z += d.vz * dt; d.x += d.vx * dt; d.y += d.vy * dt; d.rot += d.vr * dt; d.life -= dt * 0.25;
      if (d.z <= 0){
        d.z = 0;
        if (Math.abs(d.vz) > 60 && d.bounces < 3){ d.vz = -d.vz * 0.35; d.vx *= 0.6; d.vy *= 0.6; d.vr *= 0.6; d.bounces++; }
        else { d.vz = 0; const k = Math.exp(-8 * dt); d.vx *= k; d.vy *= k; d.vr *= k; if (Math.hypot(d.vx, d.vy) < 8 && Math.abs(d.vr) < 1) d.rest = true; }
      }
    }
    this.debris = this.debris.filter(d => d.life > 0);
  },
  shatter(o){
    const P = o.breakSpec, n = Math.round(this.rand(P.count[0], P.count[1])), cx = o.x + o.w / 2, cy = o.y + o.d / 2;
    let hx = 0, hy = 0; if (o.lastHit && o.lastHit.x !== undefined){ hx = cx - o.lastHit.x; hy = cy - o.lastHit.y; const m = Math.hypot(hx, hy) || 1; hx /= m; hy /= m; }
    for (let i = 0; i < n; i++){
      const S = this.pick(P.shapes);
      this.debris.push({ x: cx + this.rand(-.4, .4) * o.w, y: cy + this.rand(-.4, .4) * o.d, z: this.rand(4, o.h * 0.9),
        vx: this.rand(-130, 130) + hx * 90, vy: this.rand(-100, 100) + hy * 90, vz: this.rand(120, 380),
        rot: this.rand(0, 6.28), vr: this.rand(-16, 16), w: this.rand(...S.w), h: this.rand(...S.h), c: this.pick(S.c),
        life: this.rand(7, 10), rest: false, bounces: 0 });
    }
    if (this.debris.length > this.maxDebris) this.debris.splice(0, this.debris.length - this.maxDebris);
    if (typeof DustFactory !== 'undefined') DustFactory.spawn(cx, cy + o.d * 0.4, 8);
    o.breaking = null; if (o.destroy) o.destroy();
  },
  collect(items, cam, W, H){ for (const d of this.debris) if (ViewFactory.sees(d.x, d.y, 60, 60, 320)) items.push({ y: d.y, f: () => this.drawShard(ctx, d, cam, W, H) }); },
  drawShard(g, d, cam, W, H){
    const s = GroundFactory.toScreen(d.x, d.y, cam, W, H), a = Math.min(1, d.life / 1.5);
    g.globalAlpha = a;
    g.fillStyle = 'rgba(0,0,0,' + 0.28 * (1 - Math.min(1, d.z / 90)) + ')'; g.beginPath(); g.ellipse(s.x, s.y, d.w * 0.5 + 1, (d.w * 0.5 + 1) * CONFIG.tilt, 0, 0, 7); g.fill();
    g.save(); g.translate(s.x, s.y - d.z - (d.rest ? 1 : d.h * 0.3)); g.rotate(d.rot); if (d.rest) g.scale(1, 0.6);
    g.fillStyle = d.c; g.fillRect(-d.w / 2, -d.h / 2, d.w, d.h);
    g.strokeStyle = 'rgba(0,0,0,.5)'; g.lineWidth = 1; g.strokeRect(-d.w / 2, -d.h / 2, d.w, d.h);
    g.restore(); g.globalAlpha = 1;
  }
};

/* ============ PUSH FACTORY (reusable: any character can grab anything that is movable, then push or pull it with the joystick) ============
   nearest(ch)   the closest grabbable thing in reach (anything registered with MovableFactory that isn't already held)
   grab / release(ch)   attach / let go; while held the object is locked beside the character and moves with him
   Walls or any other non-movable collision box will block the pushing automatically. */
const PushFactory = {
  reach: 26, reachDur: 0.32, gapX: 30, gapY: 22,
  nearest(ch){
    let best = null, bd = CollisionFactory.radius + this.reach;
    for (const o of MovableFactory.list){
      if (o.heldBy || o.breaking || o.grabbable === false) continue;
      const cx = Math.max(o.x, Math.min(ch.x, o.x + o.w)), cy = Math.max(o.y, Math.min(ch.y, o.y + o.d)), d = Math.hypot(ch.x - cx, ch.y - cy);
      if (d < bd){ bd = d; best = o; }
    }
    return best;
  },
  grab(ch){
    const o = this.nearest(ch); if (!o || ch.grab) return false;
    const dx = o.x + o.w / 2 - ch.x, dy = o.y + o.d / 2 - ch.y, ex = Math.max(0, Math.abs(dx) - o.w / 2), ey = Math.max(0, Math.abs(dy) - o.d / 2);
    const cl = (v, a, b) => Math.max(a, Math.min(b, v));
    const g = { o, t: 0, sx: o.x, sy: o.y, ox: 0, oy: 0, dir: 'side', face: ch.face || 1 };
    if (ex >= ey){ const sx = dx >= 0 ? 1 : -1; g.face = sx; g.dir = 'side'; g.ox = sx > 0 ? this.gapX : -this.gapX - o.w; g.oy = cl(o.y - ch.y, -(o.d - 6), -6); }
    else { const sy = dy >= 0 ? 1 : -1; g.dir = sy > 0 ? 'front' : 'back'; g.oy = sy > 0 ? this.gapY : -this.gapY - o.d; g.ox = cl(o.x - ch.x, -(o.w - 6), -6); }
    ch.grab = g; o.heldBy = ch; o.vx = o.vy = 0;
    ch.dir = g.dir; ch.face = g.face; ch.clip = 'reach';
    return true;
  },
  release(ch){ const g = ch.grab; if (g && g.o) g.o.heldBy = null; ch.grab = null; },
  blocked(o){   // is the held object pressed into something that can't move?
    for (const b of CollisionFactory.boxes){
      if (b === o.box || (b.owner && b.owner.movable)) continue;

/* ============ ABILITY FACTORY (reusable: every gimmick button lives here. A skin lists the abilities it owns, e.g. abilities: ['grab', 'slam'],

AbilityFactory.register('grab', {

/* ============ HEALTH FACTORY (every gimmick has `max` health, 1..100; the bar floats over the head and follows it, also for other players in multiplayer.
   When a gimmick's ability hits ANOTHER gimmick, that one loses health and a red -N floats up off his head. At 0 he dies (see ReactFactory: death fall, then respawn).
   Damage comes through ImpactFactory.extraTargets (every slam wave, missile blast, tornado, storm and spin already reports to it) and dash contact. Amounts are in `dmg` right below.
     area abilities : { base, bonus, R }  -> base + bonus * (1 - distance / R), so the centre of a blast hurts the most (slam / missile)
     tick abilities : { tick }            -> that much every time the whirl ticks (tornado / storm / spin)

const HealthFactory = {
  max: 100, chipDelay: 0.5,

    tornado: { tick: 3 },               // speed gimmick's twist: every 0.25s while you stand in it
    storm:   { tick: 2 },               // the turtle's 3 roaming tornadoes: they stack if you are between them
    spin:    { tick: 2 },               // the turtle's rapid spin: every 0.2s
    dash:    { tick: 5 },               // speed gimmick barging into someone (once per 0.6s per target)
    shadow:  { base: 40, bonus: 40 },   // SHADOW SNEAK spikes: 40 at the rim of the circle, 80 in the middle
    hammer:  { base: 22, bonus: 20 },   // ACE GUARDIAN's thrown hammer: 22 at the edge of its hit area, 42 dead centre (it can hit the same target again every 0.4s)
    whirl:   { base: 2, bonus: 10 },    // DROUGHT's WHIRLPOOL: 2 at the rim, 12 in the middle, every 0.25s (so it grows as you get dragged in)
    fang:    { base: 45, bonus: 45 },   // DROUGHT's FANG crush: 45 at the edge of the marked area, 90 dead centre
    ice:     { tick: 2 },               // DROUGHT's ICE BEAM: 2 every 0.5s you stay in it (the freeze is the real punishment)
    acid:    { base: 12, bonus: 8 }     // ACID splash of each blob: 12 at the rim, 20 in the middle (then the poison ticks, see AcidFactory)

  reset(ch){ if (ch){ ch.hp = this.max; ch.hpShow = this.max; } this.floats.length = 0; this.flash = 0; this.dashCd = {}; },

  onRemote(m){ if (m.to === NetFactory.id && m.id !== NetFactory.id && isFinite(m.amt) && m.amt > 0){ const t = performance.now(), L = this.rl || (this.rl = {}); if (L[m.id] && t - L[m.id] < 80) return; L[m.id] = t; this.hurt(player, Math.min(m.amt, 60), m.x, m.y); } },

  },
  drawFloats(g, cam, W, H){

/* ============ REACT FACTORY (how every gimmick REACTS to damage; it wraps CharacterFactory.draw, so it works for all three gimmicks and the plain characters, local and remote)
   FLINCH  : whenever health drops, he is knocked back: body and head whip backwards, then spring back (about `flinchDur` s; tiny tick damage like a tornado makes a short small shudder instead)

   RESPAWN : the local player gets a YOU DIED + RESPAWN button once he has hit the ground; he comes back at his start spot with `invTime` s of blinking protection
   Everyone is driven by their HEALTH VALUE alone (health going down = flinch, reaching 0 = death, going back up = alive again), which is also what gets sent over the network,

  flinchDur: 1.0, smallDur: 0.45, bigAt: 5, angle: 0.5, knock: 9,          // seconds / damage that counts as a full hit / lean-back (radians) / knock-back (px)
  stagger: 0.4, fall: 0.75, lieTime: 1.2, fadeTime: 1.0, respawnAt: 1.6,   // death timeline (seconds): stagger back, fall, lie still, fade out; when the button shows
  hops: [{ d: 0.42, h: 16 }, { d: 0.32, h: 8 }, { d: 0.24, h: 3 }],        // the bounces after hitting the ground: duration + height (px)
  invTime: 2, box: null,
  init(){

    b.style.cssText = 'position:fixed;left:50%;bottom:22%;transform:translateX(-50%);z-index:1000;display:none;text-align:center;font-family:system-ui,sans-serif;pointer-events:none';
    b.innerHTML = '<div style="font:900 34px system-ui;letter-spacing:4px;color:#ff3b30;text-shadow:0 2px 8px #000;margin-bottom:12px">YOU DIED</div><button id="respawnBtn" style="pointer-events:auto;padding:14px 38px;font:800 20px system-ui;letter-spacing:2px;color:#fff;background:linear-gradient(#3fdc7a,#1f9a4c);border:2px solid #fff;border-radius:14px;box-shadow:0 0 18px rgba(63,220,122,.7);cursor:pointer">RESPAWN</button>';
    document.body.appendChild(b);
    const go = e => { e.preventDefault(); e.stopPropagation(); this.respawn(player); };
    b.querySelector('#respawnBtn').addEventListener('pointerdown', go);
  },
  chars(){ return [player, ...RemoteFactory.list(), ...BossFactory.list(), ...BodyguardFactory.list]; },
  reset(ch){ if (!this.box) this.init(); ch.dead = null; ch.gone = false; ch.fade = 1; ch.lie = 0; ch.fl = null; ch.inv = 0; ch._hp0 = ch.hp; this.box.style.display = 'none'; document.body.classList.remove('isDead'); },
  hit(ch, amt){

  die(ch){

    ch.dead = { t: 0, f, land: 0 }; ch.fl = null; ch.dir = 'side'; ch.face = f; ch.clip = 'idle'; ch.aim = ch.acid = ch.demon = ch.poison = ch.slam = ch.swim = ch.storm = ch.shield = ch.twist = ch.whirl = ch.fang = ch.ice = ch.sprint = null; ch.frz = 0; ch.fdv = ch.fz = ch.fb = ch.fs = ch.fk = ch.fp = 0; ch.hov = 0; ch.rec = 0;
    if (ch === player){ if (player.grab) PushFactory.release(player); player.grab = null; }

  },
  revive(ch){ ch.dead = null; ch.gone = false; ch.fade = 1; ch.lie = 0; ch.fl = null; ch.clip = 'idle'; ch.dir = 'front'; DustFactory.spawn(ch.x, ch.y, 10); },
  respawn(ch){

    const sp = ch.spawn || { x: 0, y: 90 }; ch.x = sp.x; ch.y = sp.y; cam.x = ch.x; cam.y = ch.y;
    ch.hp = ch.hpShow = HealthFactory.max; ch._hp0 = ch.hp; if (ch === player) SurvivalFactory.reset(); this.revive(ch); ch.inv = this.invTime; HealthFactory.flash = 0; HealthFactory.lastHit = 9;

  update(dt){

        const first = d.land === 0; DustFactory.spawn(ch.x - d.f * 34, ch.y + 2, first ? 12 : 5); ImpactFactory.chips(ch.x - d.f * 34, ch.y, first ? 6 : 2);

/* ============ SHAKE FACTORY (reusable: screen shake + white flash for any big hit) ============
   kick(amp, dur)   shake the screen (amp = pixels at the start, fades out); a weaker kick never cuts a stronger one short
   flashNow(dur)    quick white-ish flash over the whole screen */
const ShakeFactory = {
  amp: 0, t: 0, dur: 0.5, flash: 0, flashDur: 0.14,
  reset(){ this.t = 0; this.flash = 0; },
  kick(amp, dur){ const cur = this.t > 0 ? this.amp * this.t / this.dur : 0; if (amp >= cur){ this.amp = amp; this.dur = dur; this.t = dur; } },
  flashNow(dur = 0.14){ this.flash = this.flashDur = dur; },
  offset(dt){
    if (this.flash > 0) this.flash = Math.max(0, this.flash - dt);
    if (this.t <= 0) return { x: 0, y: 0 };
    this.t = Math.max(0, this.t - dt); const f = this.t / this.dur, a = this.amp * f * f, now = performance.now();
    return { x: Math.round((Math.random() * 2 - 1) * a + Math.sin(now * 0.09) * a * 0.5), y: Math.round((Math.random() * 2 - 1) * a * 0.75 + Math.cos(now * 0.11) * a * 0.4) };
  },
  drawScreen(g, W, H){ if (this.flash > 0){ g.fillStyle = `rgba(255,245,220,${this.flash / this.flashDur * 0.22})`; g.fillRect(0, 0, W, H); } }
};

/* ============ IMPACT FACTORY (reusable: what any shockwave / blast does to the world) ============
   sweep(w, power, fling)   w = { x, y, r, hit:Set } — everything the circle of radius r has reached: breakables take `power` damage (99 = they break),
                            loose props get flung outward. Call it every frame while r grows; `hit` stops anything being hit twice.
   extraTargets             hook for later (enemies!): return objects with {x, y, w, d, onSlam(power, fromX, fromY)} and every wave / blast hits them too
   chips(x, y, n)           stone and dirt chips thrown up from the ground */
const ImpactFactory = {
  extraTargets: () => (typeof HealthFactory !== 'undefined' ? HealthFactory.list() : []).concat(typeof ZombieSystem !== 'undefined' ? ZombieSystem.targets() : []).concat(typeof BossFactory !== 'undefined' ? BossFactory.targets() : []),
  dist(o, x, y){ const cx = Math.max(o.x, Math.min(x, o.x + o.w)), cy = Math.max(o.y, Math.min(y, o.y + o.d)); return Math.hypot(x - cx, y - cy); },
  sweep(w, power, fling = 320){
    if (w.r <= 0) return;
    for (const o of PropFactory.props.slice()){
      if (w.hit.has(o) || o.breaking || o.heldBy) continue;
      if (this.dist(o, w.x, w.y) > w.r) continue;
      w.hit.add(o);
      if (o.breakable) BreakFactory.damage(o, power, w.x, w.y);
      else if (o.movable){ const dx = o.x + o.w / 2 - w.x, dy = o.y + o.d / 2 - w.y, d = Math.hypot(dx, dy) || 1; MovableFactory.impulse(o, dx / d * fling, dy / d * fling); }

  },
  chips(x, y, n){
    for (let i = 0; i < n && BreakFactory.debris.length < 170; i++){
      const a = Math.random() * 6.283, sp = 60 + Math.random() * 150;
      BreakFactory.debris.push({ x: x + Math.cos(a) * 8, y: y + Math.sin(a) * 6, z: 2, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp * 0.8, vz: 180 + Math.random() * 260,
        rot: Math.random() * 6.28, vr: (Math.random() - .5) * 18, w: 3 + Math.random() * 5, h: 3 + Math.random() * 4, c: ['#6b5a3c', '#8a7550', '#4d4030', '#a39272'][i & 3], life: 5, rest: false, bounces: 0 });
    }
  }
};

/* ============ SLAM FACTORY (ability 'slam': a charged ground-smash. Arms go up, come down hard, and a shockwave rolls out from the impact) ============
   start(ch)     begins the slam if the gimmick owns 'slam' and the charge is full (movement is locked while it plays)

  radius: 290, cooldown: 10, windup: 0.5, hold: 0.09, strike: 0.13, recover: 0.5,   // seconds / world px (the little smash reach is 45)

  start(ch){

  update(ch, dt, wdt){

      if (!sl.hit && sl.t >= this.impactAt()){ sl.hit = true; const c = this.centre(ch); const sk = SkinFactory[ch.gimmick], R = (sk && sk.slamRadius) || this.radius; this.impactR(c.x, c.y, false, R); if (GameFactory.room) GameFactory.room.send({ t: 'slam', id: NetFactory.id, x: c.x, y: c.y, R }); }

    const me = typeof player !== 'undefined' ? player : null, dist = me ? Math.hypot(me.x - x, me.y - y) : 0;
    if (!visual){ ShakeFactory.kick(18, 0.6); ShakeFactory.flashNow(0.14); } else if (dist < this.radius * 3) ShakeFactory.kick(10 * (1 - dist / (this.radius * 3)), 0.4);

  updateWaves(dt){

      if (w.r < w.R && Math.random() < 0.9){ const a = Math.random() * 6.283; DustFactory.spawn(w.x + Math.cos(a) * w.r, w.y + Math.sin(a) * w.r, 1); }   // dust rolls along the front
    }

  },
  onRemote(m){ if (m.id !== NetFactory.id) this.impactR(m.x, m.y, true, m.R || this.radius); },
  impactR(x, y, visual, R){ const old = this.radius; this.radius = R; try { this.impact(x, y, visual); } finally { this.radius = old; } },   // one slam with its own size (a skin's `slamRadius`)
  pose(ch){   // arm / body values for the slam clip: raise, hold, strike (fast), recover. ch.slamBlend (3 SLAM only) eases from the hit pose back up to the raised pose
    const p = this.poseAt(this.timeOf(ch)), bl = ch.slamBlend;

  poseAt(t){

    else { const u = Math.min(1, (t - a - b - c) / d), e = u * u * (3 - 2 * u); ang = -0.45 * (1 - e); lean = 0.38 * (1 - e); dip = 7 * (1 - e); stance = 1 - e; sc = 0.6 + 0.4 * e; bend = 0; }

      g.strokeStyle = `rgba(255,255,235,${0.9 * f2})`; g.lineWidth = 4; g.beginPath(); g.arc(0, 0, w.r, 0, 7); g.stroke();
      if (w.r > 30){ g.strokeStyle = `rgba(210,180,130,${0.4 * f2})`; g.lineWidth = 7; g.beginPath(); g.arc(0, 0, w.r * 0.8, 0, 7); g.stroke(); }
      g.restore();

        for (const [px, py, d] of c.pts){ if (d !== undefined && d > w.r) break; const X = s.x + px, Y = s.y + py * tl; started ? g.lineTo(X, Y) : g.moveTo(X, Y); started = true; }
        g.strokeStyle = `rgba(15,8,2,${0.85 * fade})`; g.lineWidth = c.w + 1; g.stroke();

/* ============ MISSILE FACTORY (ability 'missile': HOLD the button to aim, RELEASE to fire. A long missile arcs to the target, lands, ticks, then blasts) ============
   While aiming he braces the metal arm forward with his other hand, can't walk, and you DRAG the finger that holds the button (up / down / left / right) to move the red target circle: direction = drag direction, further drag = further away.
   The camera slides toward the target so you can see it. On release the missile flies at `speed`, sticks in the ground, and after `fuse` seconds blasts:
   fireball + smoke + embers + shockwave + scorch mark + screen shake; every breakable in `blastRadius` breaks (ImpactFactory), loose props get flung.
   tune the numbers right below */

  cooldown: 5, charge: 5,
  minRange: 90, maxRange: 380, defRange: 220, vertBoost: 1.8, aimEase: 9, camLead: 0.5,   // aim distance limits (world px); vertBoost = how much further up/down shots reach (the tilted ground squashes them on screen)
  dragMax: 45, deadzone: 0.2,   // finger drag (px) from the button for full range, and the small dead area in the middle
  speed: 340, minFlight: 0.6, arc: 0.32, maxArc: 150, fuse: 0, handZ: 40,   // flight speed, arc height, seconds the landed missile ticks before blasting
  blastRadius: 120, blastWave: 0.22, power: 99, recoil: 0.35,              // blast size, how fast the blast front expands, damage, arm kick after firing
  missiles: [], blasts: [], scorches: [], watch: null,
  reset(){ this.charge = this.cooldown; this.missiles.length = this.blasts.length = this.scorches.length = 0; this.watch = null; },
  ready(){ return this.charge >= this.cooldown; },
  world(sx, sy){ const l = Math.hypot(sx, sy / CONFIG.tilt) || 1; return { x: sx / l, y: sy / CONFIG.tilt / l }; },   // screen direction -> ground direction
  start(ch){
    if (!AbilityFactory.has(ch, 'missile') || ch.aim || ch.slam || !this.ready()) return false;
    if (ch.grab) PushFactory.release(ch);
    const f = ch.face || 1, D = { side: [f, 0], front: [0, 1], back: [0, -1], fdiag: [f, 1], bdiag: [f, -1] }[ch.dir] || [f, 0], d = this.world(D[0], D[1]);
    ch.aim = { t: 0, dx: d.x, dy: d.y, range: this.defRange, firing: false, ft: 0 }; ch.clip = 'aim'; return true;
  },
  release(ch){
    const a = ch.aim; if (!a || a.firing) return;
    const hx = ch.x + a.dx * 20, hy = ch.y + a.dy * 20, tx = ch.x + a.dx * this.reach(a), ty = ch.y + a.dy * this.reach(a);
    this.launch(hx, hy, tx, ty, false);
    a.firing = true; a.ft = 0; this.charge = 0; ShakeFactory.kick(4, 0.22); DustFactory.spawn(ch.x - a.dx * 10, ch.y - a.dy * 10, 5);
    if (GameFactory.room) GameFactory.room.send({ t: 'missile', id: NetFactory.id, x0: hx, y0: hy, x1: tx, y1: ty });

  onRemote(m){ if (m.id !== NetFactory.id) this.launch(m.x0, m.y0, m.x1, m.y1, true); },

    const A = this.pathPoint(m, 0), B = this.pathPoint(m, 0.04); m.angle = Math.atan2((B.y - A.y) * CONFIG.tilt - (B.z - A.z), B.x - A.x);

  },
  update(ch, dt, m, wdt){   // dt = the shooter's time, wdt = world time (flying missiles + blasts are part of the world, so time-slow slows them)
    if (AbilityFactory.has(ch, 'missile') && !ch.aim) this.charge = Math.min(this.cooldown, this.charge + dt);

/* ============ GRASS FACTORY (upright tufts, depth-sorted like the props) ============ */
const GrassFactory = {
  cell: 90, cut: 0.6, B: 8, P: 6, sprites: null, sk: 0,   // cell size (bigger = fewer tufts) / share of cells left empty = cut / size variants / sway frames
  hash(i, j){ let h = (i * 374761393 + j * 668265263) | 0; h = (h ^ (h >>> 13)) * 1274126177 | 0; return ((h ^ (h >>> 16)) >>> 0) / 4294967295; },
  // every tuft is a small picture drawn ONCE per variant and sway frame (B x P of them), then just stamped: 1 draw call per tuft instead of ~8 strokes
  bake(k){
    this.sprites = []; this.sk = k;
    for (let b = 0; b < this.B; b++){
      const r = this.cut + (1 - this.cut) * (b + 0.5) / this.B, size = 0.7 + r * 0.9, row = [];
      for (let f = 0; f < this.P; f++){
        const cv = document.createElement('canvas'); cv.width = Math.ceil(48 * k); cv.height = Math.ceil(44 * k); const g = cv.getContext('2d'); g.scale(k, k);
        this.paint(g, { x: 24, y: 36 }, size, f / this.P * 6.2832, r); row.push(cv);
      }
      this.sprites.push(row);
    }
  },
  collect(cam, W, H, out, time){
    const c = this.cell, t = CONFIG.tilt, x0 = Math.floor((cam.x - W/2 - 30)/c), x1 = Math.floor((cam.x + W/2 + 30)/c);
    const y0 = Math.floor((cam.y - H/(2*t) - 30)/c), y1 = Math.floor((cam.y + H/(2*t) + 60)/c);
    const k = Math.min(2, CONFIG.dprNow || 1); if (!this.sprites || Math.abs(this.sk - k) > 0.01) this.bake(k);
    for (let i = x0; i <= x1; i++) for (let j = y0; j <= y1; j++){
      const r = this.hash(i, j); if (r < this.cut) continue;
      const wx = (i + this.hash(j, i)) * c, wy = (j + this.hash(i + 9, j + 4)) * c;
      if (BiomeFactory.at(wx, wy) > 0.3) continue;   // no grass in the ice biome
      out.push({ y: wy, f: () => this.draw(ctx, GroundFactory.toScreen(wx, wy, cam, W, H), time + wx*0.02, r) });
    }
  },
  draw(g, s, ph, r){
    const b = Math.min(this.B - 1, ((r - this.cut) / (1 - this.cut) * this.B) | 0), q = ph * 2 / 6.2832, f = (((q % 1) + 1) % 1 * this.P) | 0;
    g.drawImage(this.sprites[b][f], s.x - 24, s.y - 36, 48, 44);
  },
  paint(g, s, size, ph2, r){   // the original tuft drawing (used only when baking)
    const n = 5 + (r*4|0), cols = ['#3d7a30', '#5fa044', '#6fb650', '#4a8f38', '#7cc45a'];
    g.fillStyle = 'rgba(0,0,0,.15)'; g.beginPath(); g.ellipse(s.x, s.y, 7*size, 2.5*size, 0, 0, 7); g.fill();
    g.lineCap = 'round';

      g.strokeStyle = cols[k % cols.length]; g.lineWidth = 2.2*size;
      g.beginPath(); g.moveTo(s.x + a*4, s.y); g.quadraticCurveTo(s.x + a*8, s.y - len*.6, s.x + a*14 + sway, s.y - len); g.stroke();
    }
  }
};

/* ============ ANIMATION FACTORY (walk / run) ============ */
const AnimationFactory = {
  clips: {
    idle: { freq: 0,  leg: 0,    arm: 0,    bob: 0,   lean: 0 },
    walk: { freq: 9,  leg: 0.55, arm: 0.5,  bob: 2.5, lean: 0.05 },
    run:  { freq: 15, leg: 1.0,  arm: 1.0,  bob: 4.5, lean: 0.22 }
  },
  // returns the pose for a clip at time t (radians)
  pose(clip, t){
    const c = this.clips[clip] || this.clips[clip === 'sprint' ? 'run' : 'idle'], sw = Math.sin(t * c.freq);
    return {
      legL: sw * c.leg, legR: -sw * c.leg,
      armL: -sw * c.arm, armR: sw * c.arm,
      bob: Math.abs(Math.cos(t * c.freq)) * c.bob + (clip === 'idle' ? Math.sin(t * 2) * 0.8 : 0),
      lean: c.lean
    };
  }
};

/* ============ DIRECTION FACTORY (4-direction: side L/R, back, front) ============ */
const DirectionFactory = {
  bias: 1.25,   // how much stronger an axis must be to switch direction (stops flickering on diagonals)
  resolve(ch, mx, my){
    const ax = Math.abs(mx), ay = Math.abs(my); let d = ch.dir;
    const sk = typeof SkinFactory !== 'undefined' && SkinFactory[ch.gimmick];
    if (sk && sk.diag){   // 8 directions: side / diagonal / front-back, with hysteresis so it doesn't flicker
      const r = ay / Math.max(ax, 1e-6), vert = d === 'front' || d === 'back';
      const lo = d === 'side' ? 0.5 : 0.34, hi = vert ? 2.0 : 2.9;
      if (r < lo) d = 'side'; else if (r > hi) d = my < 0 ? 'back' : 'front'; else d = my < 0 ? 'bdiag' : 'fdiag';
      ch.dir = d;
      if ((d === 'side' || d === 'fdiag' || d === 'bdiag') && ax > 0.1) ch.face = mx > 0 ? 1 : -1;
      return;
    }
    if (d === 'side'){ if (ay > ax * this.bias) d = my < 0 ? 'back' : 'front'; }
    else if (ax > ay * this.bias) d = 'side';
    else d = my < 0 ? 'back' : 'front';
    ch.dir = d;
    if (d === 'side' && ax > 0.1) ch.face = mx > 0 ? 1 : -1;
  }
};

/* ============ FRONT/BACK ANIMATION FACTORY (walking toward / away from camera) ============ */
const DepthAnimationFactory = {
  clips: {
    idle: { freq: 0,  stride: 0, lift: 0, arm: 0, sway: 0,   bob: 0,   tilt: 0 },
    walk: { freq: 9,  stride: 4, lift: 5, arm: 3, sway: 1.6, bob: 2.5, tilt: 0.04 },
    run:  { freq: 15, stride: 8, lift: 9, arm: 6, sway: 2.6, bob: 4.5, tilt: 0.08 }
  },
  pose(clip, t){
    const c = this.clips[clip] || this.clips[clip === 'sprint' ? 'run' : 'idle'], sw = Math.sin(t * c.freq), cs = Math.cos(t * c.freq);
    return {
      L: sw, R: -sw, c,
      raiseL: Math.max(0, sw) * c.lift, raiseR: Math.max(0, -sw) * c.lift,
      sway: cs * c.sway, tilt: cs * c.tilt,
      bob: Math.abs(cs) * c.bob + (clip === 'idle' ? Math.sin(t * 2) * 0.8 : 0)
    };
  }
};

/* ============ CHARACTER FACTORY (2D paper-doll body) ============ */
const CharacterFactory = {
  create(x, y, look = {}){
    return { x, y, face: 1, up: false, dir: 'front', clip: 'idle', t: 0, hp: 100, hpShow: 100,
      look: Object.assign({ skin:'#f0c39b', shirt:'#c0392b', pants:'#2c3e50', shoe:'#1a1a1a', hair:'#3b2416' }, look) };
  },
  limb(g, len, w, col){ g.fillStyle = col; g.beginPath(); g.roundRect(-w/2, 0, w, len, w/2); g.fill(); },
  // front / back view: symmetric body, legs step toward/away from the camera
  drawDepth(g, ch, s, k){
    const L = ch.look, back = ch.dir === 'back', sg = back ? -1 : 1, p = DepthAnimationFactory.pose(ch.clip, ch.t);
    g.fillStyle = 'rgba(0,0,0,.3)'; g.beginPath(); g.ellipse(s.x, s.y, 16*k, 16*k*CONFIG.tilt, 0, 0, 7); g.fill();
    g.save(); g.translate(s.x + p.sway*0.4*k, s.y - p.bob*k); g.scale(k, k);
    const leg = (x, sw, raise) => {   // foot lower on screen when stepping toward camera, higher when walking away
      const len = 26 + sw * p.c.stride * sg - raise, top = -26;
      g.fillStyle = L.pants; g.beginPath(); g.roundRect(x - 5, top, 10, len, 4); g.fill();
      g.fillStyle = L.shoe; g.beginPath(); g.roundRect(x - 6, top + len - 4, 12, 6, 3); g.fill();
    };
    const arm = (x, sw) => {          // hands swing opposite to the legs
      const len = 22 + sw * p.c.arm * sg, side = Math.sign(x);
      g.save(); g.translate(x, -51); g.rotate(side * 0.07);
      g.fillStyle = L.shirt; g.beginPath(); g.roundRect(-3.5, 0, 7, 9, 3); g.fill();          // sleeve
      g.fillStyle = L.skin; g.beginPath(); g.roundRect(-3.2, 7, 6.4, len - 7, 3); g.fill(); g.restore();
    };
    // back-most limbs first: when stepping away the far leg is the one higher on screen
    leg(-5, p.L, p.raiseL); leg(5, p.R, p.raiseR);
    g.save(); g.translate(0, -39); g.rotate(p.tilt); g.translate(0, 39);                        // shoulders rock while walking
    arm(-15, p.R); arm(15, p.L);
    g.fillStyle = L.shirt; g.beginPath(); g.roundRect(-12, -54, 24, 30, 6); g.fill();          // chest
    g.fillStyle = L.pants; g.fillRect(-12, -28, 24, 5);                                        // belt
    g.fillStyle = 'rgba(0,0,0,.12)'; g.fillRect(-12, -30, 24, 2);
    if (back){ g.strokeStyle = 'rgba(0,0,0,.18)'; g.lineWidth = 1.2; g.beginPath(); g.moveTo(0, -53); g.lineTo(0, -29); g.stroke(); }
    else { g.fillStyle = L.skin; g.beginPath(); g.arc(0, -54, 4.5, 0, Math.PI); g.fill(); }    // neck / collar
    g.restore();
    // head (bobs a little against the body)
    g.save(); g.translate(p.sway*0.5, -64 + Math.sin(ch.t * p.c.freq * 2) * (p.c.bob > 0 ? 0.6 : 0)); g.rotate(p.tilt * -0.8);
    g.fillStyle = L.skin; g.beginPath(); g.arc(0, 0, 11, 0, 7); g.fill();
    g.beginPath(); g.arc(-11, 1, 2.6, 0, 7); g.arc(11, 1, 2.6, 0, 7); g.fill();                 // ears
    g.fillStyle = L.hair;
    if (back){ g.beginPath(); g.arc(0, -1, 11.6, 0, 7); g.fill(); }
    else {
      g.beginPath(); g.arc(0, -2, 11.6, Math.PI, 0); g.lineTo(9, -3); g.quadraticCurveTo(0, -8, -9, -3); g.closePath(); g.fill();   // fringe
      for (const e of [-4, 4]){ g.fillStyle = '#fff'; g.beginPath(); g.arc(e, 1, 2.8, 0, 7); g.fill(); g.fillStyle = '#111'; g.beginPath(); g.arc(e, 1.4, 1.4, 0, 7); g.fill(); }
      g.strokeStyle = L.hair; g.lineWidth = 1.4; g.beginPath(); g.moveTo(-7, -3); g.lineTo(-2, -3.6); g.moveTo(2, -3.6); g.lineTo(7, -3); g.stroke();
      g.strokeStyle = '#8a4b3a'; g.lineWidth = 1.3; g.beginPath(); g.arc(0, 4, 3.2, 0.25, Math.PI - 0.25); g.stroke();
    }
    g.restore(); g.restore();
  },
  draw(ctx, ch, cam, W, H){
    if (ch.sneakHide) return;   // underground (SHADOW SNEAK)
    const sm = ch === player && ShadowSneakFactory.bodyMode(ch);
    if (sm){ if (sm.hide) return; const s = GroundFactory.toScreen(ch.x, ch.y, cam, W, H); ctx.save(); ctx.beginPath(); ctx.rect(s.x - 220, s.y - 420, 440, 422); ctx.clip(); ctx.translate(0, sm.off); ReactFactory.draw(ctx, ch, cam, W, H, () => this.drawRaw(ctx, ch, cam, W, H)); ctx.restore(); return; }   // sinking into / rising out of the ground: the part below the ground line is cut off
    return ReactFactory.draw(ctx, ch, cam, W, H, () => this.drawRaw(ctx, ch, cam, W, H));
  },   // hit-flinch / death-fall / respawn-blink wrap the real drawing (see ReactFactory)
  drawRaw(ctx, ch, cam, W, H){
    const s = GroundFactory.toScreen(ch.x, ch.y, cam, W, H), L = ch.look, k = CONFIG.charScale;
    if (SkinFactory[ch.gimmick]){
      const ro = ch.roarU || 0;   // ROAR pose (Warden style): the whole body tips forward and sinks, the skins pull the arms back
      if (ro <= 0) return SkinFactory[ch.gimmick].draw(ctx, ch, s);
      ctx.save(); ctx.translate(s.x, s.y); const sd = ch.dir === 'side', dg2 = ch.dir === 'fdiag' || ch.dir === 'bdiag';
      if (sd || dg2) ctx.rotate((ch.face || 1) * (sd ? 0.34 : 0.2) * ro); ctx.scale(1 + 0.03 * ro, 1 - 0.07 * ro); ctx.translate(-s.x, -s.y);
      SkinFactory[ch.gimmick].draw(ctx, ch, s); ctx.restore(); return;
    }
    if (typeof HumanSkin !== 'undefined') return HumanSkin.draw(ctx, ch, s);   // the plain human
    if (ch.dir !== 'side') return this.drawDepth(ctx, ch, s, k);
    const p = AnimationFactory.pose(ch.clip, ch.t);
    // shadow
    ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(s.x, s.y, 16*k, 16*k*CONFIG.tilt, 0, 0, 7); ctx.fill();
    ctx.save(); ctx.translate(s.x, s.y - p.bob); ctx.scale(ch.face * k, k); ctx.rotate(p.lean);
    // back arm + back leg first, then body, then front limbs
    ctx.save(); ctx.translate(0, -26); ctx.rotate(p.legR); this.limb(ctx, 26, 9, L.pants); ctx.translate(0, 22); ctx.fillStyle = L.shoe; ctx.fillRect(-4, 0, 11, 5); ctx.restore();
    ctx.save(); ctx.translate(0, -50); ctx.rotate(p.armR); this.limb(ctx, 24, 7, L.skin); ctx.restore();
    // chest
    ctx.fillStyle = L.shirt; ctx.beginPath(); ctx.roundRect(-10, -54, 20, 30, 5); ctx.fill();
    ctx.fillStyle = L.pants; ctx.fillRect(-10, -28, 20, 5);
    // front leg
    ctx.save(); ctx.translate(0, -26); ctx.rotate(p.legL); this.limb(ctx, 26, 9, L.pants); ctx.translate(0, 22); ctx.fillStyle = L.shoe; ctx.fillRect(-4, 0, 11, 5); ctx.restore();
    // head
    ctx.fillStyle = L.skin; ctx.beginPath(); ctx.arc(0, -64, 11, 0, 7); ctx.fill();
    ctx.fillStyle = L.hair; ctx.beginPath(); ctx.arc(0, -66, 11.5, Math.PI, 0); ctx.fill();
    if (ch.up){ ctx.beginPath(); ctx.arc(0, -64, 11.5, 0, 7); ctx.fill(); }       // back of head
    else {                                                                          // face
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(4, -64, 3, 0, 7); ctx.fill();
      ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(5, -64, 1.5, 0, 7); ctx.fill();
      ctx.strokeStyle = '#8a4b3a'; ctx.lineWidth = 1.3; ctx.beginPath(); ctx.arc(4, -59, 3, 0.2, Math.PI - 0.5); ctx.stroke();
    }
    // front arm
    ctx.save(); ctx.translate(0, -50); ctx.rotate(p.armL); this.limb(ctx, 24, 7, L.skin); ctx.restore();
    ctx.restore();
  }
};

/* ============ HUMAN SKIN (the plain human you start as: the character with no gimmick. Realistic proportions, serious face, t-shirt + jeans + boots. Colours come from the character's look (skin / shirt / pants / shoe / hair).
   scale = overall size (1 = the old cartoon size). To go back to the old body, delete this factory and its one-line hook in CharacterFactory.drawRaw.) ============ */
const HumanSkin = {
  scale: 0.85, radius: 11,   // size / collision radius
  draw(g, ch, s){ return ch.dir === 'side' ? this.side(g, ch, s) : this.depth(g, ch, s); },
  shade(g, x0, x1, a){ const gr = g.createLinearGradient(x0, 0, x1, 0); gr.addColorStop(0, 'rgba(0,0,0,' + a + ')'); gr.addColorStop(0.3, 'rgba(0,0,0,0)'); gr.addColorStop(0.7, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,' + a + ')'); return gr; },
  eye(g, x, y){   // narrow, serious eye: white, dark iris, heavy upper lid
    g.fillStyle = '#f2efe9'; g.beginPath(); g.ellipse(x, y, 1.9, 1.15, 0, 0, 7); g.fill();
    g.fillStyle = '#1c1410'; g.beginPath(); g.arc(x + 0.15, y + 0.1, 1.05, 0, 7); g.fill();
    g.strokeStyle = 'rgba(20,10,5,.75)'; g.lineWidth = 0.9; g.beginPath(); g.moveTo(x - 2.2, y - 0.6); g.lineTo(x + 2.2, y - 0.6); g.stroke();
  },
  depth(g, ch, s){   // front / back view
    const L = ch.look, k = this.scale, back = ch.dir === 'back', sg = back ? -1 : 1, p = DepthAnimationFactory.pose(ch.clip, ch.t), pu = ch.pu || 0, pk = pu > 0 ? Math.sin(Math.min(1, pu / 0.65) * 3.14) : 0, bw = ArrowFactory.pose(ch), bo = bw ? { pull: bw.pull, nock: !ch.bow.firing } : undefined;
    g.fillStyle = 'rgba(0,0,0,.3)'; g.beginPath(); g.ellipse(s.x, s.y, 14 * k, 14 * k * CONFIG.tilt, 0, 0, 7); g.fill();
    g.save(); g.translate(s.x + p.sway * 0.4 * k, s.y - p.bob * k); g.scale(k, k);
    const leg = (x, sw, raise) => {
      const len = 30 + sw * p.c.stride * sg - raise, top = -31;
      g.fillStyle = L.pants; g.beginPath(); g.roundRect(x - 4.8, top, 9.6, len - 5, 3.5); g.fill();
      g.fillStyle = 'rgba(0,0,0,.16)'; g.fillRect(x + (x < 0 ? 2 : -4.8), top + 6, 2.8, len - 16);
      g.fillStyle = L.shoe; g.beginPath(); g.roundRect(x - 5.6, top + len - 8, 11.2, 8, 3); g.fill();
      g.fillStyle = '#0b0b0b'; g.fillRect(x - 5.6, top + len - 1, 11.2, 1.6);
      ArmorFactory.legDepth(g, ch, x, top, len);
    };
    const tool = ch === player ? ToolFactory.held() : (ch.toolNet || null), arm = (x, sw) => {
      const pn = x > 0 ? pk : 0, len = 25 + sw * p.c.arm * sg + pn * 6 * (back ? -1 : 1), side = Math.sign(x);
      g.save(); g.translate(x, -53 - pn * 7); g.rotate(side * 0.06 - pn * side * 0.25); if (bw) g.rotate(-side * (x > 0 ? 1.15 + bw.rc * 0.12 : 0.9) * bw.ae);   // aiming: both arms swing out to the sides, one holds the bow, the other draws the string
      g.fillStyle = L.skin; g.beginPath(); g.roundRect(-3.1, 8, 6.2, len - 8, 3); g.fill(); g.beginPath(); g.arc(0, len, 3.3, 0, 7); g.fill();   // forearm + hand
      if (x > 0 && tool) ToolFactory.drawHeld(g, tool, 0, len, bw && tool.type === 'bow' ? 'aimdepth' : 'depth', bw && tool.type === 'bow' ? bo : undefined);
      if (x < 0) GuardFactory.draw(g, ch, 0, len, 'depth');
      g.fillStyle = L.shirt; g.beginPath(); g.roundRect(-4.4, -1.5, 8.8, 12.5, 3.6); g.fill();                                                    // short sleeve
      g.fillStyle = 'rgba(0,0,0,.2)'; g.fillRect(-4.4, 9.4, 8.8, 1.4); ArmorFactory.pauldron(g, ch, 4.8); g.restore();
    };
    leg(-5, p.L, p.raiseL); leg(5, p.R, p.raiseR);
    g.save(); g.translate(0, -42); g.rotate(p.tilt); g.translate(0, 42);
    const aimArms = () => {   // aiming head-on / from behind: the bow arm points straight at (or away from) the camera so it is very short; the string hand sits at the cheek with the elbow lifted out wide
      const ae = bw.ae, tr = Math.sin(ch.t * 9) * 0.5 * bw.pull * ae, bx = 14 - 2 * ae, by = -53 + (back ? -8 : 3) * ae + tr, rest = [-14, -53 + 25];
      const dx = rest[0] + (-6 - rest[0]) * ae * (0.35 + 0.65 * bw.pull) - bw.rc * 9, dy = rest[1] + ((back ? -62 : -59) - rest[1]) * ae * (0.35 + 0.65 * bw.pull);
      g.save(); g.lineCap = 'round'; g.strokeStyle = L.skin; g.fillStyle = L.skin; g.lineWidth = 6; g.beginPath(); g.moveTo(14, -53); g.lineTo(bx, by); g.stroke(); g.beginPath(); g.arc(bx, by, 3.2 + 1.4 * ae * (back ? 0 : 1), 0, 7); g.fill();
      g.strokeStyle = L.shirt; g.lineWidth = 8.8; g.beginPath(); g.moveTo(14, -53); g.lineTo(14 - (14 - bx) * 0.5, -53 + (by + 53) * 0.5); g.stroke();
      if (tool && tool.type === 'bow') ToolFactory.drawHeld(g, tool, bx, by, 'aimdepth', { pull: 0, nock: !ch.bow.firing, depth: true, back });
      this.ikArm(g, L, -14, -53, dx, dy, 1); g.restore();
    };
    if (bw && back) aimArms(); else if (!bw){ arm(-14, p.R); arm(14, p.L); }
    g.fillStyle = L.skin; g.beginPath(); g.roundRect(-3.6, -64, 7.2, 9, 2); g.fill();   // neck
    const tp = new Path2D(); tp.moveTo(-13.5, -54); tp.quadraticCurveTo(-13.5, -58.5, -9, -58.8); tp.lineTo(9, -58.8); tp.quadraticCurveTo(13.5, -58.5, 13.5, -54); tp.lineTo(11, -30); tp.lineTo(-11, -30); tp.closePath();
    g.fillStyle = L.shirt; g.fill(tp); g.fillStyle = this.shade(g, -13.5, 13.5, 0.24); g.fill(tp); ArmorFactory.chestDepth(g, ch, tp, back);   // t-shirt with shaded sides
    g.fillStyle = 'rgba(0,0,0,.18)'; g.fillRect(-11, -33.4, 22, 1.2);                                  // hem
    g.fillStyle = '#2b2118'; g.fillRect(-11.2, -31.6, 22.4, 3.6);                                        // belt
    if (!back){
      g.fillStyle = '#b9a56a'; g.fillRect(-2.4, -31.9, 4.8, 4.2); g.fillStyle = '#2b2118'; g.fillRect(-1.2, -30.9, 2.4, 2.4);   // buckle
      g.fillStyle = L.skin; g.beginPath(); g.arc(0, -58.7, 4.2, 0, Math.PI); g.fill();                                        // neckline
      g.strokeStyle = 'rgba(0,0,0,.28)'; g.lineWidth = 1.5; g.beginPath(); g.arc(0, -58.7, 4.7, 0.1, Math.PI - 0.1); g.stroke();
    } else { g.strokeStyle = 'rgba(0,0,0,.22)'; g.lineWidth = 1.4; g.beginPath(); g.arc(0, -58.9, 4.5, 0.1, Math.PI - 0.1); g.stroke(); g.beginPath(); g.moveTo(0, -55); g.lineTo(0, -34); g.stroke(); }
    g.restore();
    // head
    g.save(); g.translate(p.sway * 0.5, -67 + Math.sin(ch.t * p.c.freq * 2) * (p.c.bob > 0 ? 0.6 : 0)); g.rotate(p.tilt * -0.8);
    g.fillStyle = L.skin; g.beginPath(); g.ellipse(0, 0, 7.8, 8.8, 0, 0, 7); g.fill();
    g.beginPath(); g.arc(-7.8, 1, 1.9, 0, 7); g.arc(7.8, 1, 1.9, 0, 7); g.fill();   // ears
    g.fillStyle = L.hair;
    if (back){ g.beginPath(); g.ellipse(0, -0.6, 8.5, 9.3, 0, 0, 7); g.fill(); }
    else {
      g.beginPath(); g.ellipse(0, -1.6, 8.6, 8.4, 0, Math.PI, 0); g.lineTo(7.8, -1.2); g.quadraticCurveTo(0, -4.4, -7.8, -1.2); g.closePath(); g.fill(); g.fillRect(-8.4, -1.4, 1.9, 4.6); g.fillRect(6.5, -1.4, 1.9, 4.6);   // short hair + fringe + sideburns
      this.eye(g, -3.5, 1.5); this.eye(g, 3.5, 1.5);
      g.strokeStyle = L.hair; g.lineWidth = 1.5; g.lineCap = 'round'; g.beginPath(); g.moveTo(-6, -1.5); g.lineTo(-1.4, -0.7); g.moveTo(1.4, -0.7); g.lineTo(6, -1.5); g.stroke();   // stern brows
      g.strokeStyle = 'rgba(120,70,50,.55)'; g.lineWidth = 1; g.beginPath(); g.moveTo(-0.4, 2); g.lineTo(-0.9, 4.5); g.lineTo(0.9, 4.5); g.stroke();   // nose
      g.strokeStyle = '#7a3f33'; g.lineWidth = 1.3; g.beginPath(); g.moveTo(-2.8, 6.5); g.lineTo(2.8, 6.5); g.stroke();                                // flat, serious mouth
      g.strokeStyle = 'rgba(120,70,50,.25)'; g.lineWidth = 1; g.beginPath(); g.moveTo(-1.6, 7.6); g.lineTo(1.6, 7.6); g.stroke();
    }
    ArmorFactory.helmetDepth(g, ch, back);
    g.restore(); if (bw && !back) aimArms(); g.restore();
  },
  ikArm(g, L, sx, sy, hx, hy, es){   // a two-bone arm from the shoulder to a hand position: upper arm with the sleeve, forearm, hand. es = which way the elbow bends (+1 / -1)
    const l1 = 13, l2 = 14.5; let dx = hx - sx, dy = hy - sy, d = Math.hypot(dx, dy) || 0.01;
    if (d > l1 + l2 - 0.2){ const k = (l1 + l2 - 0.2) / d; hx = sx + dx * k; hy = sy + dy * k; dx = hx - sx; dy = hy - sy; d = l1 + l2 - 0.2; }
    d = Math.max(d, 2); const ux = dx / d, uy = dy / d, a = (l1 * l1 - l2 * l2 + d * d) / (2 * d), h = Math.sqrt(Math.max(0, l1 * l1 - a * a));
    const ex = sx + ux * a + uy * h * es, ey = sy + uy * a - ux * h * es, mx = sx + (ex - sx) * 0.62, my = sy + (ey - sy) * 0.62;
    g.save(); g.lineCap = 'round'; g.lineJoin = 'round'; g.strokeStyle = L.skin; g.fillStyle = L.skin;
    g.lineWidth = 6; g.beginPath(); g.moveTo(ex, ey); g.lineTo(hx, hy); g.stroke(); g.beginPath(); g.arc(hx, hy, 3.3, 0, 7); g.fill();
    g.lineWidth = 6.2; g.beginPath(); g.moveTo(mx, my); g.lineTo(ex, ey); g.stroke();
    g.strokeStyle = L.shirt; g.lineWidth = 8.8; g.beginPath(); g.moveTo(sx, sy); g.lineTo(mx, my); g.stroke(); g.restore();
  },
  punchArm(u){ return u < 0.3 ? 0.7 * (u / 0.3) : u < 0.5 ? 0.7 - 2.3 * ((u - 0.3) / 0.2) : u < 0.65 ? -1.6 : -1.6 * (1 - (u - 0.65) / 0.35); },   // wind up back, snap forward, hold, come back (radians)
  side(g, ch, s){   // left / right view (ch.face flips it)
    const L = ch.look, k = this.scale, p = AnimationFactory.pose(ch.clip, ch.t), pu = ch.pu || 0, bw = ArrowFactory.pose(ch), bo = bw ? { pull: bw.pull, nock: !ch.bow.firing } : undefined, aimBow = !!(bw && ToolFactory.held() && ToolFactory.held().type === 'bow'), thAim = bw ? -1.88 + Math.sin(ch.t * 9) * 0.015 * bw.pull : 0;
    g.fillStyle = 'rgba(0,0,0,.3)'; g.beginPath(); g.ellipse(s.x, s.y, 14 * k, 14 * k * CONFIG.tilt, 0, 0, 7); g.fill();
    g.save(); g.translate(s.x + (pu > 0 ? Math.sin(pu * 3.14) * 3 * ch.face * k : 0), s.y - p.bob * k); g.scale(ch.face * k, k); g.rotate(p.lean + (pu > 0 ? Math.sin(pu * 3.14) * 0.12 : 0) + (bw ? 0.05 * bw.ae - bw.rc * 0.1 : 0));
    const leg = a => {
      g.save(); g.translate(0, -30); g.rotate(a);
      g.fillStyle = L.pants; g.beginPath(); g.roundRect(-4.6, -1, 9.2, 26, 3.6); g.fill();
      g.fillStyle = L.shoe; g.beginPath(); g.roundRect(-4.6, 24, 12.6, 7, 3); g.fill(); g.fillStyle = '#0b0b0b'; g.fillRect(-4.6, 30, 12.6, 1.4);
      ArmorFactory.legSide(g, ch);
      g.restore();
    };
    const tool = ch === player ? ToolFactory.held() : (ch.toolNet || null), arm = (a, tl, gd) => {
      g.save(); g.translate(0, -53); g.rotate(a);
      g.fillStyle = L.skin; g.beginPath(); g.roundRect(-3, 8, 6, 16, 3); g.fill(); g.beginPath(); g.arc(0, 24.4, 3.2, 0, 7); g.fill(); if (tl) ToolFactory.drawHeld(g, tl, 0, 24.4, aimBow ? 'aim' : 'side', aimBow ? Object.assign({ ang: a }, bo) : undefined); if (gd) GuardFactory.draw(g, ch, 0, 24.4, 'side');
      g.fillStyle = L.shirt; g.beginPath(); g.roundRect(-4.3, -2, 8.6, 12, 3.6); g.fill(); g.fillStyle = 'rgba(0,0,0,.2)'; g.fillRect(-4.3, 8, 8.6, 1.4); ArmorFactory.pauldron(g, ch, 4.9);
      g.restore();
    };
    arm(bw ? p.armR * (1 - bw.ae) + thAim * bw.ae : p.armR, aimBow ? tool : undefined, true); leg(p.legR + (bw ? 0.22 * bw.ae : 0));   // aiming: the arm behind the body holds the bow straight out at shoulder height (the bow itself stays level)

const JoystickFactory = {
  move: {x:0, y:0}, active: false, start: {x:0, y:0}, keys: {},
  init(){
    window.addEventListener('keydown', e => this.keys[e.key.toLowerCase()] = true);
    window.addEventListener('keyup', e => this.keys[e.key.toLowerCase()] = false);
    const zone = document.getElementById('joyZone'), base = document.getElementById('joyBase'), stick = document.getElementById('joyStick');
    const R = CONFIG.joystickMaxRadius, K = R * 0.9;   // base radius / knob size, both from the one setting
    base.style.width = base.style.height = R * 2 + 'px'; stick.style.width = stick.style.height = K + 'px';
    let id = null;
    const hide = () => { base.style.display = stick.style.display = 'none'; this.move.x = this.move.y = 0; this.active = false; id = null; };
    zone.addEventListener('pointerdown', e => {           // base appears wherever you touch
      id = e.pointerId; zone.setPointerCapture(id);
      this.start = {x:e.clientX, y:e.clientY}; this.active = true;
      base.style.left = (e.clientX-R)+'px'; base.style.top = (e.clientY-R)+'px';
      stick.style.left = (e.clientX-K/2)+'px'; stick.style.top = (e.clientY-K/2)+'px';
      base.style.display = stick.style.display = 'block'; e.preventDefault();
    });
    zone.addEventListener('pointermove', e => {
      if (e.pointerId !== id) return;
      let dx = e.clientX - this.start.x, dy = e.clientY - this.start.y;   // delta from ORIGINAL touch point
      const max = CONFIG.joystickMaxRadius, dist = Math.min(Math.hypot(dx, dy), max), ang = Math.atan2(dy, dx);
      dx = Math.cos(ang)*dist; dy = Math.sin(ang)*dist;
      stick.style.left = (this.start.x+dx-K/2)+'px'; stick.style.top = (this.start.y+dy-K/2)+'px';
      this.move.x = dx/max; this.move.y = dy/max;
    });
    zone.addEventListener('pointerup', hide); zone.addEventListener('pointercancel', hide);
  },
  getMoveVector(){
    let x = 0, y = 0;
    if (this.active){ x = CONFIG.invertX ? -this.move.x : this.move.x; y = this.move.y; }
    else {
      const k = this.keys;
      if (k['w']||k['arrowup']) y -= 1; if (k['s']||k['arrowdown']) y += 1;
      if (k['a']||k['arrowleft']) x -= 1; if (k['d']||k['arrowright']) x += 1;
    }
    const len = Math.hypot(x, y); if (len > 1){ x /= len; y /= len; }
    return {x, y, mag: Math.min(len, 1)};
  }
};

/* ============ CAPSULE FACTORY (rendered crystal capsules, one colour per gimmick: strength red, speed blue, defense green. They lie in chests and go into the bag when taken. What a capsule DOES comes later) ============ */
const CapsuleFactory = {

    g.fillStyle = 'rgba(' + T.gl + ',.75)'; g.beginPath(); g.moveTo(0, -cr * 1.5); g.lineTo(cr * 0.75, -cr * 0.2); g.lineTo(0, -cr * 0.2); g.closePath(); g.fill();
    g.fillStyle = 'rgba(0,0,0,.25)'; g.beginPath(); g.moveTo(0, -cr * 0.2); g.lineTo(cr * 0.75, -cr * 0.2); g.lineTo(0, cr * 1.5); g.closePath(); g.fill();
