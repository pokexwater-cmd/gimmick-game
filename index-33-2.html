  },
  drawFront(g, c, cam, W, H){
    this.ready(); const s = GroundFactory.toScreen(c.x, c.y, cam, W, H);
    if (c.ra < 0.99){ g.save(); g.globalAlpha = c.ra; g.drawImage(this.front, s.x - this.ox, s.y - this.oy, this.sw, this.sh); g.restore(); }
    else g.drawImage(this.front, s.x - this.ox, s.y - this.oy, this.sw, this.sh);
  }
};

/* ============ VILLAGER FACTORY (the look of a villager: a human in a warm hooded parka with a fur-trimmed hood, scarf, mittens and boots. 24 looks: 4 skin tones x 6 coat colours, picked by `variant` 0..23)
   Animations: idle (breathing), walk (calm), run (scared sprint, mouth open), cower (hands up by the face, shaking). Pure vector, drawn into ZombieCache-style baked sprites (VillagerCache below), so it is cheap.
   v = VillagerFactory.create(x, y, variant) with { x, y, face (1 / -1), dir ('side' | 'front' | 'back'), clip ('idle' | 'walk' | 'run' | 'cower'), t }. VillagerFactory.draw(ctx, v, screenPos) draws one) ============ */
const VillagerFactory = {
  size: 0.95, walkSpeed: 7, runSpeed: 13,
  skins: ['#f2c9a0', '#dca779', '#b07a52', '#8a5a3c'],
  coats: ['#2f6fb5', '#b5412f', '#3f8f5a', '#7a4fa0', '#c98a2a', '#3d7f8f'], coatDk: ['#1f4f86', '#85291d', '#2a6741', '#553573', '#94621a', '#285b68'],
  C: { line: '#1b2230', fur: '#f1e7d6', furDk: '#cdbfa8', pants: '#4a4f63', pantsDk: '#363a4b', boot: '#3a2c24', belt: '#4b3426', eye: '#1b2230', mitt: '#e4dccb', nose: '#d98a7c' },
  create(x, y, variant){ return { x, y, face: 1, dir: 'side', clip: 'idle', t: Math.random() * 3, variant: (variant | 0) % 24 }; },
  look(v){ const n = (v.variant | 0) % 24, c = Math.floor(n / 4) % 6; return { sk: this.skins[n % 4], coat: this.coats[c], dk: this.coatDk[c], scarf: this.coats[(c + 2) % 6] }; },
  update(v, dt){ v.t += dt; },
  pose(v){
    const t = v.t, P = { ph: 0, legN: 0, legF: 0, kN: 0, kF: 0, aN1: 0.1, aN2: -0.25, aF1: -0.08, aF2: -0.2, dip: 0, lean: 0.03, mouth: 0, up: false, sh: 0 };
    if (v.clip === 'idle'){ const s = Math.sin(t * 1.8); P.dip = (1 + s) * 0.35; P.aN1 = 0.1 + 0.04 * s; P.aF1 = -0.08 - 0.04 * s; }
    else if (v.clip === 'cower'){ P.up = true; P.aN1 = -2.3; P.aN2 = -1.0; P.aF1 = -2.2; P.aF2 = -1.1; P.lean = 0.16; P.mouth = 1; P.dip = 1.6; P.sh = Math.sin(t * 22) * 0.7; }
    else if (v.clip === 'give'){ P.aN1 = -1.45; P.aN2 = 0.12; P.aF1 = 0.12; P.lean = 0.05; P.dip = 0.4 + Math.sin(t * 3) * 0.3; }   // holds an apple out to the bodyguard
    else {
      const run = v.clip === 'run', ph = t * (run ? this.runSpeed : this.walkSpeed), sw = Math.sin(ph), amp = run ? 0.85 : 0.5; P.ph = ph;
      P.legN = sw * amp; P.legF = -sw * amp; P.kN = Math.max(0, -Math.cos(ph)) * (run ? 1.0 : 0.5); P.kF = Math.max(0, Math.cos(ph)) * (run ? 1.0 : 0.5);
      P.aN1 = -sw * amp * 0.95; P.aF1 = sw * amp * 0.95; P.aN2 = P.aF2 = run ? -1.1 : -0.3; P.dip = Math.abs(Math.cos(ph)) * (run ? 2.6 : 1.4); P.lean = run ? 0.26 : 0.05; P.mouth = run ? 0.9 : 0;
    }
    return P;
  },
  limb(g, w, len, r, fill){ g.fillStyle = fill; g.beginPath(); g.roundRect(-w / 2, 0, w, len, r); g.fill(); g.strokeStyle = this.C.line; g.lineWidth = 1; g.stroke(); },
  arm(g, sx, sy, a1, a2, L, far){   // parka sleeve (two segments), fur cuff, mitten
    const C = this.C, col = far ? L.dk : L.coat; g.save(); g.translate(sx, sy); g.rotate(a1); this.limb(g, 6.6, 9.8, 3, col); g.translate(0, 9.4); g.rotate(a2); this.limb(g, 5.8, 8.8, 3, col);
    g.fillStyle = C.fur; g.fillRect(-3.2, 7, 6.4, 2.4); g.fillStyle = C.mitt; g.beginPath(); g.arc(0, 10.8, 3.4, 0, 7); g.fill(); g.strokeStyle = C.line; g.lineWidth = 1; g.stroke(); g.restore();
  },
  leg(g, hx, hy, ang, bend, near){
    const C = this.C; g.save(); g.translate(hx, hy); g.rotate(ang); this.limb(g, 7.6, 11.8, 3, near ? C.pants : C.pantsDk); g.translate(0, 11.2); g.rotate(bend); this.limb(g, 6.6, 10.6, 3, near ? C.pants : C.pantsDk);
    g.fillStyle = C.boot; g.beginPath(); g.roundRect(-3.6, 8.2, 10.4, 5.4, 2); g.fill(); g.strokeStyle = C.line; g.stroke(); g.fillStyle = C.fur; g.fillRect(-3.6, 7.4, 7.4, 2.2); g.restore();
  },
  drawSide(g, v, s, P){
    const C = this.C, L = this.look(v), k = this.size, f = v.face || 1, hipY = -23 + P.dip;
    g.fillStyle = 'rgba(0,0,0,.3)'; g.beginPath(); g.ellipse(s.x, s.y, 16 * k, 16 * k * CONFIG.tilt, 0, 0, 7); g.fill();
    g.save(); g.translate(s.x + P.sh, s.y); g.scale(f * k * (v.dir !== 'side' ? 0.9 : 1), k);
    this.leg(g, -1, hipY, P.legF, P.kF, false); this.leg(g, 1, hipY, P.legN, P.kN, true);
    g.save(); g.translate(0, hipY); g.rotate(P.lean);
    this.arm(g, -1, -21, P.aF1, P.aF2, L, true);
    g.beginPath(); g.moveTo(-7.4, 4); g.lineTo(-8, -9); g.quadraticCurveTo(-8.4, -20, -3.6, -23.4); g.lineTo(4, -23.4); g.quadraticCurveTo(8.2, -20, 7.8, -9); g.lineTo(8.8, 4); g.closePath();
    g.fillStyle = L.coat; g.fill(); g.strokeStyle = C.line; g.lineWidth = 1.2; g.stroke();
    g.fillStyle = C.fur; g.beginPath(); g.roundRect(-7.6, 1.2, 16.4, 3.6, 1.6); g.fill(); g.fillStyle = C.belt; g.fillRect(-7.9, -8, 16, 2.4);
    g.fillStyle = L.scarf; g.beginPath(); g.roundRect(-5.4, -25, 11, 4.4, 2); g.fill(); g.strokeStyle = C.line; g.lineWidth = 1; g.stroke();
    g.save(); g.translate(1, -25); g.rotate(P.lean * 0.5 + (P.up ? 0.15 : 0));   // head with the hood
    g.fillStyle = L.coat; g.beginPath(); g.arc(-1, -9, 10.2, 0, 7); g.fill(); g.strokeStyle = C.line; g.lineWidth = 1.2; g.stroke();
    g.fillStyle = L.sk; g.beginPath(); g.arc(1.8, -8.6, 6.8, 0, 7); g.fill(); g.strokeStyle = C.line; g.lineWidth = 1; g.stroke();
    g.strokeStyle = C.fur; g.lineWidth = 3.6; g.lineCap = 'round'; g.beginPath(); g.arc(1.2, -8.8, 8.6, -2.6, 1.9); g.stroke();   // fur edge of the hood
    g.fillStyle = C.eye; g.beginPath(); g.arc(5, -9.6, 1.2, 0, 7); g.fill();
    g.fillStyle = C.nose; g.beginPath(); g.ellipse(8, -7, 1.9, 1.5, 0, 0, 7); g.fill();
    g.fillStyle = 'rgba(230,110,110,.45)'; g.beginPath(); g.arc(3.4, -6, 1.7, 0, 7); g.fill();
    if (P.mouth > 0.3){ g.fillStyle = '#4a1d1d'; g.beginPath(); g.ellipse(5.4, -3.6, 1.7, 1 + P.mouth * 1.8, 0, 0, 7); g.fill(); } else { g.strokeStyle = C.line; g.lineWidth = 1; g.beginPath(); g.moveTo(4, -3.6); g.lineTo(6.8, -3.8); g.stroke(); }
    g.restore();
    this.arm(g, 1, -21, P.aN1, P.aN2, L, false);
    g.restore(); g.restore();
  },
  drawDepth(g, v, s, P){
    const C = this.C, L = this.look(v), k = this.size, back = v.dir === 'back', hipY = -23 + P.dip, sg = Math.sin(P.ph), run = v.clip === 'run', up = P.up;
    g.fillStyle = 'rgba(0,0,0,.3)'; g.beginPath(); g.ellipse(s.x, s.y, 16 * k, 16 * k * CONFIG.tilt, 0, 0, 7); g.fill();
    g.save(); g.translate(s.x + P.sh, s.y); g.scale(k, k);
    for (const [x, lift] of [[-4, Math.max(0, -sg) * (run ? 6 : 3)], [4, Math.max(0, sg) * (run ? 6 : 3)]]){
      g.save(); g.translate(x, hipY); this.limb(g, 7.8, 21 - lift - P.dip, 3, C.pants); g.fillStyle = C.boot; g.beginPath(); g.roundRect(-4.4, 17 - lift - P.dip, 8.8, 5.4, 2); g.fill(); g.strokeStyle = C.line; g.stroke(); g.fillStyle = C.fur; g.fillRect(-4.2, 16.4 - lift - P.dip, 8.4, 2); g.restore();
    }
    g.save(); g.translate(0, hipY);
    const armD = (x, sw, far) => {   // front / back arm: hangs, swings up and down; both go up when cowering
      g.save(); g.translate(x, -20); g.rotate(up ? (x < 0 ? 0.5 : -0.5) : (x < 0 ? 0.1 : -0.1)); const len = up ? 11 : 17 - Math.abs(sw) * 4; this.limb(g, 6.6, len, 3, far ? L.dk : L.coat);
      g.fillStyle = C.mitt; g.beginPath(); g.arc(0, len + 1, 3.4, 0, 7); g.fill(); g.strokeStyle = C.line; g.stroke(); g.restore();
    };
    if (back){ armD(-10, sg, true); armD(10, -sg, false); }
    g.beginPath(); g.moveTo(-9, 4); g.lineTo(-9.4, -10); g.quadraticCurveTo(-9.6, -20, -5, -23.4); g.lineTo(5, -23.4); g.quadraticCurveTo(9.6, -20, 9.4, -10); g.lineTo(9, 4); g.closePath();
    g.fillStyle = L.coat; g.fill(); g.strokeStyle = C.line; g.lineWidth = 1.2; g.stroke();
    g.fillStyle = C.fur; g.beginPath(); g.roundRect(-9, 1.2, 18, 3.6, 1.6); g.fill(); g.fillStyle = C.belt; g.fillRect(-9.2, -8, 18.4, 2.4);
    if (!back){ g.strokeStyle = L.dk; g.lineWidth = 1.4; g.beginPath(); g.moveTo(0, -22); g.lineTo(0, 1); g.stroke(); g.fillStyle = C.fur; g.fillRect(-1.4, -14, 2.8, 2.8); }
    g.fillStyle = L.scarf; g.beginPath(); g.roundRect(-6.4, -25.4, 12.8, 4.6, 2); g.fill(); g.strokeStyle = C.line; g.lineWidth = 1; g.stroke();
    g.save(); g.translate(0, -25.4); g.rotate(P.lean * 0.2);
    g.fillStyle = L.coat; g.beginPath(); g.arc(0, -9.4, 10.6, 0, 7); g.fill(); g.strokeStyle = C.line; g.lineWidth = 1.2; g.stroke();
    if (!back){
      g.fillStyle = L.sk; g.beginPath(); g.ellipse(0, -8.6, 7.2, 7.4, 0, 0, 7); g.fill(); g.strokeStyle = C.line; g.lineWidth = 1; g.stroke();
      g.strokeStyle = C.fur; g.lineWidth = 3.6; g.lineCap = 'round'; g.beginPath(); g.ellipse(0, -8.8, 8.8, 9, 0, 0, 6.283); g.stroke();
      g.fillStyle = C.eye; g.beginPath(); g.arc(-3, -9.4, 1.2, 0, 7); g.arc(3, -9.4, 1.2, 0, 7); g.fill();
      g.fillStyle = C.nose; g.beginPath(); g.ellipse(0, -6.6, 1.7, 1.4, 0, 0, 7); g.fill(); g.fillStyle = 'rgba(230,110,110,.45)'; g.beginPath(); g.arc(-4.6, -6, 1.7, 0, 7); g.arc(4.6, -6, 1.7, 0, 7); g.fill();
      if (P.mouth > 0.3){ g.fillStyle = '#4a1d1d'; g.beginPath(); g.ellipse(0, -3.4, 2, 1 + P.mouth * 1.8, 0, 0, 7); g.fill(); } else { g.strokeStyle = C.line; g.lineWidth = 1; g.beginPath(); g.moveTo(-2, -3.4); g.lineTo(2, -3.4); g.stroke(); }
    } else { g.strokeStyle = L.dk; g.lineWidth = 1.4; g.beginPath(); g.moveTo(0, -19); g.lineTo(0, -3); g.stroke(); g.strokeStyle = C.fur; g.lineWidth = 3; g.lineCap = 'round'; g.beginPath(); g.arc(0, -9.4, 9.4, 0.4, 2.74); g.stroke(); }
    g.restore();
    if (!back){ armD(-10, sg, true); armD(10, -sg, false); }
    g.restore(); g.restore();
  },
  apple(g, v, s){   // the apple in his outstretched hand
    const f = v.face || 1, k = this.size, x = s.x + f * 21 * k, y = s.y - 40 * k + Math.sin(v.t * 3) * 0.6;
    g.fillStyle = '#d63a2e'; g.beginPath(); g.arc(x, y, 4.6, 0, 7); g.fill(); g.strokeStyle = this.C.line; g.lineWidth = 1; g.stroke();
    g.fillStyle = 'rgba(255,255,255,.45)'; g.beginPath(); g.arc(x - 1.5, y - 1.5, 1.2, 0, 7); g.fill();
    g.strokeStyle = '#4a2d1a'; g.beginPath(); g.moveTo(x, y - 4.2); g.lineTo(x + 0.8, y - 7); g.stroke();
    g.fillStyle = '#4fa84a'; g.beginPath(); g.ellipse(x + 3, y - 6.2, 3, 1.6, -0.5, 0, 7); g.fill();
  },
  draw(g, v, s){ const P = this.pose(v); if (v.dir === 'front' || v.dir === 'back') this.drawDepth(g, v, s, P); else this.drawSide(g, v, s, P); if (v.clip === 'give') this.apple(g, v, s); }
};

/* ============ VILLAGER CACHE (each villager pose is drawn ONCE into a small offscreen canvas, then only drawImage'd; same trick as ZombieCache) ============ */
const VillagerCache = {
  on: true, map: new Map(), dpr: 0, made: 0, cap: 140, maxNew: 3, W: 110, H: 120, ox: 55, oy: 96,
  draw(g, v, s){
    const F = VillagerFactory, k = CONFIG.dprNow;
    if (!this.on || !k){ F.draw(g, v, s); return; }
    if (Math.abs(k - this.dpr) > 0.01){ this.map.clear(); this.dpr = k; }
    const sp = v.clip === 'run' ? F.runSpeed : v.clip === 'walk' ? F.walkSpeed : v.clip === 'cower' ? 22 : 1.8, per = 2 * Math.PI / sp, n = (v.clip === 'idle' || v.clip === 'give') ? 16 : 24, qi = Math.floor((((v.t % per) + per) % per) / per * n);
    const key = v.dir + '|' + (v.face || 1) + '|' + v.clip + '|' + (v.variant | 0) + '|' + qi;
    let e = this.map.get(key);
    if (e){ this.map.delete(key); this.map.set(key, e); }
    else {
      if (this.made >= this.maxNew){ F.draw(g, v, s); return; }
      this.made++;
      const c = document.createElement('canvas'); c.width = Math.ceil(this.W * k); c.height = Math.ceil(this.H * k); const cg = c.getContext('2d'); cg.scale(k, k);
      F.draw(cg, { dir: v.dir, face: v.face, clip: v.clip, variant: v.variant, t: qi * per / n }, { x: this.ox, y: this.oy });
      e = c; this.map.set(key, e); if (this.map.size > this.cap) this.map.delete(this.map.keys().next().value);
    }
    g.drawImage(e, s.x - this.ox, s.y - this.oy, this.W, this.H);
  }
};

/* ============ VILLAGER SYSTEM (the people of the igloos: `perIgloo` villagers live in every igloo.
   LIFE     they stay INSIDE the igloo (home) for a while, walk out through the door, wander around it (never far), then walk back in. Calm and slow.
   FEAR     any zombie (normal or ice) within `fearR` and they sprint: back to their igloo door if it is reachable, otherwise straight away from the zombie. Inside, they cower while zombies stand near and only come out again when the zombies are gone.
   DANGER   zombies hunt villagers like players (the closest target wins) and claw them / hit them with snowballs. A villager INSIDE an igloo can't be hurt: the fire keeps the zombies out (IglooFactory.repel). Dead villagers are replaced slowly (respawnT) while nobody is near.
   NET      the HOST runs all the villager brains and sends 'vs' snapshots (same as the zombies); everybody else just shows them. Tune the numbers right below) ============ */
const VillagerSystem = {
  perIgloo: 5, spawnR: 2400, freeze: 1900, fearR: 260, calmR: 430, walk: 30, run: 68, hp: 30, deadT: 20, respawnT: 120, sendEvery: 0.1, roamR: 330,   // villagers per igloo / spawn when a player is this near / stand still beyond this / run when a zombie is this close / calm again beyond this / walk + run px/s / health / seconds a body lies / seconds before a lost villager is replaced / snapshot gap / how far they roam
  list: [], spawned: new Set(), igs: {}, lost: {}, nid: 0, spT: 0, popT: 0, sendT: 0, fullT: 0,
  aidR: 420, aidGap: 34, feedT: 1.5, tradeR: 90, tradeTTL: 6,   // AID: villagers this close to a hurt / fallen bodyguard come to help / how near they stand / seconds to hand over the apple (then he is back at full health) ; TRADE: how near a trader must be / seconds without a 'still trading' message before the villager walks on
  reset(){ this.list.length = 0; this.spawned.clear(); this.igs = {}; this.lost = {}; this.spT = 0; },
  isHost(){ return ZombieSystem.isHost(); },
  make(id, c, x, y, variant){
    const R = Math.random, v = VillagerFactory.create(x, y, variant === undefined ? Math.floor(R() * 24) : variant);
    Object.assign(v, { id, ig: c, key: c.key, hp: this.hp, max: this.hp, spd: 0.92 + R() * 0.16, state: 'home', timer: 4 + R() * 28, wps: [], idle: R() * 3, flinch: 0, vx: 0, vy: 0, tx: x, ty: y, cc: 0, rn: false, inside: true, face: R() < 0.5 ? 1 : -1, fT: 0, tgt: null, tw: {}, feed: 0, g: null, trading: false });
    this.igs[c.key] = c; this.list.push(v); return v;
  },
  inSpot(c){ const a = Math.random() * 6.283, r = 18 + Math.random() * 78; return { x: c.x + Math.cos(a) * r, y: c.y + Math.sin(a) * r * 0.8 }; },
  spawnTick(dt, pl){
    this.spT -= dt; if (this.spT > 0 || !pl.length) return; this.spT = 1;
    for (const p of pl){
      const ci = Math.floor(p.ch.x / IglooFactory.cell), cj = Math.floor(p.ch.y / IglooFactory.cell);
      for (let j = -1; j <= 1; j++) for (let i = -1; i <= 1; i++){
        const c = IglooFactory.at(ci + i, cj + j); if (!c || this.spawned.has(c.key) || Math.hypot(p.ch.x - c.x, p.ch.y - c.y) > this.spawnR) continue;
        this.spawned.add(c.key); for (let k = 0; k < this.perIgloo; k++){ const q = this.inSpot(c); this.make(NetFactory.id + 'v' + (++this.nid), c, q.x, q.y); }
      }
    }
  },
  repopulate(dt, pl){   // a lost villager is replaced inside its igloo after a while, only when nobody is close
    this.popT -= dt; if (this.popT > 0) return; this.popT = 5; const now = performance.now() / 1000;
    for (const key in this.igs){
      const c = this.igs[key]; if (this.list.filter(v => v.key === key && !v.dead && !v.gone).length >= this.perIgloo) continue;
      if (now - (this.lost[key] || 0) < this.respawnT || pl.some(p => Math.hypot(p.ch.x - c.x, p.ch.y - c.y) < 900)) continue;
      const q = this.inSpot(c); this.make(NetFactory.id + 'v' + (++this.nid), c, q.x, q.y); this.lost[key] = now;
    }
  },
  // ---- helping the bodyguard (host) ----
  needy(v){   // the closest bodyguard within aidR who is hurt (or lying there), with no wall between: the villagers carry endless apples, so they can always heal him
    let best = null, bd = this.aidR;
    for (const b of BodyguardFactory.list){
      if (b.gone || (b.hp >= b.hpMax && !b.dead)) continue; if (b.dead && (b.downT || 0) >= BodyguardFactory.reviveWin) continue;
      const d = Math.hypot(b.x - v.x, b.y - v.y); if (d < bd && !IglooFactory.blocks(v.x, v.y, b.x, b.y)){ bd = d; best = b; }
    }
    return best;
  },
  feeder(b){ for (const v of this.list) if (!v.dead && !v.gone && v.state === 'aid' && v.g === b && Math.hypot(v.x - b.x, v.y - b.y) < this.aidGap + 70) return v; return null; },   // a villager coming with / holding an apple for this bodyguard
  // ---- trading (host) ----
  // TRADES: every villager buys apples / sticks / zombie veins for emeralds, and SELLS exactly 4 random things (any item or armor piece) (picked from his id, so every player sees the same list).
  // an offer = { give: [{ kind, qty }], get: { kind, qty } }. Prices are right here: change them freely
  buys: [ { give: [{ kind: 'apple', qty: 5 }], get: { kind: 'emerald', qty: 1 } }, { give: [{ kind: 'stick', qty: 10 }], get: { kind: 'emerald', qty: 1 } }, { give: [{ kind: 'veins', qty: 2 }], get: { kind: 'emerald', qty: 1 } } ],
  armorSale: [ ['iron_boots', 4], ['iron_helmet', 5], ['iron_legs', 6], ['iron_chest', 7] ],
  pool: [ ['arrow', 8, 1], ['torch', 4, 1], ['rope', 2, 1], ['log', 6, 1], ['stone', 8, 1], ['stick', 8, 1], ['apple', 4, 1], ['iron_ingot', 1, 2], ['copper_ingot', 1, 1], ['iron_arrow', 4, 2], ['stone_bowl', 1, 1], ['bow', 1, 3], ['stone_sword', 1, 2], ['stone_axe', 1, 2], ['copper_sword', 1, 3], ['copper_axe', 1, 3], ['iron_sword', 1, 5], ['iron_axe', 1, 5], ['iron_pickaxe', 1, 5], ['spear', 1, 3], ['iron_shield', 1, 6], ['backpack', 1, 6] ],   // [item, how many you get, emeralds it costs]
  offers(v){
    if (!v) return []; if (v.tr) return v.tr;
    let h = 2166136261; for (const ch of String(v.id)){ h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } h >>>= 0;
    const rnd = () => { h = (h + 0x6D2B79F5) >>> 0; let t = h; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };

  claw(z, claw){ for (const b of this.list) if (!b.dead && b.hp > 0 && Math.hypot(b.x - claw.x, b.y - claw.y) < claw.r + 22 && !IglooFactory.blocks(z.x, z.y, b.x, b.y)) this.hurt(b, claw.damage, z.x, z.y); },   // a zombie's claw
  ballHit(ball){ for (const b of this.list){ if (b.dead || b.hp <= 0 || Math.hypot(b.x - ball.x, b.y - ball.y) > SnowballFactory.hitR + 14) continue; this.hurt(b, SnowballFactory.damage, ball.x0, ball.y0); return true; } return false; },   // an ice zombie's snowball
  // ---- brain (host) ----
  move(b, tx, ty, sp, dt){   // same screen-speed trick as the player: vertical world speed is scaled up by the tilt
    const st = IglooFactory.steer(b.x, b.y, tx, ty); tx = st.x; ty = st.y;   // round the dome, never into it
    const dx = tx - b.x, dy = ty - b.y, t = CONFIG.tilt, vy = dy * t, n = Math.hypot(dx, vy) || 1;
    this.face(b, dx, dy); b.x += dx / n * sp * dt; b.y += vy / n * sp * dt / t; CollisionFactory.resolve(b);
  },
  face(b, dx, dy){ if (Math.abs(dx) > Math.abs(dy) * 1.25){ b.dir = 'side'; b.face = dx > 0 ? 1 : -1; } else b.dir = dy < 0 ? 'back' : 'front'; },
  foes(b){   // the hostile mobs inside his patrol area (zombies and ice zombies)
    const c = b.ig, L = this.patrolR * this.leash, out = [];
    for (const z of ZombieSystem.list){ if (z.dead || z.gone) continue; if (Math.hypot(z.x - c.x, z.y - c.y) <= L) out.push(z); }
    return out;
  },
  step(b, dt, host, pl){
    b.t += dt; if (b.gone) return;
    if (b.dead){ b.downT = (b.downT || 0) + dt; if (!host || b.downT < this.reviveWin) b.dead.t = Math.min(b.dead.t, this.holdAt()); }   // he lies there for a while (everywhere), so the villagers can still help him up
    if (b.dead || b.hp <= 0){ b.act = b.slam = b.aim = null; return; }
    if (!host){   // everybody else: glide to the host's position and keep the attack timers running between snapshots
      const k = Math.min(1, dt * 10); b.x += (b.tx - b.x) * k; b.y += (b.ty - b.y) * k;
      if (b.slam) b.slam.t += dt; if (b.aim){ b.aim.t += dt; if (b.aim.firing) b.aim.ft += dt; } return;
    }
    for (const k in b.cd) if (b.cd[k] > 0) b.cd[k] -= dt;
    if (!pl.some(p => Math.hypot(p.ch.x - b.x, p.ch.y - b.y) < this.freeze)){ if (!b.act) b.clip = 'idle'; return; }   // nobody around: stand still, cost nothing
    const c = b.ig;
    if (b.act){ if (this.runAct(b, dt)){ b.act = b.slam = b.aim = null; b.clip = 'idle'; b.rest = this.restT; } return; }
    if (b.rest > 0){ b.rest -= dt; b.clip = 'idle'; return; }
    const fv = VillagerSystem.feeder(b); if (fv){ this.face(b, fv.x - b.x, fv.y - b.y); b.clip = 'idle'; IglooFactory.repel(b); return; }   // a villager is bringing an apple: he stops and takes it
    const foes = this.foes(b); let foe = null, fd = 1e9; for (const z of foes){ const d = Math.hypot(z.x - b.x, z.y - b.y); if (d < fd){ fd = d; foe = z; } }
    let moving = false, running = false;
    if (foe){   // HUNT: closest hostile first
      b.state = 'hunt'; b.pw = null; this.face(b, foe.x - b.x, foe.y - b.y);
      const close = foes.some(z => Math.hypot(z.x - b.x, z.y - b.y) < this.slamNear);
      if (b.cd.slam <= 0 && close) this.start(b, 'slam', foe);
      else if (b.cd.missile <= 0 && fd >= this.missMin && fd <= this.missMax && !IglooFactory.blocks(b.x, b.y, foe.x, foe.y) && !IglooFactory.inRoom(foe.x, foe.y, 30)) this.start(b, 'missile', foe);
      else if (fd > this.stopGap){ this.move(b, foe.x, foe.y, this.run, dt); moving = running = true; }
    } else {   // PATROL
      b.state = 'patrol';
      if (b.wait > 0) b.wait -= dt;
      else {
        if (!b.pw){ const a = Math.random() * 6.283, R0 = IglooFactory.R + 110, r = R0 + Math.random() * (this.patrolR * 0.85 - R0); b.pw = { x: c.x + Math.cos(a) * r, y: c.y + Math.sin(a) * r }; b.pt = 30; }
        b.pt -= dt;
        if (Math.hypot(b.pw.x - b.x, (b.pw.y - b.y) * CONFIG.tilt) < 10 || b.pt <= 0){ b.pw = null; b.wait = 2 + Math.random() * 5; }
        else { this.move(b, b.pw.x, b.pw.y, this.walk, dt); moving = true; }
      }
    }
    IglooFactory.repel(b);   // never into the igloo
    const lx = b.x - c.x, ly = b.y - c.y, ld = Math.hypot(lx, ly), L = this.patrolR * this.leash; if (ld > L){ b.x = c.x + lx / ld * L; b.y = c.y + ly / ld * L; }   // never past the edge of his area
    b.clip = moving ? (running ? 'run' : 'walk') : 'idle';
  },
  // ---- his powers (host) ----
  start(b, id, foe){
    this.face(b, foe.x - b.x, foe.y - b.y);
    if (id === 'slam'){ b.act = { id, t: 0, hit: false }; b.slam = { t: 0, hit: true }; b.clip = 'slam'; b.cd.slam = this.slamCd; }
    else { const dx = foe.x - b.x, dy = foe.y - b.y, l = Math.hypot(dx, dy) || 1; b.act = { id, t: 0, f: foe, lx: foe.x, ly: foe.y, fired: false }; b.aim = { t: 0, dx: dx / l, dy: dy / l, range: 200, firing: false, ft: 0 }; b.clip = 'aim'; b.cd.missile = this.missileCd; }
  },
  runAct(b, dt){   // true when the power is finished
    const a = b.act; a.t += dt;
    if (a.id === 'slam'){
      const S = SlamFactory; b.slam.t = a.t; b.clip = 'slam';
      if (!a.hit && a.t >= S.impactAt()){ a.hit = true; this.slamNow(b); }
      return a.t >= S.total();
    }
    const ai = b.aim, M = MissileFactory; ai.t = a.t; b.clip = 'aim';
    if (!a.fired){
      if (a.t < this.lockT && a.f && !a.f.dead){ a.lx = a.f.x; a.ly = a.f.y; }   // he tracks the target first, then the aim locks
      const dx = a.lx - b.x, dy = a.ly - b.y, l = Math.hypot(dx, dy) || 1; ai.dx = dx / l; ai.dy = dy / l; this.face(b, dx, dy);
      if (a.t >= this.aimT){ a.fired = true; ai.firing = true; ai.ft = 0; this.fire(b, a); }
      return false;
    }
    ai.ft += dt; return ai.ft >= M.recoil;
  },
  slamNow(b){   // the ground smash: the real slam wave as a picture (it hurts nobody by itself), and the zombies in its ring take the damage
    const S = SlamFactory, c = S.centre(b), sk = SkinFactory.strength, R = (sk && sk.slamRadius) || S.radius;
    S.impactR(c.x, c.y, true, R);
    if (GameFactory.room) GameFactory.room.send({ t: 'slam', id: NetFactory.id, x: c.x, y: c.y, R });
    this.waves.push({ x: c.x, y: c.y, R, t: 0, delay: 0, dur: S.waveTime, pw: 2.2, kind: 'slam', hit: new Set() });
  },
  fire(b, a){   // one arcing missile at the locked spot, and its blast (zombies only) when it lands
    const M = MissileFactory, ai = b.aim, x0 = b.x + ai.dx * 30, y0 = b.y + ai.dy * 30;
    M.launch(x0, y0, a.lx, a.ly, true);
    if (GameFactory.room) GameFactory.room.send({ t: 'missile', id: NetFactory.id, x0, y0, x1: a.lx, y1: a.ly });
    DustFactory.spawn(b.x - ai.dx * 16, b.y - ai.dy * 16, 6);
    this.waves.push({ x: a.lx, y: a.ly, R: M.blastRadius, t: 0, delay: Math.max(M.minFlight, Math.hypot(a.lx - x0, a.ly - y0) / M.speed) + M.fuse, dur: M.blastWave, pw: 2, kind: 'missile', hit: new Set() });
  },
  updateWaves(dt, host){
    if (!host){ this.waves.length = 0; return; }
    for (const w of this.waves){
      w.t += dt; if (w.t < w.delay) continue;
      const u = Math.min(1, (w.t - w.delay) / w.dur), r = w.R * (1 - Math.pow(1 - u, w.pw));
      for (const z of ZombieSystem.list){   // the front of the wave reaches each zombie once
        if (z.dead || z.gone || w.hit.has(z) || Math.hypot(z.x - w.x, z.y - w.y) > r) continue;
        w.hit.add(z); const amt = Math.round(HealthFactory.amount(w.kind, w, z) * this.dmgMul); if (amt > 0) ZombieSystem.hit(z, amt, w.x, w.y);
      }
    }
    this.waves = this.waves.filter(w => w.t - w.delay < w.dur + 0.05);
  },
  // ---- per frame ----
  update(dt, host, pl){
    if (host){ this.spawnTick(dt, pl); this.repopulate(dt, pl); }
    for (const b of this.list) this.step(b, dt, host, pl);
    this.updateWaves(dt, host);
    if (this.list.some(b => b.gone)) this.list = this.list.filter(b => !b.gone);
    if (host) this.send(dt);
  },
  // ---- multiplayer ----
  send(dt){
    if (!GameFactory.room) return; this.sendT -= dt; if (this.sendT > 0) return; this.sendT = this.sendEvery;
    const r1 = n => Math.round(n * 10) / 10, r2 = n => Math.round(n * 100) / 100, cc = { idle: 0, walk: 1, run: 2, slam: 3, aim: 4 };
    const msg = { t: 'gs', id: NetFactory.id, g: this.list.map(b => [b.id, b.key, r1(b.x), r1(b.y), b.face || 1, b.dir === 'front' ? 1 : b.dir === 'back' ? 2 : 0, cc[b.clip] | 0, r1(b.hp), b.slam ? r2(b.slam.t) : b.aim ? r2(b.aim.t) : 0, b.aim ? r2(b.aim.dx) : 0, b.aim ? r2(b.aim.dy) : 0, b.aim && b.aim.firing ? 1 : 0]) };
    this.fullT -= this.sendEvery; if (this.fullT <= 0){ this.fullT = 3; msg.c = [...this.spawned]; }
    GameFactory.room.send(msg);
  },
  onSnap(m){
    if (m.id === NetFactory.id || m.id !== ZombieSystem.hostId() || !Array.isArray(m.g)) return;
    for (const k of m.c || []) this.spawned.add(k);
    const seen = new Set();
    for (const a of m.g){
      const [id, key, x, y, face, dc, cc, hp, at, ax, ay, fr] = a; seen.add(id);
      let b = this.list.find(q => q.id === id);
      if (!b){ const ij = String(key).split(',').map(Number), c = IglooFactory.at(ij[0], ij[1]); if (!c) continue; b = this.make(id, c, x, y); b.hp = b.hpShow = hp; }
      b.tx = x; b.ty = y;
      if (hp < b.hp) HealthFactory.float(b, b.hp - hp); else if (hp > b.hp + 0.5){ HealthFactory.float(b, hp - b.hp, true); b.healFx = HealFactory.glow; } b.hp = hp;   // the apple: a green +N on every screen
      if (b.dead) continue;   // lying on the ground: the death fall (ReactFactory) owns the pose
      b.face = face; b.dir = dc === 1 ? 'front' : dc === 2 ? 'back' : 'side'; b.clip = ['idle', 'walk', 'run', 'slam', 'aim'][cc] || 'idle';
      if (cc === 3){ if (b.slam) b.slam.t = at; else b.slam = { t: at, hit: true }; b.aim = null; }
      else if (cc === 4){ if (b.aim){ b.aim.dx = ax; b.aim.dy = ay; b.aim.t = at; if (fr && !b.aim.firing){ b.aim.firing = true; b.aim.ft = 0; } } else b.aim = { t: at, dx: ax, dy: ay, range: 200, firing: !!fr, ft: 0 }; b.slam = null; }
      else { b.slam = null; b.aim = null; }
    }
    this.list = this.list.filter(b => seen.has(b.id));
  },
  // ---- drawing ----
  collect(items, cam, W, H){ for (const b of this.list){ if (!ViewFactory.sees(b.x, b.y, 200, 260, 300)) continue; items.push({ y: b.y, f: () => this.draw(ctx, b, cam, W, H) }); } },
  draw(g, b, cam, W, H){   // the real strength-gimmick body, a little bigger than a player, with a health bar and a GUARD tag
    const o = GroundFactory.toScreen(b.x, b.y, cam, W, H), k = this.scale;
    g.save(); g.translate(o.x, o.y); g.scale(k, k); g.translate(-o.x, -o.y); CharacterFactory.draw(g, b, cam, W, H); g.restore();
    if (b.dead || b.gone) return;
    const y = o.y - 92 * k - 16; HealthFactory.drawBar(g, b, o.x, y);
    g.save(); g.font = '800 10px system-ui, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.lineWidth = 3; g.strokeStyle = 'rgba(0,0,0,.8)'; g.strokeText('GUARD', o.x, y - 13); g.fillStyle = '#9fd8ff'; g.fillText('GUARD', o.x, y - 13); g.restore();
  }
};

/* ============ TRADE SCREEN (the TRADE window of the villagers. Walk up to a villager and the PUNCH button turns into a green TRADE hand (see PunchFactory); press it and this window opens.
   For now the window is EMPTY on purpose: the trade list (what a villager sells / buys for emeralds) comes later. It already works for everybody: the villager's list comes from the HOST (`VillagerSystem.offers`, sent with the villager snapshots),
   and while you trade, your game tells the host ('trd' messages, repeated every `ping` seconds) so the host keeps that villager standing and facing you; everybody sees him with a little 🤝 bubble.
   The window closes by itself if you walk away, or the villager gets scared, hurt or is gone. Tune the numbers right below) ============ */
const TradeScreen = {
  reach: 70, closeR: 120, ping: 2,   // how close you must be for the TRADE button / the window closes beyond this / seconds between 'still trading' messages to the host
  isOpen: false, card: null, body: null, cur: null, shown: -1, acc: 0,
  near(){   // the closest villager who can talk right now (calm, alive, no wall between you)
    if (player.dead || DungeonFactory.inside) return null; let best = null, bd = this.reach;
    for (const v of VillagerSystem.list){
      if (v.dead || v.gone || v.clip === 'run' || v.clip === 'cower' || v.flinch > 0) continue;
      const d = Math.hypot(v.x - player.x, v.y - player.y); if (d < bd && !IglooFactory.blocks(player.x, player.y, v.x, v.y)){ bd = d; best = v; }
    }
    return best;
  },
  init(){
    const mk = (tag, css, txt) => { const el = document.createElement(tag); el.style.cssText = css; if (txt !== undefined) el.textContent = txt; return el; };
    const c = this.card = mk('div', 'position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:43;display:none;width:min(440px,calc(100vw - 16px));max-height:calc(100vh - 16px);overflow-y:auto;padding:14px 18px 18px;border-radius:18px;background:linear-gradient(rgba(30,56,52,.98),rgba(14,28,30,.98));border:2px solid rgba(150,235,200,.55);box-shadow:0 10px 40px rgba(0,0,0,.6);font-family:system-ui,sans-serif');
    const head = mk('div', 'display:flex;align-items:center;justify-content:space-between;margin-bottom:12px');
    const x = mk('button', 'width:32px;height:32px;padding:0;border-radius:50%;border:1px solid rgba(255,255,255,.4);background:rgba(0,0,0,.35);color:#fff;font:700 16px system-ui;touch-action:none', '✕');
    x.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); this.close(); });
    head.append(mk('div', 'font:800 14px system-ui;letter-spacing:3px;color:#a8f0cf;text-shadow:0 1px 3px #000', '🤝 TRADE'), x);
    this.body = mk('div', 'min-height:170px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:12px;border-radius:12px;background:rgba(0,0,0,.25);border:2px solid rgba(150,235,200,.14);box-shadow:inset 0 3px 8px rgba(0,0,0,.5)');
    c.append(head, this.body); c.addEventListener('pointerdown', e => { e.stopPropagation(); if (e.target === c) e.preventDefault(); }); document.body.appendChild(c);
  },
  open(v){ if (this.isOpen || player.dead || !v) return; this.cur = v; this.isOpen = true; this.shown = -1; this.acc = 0; this.card.style.display = 'block'; this.render(); this.tell(1); },
  close(){ if (!this.isOpen) return; this.tell(0); this.isOpen = false; this.cur = null; this.card.style.display = 'none'; },
  tell(on){   // tell the host (or do it myself when I am the host): this villager is being traded with
    const v = this.cur; if (!v) return; const m = { t: 'trd', id: NetFactory.id, vid: v.id, on };
    if (VillagerSystem.isHost()) VillagerSystem.onTrade(m); else if (GameFactory.room) GameFactory.room.send(m);
  },
  render(){   // the list of trades: what he wants -> what you get, with a BUY / SELL button
    const all = this.cur ? VillagerSystem.offers(this.cur) : []; this.shown = all.length; this.body.textContent = '';
    const tab = this.tab || 'buy', o = all.filter(t => (t.get.kind === 'emerald') === (tab === 'sell'));   // BUY = what he sells you / SELL = what he buys from you
    this.body.style.justifyContent = 'flex-start'; this.body.style.alignItems = 'stretch';
    const mk = (tag, css, txt) => { const el = document.createElement(tag); el.style.cssText = css; if (txt !== undefined) el.textContent = txt; return el; };
    const item = (kind, qty) => {
      const box = mk('div', 'display:flex;align-items:center;gap:2px'), cv = mk('canvas', 'width:34px;height:34px'); cv.width = cv.height = 68;
      const ic = SlotsFactory.icons[kind]; if (ic){ try { ic(cv.getContext('2d'), 34, 34, 60); } catch (e) {} }
      box.append(cv, mk('div', 'font:800 13px system-ui;color:#fff', '×' + qty)); box.title = SlotsFactory.names[kind] || kind; return box;
    };
    const tabs = mk('div', 'display:flex;gap:8px;margin-bottom:4px');
    for (const [id, nm] of [['buy', '🛒 BUY'], ['sell', '💰 SELL']]){
      const on = tab === id, b = mk('button', 'flex:1;padding:9px 0;border-radius:10px;border:2px solid ' + (on ? '#a8f0cf' : 'rgba(150,235,200,.2)') + ';background:' + (on ? 'rgba(46,226,122,.28)' : 'rgba(0,0,0,.3)') + ';color:' + (on ? '#fff' : 'rgba(200,255,230,.6)') + ';font:800 13px system-ui;letter-spacing:1px;touch-action:none', nm);
      b.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); this.tab = id; this.render(); }); tabs.appendChild(b);
    }
    this.body.appendChild(tabs);
    if (!o.length){ this.body.append(mk('div', 'font:700 13px system-ui;color:rgba(200,255,230,.7);text-align:center;padding:14px', 'No trades')); return; }
    const bag = player.bag;
    o.forEach(t => {
      const ok = !!bag && t.give.every(g => bag.count(g.kind) >= g.qty), row = mk('div', 'display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:10px;background:rgba(255,255,255,.06)');
      const left = mk('div', 'display:flex;gap:6px;min-width:84px'); for (const g of t.give) left.appendChild(item(g.kind, g.qty));
      const sell = t.get.kind === 'emerald', btn = mk('button', 'margin-left:auto;padding:7px 12px;border-radius:9px;border:0;font:800 12px system-ui;color:#fff;touch-action:none;background:' + (ok ? '#1fa85a' : '#555') + ';opacity:' + (ok ? 1 : 0.55), sell ? 'SELL' : 'BUY');
      btn.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); if (VillagerSystem.doTrade(t)){ RaidFactory.say('Traded'); this.render(); } else RaidFactory.say('You do not have enough'); });
      row.append(left, mk('div', 'font:800 15px system-ui;color:#a8f0cf', '→'), item(t.get.kind, t.get.qty), btn); this.body.appendChild(row);
    });
  },
  update(dt){
    if (!this.isOpen) return; const v = this.cur;
    if (!v || v.dead || v.gone || VillagerSystem.list.indexOf(v) < 0 || v.clip === 'run' || v.clip === 'cower' || player.dead || Math.hypot(v.x - player.x, v.y - player.y) > this.closeR){ this.close(); return; }
    this.acc += dt; if (this.acc >= this.ping){ this.acc = 0; this.tell(1); }
    if (VillagerSystem.offers(v).length !== this.shown) this.render(); else if (this.isOpen && InventoryFactory.isOpen === false){ this.rc = (this.rc || 0) + dt; if (this.rc > 1){ this.rc = 0; this.render(); } }
  }
};
TradeScreen.init();


/* ============ SHADOW SKIN (the Shadow gimmick: a tall, fragile, black-green night stalker. Curved horns, a long whipping blade-tail, ribs showing through a hollow body, thin clawed arms and long digitigrade legs. He moves on ALL FOURS like a big cat / dog: arms and legs both walk.
   Built as a tiny 3D rig: every joint is a real 3D point that is turned to face the way he walks (front / back / side / diagonals, smoothly), projected with the game's tilt and drawn far-to-near, so he looks solid from every side.
   Legs and arms use 2-bone IK on a gait: WALK = one foot at a time (walk), RUN = diagonal pairs (trot). Edit `clips` (speed / stride / lift / bounce / tail) and `C` (colours) to tune him.
   Registered in SkinFactory + GimmickFactory ('shadow'); DialFactory.free lists him as already unlocked, so no capsule is needed yet.) ============ */
const ShadowSkin = {
  radius: 20, size: 1.9, dust: false, diag: true, speedMul: 1.08, abilities: ['sneak', 'acid', 'demons'],   // the SNEAK button (ShadowSneakFactory) belongs to this gimmick;   // size = how big he is drawn (1 = the first small version)
  C: { bk: '#030605', dk: '#0a140f', md: '#15251c', hi: '#3f7557', rib: '#9cc7a9', fang: '#d3e9d8', gl: '#aaff8c' },
  clips: {   // f = leg rate (rad/s) / cps = steps cycles per second / stride + lift in px / bob = body bounce / sway = spine + tail wave / tail = tail swing / gait = phase of [front-left, front-right, back-left, back-right]
    idle: { f: 0,  cps: 0,    stride: 0,  lift: 0,   bob: 0.4, sway: 0.5, tail: 11, tailRate: 3.4,   gait: [0, 0.5, 0.25, 0.75] },
    walk: { f: 7,  cps: 0.95, stride: 8,  lift: 4.5, bob: 0.7, sway: 1.7, tail: 11, tailRate: 3.4, gait: [0.25, 0.75, 0, 0.5] },   // lateral walk: back-left, front-left, back-right, front-right
    run:  { f: 13, cps: 2.1,  stride: 16, lift: 7,   bob: 1.5, sway: 2.6, tail: 11, tailRate: 3.4,   gait: [0, 0.5, 0.5, 0], run: 1 }   // trot: diagonal pairs move together, body low and stretched

/* ============ HAMMER THROW FACTORY (Ace Guardian's 2nd ability 'hthrow': he winds back and HURLS his giant hammer. It spins out and swings round him in a huge ring, sweeping the WHOLE area around wherever he stands (the ring follows him as he walks),
   then flies back and he catches it. Anyone the hammer touches takes big damage (HealthFactory.dmg.hammer), breakables break, loose props get flung.
   Phases: wind (he leans back, movement locked) -> out (the hammer flies out to the ring) -> swing (it circles, its distance breathing in and out so it covers the whole disk) -> back (it spirals home) -> catch.
   Net: only the thrower's game does damage. Other screens get one 'hthrow' message and play the same swing as a visual round that player. Tune everything on the next lines.) ============ */

  list: [],
  reset(){ this.list.length = 0; this.charge = this.cooldown; if (typeof player !== 'undefined'){ player.hthrow = null; } for (const id in RemoteFactory.map) RemoteFactory.map[id].ch.hthrow = null; },
  ready(){ return this.charge >= this.cooldown; },
  total(){ return this.windT + this.outT + this.swingT + this.backT + this.catchT; },
  start(ch){

  },
  make(ch, visual){

/* ============ TRIPLE SLAM FACTORY (Ace Guardian's 3rd ability 'tslam', button 3 SLAM / key R: three hammer smashes in a row, each with a SMALLER shockwave than the big slam)
   Sequence: slow wind-up -> smash #1 -> he steps FORWARD while dragging the hammer back up -> smash #2 -> steps forward and lifts it again -> smash #3 -> recover. Movement is locked while it plays.
   It reuses the SLAM clip + SlamFactory.impactR (same cracks, dust, damage rules, network message), so every wave hurts like a slam of its own size (HealthFactory.dmg.slam).
   Tune the numbers right below: radii = size of smash 1 / 2 / 3 (the big slam is 480), lift = the (slower) first wind-up, pick = time to step forward and lift again, lunge = how far he steps (world px)) ============ */
const TripleSlamFactory = {

  lift: 0.65, hold: 0.1, strike: 0.14, pick: 0.5, recover: 0.6, lunge: 90, lunPart: 0.75,
  reset(){ this.charge = this.cooldown; if (typeof player !== 'undefined'){ player.tri = null; player.slamBlend = null; } },

  start(ch){

    if (ch.grab) PushFactory.release(ch);
    this.charge = 0; ch.tri = { n: 0, ph: 'lift', t: 0, lp: 0, rum: false }; ch.slam = { t: 0, hit: true, tri: true }; ch.clip = 'slam'; return true;
  },

    else if (s.ph === 'hold'){ const u = Math.min(1, s.t / this.hold); tv = a + b * u; if (!s.rum){ s.rum = true; ShakeFactory.kick(2.5, 0.1); } if (u >= 1){ s.ph = 'strike'; s.t = 0; } }

  drawGround(g, cam, W, H){   // faint warning ring for the NEXT smash

   Press it: he sinks into the ground and vanishes. For `dur` seconds he is underground and invincible, and a dark circle (the RETICLE) shows on the ground where he will come up.
   Steer that circle with the JOYSTICK (or WASD); the camera follows it. When the time is up (or you tap the button again after a moment = LAND NOW) he rises out of the ground
   at the circle and a field of huge shadow spikes erupts under the whole circle: breakables break, props fly, zombies / the boss / other players take massive damage (HealthFactory.dmg.shadow).
   The button then refills for `cooldown` seconds. Tune everything right on the next lines.
   locked()   true while the move owns the joystick (the walking is switched off)   reset()  drop everything (gimmick changed / respawn)
   Wiring: skin lists abilities: ['sneak']; frame() calls update / lead / drawGround / collect; CharacterFactory.draw asks bodyMode() so he sinks and rises; net: 'sneak' message shows the spikes on other screens) ============ */
const ShadowSneakFactory = {
  cooldown: 10, dur: 5, minUnder: 0.8, sinkDur: 0.55, riseDur: 0.4,   // seconds: button refill / time underground / before an early landing is allowed / sinking in / rising out
  R: 140, speed: 240, maxRange: 430, power: 99, fling: 520,           // radius of the spike field (world px) / reticle speed / how far from where he sank it can go / break power / how hard props are thrown
  spikeHold: 0.9, shake: 14, depth: 70,                               // seconds the spikes stand / screen shake / px the body sinks
  charge: 10, fx: null, spikes: [], stains: [], rings: [],
  reset(){ this.fx = null; this.spikes.length = this.stains.length = this.rings.length = 0; this.charge = this.cooldown; player.sneakHide = false; },
  locked(){ return !!this.fx; },
  ready(){ return this.charge >= this.cooldown && !this.fx; },
  start(ch){
    if (!AbilityFactory.has(ch, 'sneak') || this.fx || !this.ready() || ch.dead || ch.slam || ch.aim || ch.acid || ch.demon) return false;
    if (ch.grab) PushFactory.release(ch);
    this.fx = { phase: 'sink', t: 0, ox: ch.x, oy: ch.y, tx: ch.x, ty: ch.y, trail: [], cr: Array.from({ length: 11 }, (_, i) => ({ a: i / 11 * 6.283 + Math.random() * 0.5, l: 0.55 + Math.random() * 0.45 })) };
    this.stains.push({ x: ch.x, y: ch.y, r: 36, t: 0, life: 1.6, kind: 'ink' }); DustFactory.spawn(ch.x, ch.y, 6); ShakeFactory.kick(3, 0.2);
    return true;
  },
  press(ch){ const f = this.fx; if (f){ if (f.phase === 'under' && f.t >= this.minUnder) this.emerge(ch); return; } this.start(ch); },
  cancel(ch){ this.fx = null; ch.sneakHide = false; this.charge = 0; },
  update(ch, dt, wdt, m){
    const f = this.fx;
    if (f && (!AbilityFactory.has(ch, 'sneak') || ch.dead)){ this.cancel(ch); }
    else if (f){
      f.t += dt; ch.inv = Math.max(ch.inv || 0, 0.4); ch.mv = null; ch.clip = 'idle';
      if (f.phase === 'sink'){ if (f.t >= this.sinkDur){ f.phase = 'under'; f.t = 0; ch.sneakHide = true; } }
      else if (f.phase === 'under'){
        const mx = m ? m.x : 0, my = m ? m.y : 0;   // the joystick moves the circle, not him
        if (m && m.mag > 0.05){ f.tx += mx * this.speed * dt; f.ty += my * this.speed * dt / CONFIG.tilt; const dx = f.tx - f.ox, dy = (f.ty - f.oy) * CONFIG.tilt, d = Math.hypot(dx, dy); if (d > this.maxRange){ f.tx = f.ox + dx / d * this.maxRange; f.ty = f.oy + dy / d * this.maxRange / CONFIG.tilt; } f.mv = 1; } else f.mv = 0;
        f.trail.push({ x: f.tx, y: f.ty, life: 1 }); if (f.trail.length > 40) f.trail.shift();
        if (f.t >= this.dur) this.emerge(ch);
      } else if (f.phase === 'rise'){ if (f.t >= this.riseDur){ this.fx = null; this.charge = 0; ch.sneakHide = false; } }
      if (f && f.trail) for (const p of f.trail) p.life -= dt * 1.6;

    for (const s of this.spikes) s.t += wdt; this.spikes = this.spikes.filter(s => s.t < s.delay + s.grow + this.spikeHold + s.fall);
    for (const s of this.stains) s.t += wdt; this.stains = this.stains.filter(s => s.t < s.life);
    for (const r of this.rings) r.t += wdt; this.rings = this.rings.filter(r => r.t < r.life);
  },
  emerge(ch){
    const f = this.fx; if (!f || f.phase === 'rise') return;
    f.phase = 'rise'; f.t = 0; ch.x = f.tx; ch.y = f.ty; ch.sneakHide = false; ch.dir = 'front'; ch.inv = Math.max(ch.inv || 0, 1.2);
    this.burst(f.tx, f.ty, false);
    if (GameFactory.room) GameFactory.room.send({ t: 'sneak', id: NetFactory.id, x: f.tx, y: f.ty });
  },
  onRemote(m){ if (m.id !== NetFactory.id) this.burst(m.x, m.y, true); },
  burst(x, y, visual){
    const R = this.R, S = this.spikes, rnd = Math.random;
    const add = (px, py, h, w, extra) => S.push(Object.assign({ x: px, y: py, h, w, delay: Math.hypot(px - x, py - y) / R * 0.2 + rnd() * 0.05, t: 0, grow: 0.13, fall: 0.4, lean: (rnd() - 0.5) * 0.5, seed: rnd() }, extra));
    add(x, y, 260, 50, { big: true, delay: 0 });
    for (let i = 0; i < 8; i++){ const a = i / 8 * 6.283 + rnd() * 0.4, r = R * (0.38 + rnd() * 0.1); add(x + Math.cos(a) * r, y + Math.sin(a) * r * 0.8, 150 + rnd() * 50, 32); }
    for (let i = 0; i < 13; i++){ const a = i / 13 * 6.283 + rnd() * 0.3, r = R * (0.78 + rnd() * 0.16); add(x + Math.cos(a) * r, y + Math.sin(a) * r * 0.8, 100 + rnd() * 55, 26); }
    for (let i = 0; i < 9; i++){ const a = rnd() * 6.283, r = R * Math.sqrt(rnd()) * 0.95; add(x + Math.cos(a) * r, y + Math.sin(a) * r * 0.8, 55 + rnd() * 35, 18); }

    this.rings.push({ x, y, t: 0, life: 0.5 });
    ShakeFactory.kick(this.shake, 0.5); ShakeFactory.flashNow(0.07); DustFactory.spawn(x, y, 14); ImpactFactory.chips(x, y, 26);
    if (!visual) ImpactFactory.sweep({ x, y, r: R, R, kind: 'shadow', hit: new Set() }, this.power, this.fling);   // the damage: everything inside the circle, centre hurts most
  },
  lead(l){ const f = this.fx; if (!f) return; if (f.phase === 'under' || f.phase === 'sink'){ const k = f.phase === 'sink' ? f.t / this.sinkDur * 0 : 1; l.x = (f.tx - player.x) * k; l.y = (f.ty - player.y) * k; } },   // the camera follows the circle
  bodyMode(ch){   // how the body is drawn right now: null = normal, {hide} = gone, {k, off} = sunk down into the ground by `off` px
    const f = this.fx; if (!f) return null;
    if (f.phase === 'sink') return { off: Math.min(1, f.t / this.sinkDur) * this.depth };
    if (f.phase === 'under') return { hide: true };
    const k = Math.min(1, f.t / this.riseDur); return { off: (1 - k * k) * this.depth };
  },
  // ---- drawing ----
  drawGround(g, cam, W, H){
    const now = performance.now() / 1000;
    for (const s of this.stains){
      if (!ViewFactory.sees(s.x, s.y, s.r + 40, s.r + 40, 60)) continue; const p = GroundFactory.toScreen(s.x, s.y, cam, W, H), u = s.t / s.life;
      g.save(); g.translate(p.x, p.y); g.scale(1, CONFIG.tilt);
      if (s.kind === 'ink'){ const r = s.r * (u < 0.3 ? u / 0.3 : 1 - (u - 0.3) * 0.4); g.fillStyle = 'rgba(2,8,5,' + 0.8 * (1 - u) + ')'; g.beginPath(); g.arc(0, 0, Math.max(1, r), 0, 7); g.fill(); }
      else { const a = Math.max(0, 1 - u * u); const rg = g.createRadialGradient(0, 0, 4, 0, 0, s.r); rg.addColorStop(0, 'rgba(0,0,0,' + 0.75 * a + ')'); rg.addColorStop(0.7, 'rgba(4,16,10,' + 0.55 * a + ')'); rg.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = rg; g.beginPath(); g.arc(0, 0, s.r, 0, 7); g.fill();
        g.lineCap = 'round'; g.strokeStyle = 'rgba(120,255,170,' + 0.65 * a + ')'; g.lineWidth = 2.4; for (const c of s.cr){ g.beginPath(); let x = 0, y = 0; g.moveTo(0, 0); for (let i = 1; i <= 5; i++){ const ang = c.a + (i % 2 ? 0.28 : -0.28); x += Math.cos(ang) * s.r * c.l * 0.2; y += Math.sin(ang) * s.r * c.l * 0.2; g.lineTo(x, y); } g.stroke(); } }
      g.restore();
    }
    for (const r of this.rings){ const p = GroundFactory.toScreen(r.x, r.y, cam, W, H), u = r.t / r.life; g.save(); g.translate(p.x, p.y); g.scale(1, CONFIG.tilt); g.strokeStyle = 'rgba(110,255,170,' + 0.9 * (1 - u) + ')'; g.lineWidth = 8 * (1 - u) + 1; g.beginPath(); g.arc(0, 0, this.R * (0.2 + 1.1 * (1 - Math.pow(1 - u, 2))), 0, 7); g.stroke(); g.restore(); }
    const f = this.fx; if (!f || f.phase !== 'under') return;
    // the path he has travelled underground: a dark smear that fades
    g.save(); g.lineCap = 'round'; g.lineJoin = 'round';
    for (let i = 1; i < f.trail.length; i++){ const a = f.trail[i - 1], b = f.trail[i]; if (b.life <= 0) continue; const A = GroundFactory.toScreen(a.x, a.y, cam, W, H), B = GroundFactory.toScreen(b.x, b.y, cam, W, H); g.strokeStyle = 'rgba(0,0,0,' + 0.5 * b.life + ')'; g.lineWidth = 14 * b.life + 2; g.beginPath(); g.moveTo(A.x, A.y); g.lineTo(B.x, B.y); g.stroke(); }
    g.restore();
    const p = GroundFactory.toScreen(f.tx, f.ty, cam, W, H), left = this.dur - f.t, warn = Math.max(0, Math.min(1, 1 - left / 1.1)), pulse = 0.5 + 0.5 * Math.sin(now * (6 + warn * 22)), R = this.R;
    g.save(); g.translate(p.x, p.y); g.scale(1, CONFIG.tilt);
    const rg = g.createRadialGradient(0, 0, 6, 0, 0, R); rg.addColorStop(0, 'rgba(0,0,0,' + (0.7 + 0.2 * warn) + ')'); rg.addColorStop(0.75, 'rgba(6,26,16,' + (0.45 + 0.2 * warn) + ')'); rg.addColorStop(1, 'rgba(0,0,0,0.12)');
    g.fillStyle = rg; g.beginPath(); g.arc(0, 0, R, 0, 7); g.fill();
    g.setLineDash([16, 11]); g.lineDashOffset = -now * 40; g.strokeStyle = 'rgba(110,255,170,' + (0.7 + 0.3 * pulse) + ')'; g.lineWidth = 3.5; g.beginPath(); g.arc(0, 0, R, 0, 7); g.stroke(); g.setLineDash([]);
    g.strokeStyle = 'rgba(110,255,170,' + (0.25 + 0.4 * warn) + ')'; g.lineWidth = 2; g.beginPath(); g.arc(0, 0, R * (0.35 + 0.65 * (1 - warn)), 0, 7); g.stroke();   // the inner ring closes in as the spikes are about to come
    if (warn > 0){ g.lineCap = 'round'; g.strokeStyle = 'rgba(150,255,190,' + (0.5 + 0.5 * pulse) + ')'; g.lineWidth = 2.6; for (const c of f.cr){ g.beginPath(); let x = 0, y = 0; g.moveTo(0, 0); for (let i = 1; i <= 5; i++){ const ang = c.a + (i % 2 ? 0.3 : -0.3); x += Math.cos(ang) * R * c.l * 0.2 * warn * 1.3; y += Math.sin(ang) * R * c.l * 0.2 * warn * 1.3; g.lineTo(x, y); } g.stroke(); } }   // cracks spread out of the centre in the last second
    if (f.mv){ for (let k = 0; k < 2; k++){ const u = ((now * 1.6 + k * 0.5) % 1); g.strokeStyle = 'rgba(0,0,0,' + 0.5 * (1 - u) + ')'; g.lineWidth = 3; g.beginPath(); g.ellipse(0, 0, 10 + u * 24, 6 + u * 14, 0, 0, 7); g.stroke(); } }   // ripples while he moves
    g.fillStyle = 'rgba(0,0,0,.92)'; g.beginPath(); g.ellipse(0, 0, 22, 14, 0, 0, 7); g.fill();   // him, a dark blob under the ground ...
    g.restore();
    g.save(); g.shadowColor = '#aaff8c'; g.shadowBlur = 8; g.fillStyle = '#aaff8c'; for (const sd of [-1, 1]){ g.beginPath(); g.ellipse(p.x + sd * 6, p.y - 1, 3, 1.5, sd * 0.35, 0, 7); g.fill(); } g.restore();   // ... with two glowing eyes
    g.save(); g.font = '900 20px system-ui,sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.lineWidth = 4; g.strokeStyle = 'rgba(0,0,0,.8)'; const tx = String(Math.max(1, Math.ceil(left))); g.strokeText(tx, p.x, p.y - R * CONFIG.tilt - 16); g.fillStyle = warn > 0 ? '#ff6a5a' : '#aaff8c'; g.fillText(tx, p.x, p.y - R * CONFIG.tilt - 16); g.restore();
  },
  collect(items, cam, W, H){
    for (const s of this.spikes){
      if (s.t < s.delay || !ViewFactory.sees(s.x, s.y, 80, 280, 300)) continue;
      items.push({ y: s.y, f: () => this.drawSpike(ctx, s, cam, W, H) });
    }
  },
  drawSpike(g, s, cam, W, H){
    const u = s.t - s.delay, grow = Math.min(1, u / s.grow), fallU = Math.max(0, (u - s.grow - this.spikeHold) / s.fall);
    const k = fallU > 0 ? 1 - fallU * fallU : (grow < 1 ? 1.12 * (1 - Math.pow(1 - grow, 3)) : 1.12 - 0.12 * Math.min(1, (u - s.grow) / 0.12));   // shoots up with a little overshoot, stands, then sinks back
    if (k <= 0.01) return;
    const p = GroundFactory.toScreen(s.x, s.y, cam, W, H), H0 = s.h * k, Wd = s.w * (0.55 + 0.45 * Math.min(1, k * 2)), hw = Wd / 2, tx = p.x + s.lean * H0 * 0.5, ty = p.y - H0 * CONFIG.cosT();
    const a = fallU > 0 ? 1 - fallU * 0.6 : 1;
    g.save(); g.globalAlpha = a;
    g.fillStyle = 'rgba(0,0,0,.45)'; g.beginPath(); g.ellipse(p.x, p.y, hw * 1.5, hw * 1.5 * CONFIG.tilt, 0, 0, 7); g.fill();   // dark base on the ground
    g.strokeStyle = 'rgba(110,255,170,.55)'; g.lineWidth = 1.5; g.beginPath(); g.ellipse(p.x, p.y, hw * 1.25, hw * 1.25 * CONFIG.tilt, 0, 0, 7); g.stroke();
    const mid = { x: p.x + s.lean * H0 * 0.18, y: p.y - H0 * CONFIG.cosT() * 0.5 };
    const body = (x0, x1, col) => { g.fillStyle = col; g.beginPath(); g.moveTo(x0, p.y); g.quadraticCurveTo(x0 + (mid.x - p.x) * 0.9, mid.y + 6, tx, ty); g.quadraticCurveTo(x1 + (mid.x - p.x) * 0.9, mid.y + 6, x1, p.y); g.closePath(); g.fill(); };
    body(p.x - hw, p.x, '#04090a'); body(p.x, p.x + hw, '#122a1d');   // dark left face, lit right face
    g.lineJoin = 'round'; g.strokeStyle = '#020403'; g.lineWidth = 2; g.beginPath(); g.moveTo(p.x - hw, p.y); g.quadraticCurveTo(p.x - hw + (mid.x - p.x) * 0.9, mid.y + 6, tx, ty); g.quadraticCurveTo(p.x + hw + (mid.x - p.x) * 0.9, mid.y + 6, p.x + hw, p.y); g.stroke();
    g.strokeStyle = 'rgba(120,255,170,.7)'; g.lineWidth = 1.4; g.beginPath(); g.moveTo(p.x + hw * 0.1, p.y); g.quadraticCurveTo(mid.x + hw * 0.1, mid.y, tx, ty); g.stroke();   // glowing vein up the middle
    g.fillStyle = '#0a1a12'; g.strokeStyle = '#020403'; g.lineWidth = 1;   // barbs on the sides
    for (const [h, sd] of [[0.38, -1], [0.55, 1], [0.7, -1]]){ const bx = p.x + (tx - p.x) * h + sd * hw * (1 - h) * 0.55, by = p.y - (p.y - ty) * h; g.beginPath(); g.moveTo(bx, by); g.lineTo(bx + sd * hw * 0.8, by - H0 * 0.06 - 4); g.lineTo(bx + sd * hw * 0.1, by - H0 * 0.12); g.closePath(); g.fill(); g.stroke(); }
    g.restore();
  }
};
CONFIG.cosT = () => Math.sqrt(1 - CONFIG.tilt * CONFIG.tilt);   // how much of a spike's height shows on the tilted screen
AbilityFactory.register('sneak', {
  label: 'SNEAK', color: '#3fc77f', key: 'q',
  press(ch){ ShadowSneakFactory.press(ch); },
  ui(ch){ const F = ShadowSneakFactory, f = F.fx;
    if (f) return f.phase === 'under' ? { mode: 'active', text: String(Math.max(1, Math.ceil(F.dur - f.t))), p: 1 - f.t / F.dur } : { mode: 'busy', text: 'SNEAK', p: 1 };
    const p = Math.min(1, F.charge / F.cooldown); return p >= 1 ? { mode: 'ready', text: 'SNEAK', p } : { mode: 'charging', text: String(Math.ceil(F.cooldown - F.charge)), p }; }
});


/* ============ ACID FACTORY (ability 'acid' = ACID button of the Shadow gimmick; aimed exactly like the missile: HOLD the button, DRAG the finger to move the target, RELEASE to spit)
   His head tips up, his jaw opens and he spits THREE acid blobs one after the other: one at the target and one on each side of it (a fan).
   Every blob that lands splashes: whoever stands in the splash takes damage (HealthFactory.dmg.acid) AND is POISONED: `poisonDur` seconds, `poisonTick` HP every second, and walks `poisonSlow` slower.
   A new hit while already poisoned just restarts the 5 seconds (no stacking). A shield dome blocks it. Tune everything right on the next lines.
   locked()  reset()  start / release / drag   (same hooks the missile uses). Net: 'acid' = the 3 blobs are drawn on other screens, 'poison' = tells a hit player's game to poison him) ============ */
const AcidFactory = {
  cooldown: 8, charge: 8, minRange: 90, maxRange: 360, defRange: 210, vertBoost: 1.7, aimEase: 9, camLead: 0.45, dragMax: 45, deadzone: 0.2,   // aim limits (world px), same feel as the missile
  spread: 0.34, stagger: 0.13, speed: 430, arc: 0.28, maxArc: 110, mouthZ: 32, recoil: 0.4,   // fan angle (rad) / seconds between the 3 spits / flight speed / arc height / mouth height / arm-free pause after the spit
  splashR: 64, puddleLife: 4.5,                                                             // splash radius of each blob / seconds the puddle stays
  poisonDur: 5, poisonTick: 5, poisonSlow: 0.75,                                            // poison: seconds / HP lost every second / walking speed multiplier while poisoned
  spits: [], puddles: [], drops: [], gas: [], vics: [], watch: null, gasLife: 5,   // gasLife = seconds the toxic cloud hangs over a splash
  C: { body: '#2f6b16', edge: '#0d2406', sheen: '#8fdc45', glow: '70,150,30', dark: '28,70,14', rim: '140,215,70' },   // the acid colours (r,g,b strings): a dark, sickly green
  reset(){ this.charge = this.cooldown; this.spits.length = this.puddles.length = this.drops.length = this.gas.length = this.vics.length = 0; this.watch = null; if (typeof player !== 'undefined'){ player.acid = null; player.poison = null; } },
  ready(){ return this.charge >= this.cooldown; },
  world(sx, sy){ const l = Math.hypot(sx, sy / CONFIG.tilt) || 1; return { x: sx / l, y: sy / CONFIG.tilt / l }; },
  reach(a){ return a.range * (1 + (this.vertBoost - 1) * Math.abs(a.dy)); },
  slow(ch){ return ch && ch.poison ? this.poisonSlow : 1; },
  start(ch){
    if (!AbilityFactory.has(ch, 'acid') || ch.acid || ch.demon || ch.aim || ch.slam || ch.dead || ShadowSneakFactory.locked() || !this.ready()) return false;
    if (ch.grab) PushFactory.release(ch);
    const f = ch.face || 1, D = { side: [f, 0], front: [0, 1], back: [0, -1], fdiag: [f, 1], bdiag: [f, -1] }[ch.dir] || [f, 0], d = this.world(D[0], D[1]);
    ch.acid = { t: 0, dx: d.x, dy: d.y, range: this.defRange, firing: false, ft: 0 }; ch.clip = 'aim'; return true;
  },
  drag(ch, dx, dy){ if (ch.acid) ch.acid.in = { x: dx, y: dy }; },
  targets(ch, a){   // the 3 landing spots: centre + one each side, fanned round the shooter
    const R = this.reach(a), base = Math.atan2(a.dy, a.dx), out = [];
    for (const k of [0, -1, 1]){ const an = base + k * this.spread; out.push({ x: ch.x + Math.cos(an) * R, y: ch.y + Math.sin(an) * R }); }
    return out;
  },
  release(ch){
    const a = ch.acid; if (!a || a.firing) return;
    const hx = ch.x + a.dx * 20, hy = ch.y + a.dy * 20, T = this.targets(ch, a), shots = [];
    T.forEach((p, i) => { shots.push({ x0: hx, y0: hy, x1: p.x, y1: p.y, d: i * this.stagger }); this.launch(hx, hy, p.x, p.y, i * this.stagger, false); });
    a.firing = true; a.ft = 0; this.charge = 0; ShakeFactory.kick(4, 0.25); DustFactory.spawn(ch.x - a.dx * 10, ch.y - a.dy * 10, 4); this.mouthSpray(hx, hy, a.dx, a.dy);
    if (GameFactory.room) GameFactory.room.send({ t: 'acid', id: NetFactory.id, shots });
  },
  mouthSpray(x, y, dx, dy){   // a fine acid spray bursting out of his mouth
    for (let i = 0; i < 26; i++){ const an = Math.atan2(dy, dx) + (Math.random() - .5) * 0.9, sp = 90 + Math.random() * 230; this.drops.push({ x, y, z: this.mouthZ - 2 + Math.random() * 6, vx: Math.cos(an) * sp, vy: Math.sin(an) * sp * 0.8, vz: 20 + Math.random() * 90, r: 1.4 + Math.random() * 2.6, f: 1, dur: 0.45 + Math.random() * 0.4 }); }
    this.puff(x + dx * 8, y + dy * 8, this.mouthZ, 5);
  },

/* ============ DEMON FACTORY (ability 'demons' = DEMONS button of the Shadow gimmick: the third move)
   He throws his head back and calls THREE shadow demons up out of his own shadow. They are pitch black, very fast and they never tire for `dur` seconds:
     - with nobody around they FOLLOW him, circling close, wherever he goes (he can still walk and use his other moves)
     - anything hostile inside `aggro` (a huge range: zombies, the boss, other players) is hunted: they rush it and CLAW it, `dmg` HP per scratch, one scratch every `gap` seconds each
   When the time is up they melt back into the ground. The button refills `cooldown` seconds after the cast. Tune everything right on the next lines.

  reach: 34, dmg: 6, gap: 0.45, swing: 0.28, castT: 0.9, riseT: 0.5, fadeT: 0.6,   // claw reach / damage per scratch / seconds between scratches / swing length / cast time / rise out of the ground / melt away

  reset(){ this.list.length = this.slashes.length = 0; this.pool = null; this.rem = {}; this.charge = this.cooldown; if (typeof player !== 'undefined') player.demon = null; },
  ready(){ return this.charge >= this.cooldown; },

    ch.demon = { t: 0, spawned: false }; ch.clip = 'aim'; this.charge = 0; this.pool = { x: ch.x, y: ch.y, t: 0 };

  spawn(ch){

  foes(){

    else { const b = BossFactory.alive(); if (b) out.push({ x: b.x, y: b.y, kind: 'boss', ref: b }); }

    return out;
  },
  dist(ax, ay, bx, by){ return Math.hypot(bx - ax, (by - ay) * CONFIG.tilt); },   // on-screen distance (the ground is squashed by the tilt)

/* ============ NET FACTORY (Supabase Realtime, or local two-tab test mode when no keys) ============ */
const NetFactory = {
  id: Math.random().toString(36).slice(2, 8), sb: null,
  mode(){ return CONFIG.ws && CONFIG.ws.url ? 'ws' : CONFIG.supabase.url && CONFIG.supabase.key && window.supabase ? 'supabase' : 'local'; },
  open(name, meta, h){ if (this.mode() === 'ws') return this.openWs(name, meta, h); return this.mode() === 'supabase' ? this.openSb(name, meta, h) : new LocalChannel(name, this.id, meta, h); },
  openWs(name, meta, h){   // Cloudflare Durable Object relay: one plain WebSocket per room, same interface as the Supabase channel
    const base = CONFIG.ws.url.replace(/\/$/, ''), url = base + '/?room=' + encodeURIComponent(name) + '&id=' + this.id;
    const api = { ready: false, meta, ws: null, closed: false, tries: 0, hb: null, opened: false,
      track(m){ api.meta = m; if (api.ready && m && api.ws.readyState === 1) api.ws.send('p' + JSON.stringify(m)); },
      send(p){ if (api.ready && api.ws.readyState === 1) api.ws.send('m' + JSON.stringify(p)); },
      state(){ return api._st || {}; },
      leave(){ api.closed = true; clearInterval(api.hb); try { api.ws.close(); } catch (e) {} } };

      const ws = api.ws = new WebSocket(url);

        if (d[0] === 'm'){ try { h.onMsg && h.onMsg(JSON.parse(d.slice(1))); } catch (err) {} }
        else { try { const m = JSON.parse(d); if (m.k === 'presence'){ api._st = m.state || {}; h.onPresence && h.onPresence(api._st); } } catch (err) {} } };

class LocalChannel {   // same interface as the Supabase channel, over BroadcastChannel (tabs of the same browser)
  constructor(name, id, meta, h){
    Object.assign(this, { id, meta, h, peers: {}, ready: true });
    this.bc = new BroadcastChannel('gimmick:' + name);
    this.bc.onmessage = e => { const m = e.data;
      if (m.k === 'hb'){ this.peers[m.id] = { meta: m.meta, seen: Date.now() }; this.sync(); }
      else if (m.k === 'bye'){ delete this.peers[m.id]; this.sync(); }
      else if (m.k === 'who') this.beat();
      else if (m.k === 'msg') h.onMsg && h.onMsg(m.p); };
    this.timer = setInterval(() => { this.beat(); this.prune(); }, 1000);
    this.bc.postMessage({ k: 'who' }); this.beat();
    setTimeout(() => h.onReady && h.onReady(), 0);
  }
  beat(){ if (this.meta) this.bc.postMessage({ k: 'hb', id: this.id, meta: this.meta }); }
  prune(){ let c = false; for (const k in this.peers) if (Date.now() - this.peers[k].seen > 3500){ delete this.peers[k]; c = true; } if (c) this.sync(); }
  state(){ const o = {}; for (const k in this.peers) o[k] = this.peers[k].meta; if (this.meta) o[this.id] = this.meta; return o; }
  sync(){ this.h.onPresence && this.h.onPresence(this.state()); }
  track(m){ this.meta = m; this.beat(); this.sync(); }
  send(p){ this.bc.postMessage({ k: 'msg', p }); }
  leave(){ try { this.bc.postMessage({ k: 'bye', id: this.id }); } catch (e) {} clearInterval(this.timer); this.bc.close(); }
}

  update(rdt, wdt){   // rdt = real time, wdt = slowed world time (the time-slow caster stays on real time)

  },
  collect(items, cam, W, H){ for (const id in this.map){ const c = this.map[id].ch; if (!ViewFactory.sees(c.x, c.y)) continue; items.push({ y: c.y, f: () => c.gimmick === 'speed' ? SpeedFactory.drawPlayer(ctx, c, cam, W, H) : CharacterFactory.draw(ctx, c, cam, W, H) }); } }
};

      <label>Or enter a room code</label><input class="code" id="cd" maxlength="4" placeholder="K7P2">
      <button class="mbtn pri" id="go">Join</button><div class="mmsg" id="msg"></div><button class="mlink" id="b">Back</button>`);
    const list = st => { const rs = Object.values(st).filter(m => m && m.code);
      this.$('#pl').innerHTML = rs.length ? rs.map(r => `<button data-c="${this.esc(r.code)}">${this.esc(r.name)} · ${this.esc(r.host)} · ${r.players}/${r.max}${r.started ? ' · in game' : ''}</button>`).join('') : '<div class="mnote">No public rooms right now.</div>';
      this.$('#pl').querySelectorAll('[data-c]').forEach(b => b.onclick = () => this.enter(b.dataset.c)); };
    this.pub = NetFactory.open('lobby', null, { onPresence: st => this.$('#pl') && list(st) });
    this.$('#go').onclick = () => { const c = this.$('#cd').value.trim().toUpperCase(); if (c.length < 4){ this.$('#cd').focus(); return; } this.enter(c); };
    this.$('#b').onclick = () => this.multi();
  },
  enter(code){
    if (this.pub){ this.pub.leave(); this.pub = null; }
    this.joinCode = code; this.show('<h2>Joining ' + this.esc(code) + '…</h2>');
    const meta = { name: this.name, color: this.color, gimmick: this.gimmick, host: false };
    let t0 = 0, tmr = null;
    const check = () => {   // poll until the host shows up (the server may still be waking up), then check the room
      if (!this.room) return;
      const st = this.room.state(), ms = Object.values(st), host = ms.find(m => m && m.host);
      if (!host){ if (Date.now() - t0 > 8000) return this.fail('Room not found.'); tmr = setTimeout(check, 300); return; }
      if (ms.length > host.max) return this.fail('Room is full.');
      this.joined = true; this.roomMeta = { code: host.code || code, roomName: host.roomName, max: host.max, pub: host.pub };
      this.room.track({ ...meta, ...this.roomMeta });
      if (host.started){   // late join: go straight into the running game
        const ids = Object.keys(st).sort(), roster = {}; ids.forEach(i => roster[i] = { name: st[i].name, color: st[i].color, gimmick: st[i].gimmick });
        this.begin(ids, roster); return;
      }
      this.lobby(st);
    };
    this.room = NetFactory.open('room-' + code, meta, { onPresence: st => this.joined && this.lobby(st), onMsg: m => this.onMsg(m),
      onReady: () => { t0 = Date.now(); check(); },
      onRetry: n => { if (n > 1 && this.el.querySelector('h2')) this.show('<h2>Waking the server…</h2><div class="mnote">The free server was asleep. This can take up to a minute.</div>'); },
      onError: () => this.fail('Could not connect to the server.') });
  },
  fail(msg){ this.leaveAll(); this.join(); this.$('#msg').textContent = msg; },
  leaveAll(){ this.joined = false; this.hostInfo = null; this.roomMeta = null; for (const k of ['room', 'pub']) if (this[k]){ this[k].leave(); this[k] = null; } }
};

/* ============ CLOUD SAVE FACTORY (online progress: log in once and your level, bag, gimmicks, armor and stations follow you to any browser.
   Everything the game keeps in localStorage under 'gimmick.*' is copied to ONE row in the Supabase table `saves` (see supabase-setup.sql). Uses the anon key in CONFIG.supabase only:
   the table's Row Level Security lets each player touch only their own row. Not logged in = the game works exactly as before, saving in the browser.) ============ */
const CloudSave = {
  sb: null, user: null, lastJson: '', busy: false, timer: null, status: '',
  ok(){ return !!(window.supabase && CONFIG.supabase && CONFIG.supabase.url && CONFIG.supabase.key); },
  blob(){ const o = {}; try { for (let i = 0; i < localStorage.length; i++){ const k = localStorage.key(i); if (k && k.indexOf('gimmick.') === 0) o[k] = localStorage.getItem(k); } } catch (e) {} return o; },
  async init(){
    if (!this.ok()) return;
    try { this.sb = supabase.createClient(CONFIG.supabase.url, CONFIG.supabase.key, { auth: { persistSession: true, storageKey: 'gimmick-auth' } }); } catch (e) { return; }
    this.sb.auth.onAuthStateChange((ev, ses) => { this.user = ses && ses.user || null; });
    try { const r = await this.sb.auth.getSession(); this.user = r.data && r.data.session ? r.data.session.user : null; } catch (e) {}
    if (this.user) await this.pull();
    this.start();
  },
  label(){ const u = this.user; return !u ? '' : u.is_anonymous ? 'Guest (saved online)' : (u.email || 'Logged in'); },
  async pull(){   // cloud newer than what this browser last synced -> take the cloud save (the old local one is kept as a backup) and reload once so every factory loads it
    if (!this.user) return;
    try {
      const { data, error } = await this.sb.from('saves').select('data,updated_at').eq('user_id', this.user.id).maybeSingle(); if (error) throw error;
      const have = localStorage.getItem('gb.syncedAt') || '';
      if (!data){ await this.push(true); return; }
      if (data.updated_at > have && data.data && typeof data.data === 'object'){
        try { localStorage.setItem('gb.localBackup', JSON.stringify(this.blob())); } catch (e) {}
        for (const k of Object.keys(this.blob())) localStorage.removeItem(k);
        for (const k in data.data) if (k.indexOf('gimmick.') === 0 && typeof data.data[k] === 'string') localStorage.setItem(k, data.data[k]);
        localStorage.setItem('gb.syncedAt', data.updated_at); location.reload();
      }
    } catch (e) { this.status = 'Could not load your online save'; }
  },
  async push(force){
    if (!this.user || this.busy) return; const b = this.blob(), j = JSON.stringify(b); if (!force && j === this.lastJson) return;
    this.busy = true;
    try {
      const { data, error } = await this.sb.from('saves').upsert({ user_id: this.user.id, data: b }, { onConflict: 'user_id' }).select('updated_at').single(); if (error) throw error;
      this.lastJson = j; if (data && data.updated_at) localStorage.setItem('gb.syncedAt', data.updated_at); this.status = '';
    } catch (e) { this.status = 'Online save failed (will retry)'; }
    this.busy = false;
  },
  start(){
    if (this.timer) return; this.timer = setInterval(() => this.push(), 30000);
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') this.push(); });
    addEventListener('pagehide', () => this.push());
  },
  async login(email, pw){ const r = await this.sb.auth.signInWithPassword({ email, password: pw }); if (r.error) throw r.error; this.user = r.data.user; localStorage.removeItem('gb.syncedAt'); await this.pull(); await this.push(true); this.start(); },
  async signup(email, pw){ const r = await this.sb.auth.signUp({ email, password: pw }); if (r.error) throw r.error; if (!r.data.session) return 'confirm'; this.user = r.data.user; await this.push(true); this.start(); return 'ok'; },
  async guest(){ const r = await this.sb.auth.signInAnonymously(); if (r.error) throw r.error; this.user = r.data.user; await this.push(true); this.start(); },
  async logout(){ await this.push(); try { await this.sb.auth.signOut(); } catch (e) {} this.user = null; localStorage.removeItem('gb.syncedAt'); }
};
(function(){ Settings.apply(); if (!Settings.pc) return;   // PC only: a small key badge on every button
  const set = (el, k) => { if (el && k) el.setAttribute('data-key', String(k).toUpperCase()); };
  for (const id in AbilityFactory.els) set(AbilityFactory.els[id], AbilityFactory.defs[id].key);
  for (const id in RideButtonFactory.els) set(RideButtonFactory.els[id], RideButtonFactory.defs[id].o.key);
  set(PunchFactory.btn, PunchFactory.key); set(ArrowFactory.btn, ArrowFactory.key); set(InventoryFactory.btn, InventoryFactory.key); set(GuardFactory.btn, GuardFactory.key); set(DialFactory.btn, 'Tab'); set(MountFactory.btn, 'R');
})();
MenuFactory.init(); CloudSave.init().then(() => MenuFactory.el.querySelector('#acc') && MenuFactory.main());
</script></body></html>
